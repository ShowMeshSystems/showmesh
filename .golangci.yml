version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    misspell:
      # "Mosquitto" (the MQTT broker this project uses, per ADR-008) is not
      # a misspelling of "mosquito"; test/integration and its harness
      # reference it by name repeatedly.
      ignore-rules:
        - mosquitto
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/showmeshsystems/showmesh
