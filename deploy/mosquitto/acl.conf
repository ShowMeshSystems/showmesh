# Mosquitto ACL for the ShowMesh reference deployment (ADR-024 decision
# 10). Loaded by mosquitto.conf's `acl_file` directive alongside
# `password_file` and `allow_anonymous false`: with those set, an
# authenticated client that matches no rule below gets no access at all —
# there is no implicit "allow everything else" the way anonymous access
# used to grant.
#
# This file is committed and contains no secrets: it names topic *shapes*,
# never a username or password. Credentials live in `passwd` (generated
# per deployment by generate-credentials.sh / add-agent-credential.sh,
# NEVER committed — see deploy/README.md and .gitignore).
#
# Four principal classes, matching ADR-024 decision 10 exactly:
#
#   1. Each ShowMesh agent  — the `pattern` rules below.
#   2. The coordinator      — the `user coordinator` block.
#   3. An FPP publisher role — the `user fpp` block.
#   4. A healthcheck principal — the `user healthcheck` block.
#
# Three ACL mechanics are decided in ADR-024 decision 10 and implemented
# here as written, because two fail silently and one is self-granting:
#
#   - Pattern substitution is `%u` (the broker-authenticated username),
#     NEVER `%c` (the client id a client chooses for itself at CONNECT
#     time). A `%c` pattern would let any client grant itself access to
#     any node's topic tree just by claiming that node's id as its own
#     client id — the broker never verifies a client id against anything.
#   - `pattern` rules apply to EVERY connected user — every agent, the
#     coordinator, the FPP role, and the healthcheck principal alike —
#     regardless of which `user` block precedes them in this file. That is
#     exactly why the coordinator's and the FPP role's broader grants below
#     are written as `user`/`topic` blocks instead of `pattern` lines: a
#     `pattern` line broad enough for the coordinator would hand that same
#     breadth to every agent, and a bare unscoped `topic` line outside any
#     `user` block would hand it to literally everyone, including the
#     healthcheck principal.
#   - The `pattern write showmesh/nodes/%u/...` rules below are safe ONLY
#     because a broker username is provisioned to equal that agent's
#     ShowMesh node id, and node ids are validated against
#     pkg/mqttproto's nodeIDPattern — see ValidateNodeID and its backing
#     regexp in pkg/mqttproto/topic.go:
#       ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
#     which excludes '+', '#', and '/' (MQTT's own wildcard/separator
#     characters) along with everything else outside [a-z0-9-]. That
#     validator runs when an AGENT loads SHOWMESH_NODE_ID; it does NOT run
#     against a broker username typed by hand into `passwd`. Every
#     username this file's `pattern` rules are meant to scope MUST be
#     provisioned through add-agent-credential.sh (which enforces the same
#     character class before ever calling mosquitto_passwd), not typed in
#     directly — a hand-created username containing '+', '#', or '/' can
#     widen or corrupt these pattern rules in ways Mosquitto will not warn
#     about at load time.
#
# Every ShowMesh agent publish topic is enumerated individually below
# (hello, lwt, observed/#, result/+) rather than granted as a single
# `showmesh/nodes/%u/#` pattern. That is deliberate, not merely more
# precise: `showmesh/nodes/%u/#` would ALSO match `showmesh/nodes/%u/cmd`,
# which would let every agent publish to its own cmd topic — directly
# contradicting decision 10's other, unconditional clause: "no client
# other than the coordinator may publish to any cmd topic". Read literally
# together, "publish only beneath its own prefix" and "no client but the
# coordinator may publish to any cmd topic" only both hold if the agent's
# own prefix grant carves cmd back out, so that is what this file does.

# --- 1. Every ShowMesh agent ---------------------------------------------
pattern write showmesh/nodes/%u/hello
pattern write showmesh/nodes/%u/lwt
pattern write showmesh/nodes/%u/observed/#
pattern write showmesh/nodes/%u/result/+
pattern read  showmesh/nodes/%u/cmd

# --- 2. The coordinator ---------------------------------------------------
# The only client that may publish to any node's cmd topic (ADR-008,
# ADR-024 decision 10). Read grants cover every retained topic family an
# agent publishes (hello, lwt, observed/#) plus result/#, which nothing
# publishes yet (no command flow exists before Step 7) but which ADR-008
# already names as part of the v1 topic set — granting it now avoids a
# second ACL edit the day a command result handler lands. `showmesh/events/#`
# write is the same kind of forward grant, for ADR-008's
# coordinator-published lifecycle/alert events, not yet implemented.
user coordinator
topic read  showmesh/nodes/+/hello
topic read  showmesh/nodes/+/lwt
topic read  showmesh/nodes/+/observed/#
topic read  showmesh/nodes/+/result/#
topic write showmesh/nodes/+/cmd
topic write showmesh/events/#

# --- 3. FPP publisher role -------------------------------------------------
# ADR-008 recommends one broker carrying both FPP telemetry and ShowMesh
# traffic. This role exists so an operator following that recommendation
# does not have allow_anonymous=false silently cut off FPP's MQTT output on
# upgrade (ADR-024 decision 10). It gets readwrite on FPP's own status
# topic prefix (default "falcon/player", matching
# internal/coordinator/config's SHOWMESH_FPP_MQTT_TOPIC_PREFIX default —
# see fppmqtt.DefaultTopicPrefix) and explicitly NO access to any
# showmesh/ topic: FPP is a first-class client of this broker, not an
# exception to its access boundaries. If a deployment's FPP instances
# publish under a different topic prefix (SHOWMESH_FPP_MQTT_TOPIC_PREFIX
# overridden), update the line below to match.
#
# All FPP hosts pointed at this broker share this one credential: the
# topic namespace is partitioned by hostname inside the topic
# (falcon/player/<host>/...), not by MQTT username, so one shared role
# account is sufficient and is what add-agent-credential.sh's ShowMesh
# per-node model deliberately does NOT try to replicate for FPP.
user fpp
topic readwrite falcon/player/#

# --- 4. Healthcheck principal ----------------------------------------------
# Read-only access to $SYS, and nothing else — used by
# docker-compose.yml's mosquitto healthcheck (mosquitto_sub against
# $SYS/#) now that allow_anonymous is false and an unauthenticated,
# unscoped healthcheck can no longer pass. See generate-credentials.sh for
# how this credential is created, and docker-compose.yml's comment on why
# it is referenced by variable NAME inside the healthcheck command rather
# than interpolated by value (so `docker inspect` never shows the
# plaintext password baked into Config.Healthcheck.Test).
user healthcheck
topic read $SYS/#
