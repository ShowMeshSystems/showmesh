# Mosquitto ACL for the ShowMesh reference deployment (ADR-024 decision
# 10). Loaded by mosquitto.conf's `acl_file` directive alongside
# `password_file` and `allow_anonymous false`: with those set, an
# authenticated client that matches no rule below gets no access at all —
# there is no implicit "allow everything else" the way anonymous access
# used to grant.
#
# This file is committed and contains no secrets: it names topic *shapes*,
# never a username or password. Credentials live in `passwd` (generated
# per deployment by generate-credentials.sh / add-agent-credential.sh,
# NEVER committed — see deploy/README.md and .gitignore).
#
# This is the committed base ACL. generate-credentials.sh builds the
# effective acl.generated.conf from this file plus explicit `user <node-id>`
# blocks for every provisioned agent. Mosquitto applies `pattern` rules to
# every authenticated username, including fixed roles, so this file and its
# generated output deliberately contain no `pattern` rules. That prevents
# coordinator, fpp, and healthcheck from inheriting an agent's topic access.
#
# Agent usernames must equal valid ShowMesh node IDs. The provisioning script
# validates that rule and renders only the narrow agent grants below for
# each such username; it never grants write to cmd.
#
# Those per-agent grants also include READ on showmesh/events/show_mode, the
# installation-wide operating mode (ADR-033), and READ on
# showmesh/events/weather_delay, the retained weather delay state (ADR-053).
# Both are read-only, and they are the only two events topics an agent may
# see: a node consumes each, never publishes it, and derives it from nothing
# else. Without the show_mode grant the retained mode never reaches a node,
# which reads as unknown and behaves as show forever, with nothing on the
# node saying why. Without the weather_delay grant a node can never learn
# the alert asset a delay or cancel-night plays, on any delivery path,
# because only this retained topic carries it. A node never gets read on
# showmesh/events/weather_delay/dark/#: that heartbeat is coordinator-write,
# operator-facing only.

# --- Fixed broker roles ----------------------------------------------------
# The only client that may publish to any node's cmd topic (ADR-008,
# ADR-024 decision 10). Read grants cover every retained topic family an
# agent publishes (hello, lwt, observed/#) plus result/#, which nothing
# publishes yet (no command flow exists before Step 7) but which ADR-008
# already names as part of the v1 topic set — granting it now avoids a
# second ACL edit the day a command result handler lands. `showmesh/events/#`
# write is the same kind of forward grant, for ADR-008's
# coordinator-published lifecycle/alert events, not yet implemented.
user coordinator
topic read  showmesh/nodes/+/hello
topic read  showmesh/nodes/+/lwt
topic read  showmesh/nodes/+/observed/#
topic read  showmesh/nodes/+/result/#
topic write showmesh/nodes/+/cmd
topic write showmesh/events/#
# FPP status, read only. Without these the fpp.mqtt collector connects and
# subscribes, the broker silently drops every subscription, and FPP state
# falls back to the 15s REST poll with nothing reporting that it did.
# Enumerated per suffix, matching the write grants below and
# internal/coordinator/collector/fppmqtt/topics.go; never a host wildcard,
# so the command subtree stays unreadable here.
topic read  falcon/player/+/fppd_status
topic read  falcon/player/+/port_status
topic read  falcon/player/+/warnings
topic read  falcon/player/+/version
topic read  falcon/player/+/branch
topic read  falcon/player/+/status
topic read  falcon/player/+/ready
topic read  falcon/player/+/playlist/repeat/status
topic read  falcon/player/+/playlist/position/status

# --- 3. FPP publisher role -------------------------------------------------
# One login shared by every FPP player on this broker. FPP may publish all of
# its own topics, including Home Assistant discovery, and subscribe to any
# topic (ADR-024 decision 10, amended 2026-10-17). If FPP publishes under a
# prefix other than "falcon/player", change it below too.
user fpp
topic read  #
topic write falcon/player/#
topic write homeassistant/#

# --- 4. Healthcheck principal ----------------------------------------------
# Read-only access to $SYS, and nothing else — used by
# docker-compose.yml's mosquitto healthcheck (mosquitto_sub against
# $SYS/#) now that allow_anonymous is false and an unauthenticated,
# unscoped healthcheck can no longer pass. See generate-credentials.sh for
# how this credential is created, and docker-compose.yml's comment on why
# it is referenced by variable NAME inside the healthcheck command rather
# than interpolated by value (so `docker inspect` never shows the
# plaintext password baked into Config.Healthcheck.Test).
user healthcheck
topic read $SYS/#

# --- 5. Observer principal (optional) ---------------------------------------
# Read-only across ShowMesh and FPP status, for an operator inspecting the
# broker with a tool such as MQTT Explorer. It is NOT created by default:
# generate-credentials.sh never mints it, so this block grants nothing
# until an operator deliberately adds an "observer" password entry.
#
# Read only, everywhere. It can never publish, so it can neither command a
# node nor forge an observation. It deliberately omits
# falcon/player/+/command/# for the same reason the coordinator does: a
# debugging account has no business reading what FPP is told to do.
user observer
topic read showmesh/#
topic read falcon/player/+/fppd_status
topic read falcon/player/+/port_status
topic read falcon/player/+/warnings
topic read falcon/player/+/version
topic read falcon/player/+/branch
topic read falcon/player/+/status
topic read falcon/player/+/ready
topic read falcon/player/+/playlist/repeat/status
topic read falcon/player/+/playlist/position/status
