# Mosquitto configuration for the ShowMesh reference deployment.
# See ADR-008 (docs/decisions/ADR-008-mqtt-control-plane.md) for the
# control-plane design this configuration exists to support, and ADR-024
# (docs/decisions/ADR-024-identity-authorization-and-audit.md) decision 10
# for the authentication/authorization posture below.
#
# ==========================================================================
# allow_anonymous false — REQUIRED FIRST-RUN STEP
#
# Anonymous MQTT access is closed. Before `docker compose up` will bring
# this service up healthy, you MUST run, once, from this deploy/ directory:
#
#   ./mosquitto/generate-credentials.sh
#
# That script generates `mosquitto/passwd` (bcrypt-hashed, gitignored,
# NEVER committed — see this directory's own comment in .gitignore) with
# per-deployment random credentials for the three fixed broker roles
# (coordinator, fpp, healthcheck) and writes the ones the bundle itself
# consumes into deploy/.env. Per-node agent credentials are provisioned
# separately, one per node, with mosquitto/add-agent-credential.sh — see
# deploy/README.md's "MQTT broker credentials" section for the full
# picture, including what a credential rotation can and cannot do while
# the broker is running.
#
# `acl.conf` is the committed fixed-role base. The credential scripts build
# `acl.generated.conf` from it with explicit, per-agent user blocks; this
# avoids Mosquitto's global `pattern` semantics granting agent access to
# fixed roles. Both files contain topic shapes only, never secrets.
# ==========================================================================

listener 1883 0.0.0.0

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.generated.conf

persistence true
persistence_location /mosquitto/data/

# Without an explicit autosave_interval, mosquitto defaults to writing the
# persistence file only every 1800 seconds (and on a clean shutdown). That
# default is not enough here: a retained message published and then lost
# to an unclean stop (power cut, `docker kill -s KILL`, OOM) within that
# window is gone on restart, even though persistence/persistence_location
# above are both set correctly. 30s bounds that exposure window to
# something appropriate for an appliance that can lose power without
# warning, at the cost of more frequent disk writes than the default.
autosave_interval 30

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Bounds the per-client in-flight/queued message backlog so a stalled or
# slow consumer (e.g. a disconnected agent) cannot grow broker memory
# without limit; 0 would mean unlimited.
max_queued_messages 1000

# Retained messages are how ADR-008's "late-joining coordinators and
# dashboards get current state without a sync protocol" works: hello,
# observed state, and LWT topics are all published retained. `persistence
# true` plus `persistence_location` above makes retained messages survive
# a *graceful* broker stop (the persistence file is written on clean
# shutdown regardless of autosave_interval). Surviving an *unclean* stop
# (crash, power loss, SIGKILL) depends on autosave_interval above having
# run recently enough to have saved the message; this config accepts up
# to a 30s exposure window rather than the 1800s default, it does not
# eliminate it. No separate retained-message TTL is set here, so retained
# state persists until a node republishes or is explicitly cleared.
# persistent_client_expiration below bounds how long the broker keeps
# queued messages and subscription state for a persistent-session client
# that has gone offline (e.g. a node agent that lost power), which
# complements retained state for late-joining clients.
persistent_client_expiration 1h

# Note: the ShowMesh coordinator connects as an MQTT v5 client. Mosquitto
# 2.x negotiates protocol version per-connection, so no broker-side
# version pin is required here, but this is called out because MQTT v5
# reason codes and properties are relied on for diagnostics.
