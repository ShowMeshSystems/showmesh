# Single source of truth for the PipeWire node.group name that elects
# showmesh-ptp-driver as the common driver for this node's audio graph.
# WirePlumber assigns every node it manages to a node.group on its own
# (a sound card's own ALSA output node normally lands in its own
# pro-audio-N group and elects itself driver, which silently defeats this
# whole seam); sharing this one group name across the driver's own config
# and the WirePlumber rule that reassigns the sound card's ALSA nodes is
# what makes them one election, not two. Sourced by both
# install-ptp-audio.sh and verify-ptp-audio.sh so the two can never name
# different groups.
PTP_NODE_GROUP=showmesh-ptp
