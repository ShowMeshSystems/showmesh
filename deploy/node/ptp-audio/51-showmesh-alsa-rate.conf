# WirePlumber conf.d drop-in: pins the MOTU M4's ALSA sink node to 48 kHz
# (the M4's own native rate, and the rate showmesh-ptp-clock.conf sets as
# the graph's default.clock.rate) and stops WirePlumber from suspending
# it. Installed by install-ptp-audio.sh, unmodified, to
# /etc/wireplumber/wireplumber.conf.d/.
#
# A suspended ALSA node is not a driver's follower at all until it wakes
# back up, which would silently defeat the rate lock between cues; this
# node exists purely to play a show, so there is no idle-power reason to
# ever suspend it.
#
# NOT exercised against a real M4 by this repository's own verification:
# bench/ptp-node has no ALSA hardware, so this file is syntax-checked
# (wireplumber -n starts cleanly with it present) but its match rule and
# rate pin are unverified until run on the real node. See
# deploy/node/PTP-AUDIO.md.
wireplumber.settings = {
    node.restore-props = false
}

monitor.alsa.rules = [
    {
        matches = [
            { device.name = "~alsa_card.*M4.*" }
        ]
        actions = {
            update-props = {
                api.alsa.period-size   = 256
                session.suspend-timeout-seconds = 0
            }
        }
    }
    {
        matches = [
            { node.name = "~alsa_output.*M4.*" }
        ]
        actions = {
            update-props = {
                audio.rate      = 48000
                node.rate       = "1/48000"
                session.suspend-timeout-seconds = 0
            }
        }
    }
]
