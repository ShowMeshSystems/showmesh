        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /night/commands/{command}:
    post:
      operationId: dispatchNightCommand
      summary: Dispatch a night-session lifecycle command (Track F seam F2, ADR-038)
      description: >-
        Behind `night:command`. The seven ADR-038 commands
        (`prepare-site`, `run-readiness`, `start-preshow`, `start-night`,
        `request-final-show`, `fade-out-night`, `power-down-presentation`)
        plus `end-session`, a PROVISIONAL operator-recovery action not yet
        part of ADR-038's own closed vocabulary (owner decision pending).
        Answers `202`, never `200`: accepted and applied, or recognized as
        an idempotent duplicate - this layer holds no downstream
        confirmation loop.


        `fade-out-night`, `power-down-presentation`, `request-final-show`,
        and `end-session` are exempt from the degraded-session gate and
        never refused for want of an audit write (ADR-024 decision 11):
        all four are direction-safe. The other four fail closed on an
        unwritable audit store (`503`, see below) and refuse while the
        session is degraded and non-terminal.


        `idempotencyKey` (optional request body field) is honored only by
        `prepare-site`, the one command that creates something new; a
        repeat with the same key returns the original session. The other
        six commands are already idempotent by lifecycle state and ignore
        the field.


        `interlockOverrides` (optional request body field, Track F seam
        F6) names configured "block" interlock rules to override for THIS
        command. `night:command` alone never authorizes an override: a
        rule is bypassed only when it declares
        `overridePolicy: authorized-operator` AND the caller separately
        holds `night:override` (RESTING-MODE.md §10.1;
        IDENTIFIER-REGISTER.md: starting a night must not, by itself,
        authorize bypassing a blocking interlock).


        A "block" interlock declared for `prepare-site`, `run-readiness`,
        `start-preshow`, `start-night`, `fade-out-night`, or
        `power-down-presentation` can withhold that same command with a
        `409` (`night-not-ready`) naming the rule, unless a valid override
        is supplied. `prepare-site`, `run-readiness`, `fade-out-night`,
        and `power-down-presentation` dispatch that rule's own evidence
        LIVE, at the instant the command runs. `start-preshow` and
        `start-night` gate on the most recent readiness result instead,
        which is at most as fresh as the last `run-readiness` call; see
        RESTING-MODE.md §10.1 and this seam's own build report for why
        those are different freshness guarantees, and for why
        fade-out-night and power-down-presentation moved from a stored
        gate to a live one: a night runs for hours and run-readiness
        typically runs once, near the start, so a stored gate on either
        shutdown phase almost always found no trusted result at all by
        the time it mattered and silently made `onUnavailable: allow`
        the only condition it could ever report.


        `fade-out-night` and `power-down-presentation` are also the two
        phases where PUT /config/night.session/{id} refuses a "block"
        rule that declares `overridePolicy: "none"`
        (`interlock-shutdown-phase-requires-override`): a guard on a
        phase that ends the night must always have a human exit, so
        every such rule is guaranteed an authorized-operator override
        path. `request-final-show` and `end-session` declare no
        interlock phase and consult no gate at all: `end-session` in
        particular is never withheld by any interlock, by construction,
        so it always reaches "stopped" even for a caller who cannot
        supply a valid override, though only `fade-out-night` and
        `power-down-presentation` themselves actually issue FPP's own
        stop. `projector-strike`, `enter-resting`, and
        `presentation-power-on` are validated and shown on readiness but
        have no command of their own to gate in this build.
      parameters:
        - name: command
          in: path
          required: true
          schema:
            type: string
            enum:
              - prepare-site
              - run-readiness
              - start-preshow
              - start-night
              - request-final-show
              - fade-out-night
              - power-down-presentation
              - end-session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NightCommandRequest"
      responses:
        "202":
          description: Accepted
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NightCommandResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: >-
            Three distinct causes, three distinct `type` values:
            `night-not-ready` (a precondition is not yet met, including a
            configured "block" interlock currently withholding this
            phase and not covered by a valid override, Track F seam F6),
            `night-state-rejected` (refused by the command's own closed
            state table for the session's current state), or
            `night-ambiguous` (the session is degraded; run `end-session`
            then `prepare-site` to recover).
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            `prepare-site`, `run-readiness`, `start-preshow`, or
            `start-night` only: its audit entry could not be written, so
            the whole command was refused rather than applied without one
            (`night-command-refused-audit-unavailable`). Nothing was
            dispatched and nothing was recorded.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
  /integrations/fpp/playlist-entry-observations:
    post:
      operationId: postFPPPlaylistEntryObservation
      summary: Ingest one FPP playlist-entry observation (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §1)
      description: >-
        Behind `fpp:observe`, held by the `scheduler` role (the installed
        FPP plugin's own principal) and `admin`, deliberately never by
        `operator`: an operator credential must not be able to forge
        plugin evidence. Authenticates as a bearer token, so ADR-024
        decision 6's CSRF header requirement does not apply.


        Ingestion grants no execution authority: accepting this
        observation says only that FPP reported an entry. It never
        activates a show, playlist, or cue.


        The body is bounded at 16384 bytes, refused with `413` before
        parsing. `sequence` is required to be persistent and monotonic per
        instance across plugin and host restarts; a lower or reused
        sequence is refused with `409` and leaves the stored observation
        untouched. A reused sequence with an identical canonical body is
        an idempotent replay: `200`, nothing stored, no change-stream
        event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FPPPlaylistEntryObservationRequest"
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPPlaylistEntryObservationResponse"
        "400":
          description: >-
            Malformed body, unknown field, trailing content, or a
            duplicate member name (`invalid-parameter`), missing
            `instanceUuid` (`invalid-parameter`), an invalid
            `action`/`unavailable`/hash/`position` (`invalid-parameter`),
            an identity field missing when `unavailable` is absent, or
            `playlistHash`/`entryKey` present when `unavailable` is
            present (`invalid-parameter`), an unsupported `schemaVersion`
            (`unsupported-observation-schema-version`), or a derived
            `entryKey` that disagrees with the submitted one
            (`observation-entry-key-mismatch`).
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: >-
            `sequence` was already used for this instance with a
            different observation body, or is lower than the last
            accepted sequence (`conflict`). The stored observation is
            left untouched either way.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: >-
            The request body exceeds this endpoint's 16384 byte limit.
            Shares `type` `payload-too-large` with
            `POST /config/resolume/composition` and `POST /resolume/actions`.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listFPPPlaylistEntryObservations
      summary: The latest accepted playlist-entry observation for every known FPP instance
      description: >-
        Open under `observation:read`, matching every other FPP read
        surface. Exists so a client that sees an
        `fppPlaylistEntry.changed` change-stream event has an
        authoritative state to re-fetch (ADR-020's non-resumable stream
        rule).
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPPlaylistEntryObservationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /integrations/fpp/playlist-definitions:
    post:
      operationId: postFPPPlaylistDefinition
      summary: Publish one FPP playlist definition (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §3)
      description: >-
        Behind `fpp:observe`, the same principal, credential, and scope
        as `POST /integrations/fpp/playlist-entry-observations`.
        Publishing a definition grants no execution authority, exactly
        like ingesting an observation.


        The body is bounded at 1048576 bytes, refused with `413` before
        parsing. The load-bearing check: the coordinator canonicalizes
        the received `definition` and refuses when its SHA-256 disagrees
        with the declared `playlistHash`. The definition is stored under
        the hash the COORDINATOR computed, never the caller's bare claim.
        A repeat of an already-held (`instanceUuid`, `playlistHash`) is
        an idempotent `200` that stores nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FPPPlaylistDefinitionPublishRequest"
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPPlaylistDefinitionPublishResponse"
        "400":
          description: >-
            Malformed body, unknown field, trailing content, or a
            duplicate member name (`invalid-parameter`), a missing or
            malformed identity field (`invalid-parameter`), an
            unsupported `schemaVersion`
            (`unsupported-definition-schema-version`), or a definition
            whose canonicalized SHA-256 disagrees with the declared
            `playlistHash` (`definition-hash-mismatch`).
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: >-
            The request body exceeds this endpoint's 1048576 byte limit.
            Shares `type` `payload-too-large` with
            `POST /integrations/fpp/playlist-entry-observations`.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listFPPPlaylistDefinitions
      summary: Metadata for every stored FPP playlist definition (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §3.6)
      description: >-
        Open under `observation:read`, matching every other FPP read
        surface. Metadata only, newest received first — no definition
        payload, so an operator can choose a playlist to import without
        downloading every definition on the host.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPPlaylistDefinitionsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /integrations/fpp/playlist-definitions/{instanceUuid}/{playlistHash}:
    get:
      operationId: getFPPPlaylistDefinition
      summary: One stored FPP playlist definition (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §3.6)
      description: >-
        Open under `observation:read`. Returns the definition as the
        coordinator canonicalized and stored it.
      parameters:
        - name: instanceUuid
          in: path
          required: true
          schema:
            type: string
        - name: playlistHash
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPPlaylistDefinitionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No stored definition for this (instanceUuid, playlistHash).
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /integrations/fpp/playlist-definitions/{instanceUuid}/{playlistHash}/entries:
    get:
      operationId: getFPPPlaylistDefinitionEntries
      summary: Parsed entries of one stored FPP playlist definition (TRACK-H-H2-SPEC.md §4 step 2)
      description: >-
        Open under `observation:read`. Reads `leadIn`, `mainPlaylist`,
        and `leadOut`, in that order; each section is positioned from
        zero independently. Import evidence for authoring a
        `show.playlist` binding — this route selects nothing on its own.
      parameters:
        - name: instanceUuid
          in: path
          required: true
          schema:
            type: string
        - name: playlistHash
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPPlaylistDefinitionEntriesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No stored definition for this (instanceUuid, playlistHash).
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /integrations/fpp/playlist-entry-observations/{instanceUuid}:
    delete:
      operationId: deleteFPPPlaylistEntryObservation
      summary: Clear one instance's stored observation and sequence anchor (TRACK-H-H2-SPEC.md §5.1)
      description: >-
        Behind `fpp:command`, deliberately NOT `fpp:observe`: clearing
        wedged evidence and manufacturing it are different powers, and
        `fpp:observe` stays out of the operator bundle so an operator
        credential cannot forge plugin evidence. This is the only path
        that clears a stored observation and its sequence anchor
        (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §1.5: "the stored
        per-instance sequence is cleared only by an explicit,
        authenticated operator action"). Exists because a single
        observation carrying a wildly high sequence otherwise refuses
        every later legitimate observation for that instance permanently.
        Idempotent and audited: whether or not a row existed, the
        post-condition (no stored observation for this instance) is the
        same, so this always succeeds rather than 404ing on a caller
        unsure whether the instance is actually wedged.
      parameters:
        - name: instanceUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No stored observation remains for this instance.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /integrations/fpp/playlist-entry-observations/{instanceUuid}/reconciliation:
    get:
      operationId: getFPPPlaylistEntryReconciliation
      summary: Resolve one instance's latest accepted observation against configured show.playlist bindings (TRACK-H-H2-SPEC.md §5)
      description: >-
        Open under `observation:read`, matching every other FPP read
        surface. Renders what this coordinator currently makes of the
        latest accepted observation for this instance: which Playlist,
        entry, and Cue it resolves to, or the exact refusal reason
        (`unbound`, `stale-import`, `unknown-entry`, `evidence-mismatch`,
        `cross-show`) and observed evidence when it does not. An
        `unavailable` observation resolves to `identity-unavailable` and
        is never matched against any entry. Read-only: this route never
        activates anything.
      parameters:
        - name: instanceUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPPlaylistEntryReconciliationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No accepted playlist-entry observation for this instanceUuid.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /integrations/fpp/playlists/{playlistId}/readiness:
    get:
      operationId: getFPPPlaylistReadiness
      summary: Report whether one FPP-backed Playlist is ready (TRACK-H-H2-SPEC.md §6)
      description: >-
        Open under `observation:read`, matching the reconciliation route
        above. Reports whether every one of §6's ordered conditions holds,
        and the exact failing one when it does not. §6 originally specified
        five and closed the vocabulary; it has since been opened, and the
        `failingCondition` enum below is the authoritative list of what
        this route currently checks. In order: a definition is stored for
        the binding's (instanceUuid, playlistHash); no newer definition is
        stored for the same instance and playlist name under a different
        hash; every entry's (section, position) exists in that definition
        with matching filenames; every referenced Cue exists and belongs
        to the same Show; the latest accepted observation, when one
        exists, either carries the same playlistHash or, if it could not
        establish identity at all, fails as `evidence-unavailable` rather
        than warning; when a referenced Cue declares a render output,
        every node holding a show.surface object for this Playlist's Show
        currently holds a render assignment for it; no two Cues the Show
        can run concurrently hold a colliding exclusive claim; and every
        node participating in the Show's catalog has acknowledged the
        revision the active show requires. Refuses with `400` for a
        playlist whose runner is not `fpp`: §6 readiness is an
        FPP-specific concept. Read-only: this route never activates
        anything.
      parameters:
        - name: playlistId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPPlaylistReadinessResponse"
        "400":
          description: The playlist is not fpp-runner.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No show.playlist object with this id has an active revision.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /assets:
    get:
      operationId: listAssets
      summary: Enumerate asset metadata (Track E seam E3/E4, ADR-028)
      description: >-
        Metadata only - bytes never live in SQLite (ADR-028 decision 4).
        Optionally narrowed with `?show=`, `?sequence=`, and/or `?node=`.
        `?node=` returns node-TARGETED assets only, never show-wide ones -
        the manifest (a different, not-yet-built surface) is what answers
        "what should this node hold" by combining both; this is one
        question, never the other. Never gated by asset:write: reads stay
        open by default (ADR-024), matching every other Track E config
        kind's readAnyGuard(show:macro:run OR config:write) posture.
      parameters:
        - name: show
          in: query
          required: false
          schema:
            type: string
          description: Narrow the list to this show id.
        - name: sequence
          in: query
          required: false
          schema:
            type: string
          description: Narrow the list to this logical sequence id.
        - name: node
          in: query
          required: false
          schema:
            type: string
          description: >-
            Narrow the list to CURRENT assets targeted at this node
            specifically - never a show-wide asset, even one that node
            would also need.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: uploadAsset
      summary: Upload one asset's bytes and register its metadata (Track E seam E3/E4, ADR-028)
      description: >-
        Requires `asset:write` (admin only). `multipart/form-data`: the
        `show`, `sequence`, `mediaType`, `targetKind`, and (for
        `targetKind: "node"`) `target` fields MUST arrive before the
        `file` part - a `file` part that arrives first is refused, naming
        that requirement, so every field is already known before this
        coordinator streams a single byte to its backend. The bytes are
        staged, hashed, and only THEN is the metadata row (plus its audit
        entry) written, in one transaction - an interrupted upload
        registers nothing (ADR-030).

        `targetKind` is required with no default; `targetKind: "node"`
        requires a non-empty `target` naming a DECLARED node (`400`
        `asset-target-required` when it is missing). `show` must name an
        existing `show` object; `sequence` uses the same slug rule every
        other Track E object id uses; `mediaType` is one of `fseq`,
        `audio`, `media`.

        Re-uploading IDENTICAL bytes for an identity that is still
        CURRENT is idempotent: `200` with the existing asset, no new
        row, `rolledBack: false`. Re-uploading bytes matching a
        SUPERSEDED identity is a rollback (ADR-028 decision 10): that
        asset becomes current again, superseding whatever was current,
        in one transaction, and the response reports
        `rolledBack: true`. Uploading DIFFERENT bytes for the same
        (show, sequence, target) creates a new asset and marks the
        previous one superseded, in the same transaction -
        `rolledBack: false` - a filename is never part of this identity
        (ADR-028 decision 1): three different targets' artifacts for one
        xLights sequence may share one filename without colliding.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AssetUploadRequest"
      responses:
        "200":
          description: >-
            OK. The registered asset: freshly ingested, the pre-existing
            asset on an idempotent no-op, or the restored asset on a
            rollback. See `rolledBack`.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "400":
          description: >-
            Invalid or missing field (`invalid-parameter`), or
            `targetKind: "node"` with no `target`
            (`asset-target-required`) - see `detail` for which.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Either the principal does not hold `asset:write`
            (`forbidden`), or a cookie-authenticated write was missing
            `Sec-Fetch-Site: same-origin` (`csrf-rejected`).
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: >-
            The uploaded file exceeds this coordinator's own upload size
            bound (`SHOWMESH_ASSET_MAX_UPLOAD_BYTES`). Nothing was
            stored. Shares `type` `payload-too-large` with the identical
            refusal on `POST /config/resolume/composition` - one class,
            one URI.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
        "507":
          description: >-
            This coordinator's asset storage ran out of space while
            staging the upload (`storage-full`). Nothing was registered.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /assets/{id}:
    get:
      operationId: getAsset
      summary: One asset's metadata (Track E seam E3/E4)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /assets/{id}/content:
    get:
      operationId: getAssetContent
      summary: One asset's bytes (Track E seam E3/E4)
      description: >-
        Gated by `node:read`, not the show:macro:run/config:write posture
        every other Track E route on this surface uses - this is the
        route an AGENT authenticates against to fetch its own bytes, and
        node:read is what an agent credential already holds. Supports
        `Range` (via the standard HTTP mechanism), so an interrupted
        transfer can resume. `ETag` is the asset's own content hash,
        quoted. Before serving, this coordinator compares the stored
        blob's actual on-disk size against the asset's own recorded size:
        on a mismatch it fails with `500` naming the asset rather than
        serving a truncated or corrupted body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: Standard HTTP byte-range request, e.g. "bytes=0-1023".
      responses:
        "200":
          description: OK. The complete asset bytes.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
            ETag:
              schema:
                type: string
              description: The asset's content hash, quoted.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial Content, honoring a `Range` request header.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: >-
            An internal error, OR (see `detail`) the stored blob's
            on-disk size disagrees with its recorded size: a corrupted or
            truncated asset is reported, never served.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /assets/manifest:
    get:
      operationId: getAssetManifest
      summary: Every declared node's asset readiness (Track E seam E5, ADR-028)
      description: >-
        "What should a node hold" (the active show's current assets)
        compared against "what does it actually hold" (its own inventory
        report), for every declared node, in declaration order. Computed
        identically to `GET /nodes/{nodeId}/assets`, one node at a time.
        Never gated by `asset:write`: reads stay open by default
        (ADR-024), matching every other Track E config-metadata read's
        `readAnyGuard(show:macro:run OR config:write)` posture. Absent
        evidence is stated, never omitted (ADR-020): no active show
        configured, a report that has never arrived, a report older than
        the staleness window, and a report that said it could not fully
        enumerate its own directory each render `state: "unknown"` with
        their own distinct `reason` - an `unknown` verdict never renders
        as `ready` or `not_ready`, and a stale report never renders as
        `not_ready` (a stale report is not evidence of absence).
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetManifestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /nodes/{nodeId}/assets:
    get:
      operationId: getNodeAssetManifest
      summary: One node's asset readiness (Track E seam E5, ADR-028)
      description: >-
        The same verdict `GET /assets/manifest` renders for this node
        alone. `404` when `nodeId` does not name a declared node -
        matching `GET /nodes/{nodeId}`'s identical posture, never
        `state: "unknown"` for a node this coordinator has never heard of
        at all.
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
          description: >-
            Same ID syntax as an MQTT node ID: 1-64 characters, lowercase
            letters/digits/hyphens, not starting or ending with a hyphen.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeAssetManifestResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /nodes/{nodeId}/cue-catalog:
    get:
      operationId: getNodeCueCatalog
      summary: One node's resolved Cue catalog (Track H seam H3)
      description: >-
        What the active Show's `show.cue`/`show.playlist` configuration
        resolves to for this node right now: every Cue some Playlist
        references or a `safeCue` `mismatchPolicy` names (an unreferenced
        Cue is a draft and never appears here), each Cue's outputs
        resolved for this node, and the content hashes of the assets those
        outputs need (reusing the same asset identity `GET
        /nodes/{nodeId}/assets` uses, never a second expectation model).
        `revision` is a SHA-256 over a canonical serialization covering
        the Show id, `generation`, this node's id, and every Cue id,
        revision, resolved output, and asset hash - the coordinator and a
        node compute it with the same function, so disagreement is
        detectable rather than assumed away.


        `configured` is `false`, with `show`/`generation`/`revision`
        absent and `entries` empty, exactly when no `show.active` is
        configured: the honest-absence case, never a fabricated
        `generation` of `0` that could be mistaken for a real grant. `404`
        when `nodeId` does not name a declared node, matching `GET
        /nodes/{nodeId}/assets`'s identical posture.
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
          description: >-
            Same ID syntax as an MQTT node ID: 1-64 characters, lowercase
            letters/digits/hyphens, not starting or ending with a hyphen.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CueCatalogResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /nodes/{nodeId}/cue-catalog/acknowledge:
    post:
      operationId: postNodeCueCatalogAcknowledge
      summary: A node reports which Cue catalog revision it holds (Track H seam H3)
      description: >-
        Behind `node:observe`: an authenticated node reporting the catalog
        revision (for the show and generation it was resolved from) it now
        holds. Stored beside the node's asset report, the same shape
        Track E already uses for the per-node asset manifest.


        `status` is `"catalog-current"` only when the acknowledged
        revision equals the one this coordinator resolves right now for
        this node; otherwise `"catalog-stale"`, naming both revisions -
        there is no partial state. **Acknowledging a catalog is explicitly
        NOT readiness**: this response says nothing about asset presence,
        which stays `GET /nodes/{nodeId}/assets`'s own answer. `404` when
        `nodeId` does not name a declared node.
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
          description: >-
            Same ID syntax as an MQTT node ID: 1-64 characters, lowercase
            letters/digits/hyphens, not starting or ending with a hyphen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CueCatalogAcknowledgeRequest"
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CueCatalogAcknowledgeResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /nodes/{nodeId}/cue-catalog/deploy:
    post:
      operationId: dispatchCueCatalogDeploy
      summary: Deploy this node's resolved Cue catalog (Track H seam H3)
      description: >-
        Behind `cuecatalog:deploy` (admin only), deliberately not
        `asset:write`: deploying a catalog grants the node authority to
        execute Cues, which is a separate power from putting a file in the
        asset store. Resolves
        THIS coordinator's own current Cue catalog for `nodeId` (never a
        request-body value - there is nothing for a caller to supply) and
        dispatches `cuecatalog.deploy` to the node over MQTT, the same
        command path `POST .../render/surfaces/{surfaceId}/apply` uses one
        seam earlier.


        `outcome` is `"confirmed"` only once the node's own result reports
        it has independently recomputed and persisted the identical
        revision this dispatch sent (ADR-003: a bare successful publish is
        never conflated with the node having accepted anything). On a
        confirmed outcome, the revision the node reports holding is also
        recorded via the same acknowledgement path `POST
        .../cue-catalog/acknowledge` uses, so `GET
        /nodes/{nodeId}/cue-catalog` and its own acknowledge route can
        report `catalog-current` from a real deployment. `400` when no
        `show.active` is configured (there is nothing to deploy); `404`
        when `nodeId` does not name a declared node.
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
          description: >-
            Same ID syntax as an MQTT node ID: 1-64 characters, lowercase
            letters/digits/hyphens, not starting or ending with a hyphen.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CueCatalogDeployRequest"
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CueCatalogDeployResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  responses:
    UnsupportedAPIVersion:
      description: >-
        The request named an API version (in the `ShowMesh-API-Version`
        header, or in the path as `/api/vN/...`) that this coordinator does
        not serve.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ResourceNotFound:
      description: No resource with the given identifier exists.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidParameter:
      description: A path or query parameter failed validation.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: >-
        No valid credential was presented: reads are closed and none was
        given (or it did not authenticate), or the route is a write /
        `GET /audit` and no credential authenticated at all.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: >-
        A valid credential authenticated, but the principal does not hold
        the scope this operation requires. `detail` names the missing
        scope (ADR-024 decision 4).
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CSRFRejected:
      description: >-
        A cookie-authenticated write was missing the
        `Sec-Fetch-Site: same-origin` request header (ADR-024 decision 6).
        A bearer-token-authenticated request never receives this response.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LoginCSRFRejected:
      description: >-
        Neither same-origin signal was present: no
        `Sec-Fetch-Site: same-origin`, and no `Origin` header naming the
        host this request was addressed as (owner decision, 2026-08-12:
        strict; two-signal correction 2026-08-14 - the identical predicate
        `CSRFRejected` already applies to every other write, since there is
        deliberately one CSRF rule in this codebase, not two). Unlike
        `CSRFRejected`, there is no bearer exemption for this operation: it
        is unauthenticated by construction, so there is no pre-existing
        credential that could BE bearer-shaped in the first place. A `curl`
        login must pass one of the two headers explicitly. A browser
        reaching this response is no longer evidence of an old browser: it
        means the origin the browser used and the host this coordinator was
        addressed as disagree, which in practice is a proxy rewriting
        `Host`. The bearer-paste break-glass affordance (ADR-024 decision
        5) remains the fallback path either way.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: >-
        `POST /session`'s login concurrency bound was exceeded (ADR-024
        decision 8). Carries a `Retry-After` response header.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: >-
        The path names a real route, but this request's method is not one
        that route serves. A method this document does not define for a
        path returns this response rather than a `404`, and the `Allow`
        header names exactly the methods that path does serve.

        This description used to say that the document defined only `get`
        operations because every route was read-only. That stopped being
        true in Step 6, which added `POST /session` and
        `POST /bootstrap`, and stopped being true three times over in
        Step 7, which added the configuration, discovery and FPP command
        writes. What has NOT changed is the rule underneath it: no state
        change in this API is reachable by `GET` (ADR-024), so a `GET`
        remains safe to issue against any path here.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >-
        The request itself is valid, but this coordinator's current state
        makes it unsafe or meaningless to act on right now - the identical
        request would succeed at a different moment, which is what
        distinguishes this from `InvalidParameter` (a property of the
        request itself). Every operation that returns this response names
        its own specific cause in `detail`: `PUT /config/fpp.endpoints`
        (Step 7 seam A) refuses because `SHOWMESH_FPP_ENDPOINTS` is still
        set in the coordinator's own process environment (RES-008 D1) and
        the identical body would be accepted the moment the variable is
        removed and this coordinator restarts once;
        `POST /discovery/runs` (Step 7 seam B) refuses because a run is
        already in progress.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: >-
        The coordinator failed to answer this request for a reason that
        has nothing to do with whether the requested resource exists or
        the request was well formed - an internal dependency (e.g. the
        store) failed. `detail` never carries the underlying error; it is
        logged coordinator-side only.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AudioCommandAuditUnavailable:
      description: >-
        The pre-dispatch write that must durably record this command
        before it is dispatched could not be appended to this
        coordinator's audit store. Nothing was recorded and nothing was
        dispatched to the node; retry once the audit store is writable
        again.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  headers:
    ShowMesh-API-Version:
      description: >-
        The API major version this response was served by. Present on
        every `/api/v1` response, success or error, with no exception
        (contract section 6.2). A client MAY also send this as a request
        header naming the version it expects; a coordinator that does not
        serve that version answers with the `UnsupportedAPIVersion`
        problem instead of a partial or best-guess render (contract
        section 6.6).
      schema:
        type: string
        enum: ["1"]
    Allow:
      description: >-
        Present only on a `405` response. The exact, comma-separated set
        of HTTP methods the requested path serves (e.g. `"GET, HEAD"`),
        computed from the routes actually registered - never a static or
        hand-maintained list.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <token>` (ADR-024). token is an API token
        minted for a principal by an admin, displayed exactly once at
        creation and stored coordinator-side only as a SHA-256 digest. A
        malformed or non-`Bearer` `Authorization` header never falls
        through to `cookieAuth` (ADR-024 decision 6) - it is treated as no
        credential at all. Reads are open by default (this scheme is
        optional for them, per the top-level `security` requirement not
        being exclusive); every write requires it or `cookieAuth`, with no
        opt-out. `/healthz`, `/readyz`, and `/version` are outside this
        contract entirely and are never authenticated, at any
        configuration.
    cookieAuth:
      type: apiKey
      in: cookie
      name: showmesh_session
      description: >-
        The `HttpOnly` session cookie `POST /session` mints (ADR-024
        decision 5). Not usable outside a browser in practice (nothing
        exposes it to script), and a write authenticated this way
        additionally requires the `Sec-Fetch-Site: same-origin` request
        header (decision 6) - omitted from this scheme's own contract
        because OpenAPI's securityScheme vocabulary has no way to express
        a conditional required header; see this document's top-level
        description and `components.responses.CSRFRejected`.
  schemas:
    Evidence:
      type: object
      description: >-
        The evidence envelope every observation-bearing field on this API
        uses (contract section 6.3). `state` is one of the six values
        below; `value` is null only for the three genuine absence states -
        `not_collected`, `collection_failed`, `unsupported` - where nothing
        was ever obtained. It is non-null for `current`, `stale`, AND
        `unknown_age`: `unknown_age` means a value exists but the time it
        was observed does not, which is a distinct condition from having no
        value at all, and a client that treats `unknown_age` as absent is
        making exactly the reading error that state was invented to
        prevent (a retained MQTT delivery, most commonly - see below).
        `reason` is non-null whenever `state` is not `current`.
        `observedAt` is null whenever the observation time is unknown -
        most importantly for a retained MQTT delivery (`state:
        "unknown_age"`) - and MUST NEVER be treated as equivalent to "now".


        **A signal can be reported by more than one collector source.**
        FPP's own REST API and its MQTT status topics both describe the same
        underlying facts (playback, controller/network health, pixel
        current), under identically-named `signal` values, distinguished
        only by `source` ("fpp-rest" vs "fpp-mqtt"). This API never renders
        more than one `Evidence` for the same signal on the same resource:
        when both sources have something to say, the coordinator resolves
        to a single value by a fixed precedence (a source with a known
        observation time beats one without, which beats an absence; a
        later observation time beats an earlier one; a tie prefers
        "fpp-rest" over "fpp-mqtt") before this envelope is ever built. A
        client reading this API never has to implement that resolution
        itself, and never sees two competing rows to reconcile.
      required:
        [signal, value, unit, state, reason, observedAt, collectedAt,
         source, quality, validForSeconds]
      properties:
        signal:
          type: string
          description: >-
            Namespaced, dot-separated signal identifier. Existing
            namespaces include "fpp.playlist.*"/"fpp.sequence.*"/
            "fpp.position.*"/"fpp.song.*"/"fpp.scheduler.*" (playback
            state), "fpp.fppd.*"/"fpp.power.*"/"fpp.bridging"/
            "fpp.channel_inputs.*"/"fpp.channel_outputs.*"/"fpp.mqtt.*"/
            "fpp.warnings.*" (controller and network health),
            "fpp.os.*"/"fpp.platform"/"fpp.variant"/"fpp.kernel"/
            "fpp.utilization.*"/"fpp.disk.*" (platform), "fpp.port.<key>.*"
            and "fpp.sensor.<key>.*" (per-port pixel current and per-sensor
            readings, `<key>` derived from that port's or sensor's own
            reported name - this set is dynamic and cannot be enumerated
            ahead of a real poll; an instance with nothing to report there
            simply has no such entries), "fpp.multisync.enabled",
            "node.heartbeat". A client MUST NOT assume this is a closed
            vocabulary: new signals and new namespaces are added
            additively, and an unrecognized one should render generically
            (e.g. under an "other" grouping) rather than being dropped.
        value:
          type: [boolean, string, integer, number, "null"]
        unit:
          type: [string, "null"]
          description: >-
            Never a claimed unit this API cannot actually verify - for
            example, a "fpp.sensor.<key>.value" temperature reading's unit
            is always null (Celsius vs. Fahrenheit is not stated by the
            source and is not guessed); the reading's kind is instead
            carried on a separate "fpp.sensor.<key>.type" signal
            ("Temperature", "Voltage").
        state:
          type: string
          enum:
            [current, stale, unknown_age, not_collected, collection_failed,
             unsupported]
        reason:
          type: [string, "null"]
        observedAt:
          type: [string, "null"]
          format: date-time
        collectedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Null only for state "not_collected" - no attempt was ever
            made, so there is no collection bookkeeping to report, not
            even a fallback timestamp. Non-null for every other state,
            including every absence state that DID involve an attempt
            ("collection_failed", "unsupported"). This is bookkeeping
            (when the coordinator recorded this evidence), never itself
            evidence of the subject's state - see observedAt above for
            that.
        source:
          type: string
          description: >-
            Names the collector that produced this evidence, e.g.
            "fpp-rest" (FPP's REST API), "fpp-mqtt" (FPP's own MQTT status
            topics - a second, independent source for many of the same
            facts "fpp-rest" reports), "mqtt-inventory" (node
            advertisement/liveness). Not a closed enum: a client should not
            special-case specific source values beyond display purposes.
        quality:
          type: string
          enum: [direct, derived, inferred, operator]
        validForSeconds:
          type: [integer, "null"]
          description: >-
            Null means the value does not expire on its own. Never a Go
            duration string.
    ResourceRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [node, fpp, coordinator, resolume, surface, audio_session]
        id:
          type: string
    Capability:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
        version:
          type: integer
        attributes:
          type: object
          additionalProperties: true
    ControlPlane:
      type: object
      description: >-
        A node's control-plane liveness verdict. "offline" means the MQTT
        control-plane connection is gone, not that the node - or a show it
        may still be running - is dead (contract section 3.2).
      required: [state, reason]
      properties:
        state:
          type: string
          enum: [online, offline, unknown]
        reason:
          type: [string, "null"]
          description: Non-null whenever state is not "online".
    NodeEvidence:
      type: object
      required: [hello, lastWill, heartbeat]
      properties:
        hello:
          $ref: "#/components/schemas/Evidence"
        lastWill:
          $ref: "#/components/schemas/Evidence"
        heartbeat:
          $ref: "#/components/schemas/Evidence"
    Node:
      type: object
      description: >-
        One node's current representation: an element of GET /nodes, of
        the snapshot's nodes list, and the payload of a node.changed
        stream event - all three render identically.
      required:
        [nodeId, label, platform, agentVersion, bootId, startedAt,
         firstSeenAt, updatedAt, capabilities, controlPlane, evidence,
         declaration, render, audio, fppConnect]
      properties:
        nodeId:
          type: string
        label:
          type: [string, "null"]
        platform:
          type: [string, "null"]
        agentVersion:
          type: [string, "null"]
        bootId:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date-time
        firstSeenAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        controlPlane:
          $ref: "#/components/schemas/ControlPlane"
        evidence:
          $ref: "#/components/schemas/NodeEvidence"
        declaration:
          $ref: "#/components/schemas/NodeDeclaration"
        render:
          type: array
          description: >-
            Track B seam B2b: whatever render-pipeline observations this
            coordinator currently holds for this node, one entry per
            signal. Never omitted; an empty array means this node has never
            published a render report. Most entries' resource names the
            SURFACE they concern (ADR-026), not this node - the exception
            (finding 7) is the two `node.multisync.*` signals, which name
            this node directly, because one MultiSync listener serves every
            surface a node supervises and attributing its status to a
            surface would report one fact once per surface as though each
            were independent.


            `surface.pipeline.state`'s open vocabulary includes `superseded`:
            a surface holding its previous render across an active-show
            switch reports this instead of `running` - the coordinator's own
            verdict, compared against its current show resolution, never a
            claim the node makes about itself. `surface.content.show` and
            `surface.content.generation` name the show and generation that
            authorized what is currently held, present exactly when
            `surface.content.catalog_revision` is.
          items:
            $ref: "#/components/schemas/ObservationEntry"
        audio:
          type: array
          description: >-
            Whatever node.audio.* observations this coordinator currently
            holds for this node, one entry per signal. Never omitted; an
            empty array means this node has never published an audio
            discovery report.
          items:
            $ref: "#/components/schemas/ObservationEntry"
        fppConnect:
          type: array
          description: >-
            Whatever node.fppconnect.channel_range.* observations
            this coordinator currently holds for this node's most recently
            resolved fppconnect.configure push - whether the pushed
            channel range was formatted, legitimately empty (no configured
            surface), or dropped (a surface existed but could not be
            formatted, e.g. a refused range or a string too long for the
            ping's 120-byte field), and why. Never omitted; an empty array
            means this node has never had a fppconnect.configure push
            resolved for it. Resource names this node directly, the
            `node.multisync.*` precedent (one push carries one
            channel-range string per node).
          items:
            $ref: "#/components/schemas/ObservationEntry"
    NodeDeclaration:
      type: object
      description: >-
        A node's declaration state (RES-008 D2/D6, BUILD-PLAN Step 7 seam
        B): an operator's durable statement that this node belongs to the
        installation, independent of whether it currently reports in, plus
        a discovery-evidence verdict computed on every read against the
        single most recent discovery run - never stored. `declared: false`
        means every other field is null: this node exists only as an
        observation nobody has ever promoted (POST
        /nodes/{nodeId}/declaration), and `discoveryState` is
        `not_applicable` (discovery-seen state has no meaning for something
        not part of the declared inventory).

        `discoveryState` is one of four values: `present` (the most recent
        discovery run was complete and saw this node), `not_seen` (the most
        recent discovery run was complete and did NOT see this node -
        `discoveryReason` states why and `notSeenAsOfRunId`/
        `notSeenAsOfRunFinishedAt` name THAT run specifically),
        `unknown` (either the most recent run did not complete - an
        incomplete run is never evidence of absence, so this is never
        `not_seen` - or no discovery run history is available at all,
        which covers both "never run" and "history pruned" identically
        since this API cannot and must not guess which), or
        `not_applicable` (`declared` is false).

        `lastDiscoveryRunId`/`lastDiscoveredAt` are this declaration's OWN
        last-seen-by-discovery bookkeeping (the run that most recently DID
        see it, and when - null if it has never once been seen). They are
        NEVER repurposed to carry any other run's identity, including the
        run that just failed to see it: a field literally named
        `lastDiscoveredAt` asserting a time seconds old for a node that has
        actually been dark for a week would be exactly backwards.
        `lastDiscoveryRunId` may name a run id that no longer resolves to
        any `DiscoveryRun` - `discovery_runs` is pruned by retention and a
        declaration's own last-seen pointer is not, so a dangling id is
        expected, not a bug, and it renders as `unknown` (or `not_seen`, if
        a newer complete run has since run and also missed it) with a
        reason, never as blank.

        `notSeenAsOfRunId`/`notSeenAsOfRunFinishedAt` name the run that did
        NOT see this declared node - populated ONLY when `discoveryState`
        is `not_seen`, both null otherwise. Added additively: an existing
        client that has never heard of these two fields keeps working
        unchanged, reading `discoveryReason`'s prose and
        `lastDiscoveryRunId`/`lastDiscoveredAt`'s own (unaffected) bookkeeping
        exactly as before.
      required:
        [declared, label, notes, declaredAt, declaredByPrincipalId,
         declaredByPrincipalName, discoveryState, discoveryReason,
         lastDiscoveryRunId, lastDiscoveredAt,
         notSeenAsOfRunId, notSeenAsOfRunFinishedAt]
      properties:
        declared:
          type: boolean
        label:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        declaredAt:
          type: [string, "null"]
          format: date-time
        declaredByPrincipalId:
          type: [string, "null"]
        declaredByPrincipalName:
          type: [string, "null"]
        discoveryState:
          type: string
          enum: [present, not_seen, unknown, not_applicable]
        discoveryReason:
          type: [string, "null"]
        lastDiscoveryRunId:
          type: [string, "null"]
        lastDiscoveredAt:
          type: [string, "null"]
          format: date-time
        notSeenAsOfRunId:
          type: [string, "null"]
        notSeenAsOfRunFinishedAt:
          type: [string, "null"]
          format: date-time
    DiscoveryRun:
      type: object
      description: >-
        One discovery run's wire representation (RES-008 D6, BUILD-PLAN
        Step 7 seam B). `finishedAt` and `reason` are null while a run is
        still in progress; `reason` is also null for a run that completed
        successfully (`complete: true`) - it is populated only when
        `complete` is false and the run has finished (failed partway),
        never a missing row and never a silent partial success.
      required:
        [id, startedAt, finishedAt, complete, reason, foundCount,
         initiatedByPrincipalId, initiatedByPrincipalName]
      properties:
        id:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        complete:
          type: boolean
        reason:
          type: [string, "null"]
        foundCount:
          type: integer
        initiatedByPrincipalId:
          type: string
        initiatedByPrincipalName:
          type: string
    DiscoveryProposal:
      type: object
      description: >-
        One entity a discovery run observed that is not currently declared
        (computed at read time by diffing what is observed against what is
        declared - no proposals table exists). `source` is `node` (an
        agent hello already in inventory) or `fpp` (a configured FPP
        instance), the only two sources discovery reads: it performs no
        active probing of its own. A run never creates a declaration from
        a proposal by itself - POST /nodes/{nodeId}/declaration is the
        separate operator action that promotes one.
      required: [nodeId, source]
      properties:
        nodeId:
          type: string
        source:
          type: string
          enum: [node, fpp]
    DiscoveryRunResponse:
      type: object
      required: [serverTime, run, proposals]
      properties:
        serverTime:
          type: string
          format: date-time
        run:
          $ref: "#/components/schemas/DiscoveryRun"
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryProposal"
    DeclareNodeRequest:
      type: object
      description: >-
        Body of POST /nodes/{nodeId}/declaration. Both fields are optional
        AND nullable - a bare `{}` (or an absent/null field) promotes the
        named node to declared with no label or notes on a BRAND-NEW
        declaration, or leaves that field's currently declared value
        UNCHANGED on an already-declared node. Idempotent: re-declaring an
        already-declared node with neither field present never disturbs its
        existing label/notes, or who first declared it, or when. An
        explicit empty string (`""`) still clears a field; only an absent
        key or an explicit `null` means "leave unchanged" - the same
        absent-versus-empty distinction as a JSON `null` never being an
        absent key, applied in reverse: here, ABSENCE is what must be
        representable and honored, because a client that cannot omit a
        field cannot ask for "unchanged" at all.
      properties:
        label:
          type: [string, "null"]
        notes:
          type: [string, "null"]
    NodeDeclarationResponse:
      type: object
      required: [serverTime, declaration]
      properties:
        serverTime:
          type: string
          format: date-time
        declaration:
          $ref: "#/components/schemas/NodeDeclaration"
    DeleteNodeDeclarationRequest:
      type: object
      description: >-
        Required body of DELETE /nodes/{nodeId}/declaration. `confirm` must
        be `true`, so a mis-issued call cannot quietly remove inventory -
        in addition to, never instead of, any confirmation dialog a UI
        client shows.
      required: [confirm]
      properties:
        confirm:
          type: boolean
    FPPInstance:
      type: object
      description: >-
        One configured FPP instance's current representation. `endpoint`
        never includes userinfo (credentials are stripped before this is
        ever rendered).
      required:
        [instanceId, endpoint, health, observations, lastPollAt,
         lastPollError, instanceUuid, instanceUuidFirstObservedAt,
         instanceUuidChange, duplicateInstanceUuidEndpointIds]
      properties:
        instanceId:
          type: string
        endpoint:
          type: string
        health:
          type: string
          enum: [healthy, degraded, failed, unknown, suppressed]
        observations:
          type: array
          description: Ordered by signal, ascending, and this ordering is guaranteed.
          items:
            $ref: "#/components/schemas/Evidence"
        lastPollAt:
          type: [string, "null"]
          format: date-time
        lastPollError:
          type: [string, "null"]
        instanceUuid:
          type: [string, "null"]
          description: >-
            FPP's own SystemUUID, as most recently reported by this
            endpoint (decoded off the fpp.uuid signal, and off the FPP
            plugin's playlist-entry observations). Null until this
            endpoint has actually reported a uuid at least once; never
            populated from a not_collected placeholder.
        instanceUuidFirstObservedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When this endpoint's CURRENT instanceUuid was first observed.
            Null exactly when instanceUuid is null.
        instanceUuidChange:
          oneOf:
            - $ref: "#/components/schemas/FPPInstanceUUIDChange"
            - type: "null"
          description: >-
            Non-null exactly when this endpoint has a PENDING,
            unacknowledged uuid change: it previously reported a
            different instanceUuid than its current one. A uuid change on
            a known endpoint (an SD card clone, a restored backup, a
            swapped controller) is a visible conflict, never a silent
            re-association, this field stays non-null until an operator
            explicitly acknowledges it via
            POST /fpp/{instanceId}/instance-uuid/acknowledge.
        duplicateInstanceUuidEndpointIds:
          type: array
          description: >-
            Every OTHER currently configured FPP instance reporting the
            SAME instanceUuid as this one, a stated finding, never a
            silently overwritten row. Empty, never null, when there is no
            duplicate.
          items:
            type: string
    FPPInstanceUUIDChange:
      type: object
      description: >-
        The uuid an FPP instance reported immediately before its current
        one, and when that change was first observed.
      required: [previousUuid, changedAt]
      properties:
        previousUuid:
          type: string
        changedAt:
          type: string
          format: date-time
    AcknowledgeFPPInstanceUUIDChangeResponse:
      type: object
      description: The body of `POST /fpp/{instanceId}/instance-uuid/acknowledge`.
      required: [serverTime, instance]
      properties:
        serverTime:
          type: string
          format: date-time
        instance:
          description: >-
            Null exactly when the acknowledgment committed but the
            instance is no longer among the currently configured
            fpp.endpoints (an operator removed it between the write and
            this response rendering it). The acknowledgment itself still
            succeeded and is not undone; there is just no current
            FPPInstance view left to render. Never null otherwise.
          oneOf:
            - $ref: "#/components/schemas/FPPInstance"
            - type: "null"
    Event:
      type: object
      description: >-
        One recorded event: an element of GET /events, and the payload of
        an event.recorded stream event. `occurredAt` is null when the
        change was first learned from evidence of unknown age.
      required:
        [seq, recordedAt, occurredAt, source, resource, category, severity,
         summary, details, correlationId]
      properties:
        seq:
          type: integer
          description: >-
            A durable, strictly increasing cursor into event history. Never
            to be confused with an SSE stream frame's per-connection seq.
        recordedAt:
          type: string
          format: date-time
        occurredAt:
          type: [string, "null"]
          format: date-time
        source:
          type: string
        resource:
          $ref: "#/components/schemas/ResourceRef"
        category:
          type: string
        severity:
          type: string
          enum: [informational, warning, critical]
        summary:
          type: string
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: [string, "null"]
    ObservationEntry:
      type: object
      description: >-
        One element of GET /observations: the section 6.3 Evidence envelope
        plus its own resource, since a flat list spanning every resource
        cannot rely on an enclosing object to imply the subject the way
        Node.evidence.* or FPPInstance.observations can.
      required:
        [resource, signal, value, unit, state, reason, observedAt,
         collectedAt, source, quality, validForSeconds]
      properties:
        resource:
          $ref: "#/components/schemas/ResourceRef"
        signal:
          type: string
        value:
          type: [boolean, string, integer, number, "null"]
        unit:
          type: [string, "null"]
        state:
          type: string
          enum:
            [current, stale, unknown_age, not_collected, collection_failed,
             unsupported]
        reason:
          type: [string, "null"]
        observedAt:
          type: [string, "null"]
          format: date-time
        collectedAt:
          type: [string, "null"]
          format: date-time
          description: See Evidence.collectedAt; null only for state "not_collected".
        source:
          type: string
        quality:
          type: string
          enum: [direct, derived, inferred, operator]
        validForSeconds:
          type: [integer, "null"]
    CollectorStatus:
      type: object
      required: [id, state, reason]
      properties:
        id:
          type: string
        state:
          type: string
        reason:
          type: [string, "null"]
    CoordinatorInfo:
      type: object
      required: [version, commit, buildDate, goVersion]
      properties:
        version:
          type: string
        commit:
          type: string
        buildDate:
          type: string
        goVersion:
          type: string
    ServiceDescriptor:
      type: object
      required: [serverTime, apiVersion, supportedVersions, coordinator]
      properties:
        serverTime:
          type: string
          format: date-time
        apiVersion:
          type: integer
        supportedVersions:
          type: array
          items:
            type: integer
        coordinator:
          $ref: "#/components/schemas/CoordinatorInfo"
    NodesResponse:
      type: object
      required: [serverTime, nodes]
      properties:
        serverTime:
          type: string
          format: date-time
        nodes:
          type: array
          description: >-
            Ordered by nodeId, ascending, and this ordering is
            guaranteed - a client that renders or diffs this array
            positionally may rely on it.
          items:
            $ref: "#/components/schemas/Node"
    NodeResponse:
      type: object
      description: >-
        The body of GET /nodes/{nodeId}: a single node wrapped in
        serverTime exactly like the collection endpoint, never a bare Node
        object - every response on this API carries serverTime with no
        exception (section 6.2).
      required: [serverTime, node]
      properties:
        serverTime:
          type: string
          format: date-time
        node:
          $ref: "#/components/schemas/Node"
    FPPResponse:
      type: object
      required: [serverTime, instances]
      properties:
        serverTime:
          type: string
          format: date-time
        instances:
          type: array
          description: >-
            Ordered exactly as this coordinator's own FPP endpoint
            configuration lists them, stable for the life of the process.
            This ordering is guaranteed, but it is configuration order,
            not an alphabetical or otherwise derived order.
          items:
            $ref: "#/components/schemas/FPPInstance"
    FPPInstanceResponse:
      type: object
      description: See NodeResponse; the same rule applies identically here.
      required: [serverTime, instance]
      properties:
        serverTime:
          type: string
          format: date-time
        instance:
          $ref: "#/components/schemas/FPPInstance"
    ResolumeInstanceComposition:
      type: object
      description: >-
        Which show is loaded, from the composition ShowMesh holds as
        configuration (ADR-032), never a live read of Arena. Name only -
        owner ruling, 2026-08-16: this is an open read with no credential
        by default, the same class as an FPP playlist name. Revision and
        activatedAt are administrative provenance and stay on the gated
        GET /config/resolume/composition.
      required: [name]
      properties:
        name:
          type: string
    ResolumeInstance:
      type: object
      description: >-
        One configured Resolume Arena instance's current representation.
        Mirrors FPPInstance's conventions: observations
        is never null, and composition is null before any composition has
        ever been uploaded.
      required: [instanceId, health, observations, composition]
      properties:
        instanceId:
          type: string
        health:
          type: string
          enum: [healthy, degraded, failed, unknown, suppressed]
        observations:
          type: array
          description: Ordered by signal, ascending, and this ordering is guaranteed.
          items:
            $ref: "#/components/schemas/Evidence"
        composition:
          oneOf:
            - $ref: "#/components/schemas/ResolumeInstanceComposition"
            - type: "null"
    ResolumeInstancesResponse:
      type: object
      required: [serverTime, instances]
      properties:
        serverTime:
          type: string
          format: date-time
        instances:
          type: array
          description: >-
            At most one element today (SHOWMESH_RESOLUME_ID). An
            unconfigured coordinator returns an empty array, never null.
          items:
            $ref: "#/components/schemas/ResolumeInstance"
    ResolumeInstanceResponse:
      type: object
      description: See NodeResponse; the same rule applies identically here.
      required: [serverTime, instance]
      properties:
        serverTime:
          type: string
          format: date-time
        instance:
          $ref: "#/components/schemas/ResolumeInstance"
    FPPCommandRequest:
      description: >-
        The body of POST /fpp/{instanceId}/commands (Step 7 seam C, Step 8,
        ADR-001, ADR-003) - a discriminated union on `action`, one member
        per docs/bench/fpp-command-vocabulary.md section 4's eight
        primitives. This is a deliberate correction: earlier this schema
        declared `params` as a bare, propertyless `object`, which a
        strict-JSON-Schema code generator renders as a type NO non-empty
        object satisfies - the exact opposite of what most of these eight
        actions need, since three of them (`startPlaylist`,
        `stopPlaylistGracefully`, `setVolume`) take real parameters. Each
        variant below carries its own concrete `params` shape - required
        fields, enums, numeric bounds - as real JSON Schema, not as prose
        a generator cannot see.

        `idempotencyKey` is required on every variant (ARCHITECTURE
        section 8.1): RES-015 section 7.3 established that FPP supplies
        nothing a coordinator-minted key could be derived from, so the
        caller (showmeshctl, the Operator UI) mints a fresh one per
        invocation. Its scoping rule (replay vs. `409` conflict) is
        identical on every variant - see any one variant's own
        `idempotencyKey` description below; the text is not repeated here
        a ninth time.

        `params` is REQUIRED whenever an action has at least one required
        parameter (`startPlaylist`, `setVolume`) and OPTIONAL otherwise.
        When optional, absent or `{}` means every parameter takes its
        documented default. An explicit `"params": null` is ALWAYS a
        `400`, for every action - every variant's own `params` schema is a
        plain JSON object type, never nullable, so a generated client
        cannot even construct this shape, and this coordinator's own
        handler rejects it explicitly rather than treating null as
        "omitted" (an explicit null is not the same as an omitted field).
        A required parameter absent, present as `null`, or (for a string)
        present as `""` are three DIFFERENT `400` responses, each naming
        exactly what is wrong. A key an action's own `params` schema does
        not declare is a `400` naming it (every variant's `params` sets
        `additionalProperties: false`) - deliberately stricter than this
        document's own "clients ignore unknown fields" rule, which governs
        a client reading RESPONSES, not a server accepting a WRITE: a
        typo'd parameter name must never silently fall back to that
        parameter's own default.
      discriminator:
        propertyName: action
        mapping:
          startPlaylist: "#/components/schemas/StartPlaylistCommandRequest"
          stopPlaylistGracefully: "#/components/schemas/StopPlaylistGracefullyCommandRequest"
          setVolume: "#/components/schemas/SetVolumeCommandRequest"
          stopPlaylist: "#/components/schemas/NoParamsFPPCommandRequest"
          pausePlaylist: "#/components/schemas/NoParamsFPPCommandRequest"
          resumePlaylist: "#/components/schemas/NoParamsFPPCommandRequest"
          nextPlaylistItem: "#/components/schemas/NoParamsFPPCommandRequest"
          prevPlaylistItem: "#/components/schemas/NoParamsFPPCommandRequest"
      oneOf:
        - $ref: "#/components/schemas/StartPlaylistCommandRequest"
        - $ref: "#/components/schemas/StopPlaylistGracefullyCommandRequest"
        - $ref: "#/components/schemas/SetVolumeCommandRequest"
        - $ref: "#/components/schemas/NoParamsFPPCommandRequest"
    StartPlaylistCommandRequest:
      type: object
      description: >-
        `action: "startPlaylist"` (docs/bench/fpp-command-vocabulary.md
        sections 4/5): starts a playlist on the target FPP instance, or
        refuses per `ifBusy` below.
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: startPlaylist
        idempotencyKey:
          type: string
          description: >-
            Scoped to the exact (action, instanceId, normalized params)
            triple it is first used against - a database-level UNIQUE
            constraint on this value alone (schemaV6) cannot express that
            scope, so the server checks it explicitly: reusing a key
            against the SAME action, instanceId, AND normalized params is
            a replay (nothing is dispatched a second time, the original
            result is returned, flagged `replay: true`); reusing it
            against a DIFFERENT action, a DIFFERENT instanceId, or
            DIFFERENT params is a `409` conflict, refused outright, never
            answered as if it belonged to whichever command first claimed
            the key. Mint a fresh key per genuinely new request - never
            reuse one across two different invocations "to be safe."
        params:
          type: object
          description: >-
            `ifBusy: "refuse"` (the default) additionally produces a `409`
            BEFORE anything is dispatched to FPP when a DIFFERENT playlist
            is currently confirmed playing (`type`
            `fpp-start-playlist-busy`), or when the evidence needed to
            decide that is not current (`type`
            `fpp-start-playlist-evidence-not-current`) - see the `409`
            response on POST /fpp/{instanceId}/commands.
          required: [playlist]
          additionalProperties: false
          properties:
            playlist:
              type: string
              minLength: 1
              maxLength: 250
              # Step 8 review finding 12: a generated client could
              # previously build a schema-valid request this coordinator
              # always rejects with a 400 - `" showmesh-test "` (leading/
              # trailing whitespace), 300 `a`s (exceeds 250 bytes), and
              # `"../../etc/passwd"` (traversal, described only in prose)
              # all validated against the PUBLISHED schema before this fix.
              # allOf below expresses every rule
              # internal/coordinator/fppcommand.ValidatePlaylistName
              # enforces that JSON Schema `pattern` (ECMA-style, no
              # lookaround needed - verified against every one of that
              # function's own rules, including every case this finding
              # named, with a small Go program; see this task's report) can
              # express EXACTLY, not approximately: no ASCII control
              # character (0x00-0x1F, 0x7F) or `/`/`\` anywhere; no leading
              # or trailing ASCII space (0x20) - no OTHER leading/trailing
              # ASCII whitespace needs its own rule, because tab/CR/LF are
              # already banned everywhere by the control-character pattern;
              # and no `..` substring anywhere (the traversal rule),
              # expressed without lookaround by requiring every dot be
              # immediately followed by a non-dot, with at most one
              # trailing dot allowed. Two rules the server ALSO enforces
              # remain genuinely inexpressible here and are named rather
              # than left undocumented, per this finding's own instruction:
              # (1) `maxLength` counts Unicode CODE POINTS (JSON Schema's
              # own definition), while the server counts UTF-8 BYTES (the
              # 250 the server compares against is `len(name)` in Go, which
              # is bytes) - a name using multi-byte characters can be
              # schema-valid at 250 code points and still exceed 250 bytes
              # server-side; and (2) the server trims Unicode whitespace
              # generally (Go's `strings.TrimSpace`, `unicode.IsSpace`),
              # which additionally rejects a handful of non-ASCII
              # whitespace code points (e.g. U+00A0) at the edges that this
              # pattern - which only names ASCII space explicitly - cannot
              # practically enumerate. Neither gap is closable by loosening
              # the server; the server remains authoritative for both.
              allOf:
                - pattern: '^[^\x00-\x1F\x7F/\\]*$'
                - pattern: '^([^\x20]|[^\x20].*[^\x20])$'
                - pattern: '^(\.?[^.])*\.?$'
              description: >-
                Must not contain `/`, `\`, or `..` (FPP resolves this to a
                path on its own filesystem; this coordinator rejects a
                traversal attempt before dispatch rather than passing one
                through), must not contain an ASCII control character, and
                must not have leading or trailing whitespace (rejected,
                never trimmed - the operator's value is not this
                coordinator's to edit). The `maxLength` above is 250 JSON
                Schema code points; the coordinator's own limit is 250
                UTF-8 BYTES (see this property's own schema-level comment
                for why the two are not always the same number). 250
                rather than 255 because FPP appends `.json` to this value
                to resolve a filename, so the string that must fit a
                POSIX `NAME_MAX` of 255 is this name plus five bytes.
            repeat:
              type: boolean
              default: false
            ifBusy:
              type: string
              enum: [refuse, replace]
              default: refuse
              description: >-
                `"refuse"` is the default and what an absent field means.
                `"replace"` is the operator saying, in this request, that
                interrupting whatever is currently running is intended.
    StopPlaylistGracefullyCommandRequest:
      type: object
      description: >-
        `action: "stopPlaylistGracefully"` (docs/bench/fpp-command-vocabulary.md
        section 3.3/4): a graceful stop's terminal state is bounded by the
        currently playing item's own remaining runtime, not by any number
        this coordinator can choose - see FPPCommandResult.outcomeReason.
      required: [action, idempotencyKey]
      properties:
        action:
          type: string
          const: stopPlaylistGracefully
        idempotencyKey:
          type: string
          description: >-
            Scoped to the exact (action, instanceId, normalized params)
            triple it is first used against - a database-level UNIQUE
            constraint on this value alone (schemaV6) cannot express that
            scope, so the server checks it explicitly: reusing a key
            against the SAME action, instanceId, AND normalized params is
            a replay (nothing is dispatched a second time, the original
            result is returned, flagged `replay: true`); reusing it
            against a DIFFERENT action, a DIFFERENT instanceId, or
            DIFFERENT params is a `409` conflict, refused outright, never
            answered as if it belonged to whichever command first claimed
            the key. Mint a fresh key per genuinely new request - never
            reuse one across two different invocations "to be safe."
        params:
          type: object
          description: >-
            Optional; absent or `{}` means `afterLoop` defaults to
            `false`.
          additionalProperties: false
          properties:
            afterLoop:
              type: boolean
              default: false
    SetVolumeCommandRequest:
      type: object
      description: >-
        `action: "setVolume"` (docs/bench/fpp-command-vocabulary.md
        section 3.6/4).
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: setVolume
        idempotencyKey:
          type: string
          description: >-
            Scoped to the exact (action, instanceId, normalized params)
            triple it is first used against - a database-level UNIQUE
            constraint on this value alone (schemaV6) cannot express that
            scope, so the server checks it explicitly: reusing a key
            against the SAME action, instanceId, AND normalized params is
            a replay (nothing is dispatched a second time, the original
            result is returned, flagged `replay: true`); reusing it
            against a DIFFERENT action, a DIFFERENT instanceId, or
            DIFFERENT params is a `409` conflict, refused outright, never
            answered as if it belonged to whichever command first claimed
            the key. Mint a fresh key per genuinely new request - never
            reuse one across two different invocations "to be safe."
        params:
          type: object
          required: [volume]
          additionalProperties: false
          properties:
            volume:
              type: integer
              minimum: 0
              maximum: 100
              description: >-
                A JSON number with a fractional part is a `400`, never
                truncated (capture section 1.5: FPP itself silently
                coerces and clamps a bad value; this coordinator does not
                repeat that for its own parameters).
    NoParamsFPPCommandRequest:
      type: object
      description: >-
        `action` one of `"stopPlaylist"`, `"pausePlaylist"`,
        `"resumePlaylist"`, `"nextPlaylistItem"`, `"prevPlaylistItem"` -
        docs/bench/fpp-command-vocabulary.md section 4's five
        zero-parameter primitives, which take no arguments and so share
        one shape.
      required: [action, idempotencyKey]
      properties:
        action:
          type: string
          enum:
            [stopPlaylist, pausePlaylist, resumePlaylist, nextPlaylistItem,
             prevPlaylistItem]
        idempotencyKey:
          type: string
          description: >-
            Scoped to the exact (action, instanceId, normalized params)
            triple it is first used against - a database-level UNIQUE
            constraint on this value alone (schemaV6) cannot express that
            scope, so the server checks it explicitly: reusing a key
            against the SAME action, instanceId, AND normalized params is
            a replay (nothing is dispatched a second time, the original
            result is returned, flagged `replay: true`); reusing it
            against a DIFFERENT action, a DIFFERENT instanceId, or
            DIFFERENT params is a `409` conflict, refused outright, never
            answered as if it belonged to whichever command first claimed
            the key. Mint a fresh key per genuinely new request - never
            reuse one across two different invocations "to be safe."
        params:
          type: object
          description: >-
            Optional; this action takes no parameters - a non-empty
            `params` object is a `400`.
          additionalProperties: false
    RenderApplyRequest:
      type: object
      description: >-
        The body of POST /nodes/{nodeId}/render/surfaces/{surfaceId}/apply.
      required: [sequenceId]
      additionalProperties: false
      properties:
        sequenceId:
          type: string
          description: >-
            Which of the show's sequences to resolve the surface's current
            FSEQ asset from - see this operation's own description for the
            identity rule (show + sequence + target + content hash).
        idempotencyKey:
          type: string
          description: >-
            Optional; a fresh key is minted server-side when omitted. A
            replayed key dispatches nothing and returns the original
            command's own result, flagged `replay: true`.
    RenderSurfaceRequest:
      type: object
      description: >-
        The body of POST /nodes/{nodeId}/render/surfaces/{surfaceId}/clear
        and .../restart, which take no parameters of their own beyond the
        path's surfaceId.
      additionalProperties: false
      properties:
        idempotencyKey:
          type: string
          description: >-
            Optional; a fresh key is minted server-side when omitted. A
            replayed key dispatches nothing and returns the original
            command's own result, flagged `replay: true`.
    RenderCommandResponse:
      type: object
      description: >-
        The body of a successful (200) response from any of this seam's
        three dispatch endpoints.
      required: [serverTime, command]
      additionalProperties: false
      properties:
        serverTime:
          type: string
          format: date-time
        command:
          $ref: "#/components/schemas/RenderCommandResult"
    RenderCommandResult:
      type: object
      description: >-
        What happened to one dispatched (or replayed) render.* command.
        outcome is never "successful" merely because the publish to the
        node succeeded (ADR-003): it is exactly "confirmed" or
        "unconfirmed" once resolved, decided by confirming
        `surface.pipeline.state` evidence dated at or after dispatch.
      required:
        [commandId, idempotencyKey, action, nodeId, surfaceId, replay,
         outcome, outcomeState, outcomeReason, pipelineFailed, dispatchedAt,
         resolvedAt, idleOutput]
      additionalProperties: false
      properties:
        commandId:
          type: string
        idempotencyKey:
          type: string
        action:
          type: string
          enum:
            ["render.surface.apply", "render.surface.clear", "render.pipeline.restart", "render.transport.probe"]
        nodeId:
          type: string
        surfaceId:
          type: string
        replay:
          type: boolean
          description: >-
            True when this response answers a REPLAYED idempotency key:
            the command described here was NOT dispatched by this
            request - it is the ORIGINAL command's already-recorded
            result.
        outcome:
          type: string
          enum: ["confirmed", "unconfirmed", ""]
          description: >-
            Empty only for a REPLAY response returned before the original
            request's own dispatch/confirmation has finished - matching
            FPPCommandResult.outcome's identical accepted-empty case.
        outcomeState:
          type: string
          description: >-
            pkg/observation's six-value evidence-state vocabulary - the
            state of the evidence this outcome was actually decided from.
          enum:
            [current, stale, unknown_age, not_collected, collection_failed,
             unsupported]
        outcomeReason:
          type: string
          description: A short, human-readable explanation. Always non-empty.
        pipelineFailed:
          type: boolean
          description: >-
            True only when this command's outcome evidence is itself the
            pipeline's own reported "failed" state, distinct from absent,
            stale, or a merely-not-yet-reached state. outcomeState above
            only ever carries the six-value evidence-state vocabulary
            (never "failed") - a caller that wants to react to the
            pipeline specifically being down must use this field, never
            outcomeState or a parse of outcomeReason's free text. Always
            false for a confirmed outcome and for render.transport.probe.
        dispatchedAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
        idleOutput:
          type: string
          enum: ["black", "hold", "diagnostic", ""]
          description: >-
            The render.settings.idleOutput value RESOLVED and sent to the
            node as part of THIS render.surface.apply assignment. Empty for
            render.surface.clear/render.pipeline.restart/render.transport.probe,
            which carry no idleOutput.
    AudioSessionApplyRequest:
      type: object
      description: >-
        The body of POST /nodes/{nodeId}/audio/sessions/{sessionId}/apply.
        revision goes through the node's own per-session revision ledger:
        a value not strictly greater than the session's current desired
        revision is refused, never silently applied out of order.
      required: [revision]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        idempotencyKey:
          type: string
          description: >-
            Optional; a fresh key is minted server-side when omitted. A
            replayed key (same action, same params) dispatches nothing
            and returns the original command's own result, flagged
            `replay: true` - see the `409` response for what happens
            when the SAME key is reused with a DIFFERENT action or
            params.
        params:
          $ref: "#/components/schemas/AudioSessionApplyParams"
    AudioSessionSeekRequest:
      type: object
      description: >-
        The body of POST /nodes/{nodeId}/audio/sessions/{sessionId}/seek.
        revision goes through the node's own per-session revision ledger:
        a value not strictly greater than the session's current desired
        revision is refused, never silently applied out of order.
      required: [revision, params]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        idempotencyKey:
          type: string
          description: >-
            Optional; a fresh key is minted server-side when omitted. A
            replayed key (same action, same params) dispatches nothing
            and returns the original command's own result, flagged
            `replay: true` - see the `409` response for what happens
            when the SAME key is reused with a DIFFERENT action or
            params.
        params:
          $ref: "#/components/schemas/AudioSessionSeekParams"
    AudioGainSetRequest:
      type: object
      description: >-
        The body of POST /nodes/{nodeId}/audio/sessions/{sessionId}/gain.
        revision goes through the node's own per-session revision ledger:
        a value not strictly greater than the session's current desired
        revision is refused, never silently applied out of order.
      required: [revision, params]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        idempotencyKey:
          type: string
          description: >-
            Optional; a fresh key is minted server-side when omitted. A
            replayed key (same action, same params) dispatches nothing
            and returns the original command's own result, flagged
            `replay: true` - see the `409` response for what happens
            when the SAME key is reused with a DIFFERENT action or
            params.
        params:
          $ref: "#/components/schemas/AudioSessionGainParams"
    AudioGainFadeRequest:
      type: object
      description: >-
        The body of POST /nodes/{nodeId}/audio/sessions/{sessionId}/gain/fade
        (two path segments after {sessionId}: "gain" then "fade").
        revision goes through the node's own per-session revision ledger:
        a value not strictly greater than the session's current desired
        revision is refused, never silently applied out of order.
      required: [revision, params]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        idempotencyKey:
          type: string
          description: >-
            Optional; a fresh key is minted server-side when omitted. A
            replayed key (same action, same params) dispatches nothing
            and returns the original command's own result, flagged
            `replay: true` - see the `409` response for what happens
            when the SAME key is reused with a DIFFERENT action or
            params.
        params:
          $ref: "#/components/schemas/AudioSessionGainFadeParams"
    AudioSessionNoParamsRequest:
      type: object
      description: >-
        The body of the nine audio session dispatch endpoints that take
        no operation-specific params: the seven single-segment
        POST /nodes/{nodeId}/audio/sessions/{sessionId}/prepare|start|
        pause|resume|advance|stop|clear endpoints, plus the two
        two-segment POST /nodes/{nodeId}/audio/sessions/{sessionId}/
        output/mute and .../output/unmute endpoints. revision goes
        through the node's own per-session revision ledger: a value not
        strictly greater than the session's current desired revision is
        refused, never silently applied out of order.
      required: [revision]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        idempotencyKey:
          type: string
          description: >-
            Optional; a fresh key is minted server-side when omitted. A
            replayed key (same action, same params) dispatches nothing
            and returns the original command's own result, flagged
            `replay: true` - see the `409` response for what happens
            when the SAME key is reused with a DIFFERENT action or
            params.
        params:
          type: object
          additionalProperties: false
          description: >-
            Optional; this operation takes no params. Omitted and `{}`
            are the only accepted values.
    AudioSessionApplyParams:
      type: object
      additionalProperties: false
      description: >-
        Every field is independently optional: params with no fields at
        all is syntactically valid and merges nothing new onto the
        session's already-applied state. `media` and `playlist` are
        mutually exclusive; neither is required, since an apply that
        only changes e.g. `outputs` or `mixPolicy` on an already-applied
        session is valid. `gain`, `ceiling`, `fade`, and `bookmark` are
        never accepted here: gain and its ceiling and fade are set
        through the separate audio.gain.* commands, and a bookmark is
        state the session records for itself, never supplied by a
        caller.
      not:
        required: [media, playlist]
      properties:
        sourceRole:
          type: string
          enum: [show, background, announcement, manual]
          description: This session's source type. An unrecognized value is refused.
        media:
          type: object
          additionalProperties: true
          description: >-
            A single pinned media item. Mutually exclusive with
            `playlist`. Unlike `playlist` and this object's own
            siblings, an unrecognized key here is silently ignored
            rather than refused.
          required: [assetId, contentHash, filename]
          properties:
            assetId:
              type: string
              minLength: 1
            contentHash:
              type: string
              minLength: 1
            filename:
              type: string
              minLength: 1
              pattern: '^[^/\\]*$'
              not:
                enum: [".", ".."]
              description: >-
                A bare filename: no path separator (`/` or `\`), and not
                exactly `.` or `..`. The node re-checks this same rule
                against its own asset directory before this value is
                ever used to name a file on disk, so a schema-valid
                value naming an actual traversal attempt is still
                refused there.
            sizeBytes:
              type: integer
              minimum: 1
              description: Optional; when present must be at least 1.
        playlist:
          type: object
          additionalProperties: false
          description: A pinned playlist. Mutually exclusive with `media`.
          required: [ownerKind, ownerId, items]
          properties:
            ownerKind:
              type: string
              minLength: 1
            ownerId:
              type: string
              minLength: 1
            ownerRevision:
              type: integer
              minimum: 0
              description: Optional; defaults to 0 when absent.
            repeat:
              type: string
              enum: [none, item, playlist]
              description: Optional; defaults to "none" when absent.
            resume:
              type: string
              enum: [resume, restart]
              description: Optional; defaults to "restart" when absent.
            requestedTransition:
              type: string
              enum: [sequential, gapless, crossfade]
              description: Optional; defaults to "sequential" when absent.
            items:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                description: The same pinned-media-item shape as `media` above, one per playlist entry.
                required: [assetId, contentHash, filename]
                properties:
                  itemId:
                    type: string
                    minLength: 1
                    description: Optional; defaults to assetId when absent.
                  index:
                    type: integer
                    description: Optional; defaults to this item's own array position when absent.
                  assetId:
                    type: string
                    minLength: 1
                  contentHash:
                    type: string
                    minLength: 1
                  filename:
                    type: string
                    minLength: 1
                    pattern: '^[^/\\]*$'
                    not:
                      enum: [".", ".."]
                    description: >-
                      A bare filename: no path separator (`/` or `\`),
                      and not exactly `.` or `..`. The node re-checks
                      this same rule before this value is ever used to
                      name a file on disk.
                  sizeBytes:
                    type: integer
                    minimum: 1
                    description: Optional; when present must be at least 1.
        outputs:
          type: array
          items:
            type: string
            minLength: 1
        ltcStartOffset:
          type: string
          description: >-
            HH:MM:SS:FF, non-drop-frame - this session's LTC start
            point, overriding
            ConfigAudioSettingsPayload.ltcDefaultStartOffset for this
            apply only.
        mixPolicy:
          type: string
          enum: [mix, duck, interrupt, unsupported]
          description: How this session's audio combines with a lower- or higher-priority session's own audio.
    AudioSessionSeekParams:
      type: object
      additionalProperties: false
      description: >-
        This schema is stricter than the node: an unrecognized key here
        is refused, where the node itself silently ignores one instead.
      required: [positionMs]
      properties:
        positionMs:
          type: number
          minimum: 0
          description: Milliseconds. A negative value is refused.
    AudioSessionGainParams:
      type: object
      additionalProperties: false
      description: >-
        `gainDb` is in decibels; the coordinator converts it to the
        linear amplitude multiplier the node itself works in before this
        reaches the node, so a caller sending a pre-converted linear
        value is refused by name (the two units overlap numerically).
        This schema is stricter than the node: an unrecognized key here
        is refused, where the node itself silently ignores one instead.
      required: [gainDb]
      properties:
        gainDb:
          type: number
          maximum: 12
          description: >-
            0 dB is unity; -60 dB and below is silence; no lower bound
            is enforced, a more negative value is simply clamped to
            silence. +12 dB is the refused ceiling, a typo guard rather
            than a tuned headroom figure.
    AudioSessionGainFadeParams:
      type: object
      additionalProperties: false
      description: >-
        `targetGainDb` shares its decibel boundary and bounds with
        AudioSessionGainParams.gainDb, see that field's own description.
      required: [targetGainDb]
      properties:
        targetGainDb:
          type: number
          maximum: 12
        durationMs:
          type: number
          exclusiveMinimum: 0
          description: >-
            Optional; when absent, defaults to this node's own
            configured fade duration. A value at or below 0 is refused.
        curve:
          type: string
          enum: [linear]
          description: >-
            Optional; when absent, defaults to this node's own
            configured fade curve. "linear" is the only member this
            vocabulary reserves today.
    AudioSessionCommandResponse:
      type: object
      description: >-
        The body of a successful (200) response from any of the nine
        audio.session.* dispatch endpoints.
      required: [serverTime, command]
      additionalProperties: false
      properties:
        serverTime:
          type: string
          format: date-time
        command:
          $ref: "#/components/schemas/AudioSessionCommandResult"
    AudioSessionCommandResult:
      type: object
      description: >-
        What happened to one dispatched (or replayed) audio.session.*
        command. outcome is never "successful" merely because the
        publish to the node succeeded (ADR-003): it is decided from the
        node's own evidence, collected after its own dispatch. A
        SUCCESSFUL HTTP 200 response commonly carries
        `outcome: "unconfirmable"` - this is a real, expected outcome
        while the node's session engine has no working pipeline backend
        wired in, never an error and never a transport failure. Reading
        only the HTTP status code is not enough to know whether the
        command worked; read `outcome`.
      required:
        [commandId, idempotencyKey, action, nodeId, sessionId, replay,
         outcome, reason, dispatchedAt, resolvedAt, attributionDegraded]
      additionalProperties: false
      properties:
        commandId:
          type: string
        idempotencyKey:
          type: string
        action:
          type: string
          enum:
            ["audio.session.apply", "audio.session.prepare", "audio.session.start",
             "audio.session.pause", "audio.session.resume", "audio.session.seek",
             "audio.session.advance", "audio.session.stop", "audio.session.clear",
             "audio.gain.set", "audio.gain.fade", "audio.output.mute", "audio.output.unmute"]
        nodeId:
          type: string
        sessionId:
          type: string
        replay:
          type: boolean
          description: >-
            True when this response answers a REPLAYED idempotency key:
            the command described here was NOT dispatched by this
            request - it is the ORIGINAL command's already-recorded
            result.
        outcome:
          type: string
          enum:
            ["started", "position", "stopped", "completed", "refused",
             "failed", "unconfirmable", ""]
          description: >-
            Empty only for a REPLAY response returned before the
            original request's own dispatch/confirmation has finished,
            matching FPPCommandResult.outcome's identical accepted-empty
            case. "refused" and "failed" carry a non-empty reason and
            were never dispatched to the node as a real command attempt
            (a bad revision, an unknown session, invalid params).
            "unconfirmable" WAS dispatched but the node could not
            corroborate it with fresh evidence - including, today,
            every dispatch against the shipped agent, whose session
            engine has no working pipeline backend. gain/fade_complete
            never appear here: those belong to the separate
            audio.gain.* dispatch surface.
        reason:
          type: string
          description: >-
            Required whenever outcome is "refused", "failed", or
            "unconfirmable"; empty for every other outcome.
        dispatchedAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
        attributionDegraded:
          type: boolean
          description: >-
            True when this command's dispatch could not write its audit
            entry atomically with the command and proceeded anyway under
            the `audio.session.stop`/`audio.session.clear`/
            `audio.output.mute` safety-class exemption (ADR-024 decision
            11), with a degraded, stderr-only attribution record.
    FPPCommandResponse:
      type: object
      description: The body of a successful (200) response from POST /fpp/{instanceId}/commands.
      required: [serverTime, command]
      properties:
        serverTime:
          type: string
          format: date-time
        command:
          $ref: "#/components/schemas/FPPCommandResult"
    FPPCommandResult:
      type: object
      description: >-
        What happened to one dispatched (or replayed) command. outcome is
        never "successful" merely because FPP answered 200 (ADR-003): it is
        exactly "confirmed" or "unconfirmed" once resolved, decided by
        confirming observed state against the collector's own evidence, or
        empty in the one accepted race a replay response can observe (see
        outcome's own description). outcomeState carries
        pkg/observation's six-value evidence-state vocabulary, the state of
        the evidence the outcome was actually decided from - the same
        vocabulary AuditEntry.outcomeState already uses, not a second one
        invented for this endpoint.
      required:
        [id, idempotencyKey, action, instanceId, params, replay, outcome,
         outcomeState, outcomeReason, attributionDegraded, dispatchedAt,
         resolvedAt]
      properties:
        id:
          type: string
        idempotencyKey:
          type: string
        action:
          type: string
        instanceId:
          type: string
        params:
          type: object
          additionalProperties: true
          description: >-
            This command's own normalized parameters (Step 8): defaults
            applied, present even for a zero-parameter action (as `{}`),
            never omitted or null - matching AuditEntry.params's identical
            convention (including `additionalProperties: true`: this is
            the RESPONSE echo of whichever action's own params this
            command actually carried, heterogeneous by construction,
            unlike FPPCommandRequest's own per-action `params`, which is a
            real, closed shape per variant). On a REPLAY response this is
            the ORIGINAL command's own params, so a replay always tells
            the caller what the original request's parameters actually
            were.
        replay:
          type: boolean
          description: >-
            True when this response answers a REPLAYED idempotency key: the
            command described here was NOT dispatched by this request - it
            is the ORIGINAL command's already-recorded result, returned per
            ADR-024 decision 11 ("a replay is precisely the case an
            investigator wants to see, because it means the operator did
            not get their response").
        outcome:
          type: string
          enum: ["confirmed", "unconfirmed", ""]
          description: >-
            Empty only for a REPLAY response returned before the original
            request's own dispatch/confirmation has finished - a real,
            honest value (ADR-020's absence-is-stated rule), not an
            omission.
        outcomeState:
          type: string
          description: >-
            pkg/observation's six-value evidence-state vocabulary - the
            state of the evidence this outcome was actually decided from
            (or, for a command a coordinator restart left dispatched and
            never resolved, the state a startup reconciliation pass
            decided it from - see this document's own note on
            outcomeReason). NEVER blank for a resolved command: a bare,
            unconstrained string here is exactly what let a coordinator
            restart leave outcomeState/outcomeReason as permanent empty
            strings, indistinguishable from the one narrow, accepted race
            a REPLAY response's outcome (not outcomeState) may legitimately
            be empty for - see FPPCommandResult.outcome's own description.
          enum:
            [current, stale, unknown_age, not_collected, collection_failed,
             unsupported]
        outcomeReason:
          type: string
          description: >-
            A short, human-readable explanation. Non-empty whenever this
            response's own `command.outcome` is `"confirmed"` or
            `"unconfirmed"` (i.e. whenever this command has actually
            resolved) - verified true, as of Step 8 review finding 6, for
            every one of the eight primitives on both a confirmed and an
            unconfirmed outcome (internal/coordinator/api/fppcommand_evidence.go's
            resolveConfirmationEvidence and every predicate built on it
            always produces a reason; a confirmed result used to leave this
            blank, fixed by that same finding). Deliberately left `type:
            string` with no `minLength`, unlike `outcomeState`'s enum
            (this schema's own JSON Schema `if`/`then` could express
            "non-empty unless outcome is empty", but this document's own
            test suite overlays every schema declaring `properties` with
            `additionalProperties: false` - including inside an `if`
            branch - which either rejects the WHOLE object against a
            partial `if` subschema or silently defeats the conditional
            outright, a defect invisible to review and exactly the "a test
            that passes whether or not the bug is present" shape CLAUDE.md
            warns against; a schema constraint that risky is worse than
            none). This field's non-emptiness is verified at the handler
            level instead - the only value for which it may be empty is a
            REPLAY response returned before the original request's own
            dispatch/confirmation has finished, matching `outcome`'s own
            narrow accepted-empty case exactly. A command a coordinator
            restart left stranded is resolved by a startup reconciliation
            pass before it can ever reach a client in that state - see
            outcomeState's own description - so that condition is never a
            second source of a blank reason.
        attributionDegraded:
          type: boolean
          description: >-
            True when this command's dispatch or outcome audit entry could
            not be written. Stop Playlist is a member of ADR-024 decision
            11's blackout/stop/power-off safety class, so the command
            proceeds regardless, with a degraded attribution record written
            to the coordinator's stderr instead of the audit log.
        dispatchedAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
    ObservationsResponse:
      type: object
      required: [serverTime, observations]
      properties:
        serverTime:
          type: string
          format: date-time
        observations:
          type: array
          description: >-
            Ordered by resourceKind, then resourceId, then signal,
            ascending, and this ordering is guaranteed.
          items:
            $ref: "#/components/schemas/ObservationEntry"
    EventsResponse:
      type: object
      description: >-
        See this document's top-level description for gap and
        oldestRetainedSeq: gap is always present and boolean;
        oldestRetainedSeq is the lowest seq still retained, or null when
        the store retains no events at all.
      required: [serverTime, events, latestSeq, gap, oldestRetainedSeq]
      properties:
        serverTime:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        latestSeq:
          type: integer
        gap:
          type: boolean
        oldestRetainedSeq:
          type: [integer, "null"]
    Snapshot:
      type: object
      required:
        [serverTime, latestEventSeq, nodes, fpp, collectors, macroRuns,
         resolume, audioConfigPush]
      properties:
        serverTime:
          type: string
          format: date-time
        latestEventSeq:
          type: integer
        nodes:
          type: array
          description: Ordered by nodeId, ascending. Same guarantee as NodesResponse.nodes.
          items:
            $ref: "#/components/schemas/Node"
        fpp:
          type: object
          required: [instances]
          properties:
            instances:
              type: array
              description: >-
                Ordered exactly as configured, stable for the life of the
                process. Same guarantee as FPPResponse.instances.
              items:
                $ref: "#/components/schemas/FPPInstance"
        collectors:
          type: array
          description: >-
            Ordered exactly as this coordinator's own FPP endpoint
            configuration lists them (one collector per configured
            instance), stable for the life of the process. This ordering
            is guaranteed.
          items:
            $ref: "#/components/schemas/CollectorStatus"
        macroRuns:
          type: array
          description: >-
            Step 9: every in-flight macro run, plus a bounded window of
            recently finished ones (STEP-9-SPEC.md section 6.6). Fatal to
            omit per ADR-020 decision 3: the change stream emits no id, so a
            client connecting for the first time during an in-flight run
            has no other way to learn the run exists.
          items:
            $ref: "#/components/schemas/MacroRunSummary"
        resolume:
          type: array
          description: >-
            Every configured Resolume instance, rendered exactly as GET
            /resolume/instances renders it. Never null: an unconfigured
            coordinator reports an empty array.
          items:
            $ref: "#/components/schemas/ResolumeInstance"
        audioConfigPush:
          $ref: "#/components/schemas/AudioConfigPushStatus"
    AudioConfigPushStatus:
      type: object
      description: >-
        Whether the coordinator can decode its stored, engine-wide
        audio.settings revision right now. Coordinator-wide, not per-node
        or per-collector: audio.settings is a singleton (ADR-039), so
        there is exactly one current revision to decode. Computed fresh
        from the same decode a real push performs on that revision, so
        this always reflects the revision currently active. Deliberately
        narrow: this reports only whether the audio.settings singleton
        itself decodes, never whether any one node's own separate
        audio.node binding does or whether that node is reachable — a
        node can still be stranded by a broken audio.node revision, or by
        being unreachable, while this reads "usable".
      required: [state, reason]
      properties:
        state:
          type: string
          enum: [usable, unusable, unknown]
          description: >-
            "usable": the stored audio.settings revision (or the built-in
            default, when nothing has ever been written) decodes.
            "unusable": it does not, and every node is stranded on
            whatever audio.settings it last successfully received.
            "unknown": a genuine config-store failure, not a decode
            failure, kept the coordinator from reading its own revision
            just now — the revision itself may be perfectly usable.
        reason:
          type: [string, "null"]
          description: Set whenever state is not "usable", null otherwise.
    PrincipalSummary:
      type: object
      description: A principal's own non-secret identity (ADR-024).
      required: [id, name, kind, role]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [human, machine]
        role:
          type: string
          enum: [viewer, operator, admin, scheduler]
    SessionInfo:
      type: object
      description: >-
        The session that authenticated this request, present only when
        that credential was the session cookie. id is the session's
        non-secret row identifier - never the cookie value.
      required: [id, deviceLabel, createdAt]
      properties:
        id:
          type: string
        deviceLabel:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateSessionRequest:
      type: object
      description: The body of POST /session.
      required: [name, password, deviceLabel]
      properties:
        name:
          type: string
        password:
          type: string
        deviceLabel:
          type: string
    DeleteSessionRequest:
      type: object
      description: >-
        DELETE /session's optional body. An absent/empty sessionId revokes
        the session that authenticated this request (requiring that
        credential to be the session cookie itself); a non-empty sessionId
        instead revokes that specific session, which must belong to the
        authenticated principal, and works under either credential form.
      properties:
        sessionId:
          type: string
    BootstrapRequest:
      type: object
      description: >-
        The body of POST /bootstrap. code is single-use and readable only
        from a file in the coordinator's data volume (ADR-024 decision 9);
        deviceLabel behaves exactly as CreateSessionRequest.deviceLabel
        does, since a successful claim immediately mints a session.
      required: [code, name, password, deviceLabel]
      properties:
        code:
          type: string
        name:
          type: string
        password:
          type: string
        deviceLabel:
          type: string
    SessionResponse:
      type: object
      description: >-
        The body of GET and POST /session, and of POST /bootstrap on
        success (ADR-024 decisions 5, 9, and 12). authenticated is false
        whenever no valid credential authenticated this request - a new
        device, cleared cookies, a revoked or idle-expired session, a bad
        or absent bearer token - which is deliberately NOT a 401: "being
        signed out" is a persistent, readable state, not an error a caller
        must catch to learn. When authenticated is false, principal,
        session, and credentialForm are all null, scopes is an empty
        array, and scopesState is "not_applicable". scopesState is
        "current" when scopes was computed from a fresh read of this
        principal's role in this same request (the only case this
        coordinator currently produces) and "unknown" on an internal error
        computing them - a client MUST treat "unknown" exactly like an
        empty scope list (ADR-024 decision 12: "a stale or unavailable
        [scope list] renders as unknown, never as permissive").
        bootstrapRequired is true whenever this coordinator currently holds
        zero principals (ADR-024 decision 9's "loud and persistent"
        unclaimed-bootstrap signal) - computed and returned regardless of
        whether this particular request authenticated, so a client can
        render the banner from GET /session on load with no credential at
        all.
      required:
        [serverTime, authenticated, principal, session, credentialForm,
         scopes, scopesState, bootstrapRequired]
      properties:
        serverTime:
          type: string
          format: date-time
        authenticated:
          type: boolean
        principal:
          oneOf:
            - $ref: "#/components/schemas/PrincipalSummary"
            - type: "null"
        session:
          oneOf:
            - $ref: "#/components/schemas/SessionInfo"
            - type: "null"
        credentialForm:
          type: [string, "null"]
          enum: [session, token, password, null]
        scopes:
          type: array
          items:
            type: string
        scopesState:
          type: string
          enum: [current, unknown, not_applicable]
        bootstrapRequired:
          type: boolean
    AuditEntry:
      type: object
      description: >-
        One element of GET /audit (ADR-024 decision 11). params is never
        null (an entry with none still reports an empty object).
      required:
        [id, timestamp, principalId, principalName, form, credentialId,
         clientAddr, action, target, params, idempotencyKey, kind,
         commandId, outcome, outcomeState, outcomeReason]
      properties:
        id:
          type: integer
          description: >-
            This entry's append-only row id: strictly increasing, never
            reused, and the value BOTH of this endpoint's cursors are
            expressed in (`since` forward, `before` backward). Not a
            position in the result - see this operation's own description
            for why counting entries is not a cursor.
        timestamp:
          type: string
          format: date-time
        principalId:
          type: string
        principalName:
          type: string
        form:
          type: string
        credentialId:
          type: string
        clientAddr:
          type: string
        action:
          type: string
        target:
          type: string
        params:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
        kind:
          type: string
          enum: [dispatch, outcome, replay, auth_failure, admin]
        commandId:
          type: string
        outcome:
          type: string
          description: >-
            The command family's own outcome word - FPP's "confirmed"/
            "unconfirmed", or Resolume's five-word vocabulary
            (ResolumeActionResult.outcome's own enum) - deliberately left
            unconstrained here because this ONE field is shared across
            every command family this coordinator has or will ever audit,
            unlike outcomeState below. Empty except on an `outcome`-kind
            entry (see this schema's own `kind` enum).
        outcomeState:
          type: string
          enum:
            [current, stale, unknown_age, not_collected, collection_failed,
             unsupported, ""]
          description: >-
            pkg/observation's six-value evidence-state vocabulary - never a
            command family's own outcome word (Review fix 3, 2026-08-15:
            before this, a Resolume outcome-kind entry carried its own
            five-word outcome here instead, so an audit reader filtering on
            evidence states would silently drop or misread every Resolume
            entry). Empty on every entry that is not an `outcome`-kind
            entry (identity.AuditEntry's own doc comment: "populated only
            on an AuditOutcome entry"), and ALSO empty for an outcome-kind
            entry whose command family has no per-observation evidence-state
            signal to honestly report for that particular outcome - see
            ResolumeActionResult's own outcome enum for which of ITS five
            values do (only "confirmed" does today).
        outcomeReason:
          type: string
    AuditResponse:
      type: object
      description: >-
        The body of GET /audit. `order` is the ordering the entries are
        actually in, echoed rather than inferred. `oldestRetainedId` is
        the lowest id still retained, or null when the log retains nothing
        at all; it mirrors EventsResponse.oldestRetainedSeq and is what
        lets a client paging backward tell the beginning of retained
        history from a page boundary. Unlike EventsResponse there is still
        no `gap` flag, and that absence is deliberate rather than
        unreported - see this operation's description.
      required: [serverTime, order, oldestRetainedId, entries]
      properties:
        serverTime:
          type: string
          format: date-time
        order:
          type: string
          enum: [asc, desc]
        oldestRetainedId:
          type: [integer, "null"]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
    PrincipalObject:
      type: object
      description: >-
        One principal as Track G seam G-5's admin surface renders it.
        Distinct from PrincipalSummary (SessionResponse's own narrower "who
        am I" shape): this is the full object GET/POST /principals and its
        sub-resources return. hasPassword and reserved are booleans, never
        a password hash or any other secret - reserved is true only for
        the built-in Resolume recovery principal, which is visible
        wherever principals are listed but cannot be created, disabled,
        renamed, re-roled, or re-credentialed through this surface.
      required:
        [id, name, kind, role, disabled, hasPassword, reserved, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [human, machine]
        role:
          type: string
          enum: [viewer, operator, admin, scheduler, recovery]
        disabled:
          type: boolean
        hasPassword:
          type: boolean
        reserved:
          type: boolean
        createdAt:
          type: string
          format: date-time
    PrincipalsResponse:
      type: object
      description: The body of GET /principals.
      required: [serverTime, principals]
      properties:
        serverTime:
          type: string
          format: date-time
        principals:
          type: array
          items:
            $ref: "#/components/schemas/PrincipalObject"
    PrincipalResponse:
      type: object
      description: >-
        The body of GET /principals/{id}, POST /principals, PUT
        /principals/{id}/role, POST /principals/{id}/enable, POST
        /principals/{id}/disable, and POST /principals/{id}/password.
      required: [serverTime, principal]
      properties:
        serverTime:
          type: string
          format: date-time
        principal:
          $ref: "#/components/schemas/PrincipalObject"
    CreatePrincipalRequest:
      type: object
      description: >-
        The body of POST /principals. password may be absent, null, or an
        empty string - all three mean "no password, token-only" (a machine
        principal that will only ever use an issued token), matching this
        coordinator's own create-principal subcommand.
      required: [name, kind, role]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [human, machine]
        role:
          type: string
          enum: [viewer, operator, admin, scheduler, recovery]
        password:
          type: string
    SetPrincipalRoleRequest:
      type: object
      description: >-
        The body of PUT /principals/{id}/role. Refused with `409` when the
        requested role would leave no enabled principal able to reach
        `principal:write` (Track G seam G-5 requirement 3).
      required: [role]
      properties:
        role:
          type: string
          enum: [viewer, operator, admin, scheduler, recovery]
    SetPrincipalPasswordRequest:
      type: object
      description: >-
        The body of POST /principals/{id}/password. Unlike
        CreatePrincipalRequest.password, this one is required and must be
        non-empty - a reset that silently clears a password would leave a
        human principal with no way to sign in at all.
      required: [password]
      properties:
        password:
          type: string
    TokenObject:
      type: object
      description: >-
        One API token's non-secret metadata - never a digest or the raw
        token value, which is rendered exactly once, by
        IssueTokenResponse.value, and never again by this or any other
        schema (ADR-024 decision 1).
      required:
        [id, principalId, hint, label, createdAt, expiresAt, lastUsedAt]
      properties:
        id:
          type: string
        principalId:
          type: string
        hint:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
    TokensResponse:
      type: object
      description: The body of GET /principals/{id}/tokens.
      required: [serverTime, tokens]
      properties:
        serverTime:
          type: string
          format: date-time
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenObject"
    IssueTokenRequest:
      type: object
      description: >-
        The body of POST /principals/{id}/tokens. expiresAt absent or null
        both mean "never expires" (ADR-024 decision 1's default) - the same
        meaning either way, so there is no absent-vs-null ambiguity for
        this field to resolve, unlike ConfigFPPEndpointsPayload.endpoints.
      properties:
        label:
          type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
    IssueTokenResponse:
      type: object
      description: >-
        The body of POST /principals/{id}/tokens. value carries the
        token's plaintext exactly once (ADR-024 decision 1) - no other
        response in this contract ever renders it again, including a later
        GET /principals/{id}/tokens.
      required: [serverTime, token, value]
      properties:
        serverTime:
          type: string
          format: date-time
        token:
          $ref: "#/components/schemas/TokenObject"
        value:
          type: string
    ConfigFPPEndpoint:
      type: object
      description: >-
        One FPP instance's (id, url) pair (RES-008 D1) - the same shape
        `SHOWMESH_FPP_ENDPOINTS` carries.
      required: [id, url]
      properties:
        id:
          type: string
        url:
          type: string
    ConfigFPPEndpointsPayload:
      type: object
      description: >-
        The "fpp.endpoints" configuration kind's payload: the body PUT
        /config/fpp.endpoints accepts, and the "payload" member of GET
        /config/fpp.endpoints' response. endpoints is never null - an
        empty configured-endpoints list is a real, valid state, and it is
        the only way to deliberately configure zero endpoints; an absent
        or null "endpoints" key on a PUT is a `400`, never a silent wipe.

        This schema is deliberately NOT closed (no `additionalProperties:
        false`) even though the PUT handler itself rejects an unrecognized
        top-level field: ADR-020 requires this published document stay
        additive-only-compatible for a client reading a RESPONSE (this
        schema also describes GET's "payload" member), and a closed schema
        here would apply to both directions at once. The request-side
        strictness is enforced by the coordinator's own handler, not by
        this schema.
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/ConfigFPPEndpoint"
    FPPEndpointsConfigResponse:
      type: object
      description: >-
        The body of GET and PUT /config/fpp.endpoints. createdByPrincipalId
        and createdByPrincipalName are null for the one revision the
        startup env->store migration creates (source "env_migration"): a
        startup migration has no principal. restartRequired is always
        false since 2026-08-14 (this configuration is applied without a
        restart); restartRequiredReason says so in words. The field is
        retained rather than removed because this contract is
        additive-only within a major version.
      required:
        [serverTime, kind, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source,
         restartRequired, restartRequiredReason]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          const: fpp.endpoints
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigFPPEndpointsPayload"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api, env_migration]
        restartRequired:
          type: boolean
          const: false
        restartRequiredReason:
          type: string
    ConfigResolumeInstance:
      type: object
      description: >-
        One Resolume Arena instance's (id, url) pair (Track G seam G-2,
        ADR-039) - the same shape `SHOWMESH_RESOLUME_URL`/
        `SHOWMESH_RESOLUME_ID` carried.
      required: [id, url]
      properties:
        id:
          type: string
        url:
          type: string
    ConfigResolumeInstancesPayload:
      type: object
      description: >-
        The "resolume.instances" configuration kind's payload: the body PUT
        /config/resolume.instances accepts, and the "payload" member of GET
        /config/resolume.instances' response. instances is never null - an
        empty configured-instances list is a real, valid state, and it is
        the only way to deliberately configure zero instances; an absent
        or null "instances" key on a PUT is a `400`, never a silent wipe.
        At most one instance is accepted today (enforced by validation,
        not by this schema - see `PUT /config/resolume.instances`'s own
        description).

        This schema is deliberately NOT closed (no `additionalProperties:
        false`), mirroring `ConfigFPPEndpointsPayload`'s identical
        reasoning: ADR-020 requires this published document stay
        additive-only-compatible for a client reading a RESPONSE, and the
        request-side strictness (rejecting an unrecognized top-level
        field) is enforced by the coordinator's own handler, not by this
        schema.
      required: [instances]
      properties:
        instances:
          type: array
          items:
            $ref: "#/components/schemas/ConfigResolumeInstance"
    ResolumeInstancesConfigResponse:
      type: object
      description: >-
        The body of GET and PUT /config/resolume.instances.
        createdByPrincipalId and createdByPrincipalName are null for the
        one revision the startup env->store migration creates (source
        "env_migration"): a startup migration has no principal.
        restartRequired is always false: this configuration is applied
        without a restart from the start (ADR-036). The field is retained
        rather than removed because this contract is additive-only within
        a major version.
      required:
        [serverTime, kind, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source,
         restartRequired, restartRequiredReason]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          const: resolume.instances
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigResolumeInstancesPayload"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api, env_migration]
        restartRequired:
          type: boolean
          const: false
        restartRequiredReason:
          type: string
    ConfigFPPMQTTPayload:
      type: object
      description: >-
        The "fpp.mqtt" configuration kind's payload (Track G seam G-3,
        ADR-039), as it appears in the "payload" member of GET and PUT
        /config/fpp.mqtt's response. passwordSet reports presence only -
        the broker password itself never appears on this or any other
        wire type (ADR-039 decision 7). hosts is never null.
      required: [brokerURL, username, topicPrefix, hosts, passwordSet]
      properties:
        brokerURL:
          type: string
        username:
          type: string
        topicPrefix:
          type: string
        hosts:
          type: object
          additionalProperties:
            type: string
        passwordSet:
          type: boolean
    ConfigFPPMQTTPutRequest:
      type: object
      description: >-
        The request body of PUT /config/fpp.mqtt (Track G seam G-3,
        ADR-039). Unlike every other configuration kind's PUT request in
        this document, EVERY field here is independently optional: a key
        absent from the request body leaves that field's currently stored
        value unchanged (ADR-039 decision 5), which is what makes the
        credential rule (decision 7) usable at all - GET never returns
        the password, so a PUT that required every field present would
        erase a credential the operator never saw. See
        `PUT /config/fpp.mqtt`'s own description for the per-field
        null/empty handling this schema alone does not express (a null
        brokerURL/username/topicPrefix or a null hosts is rejected by the
        handler; a null or empty password explicitly clears it).
      properties:
        brokerURL:
          type: string
        username:
          type: string
        topicPrefix:
          type: string
        hosts:
          type: object
          additionalProperties:
            type: string
        password:
          type: [string, "null"]
    FPPMQTTConfigResponse:
      type: object
      description: >-
        The body of GET and PUT /config/fpp.mqtt. createdByPrincipalId and
        createdByPrincipalName are null for the one revision the startup
        env->store migration creates (source "env_migration"): a startup
        migration has no principal. restartRequired is always false: this
        configuration is applied without a restart from the start (ADR-036
        via ADR-039 decision 6).
      required:
        [serverTime, kind, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source,
         restartRequired, restartRequiredReason]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          const: fpp.mqtt
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigFPPMQTTPayload"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api, env_migration]
        restartRequired:
          type: boolean
          const: false
        restartRequiredReason:
          type: string
    ConfigAssetsSettingsPayload:
      type: object
      description: >-
        The "assets.settings" configuration kind's payload (Track G seam
        G-4, ADR-039) as it appears in a RESPONSE: the "payload" member of
        GET/PUT /config/assets.settings, with all four fields always
        present. syncIntervalSeconds/inventoryIntervalSeconds are seconds,
        matching this contract's existing "...Seconds" convention - NUMBER,
        not integer, matching ResolumeRecoveryResponse.settleDelaySeconds'
        identical choice one seam over: an integer-second encoding silently
        truncates a legitimate sub-second interval to zero. SHOWMESH_ASSET_DIR
        has no field here - it stays environment-only (ADR-039 decision 2).
      required:
        [contentBaseUrl, maxUploadBytes, syncIntervalSeconds, inventoryIntervalSeconds]
      properties:
        contentBaseUrl:
          type: string
          description: >-
            Empty is a real, deliberate state: the asset sync service does
            not run, and nothing ever reaches a node over the network.
        maxUploadBytes:
          type: integer
          description: Always positive.
        syncIntervalSeconds:
          type: number
          description: Always positive.
        inventoryIntervalSeconds:
          type: number
          description: Always positive.
    ConfigAssetsSettingsPutPayload:
      type: object
      description: >-
        The body PUT /config/assets.settings accepts. Unlike
        ConfigAssetsSettingsPayload (a response, where every field is
        always present), every field here is INDEPENDENTLY OPTIONAL: an
        absent field leaves the currently stored (or default) value alone
        (ADR-039 decision 5). A field that IS present must not be JSON
        `null` - refused with 400 naming the field. This schema is
        deliberately NOT closed (no additionalProperties: false), matching
        every other PUT payload schema in this contract: the coordinator's
        own handler enforces top-level-field strictness on the request, not
        this published schema (see ConfigResolumeInstancesPayload's
        identical reasoning).
      properties:
        contentBaseUrl:
          type: string
        maxUploadBytes:
          type: integer
        syncIntervalSeconds:
          type: number
        inventoryIntervalSeconds:
          type: number
    AssetsSettingsConfigResponse:
      type: object
      description: >-
        The body of GET and PUT /config/assets.settings, mirroring
        ResolumeInstancesConfigResponse's shape exactly (env->store
        migration, singleton object, no-restart apply). createdByPrincipalId
        and createdByPrincipalName are null for the one revision the
        startup env->store migration creates (source "env_migration"): a
        startup migration has no principal. restartRequired is always
        false: every field of this kind applies to the already-running
        asset sync service with no restart (ADR-039 decision 6).
      required:
        [serverTime, kind, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source,
         restartRequired, restartRequiredReason]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          const: assets.settings
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigAssetsSettingsPayload"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api, env_migration]
        restartRequired:
          type: boolean
          const: false
        restartRequiredReason:
          type: string
    ConfigRevisionMeta:
      type: object
      description: >-
        One element of ConfigRevisionsResponse.revisions: a config
        revision's metadata, WITHOUT its payload. createdByPrincipalId and
        createdByPrincipalName are null for a revision created by the
        startup env->store migration (source "env_migration").
      required:
        [revision, createdAt, createdByPrincipalId, createdByPrincipalName,
         source, note, active]
      properties:
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api, env_migration]
        note:
          type: string
        active:
          type: boolean
    ConfigRevisionsResponse:
      type: object
      description: >-
        The body of GET /config/fpp.endpoints/revisions, GET
        /config/show.action/{id}/revisions, GET
        /config/show.macro/{id}/revisions, GET
        /config/show/{id}/revisions, GET
        /config/show.surface/{id}/revisions, GET
        /config/show.active/revisions, GET
        /config/show.mode/revisions, GET
        /config/show.cue/{id}/revisions, GET
        /config/show.playlist/{id}/revisions, GET
        /config/resolume.recovery/revisions, GET
        /config/render.settings/revisions, GET
        /config/resolume.instances/revisions, GET
        /config/fpp.mqtt/revisions, GET
        /config/assets.settings/revisions, GET
        /config/audio.settings/revisions, GET
        /config/audio.node/{id}/revisions, and GET
        /config/fppconnect.settings/revisions, newest first - one shape
        shared across every configuration kind's own revision history route
        (Step 9 wave 2: kind's const narrowed to fpp.endpoints was
        Step 7-only and never revisited when this schema gained more
        callers; Track E added three more, Track D seam D-3a another,
        Track B seam B2c another, Track G seams G-2, G-3, and G-4 one
        each more, audio.settings/audio.node two more, Track H seam
        H1 two more, ADR-033's show.mode one more, and Track E phase 2
        seam FC1a's fppconnect.settings one more).
      required: [serverTime, kind, revisions]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          enum: [fpp.endpoints, show.action, show.macro, show, show.surface, show.active, show.mode, show.cue, show.playlist, night.session, night.session.active, resolume.recovery, render.settings, resolume.instances, fpp.mqtt, assets.settings, audio.settings, audio.node, fppconnect.settings]
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/ConfigRevisionMeta"
    ResolumeCompositionWrittenBy:
