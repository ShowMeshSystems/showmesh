          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowModeConfigResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Either the principal does not hold `config:write`
