            States that idleOutput takes effect on each surface's own next
            render.surface.apply dispatch, never on an already-applied
            surface - there is no config-push path to a node beyond that
            assignment (TRACK-B-BUILD-CONTRACT.md ruling 4). Always
            non-empty.
    ConfigShowModePayload:
      type: object
      description: >-
        The "show.mode" configuration kind's decoded payload (ADR-033): the
        body PUT /config/show.mode accepts (a full replacement - `mode`
        required and non-null), and the "payload" member of GET
        /config/show.mode's response.


        The vocabulary is closed and has exactly two members. `unknown` is
        deliberately NOT among them: it is a node-side held-value state
        (ADR-033 decision 5) meaning a node could not read the mode at all,
        it behaves as `show`, and no operator can ever write it.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [program, show]
          description: >-
            The installation-wide operating mode. The wire value and the
            operator-facing label are the same word, deliberately (ADR-033
            decision 1).
    ShowModeConfigResponse:
      type: object
      description: >-
        The body of GET and PUT /config/show.mode. Never `404`s: the
        payload has a well-defined default (`program`), reported with
        `revision` `0` and `source` `"default"` when nothing has ever been
        written.
      required:
        [serverTime, kind, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source,
         resolumeWebSocketEffect]
      properties:
        serverTime:
          type: string
          format: date-time
