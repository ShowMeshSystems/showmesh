openapi: 3.1.0
info:
  title: ShowMesh Control API
  version: "1"
  summary: >-
    The coordinator's public, versioned control API and Server-Sent
    Events change stream (ADR-014).
  description: >-
    This is the versioned public contract ADR-014 requires: it is designed
    to be used without any Operator UI, by a CLI (`showmeshctl`), an
    automation system, or an alternate client. Everything here is served
    under `/api/v1`; the container healthcheck endpoints `/healthz`,
    `/readyz`, and `/version` are infrastructure probes outside this
    versioned contract and are not documented here.


    **Versioning is additive-only within v1.** Fields may be added to any
    response; they are never removed, renamed, or retyped. A client MUST
    ignore fields it does not recognize. A breaking change is a `/api/v2`
    contract, not an edit to this one.


    **`serverTime` appears on every response, including every error.** A
    client computes evidence ages against `serverTime` rather than its own
    clock, so clock skew between the client and the coordinator is visible
    instead of silently wrong. Payloads never carry a precomputed age or
    "secondsAgo" field for exactly this reason: an age field would change on
    every poll even when nothing else did, which would make change
    detection on the SSE stream fire continuously for no real change.


    **`offline` means the control-plane (MQTT) connection is gone, not that
    the node is dead.** A running show survives coordinator loss and
    broker loss (ADR-008); a node can be reported `node.controlPlane.state
    == "offline"` while the show it is running continues perfectly. This is
    why the field is nested under `controlPlane` and is never named `state`,
    `online`, or `status` at the top level of a node.


    **`observedAt: null` is meaningful and must never be treated as
    "now".** It means the observation's time is genuinely unknown — most
    commonly a retained MQTT delivery replayed to the coordinator on
    reconnect, which carries no information about how old the evidence
    actually is. Filling in the current time in its place would silently
    manufacture false freshness. See the `Evidence` schema below and
    `state: "unknown_age"`.


    **Desired state, capability assignments, and reconciliation status are
    not modelled by this API yet.** They are a real part of the eventual
    architecture (see ARCHITECTURE section 7.2 and OPERATOR-UI section 10),
    but nothing in the coordinator computes them today, and Step 3
    deliberately ships no placeholder field for them: a field like
    `reconciliationStatus: "unknown"` that no code actually computes would
    be read by an operator as a real verdict. These arrive additively, in
    the version of this API that introduces the behavior behind them.


    **A `gap: true` on `GET /api/v1/events` means history was permanently
    lost to retention, not that nothing happened.** The store prunes event
    history by age and row count, so a client's `since` cursor can name a
    point before anything the store still retains. That is reported as a
    successful response describing an incomplete answer (never a 4xx: a
    client retrying will never get the missing events back, because they no
    longer exist anywhere in this system).


    **Authentication is two credential forms resolving to one principal
    (ADR-024), and reads and writes have different postures.** A request
    authenticates with `Authorization: Bearer <token>` (an API token
    minted by an admin) or with the `HttpOnly` session cookie
    `POST /session` mints — never both considered together: an
    `Authorization` header, if present at all, is the only credential path
    considered for that request (ADR-024 decision 6). **Every write
    requires an authenticated principal, with no opt-out.** **Reads stay
    open by default and are closable by coordinator-side configuration**
    (carried forward from ADR-021) — `GET /session` and `GET /` are always
    open regardless, since a client must be able to learn it has no
    credential without needing one to ask, and coordinator build metadata
    carries no operational resource data. This document declares
    `bearerAuth` and `cookieAuth` as available schemes rather than
    mandatory ones for exactly that reason — a generated client sends
    whichever credential it holds and omits both otherwise, rather than
    treating absence as a client bug.


    **A `403` names the missing scope; a `401` means no valid credential
    was presented at all.** `GET /audit` requires `audit:read` regardless
    of whether reads are otherwise open, since it is not one of the four
    pre-existing read resources (`node:read`, `fpp:read`,
    `observation:read`, `event:read`) the open-reads posture covers.


    **`POST /session`, `DELETE /session`, and `POST /bootstrap` are the
    only non-`GET` routes this contract defines.** Every other route
    documented below remains `GET`-only; any other method on one of THOSE
    paths returns
    `405 Method Not Allowed` with an `Allow` header naming the methods
    that path actually serves; see `components.responses.MethodNotAllowed`.
    A cookie-authenticated write additionally requires the
    `Sec-Fetch-Site: same-origin` request header and is rejected
    (`csrf-rejected`) when it is absent — there is no `Origin`-vs-`Host`
    fallback (ADR-024 decision 6). A bearer-token-authenticated write is
    exempt from that check: nothing attaches an `Authorization` header to
    a request automatically the way a browser attaches a cookie.
servers:
  - url: /api/v1
    description: The coordinator's own control API root.
security:
  - bearerAuth: []
  - cookieAuth: []
  - {}
paths:
  /:
    get:
      operationId: getServiceDescriptor
      summary: Service descriptor
      description: >-
        The API's own self-description: served version, every version this
        coordinator supports, and coordinator build metadata. Always open,
        with no credential and regardless of whether reads are otherwise
        closed (ADR-024): it carries coordinator build metadata only, none
        of the four resources the read-closure posture gates.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDescriptor"
        "400":
          $ref: "#/components/responses/UnsupportedAPIVersion"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /snapshot:
    get:
      operationId: getSnapshot
      summary: Authoritative snapshot
      description: >-
        The authoritative state the SSE stream's deltas are relative to.
        Contains every resource the stream can notify about — nodes, FPP
        instances, and collector run state — plus `latestEventSeq`, so a
        client can fetch this snapshot once and then request exactly the
        event history after it via `GET /events?since=`, with no gap and no
        duplicate. Events themselves are not included here; they are a log,
        fetched separately.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "400":
          $ref: "#/components/responses/UnsupportedAPIVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /nodes:
    get:
      operationId: listNodes
      summary: Node inventory
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodesResponse"
        "400":
          $ref: "#/components/responses/UnsupportedAPIVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /nodes/{nodeId}:
    get:
      operationId: getNode
      summary: One node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
          description: >-
            Same ID syntax as an MQTT node ID: 1-64 characters, lowercase
            letters/digits/hyphens, not starting or ending with a hyphen.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /nodes/{nodeId}/declaration:
    parameters:
      - name: nodeId
        in: path
        required: true
        schema:
          type: string
        description: >-
          Same ID syntax as an MQTT node ID: 1-64 characters, lowercase
          letters/digits/hyphens, not starting or ending with a hyphen.
    post:
      operationId: declareNode
      summary: Promote a node to declared, or update its label/notes (RES-008 D2, BUILD-PLAN Step 7 seam B)
      description: >-
        A coordinator-local state change behind `config:write`. Declaring
        what hardware exists is configuration — ADR-024 decision 4 defines
        no narrower scope. Idempotent: promoting an already-declared node
        updates its label/notes without disturbing who first declared it or
        when. ADR-024 decision 11's same-transaction rule applies in full:
        the declaration write and its audit entry land in one transaction,
        or neither does — with the audit store failing, this operation is
        refused and the declaration is absent afterwards.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclareNodeRequest"
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDeclarationResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Either the authenticated principal does not hold `config:write`
            (ADR-024 decision 4, `detail` names the missing scope), or a
            cookie-authenticated write was missing
            `Sec-Fetch-Site: same-origin` (ADR-024 decision 6) — a
            bearer-token-authenticated request never receives the latter.
            Both share this one `Problem`-shaped response.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteNodeDeclaration
      summary: Remove a node's declaration (RES-008 D6, BUILD-PLAN Step 7 seam B)
      description: >-
        A coordinator-local state change behind `config:write`, audited the
        same atomic way as `POST` above. Requires an explicit
        `{"confirm":true}` body, so a mis-issued call cannot quietly remove
        inventory — a UI client's own confirmation dialog is in addition to
        this, never instead of it. This is the ONLY path that removes a
        declaration: a discovery run never deletes one (RES-008 D6) — see
        `POST /discovery/runs`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteNodeDeclarationRequest"
      responses:
        "204":
          description: The declaration was deleted.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Either the authenticated principal does not hold `config:write`
            (ADR-024 decision 4, `detail` names the missing scope), or a
            cookie-authenticated write was missing
            `Sec-Fetch-Site: same-origin` (ADR-024 decision 6) — a
            bearer-token-authenticated request never receives the latter.
            Both share this one `Problem`-shaped response.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /discovery/runs:
    post:
      operationId: startDiscoveryRun
      summary: Run discovery and propose undeclared nodes (RES-008 D2/D6, BUILD-PLAN Step 7 seam B)
      description: >-
        Behind `config:write`. Reads what this coordinator already
        observes — agent hellos already in inventory, and configured FPP
        instances — and PROPOSES what is not currently declared; it never
        creates, modifies, or deletes a declaration's own identity (ADR-003:
        discovery proposes, an operator action promotes). Performs NO
        active probing of its own: no mDNS, no subnet sweep, no MultiSync
        discover ping, so it cannot find equipment that has never talked to
        ShowMesh. A run that fails partway is reported as a `500` and is
        recorded with `complete: false` and a reason — never a missing row
        and never a silent partial success. Discovery runs are serialized:
        a second, overlapping request while one is already in progress on
        this coordinator is refused with `409`, never queued — see
        `components.responses.Conflict`'s own doc comment on why
        interleaving two runs is unsafe rather than merely wasteful.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Either the authenticated principal does not hold `config:write`
            (ADR-024 decision 4, `detail` names the missing scope), or a
            cookie-authenticated write was missing
            `Sec-Fetch-Site: same-origin` (ADR-024 decision 6) — a
            bearer-token-authenticated request never receives the latter.
            Both share this one `Problem`-shaped response.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /fpp:
    get:
      operationId: listFPPInstances
      summary: Configured FPP instances
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPResponse"
        "400":
          $ref: "#/components/responses/UnsupportedAPIVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /fpp/{instanceId}:
    get:
      operationId: getFPPInstance
      summary: One FPP instance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
          description: Same ID syntax as a node ID (contract section 7).
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPInstanceResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /fpp/{instanceId}/commands:
    post:
      operationId: dispatchFPPCommand
      summary: Dispatch a primitive FPP lifecycle command (Step 7 seam C)
      description: >-
        Behind `fpp:command` (ADR-024 decision 4). Dispatches FPP's own
        native command over GET at its own /api/command/... endpoint
        (ADR-001: this is ShowMesh invoking FPP's own command, never a
        second scheduler) and confirms by evidence against the collector's
        observations before answering, up to an internal deadline
        (ADR-003). A `200` from FPP is never reported as this endpoint's
        own success on its own — see FPPCommandResult.outcome. A
        cookie-authenticated request additionally requires
        `Sec-Fetch-Site: same-origin` (ADR-024 decision 6, `403` on
        absence, same Problem schema as a missing-scope `403`); a
        bearer-token-authenticated request is exempt. A replayed
        `idempotencyKey` — reused against the SAME `action` and the SAME
        `instanceId` it was first used against — dispatches nothing and
        returns the original command's result, flagged `replay: true`. An
        `idempotencyKey` reused against a DIFFERENT `action` or a
        DIFFERENT `instanceId` is a `409` conflict, not a replay: see
        FPPCommandRequest.idempotencyKey and the `409` response below.
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
          description: Same ID syntax as a node ID (contract section 7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FPPCommandRequest"
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPCommandResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: >-
            `idempotencyKey` was already used for a command whose `action`
            or `instanceId` differs from this request's own — a conflict,
            not a replay (see this operation's own description).
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
  /observations:
    get:
      operationId: listObservations
      summary: Flat observation list
      description: >-
        Every observation this coordinator currently holds, across every
        resource, optionally filtered. A filter that matches nothing
        returns `200` with an empty `observations` array — "no observations
        match this filter" is not "this endpoint does not exist", so this
        is never a `404`.
      parameters:
        - name: resourceKind
          in: query
          required: false
          schema:
            type: string
            enum: [node, fpp, coordinator]
          description: Restrict to observations about resources of this kind.
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
          description: Restrict to observations about this specific resource ID.
        - name: signal
          in: query
          required: false
          schema:
            type: string
          description: Restrict to observations of this exact signal ID.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationsResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /events:
    get:
      operationId: listEvents
      summary: Event history
      description: >-
        Event history in ascending `seq` order. See this document's
        top-level description for what `gap: true` means; it is a
        successful response describing an incomplete answer, never an
        error.
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: >-
            Exclusive lower bound: return events with seq strictly greater
            than this value. 0 (the default) means "from the beginning of
            retained history".
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
            maximum: 500
          description: >-
            Maximum number of events to return. Defaults to 100; values
            above 500 are silently clamped to 500. Both numbers are this
            coordinator's own pagination choice, not a measured or
            contractually significant value (see RES-013), and may change.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /stream:
    get:
      operationId: streamChanges
      summary: Server-Sent Events change stream
      description: >-
        `text/event-stream`, not JSON-over-HTTP-response, so this operation
        has no normal `200 application/json` content — the event payload
        shapes are documented as schemas under `components.schemas` for a
        client to validate the JSON inside each SSE `data:` line against,
        even though the transport itself is not modeled as a normal
        response body here. Every SSE `event:` name this coordinator emits,
        and the schema of the JSON on its `data:` line, is:

          | SSE `event:` name | `data:` schema | delivered to |
          |---|---|---|
          | `stream.start` | `StreamStart` | every connection |
          | `node.changed` | `NodeChangedEvent` | every connection |
          | `fpp.changed` | `FPPChangedEvent` | every connection |
          | `fpp.observations.changed` | `FPPObservationsChangedEvent` | `?deltas=1` connections only |
          | `event.recorded` | `EventRecordedEvent` | every connection |
          | `stream.reset` | `StreamReset` | every connection |

        `data:` is always exactly one line of compact (no embedded
        newlines) JSON — never pretty-printed, never split across
        multiple `data:` lines. No other SSE field (`event:`, `data:`) is
        ever emitted for these six types, and no other event type is
        defined; a client encountering an `event:` name not in this table
        should ignore that frame rather than fail, in the same
        unknown-field-tolerant spirit as contract section 6.2's
        additive-only rule for JSON fields.


        **Delta frames are opt-in per connection (ADR-023).** A request to
        this exact path with no query string, or with any `deltas` value
        other than the literal `1`, gets precisely what this endpoint
        produced before `fpp.observations.changed` existed — byte for
        byte, with no `fpp.observations.changed` event ever appearing on
        that connection. This is what makes the addition additive rather
        than a silent break under ADR-020's own additive-only rule
        (contract section 6.2, "within a major version the contract is
        additive-only... clients must ignore unknown fields"): no existing
        client's behavior changes, and a client that has never heard of
        deltas cannot be affected by them.

          `GET /stream?deltas=1`

        On a delta-subscribed connection, an observation-level change to
        an FPP instance (a signal's resolved value, unit, state, reason,
        or quality differs from what this connection was last told, or a
        signal stops being reported entirely) arrives as
        `fpp.observations.changed` instead of repeating that instance's
        entire `observations` array inside `fpp.changed`. A change to the
        instance's own structural fields — `health`, `endpoint`,
        `lastPollAt`, `lastPollError` — still arrives as `fpp.changed`,
        carrying the instance's full current representation exactly as it
        always has, on a delta-subscribed connection too; such a
        connection therefore receives BOTH event kinds and must apply
        both. `fpp.observations.changed` is never sent in the same render
        pass as an `fpp.changed` for the same instance that already
        widened to include this connection, since that `fpp.changed`
        already carries the current, complete observation set.


        On a fixed interval (a ShowMesh-chosen hypothesis, not a measured
        or contractually significant value) this coordinator also writes
        an SSE **comment** line, `: keepalive`, with no `event:` or `data:`
        field at all — this is what lets an idle connection be
        distinguished from a dead one through an intermediary that would
        otherwise time it out. A client (or its SSE parsing library) MUST
        skip a line beginning with `:` rather than attempt to parse it as
        an event; this is standard `text/event-stream` syntax, not a
        ShowMesh extension, but is called out explicitly here because a
        naive hand-rolled parser that only expects `event:`/`data:` lines
        will otherwise choke on it.


        The first event on every connection is `stream.start`, carrying
        `snapshotRequired: true`; a client MUST fetch `GET /snapshot` before
        applying anything else from this stream. No SSE `id:` field is ever
        emitted, and any `Last-Event-ID` request header is ignored: a gap in
        this stream is indistinguishable from a quiet system, so resuming
        from a cursor is deliberately impossible (OPERATOR-UI section 6).
        `seq` on every event after `stream.start` is per-connection only
        and must never be treated as a durable cursor — unlike `Event.seq`,
        which is.


        **The stream carries no RESOURCE deletions in v1.** Nothing on
        this connection tells a client that an entire node or FPP instance
        has been removed from this coordinator's configuration or
        inventory; a client applying deltas on top of a snapshot has no
        signal that a node or FPP instance present in that snapshot is now
        gone entirely. This is a real gap, stated here so a client does
        not assume otherwise, not a promise that it will never happen.
        `fpp.observations.changed`'s `removed` list (ADR-023) is narrower
        and does not close this gap: it reports a single OBSERVATION
        disappearing from a still-present FPP instance — a cape swapped
        for a smaller one, a sensor that stopped reporting — never the
        instance itself disappearing.


        **A stream closes with a clean end-of-response and no terminating
        frame of any kind**, including when the coordinator is the one
        shutting down — there is no `stream.end` event and none is
        planned, deliberately: correctness here depends only on a client
        re-fetching `GET /snapshot` on *any* interruption (this operation's
        own reconnection rule, above), which already covers an orderly
        shutdown exactly the same way it covers a network fault or a
        crash. A client cannot distinguish "the coordinator shut down
        cleanly" from "a proxy in between timed the connection out" from
        the stream alone, and is not meant to try; it should simply
        reconnect and re-snapshot either way.
      parameters:
        - name: deltas
          in: query
          required: false
          schema:
            type: string
          description: >-
            Opt this connection into `fpp.observations.changed` frames
            (ADR-023). Only the exact literal value `1` enables it; any
            other value — absent, empty, `0`, `true`, anything else —
            behaves identically to omitting this parameter entirely, which
            is deliberately the strictest possible reading rather than a
            lenient truthy check (see this operation's own description
            above for why: additive compatibility for every connection
            that has never heard of this parameter depends on it).
      responses:
        "200":
          description: >-
            An open `text/event-stream` connection. See the description
            above for the event types and their JSON payload schemas.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
        "400":
          $ref: "#/components/responses/UnsupportedAPIVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /session:
    get:
      operationId: getSession
      summary: Current session (ADR-024)
      description: >-
        Always reachable with no credential at all, regardless of whether
        reads are otherwise closed — see SessionResponse's own
        description for why "signed out" must be a readable state here,
        never a 401 this operation itself produces.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - {}
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/UnsupportedAPIVersion"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createSession
      summary: Log in (ADR-024)
      description: >-
        Unauthenticated by construction (ADR-024 decision 8): this is how
        a session is created in the first place, so no pre-existing
        credential is required or considered. Requires
        `Sec-Fetch-Site: same-origin` regardless (Step 7 seam 0, owner
        decision 2026-08-12: strict), checked on its own before any
        credential is verified — see the `403` response. Bounded by a
        login concurrency limit and a per-source increasing delay, NEVER a
        per-principal lockout — a correct password always eventually
        succeeds, only more slowly from a source with recent failures. On
        success, sets the HttpOnly session cookie via Set-Cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: OK. Set-Cookie carries the new session.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          description: Invalid name/password, or the principal is disabled.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/LoginCSRFRejected"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteSession
      summary: Log out / revoke a session (ADR-024)
      description: >-
        Requires an authenticated principal (no specific scope). A
        cookie-authenticated request additionally requires
        `Sec-Fetch-Site: same-origin` (ADR-024 decision 6) and is rejected
        when absent — there is no Origin-vs-Host fallback. An empty body
        revokes the session that authenticated this request, which
        requires that credential to be the session cookie itself; a body
        naming `sessionId` instead revokes that specific session (which
        must belong to the authenticated principal) and works under either
        credential form — this is this contract's one genuine
        bearer-authenticated write.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSessionRequest"
      responses:
        "204":
          description: The session was revoked.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /bootstrap:
    post:
      operationId: claimBootstrap
      summary: Claim the one-time bootstrap code and create the first admin (ADR-024 decision 9)
      description: >-
        Unauthenticated by construction, exactly like `POST /session` — no
        principal exists yet for a credential to name. Useless without
        `code`, which is readable only from a file in the coordinator's
        data volume: possessing it proves filesystem access, which is what
        keeps this endpoint from being a network-reachable way to become
        administrator. Bounded by the SAME login concurrency limit and
        per-source delay as `POST /session` (ADR-024 decision 8), never a
        per-principal lockout. A successful claim creates the first
        administrator (always `kind: human`, `role: admin`), invalidates
        and deletes the bootstrap code, and immediately mints a session for
        it exactly as `POST /session` does — the response body is the
        identical `SessionResponse` shape. Requires
        `Sec-Fetch-Site: same-origin` exactly as `POST /session` does
        (Step 7 seam 0, owner decision 2026-08-12: strict) — see the `403`
        response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "200":
          description: OK. Set-Cookie carries the new session.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          description: >-
            The bootstrap code is invalid, already claimed, or expired —
            or no bootstrap code is currently available (a principal
            already exists).
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/LoginCSRFRejected"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /audit:
    get:
      operationId: listAudit
      summary: Audit log (ADR-024 decision 11)
      description: >-
        Append-only. Always requires `audit:read`, regardless of whether
        reads are otherwise open — this is not one of the four
        pre-existing read resources the open-reads posture covers. Not
        carried on the SSE change stream.
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: >-
            An opaque cursor: return entries after this value. 0 (the
            default) means "from the beginning of retained history".
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
            maximum: 500
          description: >-
            Maximum number of entries to return. Defaults to 100; values
            above 500 are silently clamped to 500.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /config/fpp.endpoints:
    get:
      operationId: getFPPEndpointsConfig
      summary: The active fpp.endpoints configuration (Step 7 seam A, RES-008 D1)
      description: >-
        Always requires `config:write` — there is no `config:read` scope
        (ADR-024 decision 4 fixes exactly four read scopes, and this
        surface is a new, always-sensitive one exactly like `GET /audit`,
        not one of the four the open-reads posture covers). `404` when no
        revision has ever been activated, which carries two distinct
        facts and states which one in `detail`: nothing has ever been
        configured here, or this coordinator's startup migration of
        `SHOWMESH_FPP_ENDPOINTS` into its store (RES-008 D1) could not be
        persisted, in which case a configuration IS in effect and
        `GET /fpp` lists it. A client must not read this `404` as "this
        coordinator is collecting from nothing". `restartRequired` is always
        `true`: this coordinator does not hot-reload configuration, so a
        change here takes effect on the coordinator's next restart, never
        immediately — see `restartRequiredReason`.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPEndpointsConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putFPPEndpointsConfig
      summary: Write a new fpp.endpoints configuration revision (Step 7 seam A, RES-008 D1)
      description: >-
        Requires `config:write` (admin only). The request body's
        `endpoints` field is required and must not be `null` — a JSON
        `null` is not an absent key, and neither means "no change"; the
        only way to deliberately configure zero endpoints is an explicit
        empty array (`"endpoints": []`). No other top-level field is
        accepted; an unrecognized one (e.g. a typo'd `endpoint`) is
        rejected rather than silently ignored, unlike a response body,
        where an unknown field must be ignored (this is a request a client
        is asking this coordinator to ACT on, not a response whose shape
        this coordinator already promised — see `ConfigFPPEndpointsPayload`'s
        own description).

        Validates the body (instance id syntax, URL scheme/host, no
        userinfo, no duplicate ids — the identical rule
        `SHOWMESH_FPP_ENDPOINTS` itself is checked against at coordinator
        startup) BEFORE activation (ADR-009): a rejected write appends no
        revision. Also refused before activation: an endpoint list that
        would drop an instance id `SHOWMESH_FPP_MQTT_HOSTS` still
        references, which this coordinator's own startup already enforces
        fatally — refusing it here means the mistake is refused at write
        time, not discovered as a refusal to boot on the next restart.

        Refused with `409` outright, before the body is even read, while
        `SHOWMESH_FPP_ENDPOINTS` is still set in this coordinator's own
        process environment: a write accepted in that state cannot survive
        this coordinator's own env/store disagreement rule on its very
        next restart, so the refusal happens now, while this coordinator
        is up and the reason is readable, rather than after a restart that
        never completes. That `409` carries one of two REMEDIES and they
        are not interchangeable, so `detail` is the part to read rather
        than the status: normally, remove the variable and restart once.
        But if this coordinator's startup migration of that variable was
        deferred because it could not be persisted, the store holds no
        endpoint list at all and removing the variable would resolve this
        coordinator to zero endpoints; `detail` then says so explicitly
        and the fix is to repair the data volume and restart.

        On success, appends a new immutable revision and activates it in
        the SAME transaction as its audit log entry (ADR-024 decision 11's
        same-transaction rule for `config:write`) — with the audit store
        failing, the write is refused and no revision is created. A
        cookie-authenticated request additionally requires
        `Sec-Fetch-Site: same-origin` (ADR-024 decision 6); a
        bearer-token-authenticated request is exempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigFPPEndpointsPayload"
      responses:
        "200":
          description: OK. The newly activated revision.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPEndpointsConfigResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Either the principal does not hold `config:write`
            (`forbidden`), or a cookie-authenticated write was missing
            `Sec-Fetch-Site: same-origin` (`csrf-rejected`) — see
            `components.responses.Forbidden` and
            `components.responses.CSRFRejected`.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /config/fpp.endpoints/revisions:
    get:
      operationId: listFPPEndpointsConfigRevisions
      summary: fpp.endpoints revision history, newest first (Step 7 seam A, RES-008 D1)
      description: >-
        Always requires `config:write`, exactly like `GET
        /config/fpp.endpoints`. Metadata only — no payload — per revision:
        ADR-009 requires revisions stay immutable and available, and this
        endpoint is for browsing that history, not for rollback tooling
        (deliberately out of scope — RES-008 section 10). An object that
        has never been created returns `200` with an empty `revisions`
        array, unlike `GET /config/fpp.endpoints`'s `404` for the same
        case: "no history yet" is not an absent resource the way "no
        active configuration" is.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigRevisionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  responses:
    UnsupportedAPIVersion:
      description: >-
        The request named an API version (in the `ShowMesh-API-Version`
        header, or in the path as `/api/vN/...`) that this coordinator does
        not serve.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ResourceNotFound:
      description: No resource with the given identifier exists.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidParameter:
      description: A path or query parameter failed validation.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: >-
        No valid credential was presented: reads are closed and none was
        given (or it did not authenticate), or the route is a write /
        `GET /audit` and no credential authenticated at all.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: >-
        A valid credential authenticated, but the principal does not hold
        the scope this operation requires. `detail` names the missing
        scope (ADR-024 decision 4).
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CSRFRejected:
      description: >-
        A cookie-authenticated write was missing the
        `Sec-Fetch-Site: same-origin` request header (ADR-024 decision 6).
        A bearer-token-authenticated request never receives this response.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LoginCSRFRejected:
      description: >-
        `Sec-Fetch-Site: same-origin` was missing (owner decision,
        2026-08-12: strict — the identical predicate `CSRFRejected` already
        applies to every other write, since there is deliberately one CSRF
        rule in this codebase, not two). Unlike `CSRFRejected`, there is no
        bearer exemption for this operation: it is unauthenticated by
        construction, so there is no pre-existing credential that could BE
        bearer-shaped in the first place. A `curl` login must pass the
        header explicitly, and a browser sending no `Sec-Fetch-Site` at all
        (Safari before 16.4) cannot use this endpoint — its path is the
        bearer-paste break-glass affordance (ADR-024 decision 5), unchanged.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: >-
        `POST /session`'s login concurrency bound was exceeded (ADR-024
        decision 8). Carries a `Retry-After` response header.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: >-
        The path names a real route, but this request's method is not one
        that route serves. A method this document does not define for a
        path returns this response rather than a `404`, and the `Allow`
        header names exactly the methods that path does serve.

        This description used to say that the document defined only `get`
        operations because every route was read-only. That stopped being
        true in Step 6, which added `POST /session` and
        `POST /bootstrap`, and stopped being true three times over in
        Step 7, which added the configuration, discovery and FPP command
        writes. What has NOT changed is the rule underneath it: no state
        change in this API is reachable by `GET` (ADR-024), so a `GET`
        remains safe to issue against any path here.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >-
        The request itself is valid, but this coordinator's current state
        makes it unsafe or meaningless to act on right now — the identical
        request would succeed at a different moment, which is what
        distinguishes this from `InvalidParameter` (a property of the
        request itself). Every operation that returns this response names
        its own specific cause in `detail`: `PUT /config/fpp.endpoints`
        (Step 7 seam A) refuses because `SHOWMESH_FPP_ENDPOINTS` is still
        set in the coordinator's own process environment (RES-008 D1) and
        the identical body would be accepted the moment the variable is
        removed and this coordinator restarts once;
        `POST /discovery/runs` (Step 7 seam B) refuses because a run is
        already in progress.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: >-
        The coordinator failed to answer this request for a reason that
        has nothing to do with whether the requested resource exists or
        the request was well formed — an internal dependency (e.g. the
        store) failed. `detail` never carries the underlying error; it is
        logged coordinator-side only.
      headers:
        ShowMesh-API-Version:
          $ref: "#/components/headers/ShowMesh-API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  headers:
    ShowMesh-API-Version:
      description: >-
        The API major version this response was served by. Present on
        every `/api/v1` response, success or error, with no exception
        (contract section 6.2). A client MAY also send this as a request
        header naming the version it expects; a coordinator that does not
        serve that version answers with the `UnsupportedAPIVersion`
        problem instead of a partial or best-guess render (contract
        section 6.6).
      schema:
        type: string
        enum: ["1"]
    Allow:
      description: >-
        Present only on a `405` response. The exact, comma-separated set
        of HTTP methods the requested path serves (e.g. `"GET, HEAD"`),
        computed from the routes actually registered — never a static or
        hand-maintained list.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <token>` (ADR-024). token is an API token
        minted for a principal by an admin, displayed exactly once at
        creation and stored coordinator-side only as a SHA-256 digest. A
        malformed or non-`Bearer` `Authorization` header never falls
        through to `cookieAuth` (ADR-024 decision 6) — it is treated as no
        credential at all. Reads are open by default (this scheme is
        optional for them, per the top-level `security` requirement not
        being exclusive); every write requires it or `cookieAuth`, with no
        opt-out. `/healthz`, `/readyz`, and `/version` are outside this
        contract entirely and are never authenticated, at any
        configuration.
    cookieAuth:
      type: apiKey
      in: cookie
      name: showmesh_session
      description: >-
        The `HttpOnly` session cookie `POST /session` mints (ADR-024
        decision 5). Not usable outside a browser in practice (nothing
        exposes it to script), and a write authenticated this way
        additionally requires the `Sec-Fetch-Site: same-origin` request
        header (decision 6) — omitted from this scheme's own contract
        because OpenAPI's securityScheme vocabulary has no way to express
        a conditional required header; see this document's top-level
        description and `components.responses.CSRFRejected`.
  schemas:
    Evidence:
      type: object
      description: >-
        The evidence envelope every observation-bearing field on this API
        uses (contract section 6.3). `state` is one of the six values
        below; `value` is null only for the three genuine absence states —
        `not_collected`, `collection_failed`, `unsupported` — where nothing
        was ever obtained. It is non-null for `current`, `stale`, AND
        `unknown_age`: `unknown_age` means a value exists but the time it
        was observed does not, which is a distinct condition from having no
        value at all, and a client that treats `unknown_age` as absent is
        making exactly the reading error that state was invented to
        prevent (a retained MQTT delivery, most commonly — see below).
        `reason` is non-null whenever `state` is not `current`.
        `observedAt` is null whenever the observation time is unknown —
        most importantly for a retained MQTT delivery (`state:
        "unknown_age"`) — and MUST NEVER be treated as equivalent to "now".


        **A signal can be reported by more than one collector source.**
        FPP's own REST API and its MQTT status topics both describe the same
        underlying facts (playback, controller/network health, pixel
        current), under identically-named `signal` values, distinguished
        only by `source` ("fpp-rest" vs "fpp-mqtt"). This API never renders
        more than one `Evidence` for the same signal on the same resource:
        when both sources have something to say, the coordinator resolves
        to a single value by a fixed precedence (a source with a known
        observation time beats one without, which beats an absence; a
        later observation time beats an earlier one; a tie prefers
        "fpp-rest" over "fpp-mqtt") before this envelope is ever built. A
        client reading this API never has to implement that resolution
        itself, and never sees two competing rows to reconcile.
      required:
        [signal, value, unit, state, reason, observedAt, collectedAt,
         source, quality, validForSeconds]
      properties:
        signal:
          type: string
          description: >-
            Namespaced, dot-separated signal identifier. Existing
            namespaces include "fpp.playlist.*"/"fpp.sequence.*"/
            "fpp.position.*"/"fpp.song.*"/"fpp.scheduler.*" (playback
            state), "fpp.fppd.*"/"fpp.power.*"/"fpp.bridging"/
            "fpp.channel_inputs.*"/"fpp.channel_outputs.*"/"fpp.mqtt.*"/
            "fpp.warnings.*" (controller and network health),
            "fpp.os.*"/"fpp.platform"/"fpp.variant"/"fpp.kernel"/
            "fpp.utilization.*"/"fpp.disk.*" (platform), "fpp.port.<key>.*"
            and "fpp.sensor.<key>.*" (per-port pixel current and per-sensor
            readings, `<key>` derived from that port's or sensor's own
            reported name — this set is dynamic and cannot be enumerated
            ahead of a real poll; an instance with nothing to report there
            simply has no such entries), "fpp.multisync.enabled",
            "node.heartbeat". A client MUST NOT assume this is a closed
            vocabulary: new signals and new namespaces are added
            additively, and an unrecognized one should render generically
            (e.g. under an "other" grouping) rather than being dropped.
        value:
          type: [boolean, string, integer, number, "null"]
        unit:
          type: [string, "null"]
          description: >-
            Never a claimed unit this API cannot actually verify — for
            example, a "fpp.sensor.<key>.value" temperature reading's unit
            is always null (Celsius vs. Fahrenheit is not stated by the
            source and is not guessed); the reading's kind is instead
            carried on a separate "fpp.sensor.<key>.type" signal
            ("Temperature", "Voltage").
        state:
          type: string
          enum:
            [current, stale, unknown_age, not_collected, collection_failed,
             unsupported]
        reason:
          type: [string, "null"]
        observedAt:
          type: [string, "null"]
          format: date-time
        collectedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Null only for state "not_collected" — no attempt was ever
            made, so there is no collection bookkeeping to report, not
            even a fallback timestamp. Non-null for every other state,
            including every absence state that DID involve an attempt
            ("collection_failed", "unsupported"). This is bookkeeping
            (when the coordinator recorded this evidence), never itself
            evidence of the subject's state — see observedAt above for
            that.
        source:
          type: string
          description: >-
            Names the collector that produced this evidence, e.g.
            "fpp-rest" (FPP's REST API), "fpp-mqtt" (FPP's own MQTT status
            topics — a second, independent source for many of the same
            facts "fpp-rest" reports), "mqtt-inventory" (node
            advertisement/liveness). Not a closed enum: a client should not
            special-case specific source values beyond display purposes.
        quality:
          type: string
          enum: [direct, derived, inferred, operator]
        validForSeconds:
          type: [integer, "null"]
          description: >-
            Null means the value does not expire on its own. Never a Go
            duration string.
    ResourceRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [node, fpp, coordinator]
        id:
          type: string
    Capability:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
        version:
          type: integer
        attributes:
          type: object
          additionalProperties: true
    ControlPlane:
      type: object
      description: >-
        A node's control-plane liveness verdict. "offline" means the MQTT
        control-plane connection is gone, not that the node — or a show it
        may still be running — is dead (contract section 3.2).
      required: [state, reason]
      properties:
        state:
          type: string
          enum: [online, offline, unknown]
        reason:
          type: [string, "null"]
          description: Non-null whenever state is not "online".
    NodeEvidence:
      type: object
      required: [hello, lastWill, heartbeat]
      properties:
        hello:
          $ref: "#/components/schemas/Evidence"
        lastWill:
          $ref: "#/components/schemas/Evidence"
        heartbeat:
          $ref: "#/components/schemas/Evidence"
    Node:
      type: object
      description: >-
        One node's current representation: an element of GET /nodes, of
        the snapshot's nodes list, and the payload of a node.changed
        stream event — all three render identically.
      required:
        [nodeId, label, platform, agentVersion, bootId, startedAt,
         firstSeenAt, updatedAt, capabilities, controlPlane, evidence,
         declaration]
      properties:
        nodeId:
          type: string
        label:
          type: [string, "null"]
        platform:
          type: [string, "null"]
        agentVersion:
          type: [string, "null"]
        bootId:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date-time
        firstSeenAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        controlPlane:
          $ref: "#/components/schemas/ControlPlane"
        evidence:
          $ref: "#/components/schemas/NodeEvidence"
        declaration:
          $ref: "#/components/schemas/NodeDeclaration"
    NodeDeclaration:
      type: object
      description: >-
        A node's declaration state (RES-008 D2/D6, BUILD-PLAN Step 7 seam
        B): an operator's durable statement that this node belongs to the
        installation, independent of whether it currently reports in, plus
        a discovery-evidence verdict computed on every read against the
        single most recent discovery run — never stored. `declared: false`
        means every other field is null: this node exists only as an
        observation nobody has ever promoted (POST
        /nodes/{nodeId}/declaration), and `discoveryState` is
        `not_applicable` (discovery-seen state has no meaning for something
        not part of the declared inventory).

        `discoveryState` is one of four values: `present` (the most recent
        discovery run was complete and saw this node), `not_seen` (the most
        recent discovery run was complete and did NOT see this node —
        `discoveryReason` states why and `notSeenAsOfRunId`/
        `notSeenAsOfRunFinishedAt` name THAT run specifically),
        `unknown` (either the most recent run did not complete — an
        incomplete run is never evidence of absence, so this is never
        `not_seen` — or no discovery run history is available at all,
        which covers both "never run" and "history pruned" identically
        since this API cannot and must not guess which), or
        `not_applicable` (`declared` is false).

        `lastDiscoveryRunId`/`lastDiscoveredAt` are this declaration's OWN
        last-seen-by-discovery bookkeeping (the run that most recently DID
        see it, and when — null if it has never once been seen). They are
        NEVER repurposed to carry any other run's identity, including the
        run that just failed to see it: a field literally named
        `lastDiscoveredAt` asserting a time seconds old for a node that has
        actually been dark for a week would be exactly backwards.
        `lastDiscoveryRunId` may name a run id that no longer resolves to
        any `DiscoveryRun` — `discovery_runs` is pruned by retention and a
        declaration's own last-seen pointer is not, so a dangling id is
        expected, not a bug, and it renders as `unknown` (or `not_seen`, if
        a newer complete run has since run and also missed it) with a
        reason, never as blank.

        `notSeenAsOfRunId`/`notSeenAsOfRunFinishedAt` name the run that did
        NOT see this declared node — populated ONLY when `discoveryState`
        is `not_seen`, both null otherwise. Added additively: an existing
        client that has never heard of these two fields keeps working
        unchanged, reading `discoveryReason`'s prose and
        `lastDiscoveryRunId`/`lastDiscoveredAt`'s own (unaffected) bookkeeping
        exactly as before.
      required:
        [declared, label, notes, declaredAt, declaredByPrincipalId,
         declaredByPrincipalName, discoveryState, discoveryReason,
         lastDiscoveryRunId, lastDiscoveredAt,
         notSeenAsOfRunId, notSeenAsOfRunFinishedAt]
      properties:
        declared:
          type: boolean
        label:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        declaredAt:
          type: [string, "null"]
          format: date-time
        declaredByPrincipalId:
          type: [string, "null"]
        declaredByPrincipalName:
          type: [string, "null"]
        discoveryState:
          type: string
          enum: [present, not_seen, unknown, not_applicable]
        discoveryReason:
          type: [string, "null"]
        lastDiscoveryRunId:
          type: [string, "null"]
        lastDiscoveredAt:
          type: [string, "null"]
          format: date-time
        notSeenAsOfRunId:
          type: [string, "null"]
        notSeenAsOfRunFinishedAt:
          type: [string, "null"]
          format: date-time
    DiscoveryRun:
      type: object
      description: >-
        One discovery run's wire representation (RES-008 D6, BUILD-PLAN
        Step 7 seam B). `finishedAt` and `reason` are null while a run is
        still in progress; `reason` is also null for a run that completed
        successfully (`complete: true`) — it is populated only when
        `complete` is false and the run has finished (failed partway),
        never a missing row and never a silent partial success.
      required:
        [id, startedAt, finishedAt, complete, reason, foundCount,
         initiatedByPrincipalId, initiatedByPrincipalName]
      properties:
        id:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        complete:
          type: boolean
        reason:
          type: [string, "null"]
        foundCount:
          type: integer
        initiatedByPrincipalId:
          type: string
        initiatedByPrincipalName:
          type: string
    DiscoveryProposal:
      type: object
      description: >-
        One entity a discovery run observed that is not currently declared
        (computed at read time by diffing what is observed against what is
        declared — no proposals table exists). `source` is `node` (an
        agent hello already in inventory) or `fpp` (a configured FPP
        instance), the only two sources discovery reads: it performs no
        active probing of its own. A run never creates a declaration from
        a proposal by itself — POST /nodes/{nodeId}/declaration is the
        separate operator action that promotes one.
      required: [nodeId, source]
      properties:
        nodeId:
          type: string
        source:
          type: string
          enum: [node, fpp]
    DiscoveryRunResponse:
      type: object
      required: [serverTime, run, proposals]
      properties:
        serverTime:
          type: string
          format: date-time
        run:
          $ref: "#/components/schemas/DiscoveryRun"
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryProposal"
    DeclareNodeRequest:
      type: object
      description: >-
        Body of POST /nodes/{nodeId}/declaration. Both fields are optional
        AND nullable — a bare `{}` (or an absent/null field) promotes the
        named node to declared with no label or notes on a BRAND-NEW
        declaration, or leaves that field's currently declared value
        UNCHANGED on an already-declared node. Idempotent: re-declaring an
        already-declared node with neither field present never disturbs its
        existing label/notes, or who first declared it, or when. An
        explicit empty string (`""`) still clears a field; only an absent
        key or an explicit `null` means "leave unchanged" — the same
        absent-versus-empty distinction as a JSON `null` never being an
        absent key, applied in reverse: here, ABSENCE is what must be
        representable and honored, because a client that cannot omit a
        field cannot ask for "unchanged" at all.
      properties:
        label:
          type: [string, "null"]
        notes:
          type: [string, "null"]
    NodeDeclarationResponse:
      type: object
      required: [serverTime, declaration]
      properties:
        serverTime:
          type: string
          format: date-time
        declaration:
          $ref: "#/components/schemas/NodeDeclaration"
    DeleteNodeDeclarationRequest:
      type: object
      description: >-
        Required body of DELETE /nodes/{nodeId}/declaration. `confirm` must
        be `true`, so a mis-issued call cannot quietly remove inventory —
        in addition to, never instead of, any confirmation dialog a UI
        client shows.
      required: [confirm]
      properties:
        confirm:
          type: boolean
    FPPInstance:
      type: object
      description: >-
        One configured FPP instance's current representation. `endpoint`
        never includes userinfo (credentials are stripped before this is
        ever rendered).
      required:
        [instanceId, endpoint, health, observations, lastPollAt,
         lastPollError]
      properties:
        instanceId:
          type: string
        endpoint:
          type: string
        health:
          type: string
          enum: [healthy, degraded, failed, unknown, suppressed]
        observations:
          type: array
          description: Ordered by signal, ascending, and this ordering is guaranteed.
          items:
            $ref: "#/components/schemas/Evidence"
        lastPollAt:
          type: [string, "null"]
          format: date-time
        lastPollError:
          type: [string, "null"]
    Event:
      type: object
      description: >-
        One recorded event: an element of GET /events, and the payload of
        an event.recorded stream event. `occurredAt` is null when the
        change was first learned from evidence of unknown age.
      required:
        [seq, recordedAt, occurredAt, source, resource, category, severity,
         summary, details, correlationId]
      properties:
        seq:
          type: integer
          description: >-
            A durable, strictly increasing cursor into event history. Never
            to be confused with an SSE stream frame's per-connection seq.
        recordedAt:
          type: string
          format: date-time
        occurredAt:
          type: [string, "null"]
          format: date-time
        source:
          type: string
        resource:
          $ref: "#/components/schemas/ResourceRef"
        category:
          type: string
        severity:
          type: string
          enum: [informational, warning, critical]
        summary:
          type: string
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: [string, "null"]
    ObservationEntry:
      type: object
      description: >-
        One element of GET /observations: the section 6.3 Evidence envelope
        plus its own resource, since a flat list spanning every resource
        cannot rely on an enclosing object to imply the subject the way
        Node.evidence.* or FPPInstance.observations can.
      required:
        [resource, signal, value, unit, state, reason, observedAt,
         collectedAt, source, quality, validForSeconds]
      properties:
        resource:
          $ref: "#/components/schemas/ResourceRef"
        signal:
          type: string
        value:
          type: [boolean, string, integer, number, "null"]
        unit:
          type: [string, "null"]
        state:
          type: string
          enum:
            [current, stale, unknown_age, not_collected, collection_failed,
             unsupported]
        reason:
          type: [string, "null"]
        observedAt:
          type: [string, "null"]
          format: date-time
        collectedAt:
          type: [string, "null"]
          format: date-time
          description: See Evidence.collectedAt; null only for state "not_collected".
        source:
          type: string
        quality:
          type: string
          enum: [direct, derived, inferred, operator]
        validForSeconds:
          type: [integer, "null"]
    CollectorStatus:
      type: object
      required: [id, state, reason]
      properties:
        id:
          type: string
        state:
          type: string
        reason:
          type: [string, "null"]
    CoordinatorInfo:
      type: object
      required: [version, commit, buildDate, goVersion]
      properties:
        version:
          type: string
        commit:
          type: string
        buildDate:
          type: string
        goVersion:
          type: string
    ServiceDescriptor:
      type: object
      required: [serverTime, apiVersion, supportedVersions, coordinator]
      properties:
        serverTime:
          type: string
          format: date-time
        apiVersion:
          type: integer
        supportedVersions:
          type: array
          items:
            type: integer
        coordinator:
          $ref: "#/components/schemas/CoordinatorInfo"
    NodesResponse:
      type: object
      required: [serverTime, nodes]
      properties:
        serverTime:
          type: string
          format: date-time
        nodes:
          type: array
          description: >-
            Ordered by nodeId, ascending, and this ordering is
            guaranteed — a client that renders or diffs this array
            positionally may rely on it.
          items:
            $ref: "#/components/schemas/Node"
    NodeResponse:
      type: object
      description: >-
        The body of GET /nodes/{nodeId}: a single node wrapped in
        serverTime exactly like the collection endpoint, never a bare Node
        object — every response on this API carries serverTime with no
        exception (section 6.2).
      required: [serverTime, node]
      properties:
        serverTime:
          type: string
          format: date-time
        node:
          $ref: "#/components/schemas/Node"
    FPPResponse:
      type: object
      required: [serverTime, instances]
      properties:
        serverTime:
          type: string
          format: date-time
        instances:
          type: array
          description: >-
            Ordered exactly as this coordinator's own FPP endpoint
            configuration lists them, stable for the life of the process.
            This ordering is guaranteed, but it is configuration order,
            not an alphabetical or otherwise derived order.
          items:
            $ref: "#/components/schemas/FPPInstance"
    FPPInstanceResponse:
      type: object
      description: See NodeResponse; the same rule applies identically here.
      required: [serverTime, instance]
      properties:
        serverTime:
          type: string
          format: date-time
        instance:
          $ref: "#/components/schemas/FPPInstance"
    FPPCommandRequest:
      type: object
      description: >-
        The body of POST /fpp/{instanceId}/commands (Step 7 seam C, ADR-001,
        ADR-003). action is checked against a fixed vocabulary at the
        handler; "stopPlaylist" is the only member today, and dispatches
        FPP's own native "Stop Now" command. idempotencyKey is required on
        every request (ARCHITECTURE section 8.1): RES-015 section 7.3
        established that FPP supplies nothing a coordinator-minted key
        could be derived from, so the caller (showmeshctl, the Operator UI)
        mints a fresh one per invocation.
      required: [action, idempotencyKey]
      properties:
        action:
          type: string
          enum: [stopPlaylist]
        idempotencyKey:
          type: string
          description: >-
            Scoped to the exact (action, instanceId) pair it is first used
            against — a database-level UNIQUE constraint on this value
            alone (schemaV6) cannot express that scope, so the server
            checks it explicitly: reusing a key against the SAME action and
            instanceId is a replay (nothing is dispatched a second time,
            the original result is returned, flagged `replay: true`);
            reusing it against a DIFFERENT action or a DIFFERENT
            instanceId is a `409` conflict, refused outright, never
            answered as if it belonged to whichever command first claimed
            the key. Mint a fresh key per genuinely new request — never
            reuse one across two different invocations "to be safe."
    FPPCommandResponse:
      type: object
      description: The body of a successful (200) response from POST /fpp/{instanceId}/commands.
      required: [serverTime, command]
      properties:
        serverTime:
          type: string
          format: date-time
        command:
          $ref: "#/components/schemas/FPPCommandResult"
    FPPCommandResult:
      type: object
      description: >-
        What happened to one dispatched (or replayed) command. outcome is
        never "successful" merely because FPP answered 200 (ADR-003): it is
        exactly "confirmed" or "unconfirmed" once resolved, decided by
        confirming observed state against the collector's own evidence, or
        empty in the one accepted race a replay response can observe (see
        outcome's own description). outcomeState carries
        pkg/observation's six-value evidence-state vocabulary, the state of
        the evidence the outcome was actually decided from — the same
        vocabulary AuditEntry.outcomeState already uses, not a second one
        invented for this endpoint.
      required:
        [id, idempotencyKey, action, instanceId, replay, outcome,
         outcomeState, outcomeReason, attributionDegraded, dispatchedAt,
         resolvedAt]
      properties:
        id:
          type: string
        idempotencyKey:
          type: string
        action:
          type: string
        instanceId:
          type: string
        replay:
          type: boolean
          description: >-
            True when this response answers a REPLAYED idempotency key: the
            command described here was NOT dispatched by this request — it
            is the ORIGINAL command's already-recorded result, returned per
            ADR-024 decision 11 ("a replay is precisely the case an
            investigator wants to see, because it means the operator did
            not get their response").
        outcome:
          type: string
          enum: ["confirmed", "unconfirmed", ""]
          description: >-
            Empty only for a REPLAY response returned before the original
            request's own dispatch/confirmation has finished — a real,
            honest value (ADR-020's absence-is-stated rule), not an
            omission.
        outcomeState:
          type: string
          description: >-
            pkg/observation's six-value evidence-state vocabulary — the
            state of the evidence this outcome was actually decided from
            (or, for a command a coordinator restart left dispatched and
            never resolved, the state a startup reconciliation pass
            decided it from — see this document's own note on
            outcomeReason). NEVER blank for a resolved command: a bare,
            unconstrained string here is exactly what let a coordinator
            restart leave outcomeState/outcomeReason as permanent empty
            strings, indistinguishable from the one narrow, accepted race
            a REPLAY response's outcome (not outcomeState) may legitimately
            be empty for — see FPPCommandResult.outcome's own description.
          enum:
            [current, stale, unknown_age, not_collected, collection_failed,
             unsupported]
        outcomeReason:
          type: string
          description: >-
            A short, human-readable explanation. Non-empty whenever this
            response's own `command.outcome` is `"confirmed"` or
            `"unconfirmed"` (i.e. whenever this command has actually
            resolved) — the only value for which it may be empty is a
            REPLAY response returned before the original request's own
            dispatch/confirmation has finished, matching `outcome`'s own
            narrow accepted-empty case exactly. A command a coordinator
            restart left stranded is resolved by a startup reconciliation
            pass before it can ever reach a client in that state — see
            outcomeState's own description — so that condition is never a
            second source of a blank reason.
        attributionDegraded:
          type: boolean
          description: >-
            True when this command's dispatch or outcome audit entry could
            not be written. Stop Playlist is a member of ADR-024 decision
            11's blackout/stop/power-off safety class, so the command
            proceeds regardless, with a degraded attribution record written
            to the coordinator's stderr instead of the audit log.
        dispatchedAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
    ObservationsResponse:
      type: object
      required: [serverTime, observations]
      properties:
        serverTime:
          type: string
          format: date-time
        observations:
          type: array
          description: >-
            Ordered by resourceKind, then resourceId, then signal,
            ascending, and this ordering is guaranteed.
          items:
            $ref: "#/components/schemas/ObservationEntry"
    EventsResponse:
      type: object
      description: >-
        See this document's top-level description for gap and
        oldestRetainedSeq: gap is always present and boolean;
        oldestRetainedSeq is the lowest seq still retained, or null when
        the store retains no events at all.
      required: [serverTime, events, latestSeq, gap, oldestRetainedSeq]
      properties:
        serverTime:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        latestSeq:
          type: integer
        gap:
          type: boolean
        oldestRetainedSeq:
          type: [integer, "null"]
    Snapshot:
      type: object
      required:
        [serverTime, latestEventSeq, nodes, fpp, collectors]
      properties:
        serverTime:
          type: string
          format: date-time
        latestEventSeq:
          type: integer
        nodes:
          type: array
          description: Ordered by nodeId, ascending. Same guarantee as NodesResponse.nodes.
          items:
            $ref: "#/components/schemas/Node"
        fpp:
          type: object
          required: [instances]
          properties:
            instances:
              type: array
              description: >-
                Ordered exactly as configured, stable for the life of the
                process. Same guarantee as FPPResponse.instances.
              items:
                $ref: "#/components/schemas/FPPInstance"
        collectors:
          type: array
          description: >-
            Ordered exactly as this coordinator's own FPP endpoint
            configuration lists them (one collector per configured
            instance), stable for the life of the process. This ordering
            is guaranteed.
          items:
            $ref: "#/components/schemas/CollectorStatus"
    PrincipalSummary:
      type: object
      description: A principal's own non-secret identity (ADR-024).
      required: [id, name, kind, role]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [human, machine]
        role:
          type: string
          enum: [viewer, operator, admin, scheduler]
    SessionInfo:
      type: object
      description: >-
        The session that authenticated this request, present only when
        that credential was the session cookie. id is the session's
        non-secret row identifier — never the cookie value.
      required: [id, deviceLabel, createdAt]
      properties:
        id:
          type: string
        deviceLabel:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateSessionRequest:
      type: object
      description: The body of POST /session.
      required: [name, password, deviceLabel]
      properties:
        name:
          type: string
        password:
          type: string
        deviceLabel:
          type: string
    DeleteSessionRequest:
      type: object
      description: >-
        DELETE /session's optional body. An absent/empty sessionId revokes
        the session that authenticated this request (requiring that
        credential to be the session cookie itself); a non-empty sessionId
        instead revokes that specific session, which must belong to the
        authenticated principal, and works under either credential form.
      properties:
        sessionId:
          type: string
    BootstrapRequest:
      type: object
      description: >-
        The body of POST /bootstrap. code is single-use and readable only
        from a file in the coordinator's data volume (ADR-024 decision 9);
        deviceLabel behaves exactly as CreateSessionRequest.deviceLabel
        does, since a successful claim immediately mints a session.
      required: [code, name, password, deviceLabel]
      properties:
        code:
          type: string
        name:
          type: string
        password:
          type: string
        deviceLabel:
          type: string
    SessionResponse:
      type: object
      description: >-
        The body of GET and POST /session, and of POST /bootstrap on
        success (ADR-024 decisions 5, 9, and 12). authenticated is false
        whenever no valid credential authenticated this request — a new
        device, cleared cookies, a revoked or idle-expired session, a bad
        or absent bearer token — which is deliberately NOT a 401: "being
        signed out" is a persistent, readable state, not an error a caller
        must catch to learn. When authenticated is false, principal,
        session, and credentialForm are all null, scopes is an empty
        array, and scopesState is "not_applicable". scopesState is
        "current" when scopes was computed from a fresh read of this
        principal's role in this same request (the only case this
        coordinator currently produces) and "unknown" on an internal error
        computing them — a client MUST treat "unknown" exactly like an
        empty scope list (ADR-024 decision 12: "a stale or unavailable
        [scope list] renders as unknown, never as permissive").
        bootstrapRequired is true whenever this coordinator currently holds
        zero principals (ADR-024 decision 9's "loud and persistent"
        unclaimed-bootstrap signal) — computed and returned regardless of
        whether this particular request authenticated, so a client can
        render the banner from GET /session on load with no credential at
        all.
      required:
        [serverTime, authenticated, principal, session, credentialForm,
         scopes, scopesState, bootstrapRequired]
      properties:
        serverTime:
          type: string
          format: date-time
        authenticated:
          type: boolean
        principal:
          oneOf:
            - $ref: "#/components/schemas/PrincipalSummary"
            - type: "null"
        session:
          oneOf:
            - $ref: "#/components/schemas/SessionInfo"
            - type: "null"
        credentialForm:
          type: [string, "null"]
          enum: [session, token, password, null]
        scopes:
          type: array
          items:
            type: string
        scopesState:
          type: string
          enum: [current, unknown, not_applicable]
        bootstrapRequired:
          type: boolean
    AuditEntry:
      type: object
      description: >-
        One element of GET /audit (ADR-024 decision 11). params is never
        null (an entry with none still reports an empty object).
      required:
        [timestamp, principalId, principalName, form, credentialId,
         clientAddr, action, target, params, idempotencyKey, kind,
         commandId, outcome, outcomeState, outcomeReason]
      properties:
        timestamp:
          type: string
          format: date-time
        principalId:
          type: string
        principalName:
          type: string
        form:
          type: string
        credentialId:
          type: string
        clientAddr:
          type: string
        action:
          type: string
        target:
          type: string
        params:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
        kind:
          type: string
          enum: [dispatch, outcome, replay, auth_failure, admin]
        commandId:
          type: string
        outcome:
          type: string
        outcomeState:
          type: string
        outcomeReason:
          type: string
    AuditResponse:
      type: object
      description: >-
        The body of GET /audit. Unlike EventsResponse, this carries no
        gap/oldestRetainedSeq-shaped fields: the coordinator's audit
        service currently exposes no oldest-retained cursor for this
        endpoint to report one honestly.
      required: [serverTime, entries]
      properties:
        serverTime:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
    ConfigFPPEndpoint:
      type: object
      description: >-
        One FPP instance's (id, url) pair (RES-008 D1) — the same shape
        `SHOWMESH_FPP_ENDPOINTS` carries.
      required: [id, url]
      properties:
        id:
          type: string
        url:
          type: string
    ConfigFPPEndpointsPayload:
      type: object
      description: >-
        The "fpp.endpoints" configuration kind's payload: the body PUT
        /config/fpp.endpoints accepts, and the "payload" member of GET
        /config/fpp.endpoints' response. endpoints is never null — an
        empty configured-endpoints list is a real, valid state, and it is
        the only way to deliberately configure zero endpoints; an absent
        or null "endpoints" key on a PUT is a `400`, never a silent wipe.

        This schema is deliberately NOT closed (no `additionalProperties:
        false`) even though the PUT handler itself rejects an unrecognized
        top-level field: ADR-020 requires this published document stay
        additive-only-compatible for a client reading a RESPONSE (this
        schema also describes GET's "payload" member), and a closed schema
        here would apply to both directions at once. The request-side
        strictness is enforced by the coordinator's own handler, not by
        this schema.
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/ConfigFPPEndpoint"
    FPPEndpointsConfigResponse:
      type: object
      description: >-
        The body of GET and PUT /config/fpp.endpoints. createdByPrincipalId
        and createdByPrincipalName are null for the one revision the
        startup env->store migration creates (source "env_migration"): a
        startup migration has no principal. restartRequired is always
        true; restartRequiredReason states why (this coordinator does not
        hot-reload configuration).
      required:
        [serverTime, kind, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source,
         restartRequired, restartRequiredReason]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          const: fpp.endpoints
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigFPPEndpointsPayload"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api, env_migration]
        restartRequired:
          type: boolean
          const: true
        restartRequiredReason:
          type: string
    ConfigRevisionMeta:
      type: object
      description: >-
        One element of ConfigRevisionsResponse.revisions: a config
        revision's metadata, WITHOUT its payload. createdByPrincipalId and
        createdByPrincipalName are null for a revision created by the
        startup env->store migration (source "env_migration").
      required:
        [revision, createdAt, createdByPrincipalId, createdByPrincipalName,
         source, note, active]
      properties:
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api, env_migration]
        note:
          type: string
        active:
          type: boolean
    ConfigRevisionsResponse:
      type: object
      description: The body of GET /config/fpp.endpoints/revisions, newest first.
      required: [serverTime, kind, revisions]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          const: fpp.endpoints
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/ConfigRevisionMeta"
    Problem:
      type: object
      description: >-
        RFC 9457 application/problem+json. serverTime is an extension
        member present on every problem this API produces, with no
        exception (section 6.2 and 6.6). supportedVersions is present only
        on an "unsupported-api-version" problem. type is a stable,
        documented identifier a client dispatches on — the twelve values
        in its enum below are every class this coordinator currently
        produces, and this list is the single source of truth for that
        set. It is deliberately not a fetchable URI: nothing in this API
        or its tests dereferences it over the network.


        Four of the twelve are ADR-024: "forbidden" (401 means no valid
        credential, this means authenticated but missing a scope — the
        detail text names the missing scope), "csrf-rejected" (a
        cookie-authenticated write with no `Sec-Fetch-Site: same-origin`
        header, decision 6), "too-many-requests" (decision 8's login
        concurrency bound, paired with a `Retry-After` response header),
        and "credential-in-url" (decision 1: a request whose query string
        carried a credential). One is "conflict": the request is valid but
        this coordinator's current state makes it unsafe or meaningless to
        act on right now — shared by `PUT /config/fpp.endpoints` (Step 7
        seam A, refused because `SHOWMESH_FPP_ENDPOINTS` is still set in
        the coordinator's own environment, RES-008 D1),
        `POST /discovery/runs` (Step 7 seam B, refused while a run is
        already in progress), and a `commands` idempotency key reused
        against a different action or target (Step 7 seam C) — `detail`
        names which.
      required: [type, title, status, detail, serverTime]
      properties:
        type:
          type: string
          format: uri
          enum:
            - https://showmesh.dev/problems/unsupported-api-version
            - https://showmesh.dev/problems/resource-not-found
            - https://showmesh.dev/problems/invalid-parameter
            - https://showmesh.dev/problems/unauthorized
            - https://showmesh.dev/problems/method-not-allowed
            - https://showmesh.dev/problems/internal-error
            - https://showmesh.dev/problems/forbidden
            - https://showmesh.dev/problems/csrf-rejected
            - https://showmesh.dev/problems/too-many-requests
            - https://showmesh.dev/problems/credential-in-url
            - https://showmesh.dev/problems/conflict
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        serverTime:
          type: string
          format: date-time
        supportedVersions:
          type: array
          items:
            type: integer
    StreamStart:
      type: object
      description: The payload of the first event on every SSE connection.
      required: [streamId, apiVersion, serverTime, snapshotRequired]
      properties:
        streamId:
          type: string
        apiVersion:
          type: integer
        serverTime:
          type: string
          format: date-time
        snapshotRequired:
          type: boolean
          const: true
    StreamReset:
      type: object
      description: >-
        The payload of a stream.reset event: either an overflowed
        subscriber buffer (reason "subscriber_too_slow", after which the
        connection is closed) or any other condition making the client's
        local model unsafe to keep applying deltas to.
      required: [seq, serverTime, reason, snapshotRequired]
      properties:
        seq:
          type: integer
          description: Per-connection only; never a durable cursor.
        serverTime:
          type: string
          format: date-time
        reason:
          type: string
        snapshotRequired:
          type: boolean
          const: true
    NodeChangedEvent:
      type: object
      required: [seq, serverTime, node]
      properties:
        seq:
          type: integer
        serverTime:
          type: string
          format: date-time
        node:
          $ref: "#/components/schemas/Node"
    FPPChangedEvent:
      type: object
      required: [seq, serverTime, instance]
      properties:
        seq:
          type: integer
        serverTime:
          type: string
          format: date-time
        instance:
          $ref: "#/components/schemas/FPPInstance"
    EventRecordedEvent:
      type: object
      required: [seq, serverTime, event]
      properties:
        seq:
          type: integer
        serverTime:
          type: string
          format: date-time
        event:
          $ref: "#/components/schemas/Event"
    FPPObservationsChangedEvent:
      type: object
      description: >-
        The payload of an `fpp.observations.changed` event (ADR-023),
        delivered only to a connection that opted into delta frames via
        `GET /stream?deltas=1`. `changed` is never null and carries the
        full `Evidence` envelope — exactly the shape an element of
        `FPPInstance.observations` would have — for every signal on this
        instance whose resolved evidence differs from what this connection
        has already been told; it never repeats a signal whose resolved
        evidence is unchanged from last time. `removed` is never null and
        carries the signal IDs (bare strings, not `Evidence` envelopes) of
        every observation this connection has previously been told about
        for this instance that no longer exists at all — a cape swapped
        for a smaller one, a renamed port, a sensor that stopped being
        reported. A client applying `removed` MUST delete those signals
        from its own merged baseline; without that, the baseline
        accumulates observations the coordinator no longer has. At least
        one of `changed`/`removed` is always non-empty: an instance with
        nothing to report this render pass produces no
        `fpp.observations.changed` event at all. This event is always
        paired with `instanceId`, unlike `FPPChangedEvent`, which nests
        its instance identity inside `instance` — an observations-only
        delta has no full instance object to carry it in otherwise.
        Structural, non-observation changes to an instance (health,
        endpoint, lastPollAt, lastPollError) continue to arrive as
        `fpp.changed` for a delta-subscribed connection too — this event
        exists only for a change confined to `observations`.
      required: [seq, serverTime, instanceId, changed, removed]
      properties:
        seq:
          type: integer
          description: Per-connection only; never a durable cursor.
        serverTime:
          type: string
          format: date-time
        instanceId:
          type: string
        changed:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        removed:
          type: array
          items:
            type: string
