        payload:
          $ref: "#/components/schemas/ConfigShowModePayload"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
        resolumeWebSocketEffect:
          type: string
          description: >-
            What the CURRENT mode does to the only behaviour that reads the
            mode in this build: the Resolume WebSocket footprint switch
            (ADR-033 decision 2), held open in `program` and closed in
            `show`. Names the mode as the reason, which is ADR-033 decision
            3's requirement that a behaviour caused by the mode says so
            where the operator can see it. Always non-empty.
    ConfigAudioSettingsPayload:
      type: object
      description: >-
        The "audio.settings" configuration kind's decoded payload (ADR-039): the
        body PUT /config/audio.settings accepts (a
        full replacement - every field required and non-null), and the
        "payload" member of GET /config/audio.settings' response.
        `driftIgnoreThresholdMs` has never been measured against real
        playback; its default is a starting point, not a tuned value.
        `defaultFadeCurve` must be a member of the audio engine's own
        closed fade-curve vocabulary (only "linear" ships today).
        `defaultMaxBackgroundGainDb` is in DECIBELS - `0` is unity gain,
        `+12` is the most accepted - applied as the default ceiling on a
        background bed.
        `duckTargetGainDb` is how far a node lowers a session while a
        higher-priority session ducks it (an announcement over a resting
        background bed), also in decibels: it must be negative and at
        least `-60`, where `-60` is full silence, and `0` or louder is
        refused because it would not duck anything. Both are converted to
        the engine's linear amplitude multiplier once, at the
        coordinator's own boundary, before anything reaches a node. The
        pre-decibel `defaultMaxBackgroundGain` and `duckTargetGain` are
        refused by name, each naming its replacement, because the two
        units share a number range.
        THE SHIPPED VALUE IS PROVISIONAL: it has never been
        heard on the installation's speakers, and the owner picks the
        real one by ear (RES-007). A muted session is unaffected;
        mute silences unconditionally.
        `ltcFrameRate` is the closed vocabulary Resolume's timecode input
        supports; this ships non-drop-frame at every rate because
        Resolume's drop-frame expectation at 29.97 is unresearched
        (RES-001 §9) - an explicit ruling, not a silent default.
        `ltcDefaultStartOffset` (HH:MM:SS:FF) is a session's LTC start
        point when its own audio.session.apply carries no override.
      required:
        [driftIgnoreThresholdMs, defaultFadeCurve, defaultFadeDurationMs,
         defaultMaxBackgroundGainDb, duckTargetGainDb, ltcFrameRate,
         ltcDefaultStartOffset]
      properties:
        driftIgnoreThresholdMs:
          type: integer
        defaultFadeCurve:
          type: string
          enum: [linear]
        defaultFadeDurationMs:
          type: integer
        defaultMaxBackgroundGainDb:
          type: number
          minimum: -60
          maximum: 12
          description: >-
            Decibels. 0 dB is unity gain; +12 dB is the typo guard, not a
            tuned headroom figure. -60 dB is the same silence floor
            duckTargetGainDb bounds against.
        duckTargetGainDb:
          type: number
          minimum: -60
          exclusiveMaximum: 0
          description: >-
            Decibels a ducked session is driven to. Must be negative;
            -60 dB is silence. Provisional value, not measured.
        ltcFrameRate:
          type: string
          enum: ["24", "25", "29.97", "30"]
        ltcDefaultStartOffset:
          type: string
          description: HH:MM:SS:FF, non-drop-frame.
