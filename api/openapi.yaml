      operationId: putShowModeConfig
      summary: Set the installation-wide operating mode (ADR-033)
      description: >-
        Requires `config:write` (admin only). A full replacement: `mode` is
        required and non-null on every write, so an absent key is refused
        by name rather than silently defaulting or carrying the old value
        forward. On success, appends a new immutable revision and activates
        it in the SAME transaction as its audit log entry (ADR-024 decision
        11). A cookie-authenticated request additionally requires
        `Sec-Fetch-Site: same-origin` (ADR-024 decision 6); a
        bearer-token-authenticated request is exempt.


        The mode changes what the system DOES, never who may do it (ADR-033
        decision 6), and it gates no command path anywhere: no mode may
        refuse, delay, or degrade blackout, stop, or power-off (ADR-033
        decision 4).


        Applies without a restart, in both directions (ADR-036): entering
        `show` closes the Resolume WebSocket wake-up channel and returning
        to `program` reopens it.
