      required: [integration]
      properties:
        integration:
          type: string
          enum: [fpp, mqtt, resolume, audio]
        instanceId:
          type: string
          minLength: 1
        primitive:
          type: string
          minLength: 1
        params:
          type: object
          additionalProperties: true
        broker:
          type: string
          minLength: 1
        publish:
          $ref: "#/components/schemas/ConfigShowActionMQTTPublishWrite"
        expect:
          $ref: "#/components/schemas/ConfigShowActionMQTTExpect"
        action:
          type: string
          minLength: 1
        ref:
          type: object
          additionalProperties: true
        audioNodeId:
          type: string
          minLength: 1
        audioSessionId:
          type: string
          minLength: 1
        audioAction:
          type: string
          minLength: 1
