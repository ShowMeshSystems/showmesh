            - https://showmesh.dev/problems/show-config-steps-too-many
            - https://showmesh.dev/problems/show-config-step-id-duplicate
            - https://showmesh.dev/problems/show-config-field-unknown-key
            - https://showmesh.dev/problems/show-config-calendar-field-rejected
            - https://showmesh.dev/problems/show-config-duplicate-rest-duration
