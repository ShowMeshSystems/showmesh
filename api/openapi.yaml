          type: string
          format: date-time
        revision:
          type: integer
        activatedAt:
          type: string
          format: date-time
        composition:
          $ref: "#/components/schemas/ResolumeCompositionSummary"
    ResolumeCompositionLayerGroup:
      type: object
      description: >-
        One element of ResolumeCompositionResponse.layerGroups. index is
        the group's position among the file's own <Group> elements in
        document order, which is what
        ResolumeCompositionLayer.layerGroupIndex refers to.
      required: [id, index]
      properties:
        id:
          type: string
        index:
          type: integer
    ResolumeCompositionLayer:
      type: object
      description: >-
        One element of ResolumeCompositionResponse.layers, deck-independent
        (ADR-032 decision 6 - only a clip's resolution depends on its deck
        being selected). layerGroupIndex is absent from the wire entirely,
        never sent as null, when the composition has no layer groups at
        all. When present, it is the layer's own layerGroup value taken
        as-is from the uploaded composition file - NOT validated to be
        within [0, layerGroups.length). A client that wants an actual
        layerGroups element must bounds-check this value itself before
        indexing with it. name is never blank (ADR-037 decisions 4 and 7):
        it is the operator's own value from the composition file when one
        exists, or a generated positional label ("Layer <n>") when it does
        not, and nameGenerated says which - a blank cell is never sent in
        its place.
      required: [id, index, name, nameGenerated]
      properties:
        id:
          type: string
        index:
          type: integer
        layerGroupIndex:
          type: integer
        name:
          type: string
        nameGenerated:
          type: boolean
    ResolumeCompositionColumn:
      type: object
      description: >-
        One column position within one deck. name/nameGenerated are
        ADR-037 decision 4: columns never carry an authored name at all
        (the .avc format gives them none), so nameGenerated is always
        true and name is always the generated "Column <n>" form from
        index - carried anyway so every kind's response shares the
        identical (name, nameGenerated) shape.
      required: [id, deckId, index, name, nameGenerated]
      properties:
        id:
          type: string
        deckId:
          type: string
        index:
          type: integer
        name:
          type: string
        nameGenerated:
          type: boolean
    ResolumeCompositionClip:
      type: object
      description: >-
        One clip in the stored id map. Every element of "clips" carries
        deckId: a Resolume clip id resolves over Resolume's own API only
        while its own deck is selected (ADR-032 decision 6), so a clip
        reference without its deck cannot tell a stale id from an
        unselected deck. Elements of "persistentClips" carry no deckId at
        all (absent from the wire, never sent as an empty string) - they
        live outside any deck and resolve regardless of selection.
        transportTypeIndex is a raw index with no label to resolve it
        against - absent when the clip carries no TransportType param, and
        never translated to a name. name/nameGenerated are ADR-037
        decision 4: name is the clip's own authored name when non-empty,
        otherwise a generated form - "Clip L<layerIndex+1>C<columnIndex+1>"
        for a deck clip, "Persistent clip <n>" (1-based position among
        "persistentClips") for a persistent one. ambiguous (amendment,
        2026-08-16) is true when this clip's own (deck-or-persistent,
        layer, label) triple is shared by another clip in this
        composition, meaning no reference - including one naming this
        clip's own layer - can ever resolve it; the remedy is renaming one
        of the colliding clips in Resolume and re-uploading.
      required: [id, layerIndex, columnIndex, name, nameGenerated, ambiguous]
      properties:
        id:
          type: string
        deckId:
          type: string
        layerIndex:
          type: integer
        columnIndex:
          type: integer
        name:
          type: string
        nameGenerated:
          type: boolean
        ambiguous:
          type: boolean
        transportTypeIndex:
          type: integer
        sourcePath:
          type: string
        width:
          type: integer
        height:
          type: integer
    ResolumeCompositionResponse:
      type: object
      description: >-
        The body of GET /config/resolume/composition: the stored
        composition's own summary plus the full id map every ShowMesh
        reference to a Resolume object resolves through (ADR-032 decision
        1).
      required:
        [serverTime, revision, activatedAt, composition, decks,
         layerGroups, layers, columns, clips, persistentClips]
      properties:
        serverTime:
          type: string
          format: date-time
        revision:
          type: integer
        activatedAt:
          type: string
          format: date-time
        composition:
          $ref: "#/components/schemas/ResolumeCompositionSummary"
        decks:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionDeckSummary"
        layerGroups:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionLayerGroup"
        layers:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionLayer"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionColumn"
        clips:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionClip"
        persistentClips:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionClip"
    ResolumeActionParam:
      type: object
      description: >-
        One named parameter one Resolume action's "params" object accepts.
        ADR-037 gave this vocabulary its first optional parameters
        (launchClip's "layer" and "persistent", and its conditionally
        required "deck") - required: false means the parameter may be
        absent, never that an absent value is silently defaulted; there is
        still no `default` member here the way FPPCommandRequest's variant
        schemas have for some of their own parameters, because what an
        absence means is a resolution rule the caller applies, not a
        decode-time default.
      required: [name, kind, required]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [string, bool, number]
        required:
          type: boolean
    ResolumeAction:
      type: object
      description: >-
        One entry of the fixed seven-action vocabulary GET /resolume/actions
        returns. auditExempt mirrors ADR-024 decision 11's safety class:
        true only for `blackout` and `clearLayer`. coordinatorRequired is
        `true` for every entry today - the Resolume adapter is coordinator-
        hosted and Resolume holds no local fallback - carried on the wire
        so a macro author never has to know that out of band.
      required: [name, params, auditExempt, coordinatorRequired]
      properties:
        name:
          type: string
          enum:
            [launchClip, clearLayer, blackout, launchColumn, selectDeck,
             setLayerBypass, setLayerMaster]
        params:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeActionParam"
        auditExempt:
          type: boolean
        coordinatorRequired:
          type: boolean
    ResolumeActionsResponse:
      type: object
      description: The body of GET /resolume/actions.
      required: [serverTime, actions]
      properties:
        serverTime:
          type: string
          format: date-time
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeAction"
    ResolumeActionRequest:
      description: >-
        The body of POST /resolume/actions - a discriminated union on
        `action`, matching FPPCommandRequest's own shape (Step 7/8) for the
        identical reason: a bare, propertyless `params` object would let a
        generated client build a request this coordinator always rejects.
        Every variant's `idempotencyKey` is required (ARCHITECTURE section
        8.1) and scoped to the exact (action, normalized params) pair it
        is first used against - reusing it against the SAME action and the
        SAME normalized params is a replay; reusing it against a DIFFERENT
        action or DIFFERENT params is a `409` conflict, refused outright.
        There is no `instanceId` the way FPPCommandRequest has one: this
        coordinator dispatches against exactly one configured Resolume
        adapter. ADR-037: every reference below is a NAME, resolved
        against the stored composition - a raw Resolume object id is never
        accepted anywhere in this union, and a request that still sends
        one is refused as an unrecognized parameter.
      discriminator:
        propertyName: action
        mapping:
          launchClip: "#/components/schemas/ResolumeLaunchClipActionRequest"
          clearLayer: "#/components/schemas/ResolumeClearLayerActionRequest"
          launchColumn: "#/components/schemas/ResolumeLaunchColumnActionRequest"
          selectDeck: "#/components/schemas/ResolumeSelectDeckActionRequest"
          blackout: "#/components/schemas/ResolumeBlackoutActionRequest"
          setLayerBypass: "#/components/schemas/ResolumeSetLayerBypassActionRequest"
          setLayerMaster: "#/components/schemas/ResolumeSetLayerMasterActionRequest"
      oneOf:
        - $ref: "#/components/schemas/ResolumeLaunchClipActionRequest"
        - $ref: "#/components/schemas/ResolumeClearLayerActionRequest"
        - $ref: "#/components/schemas/ResolumeLaunchColumnActionRequest"
        - $ref: "#/components/schemas/ResolumeSelectDeckActionRequest"
        - $ref: "#/components/schemas/ResolumeBlackoutActionRequest"
        - $ref: "#/components/schemas/ResolumeSetLayerBypassActionRequest"
        - $ref: "#/components/schemas/ResolumeSetLayerMasterActionRequest"
    ResolumeLaunchClipActionRequest:
      type: object
      description: >-
        `action: "launchClip"`: launches (connects) a clip named by
        `params.clip`, scoped to exactly one of `params.deck` (a deck
        clip) or `params.persistent: true` (a persistent clip, which lives
        outside any deck and carries no `deck`) - `params` below encodes
        that exclusivity structurally, so a client generated from this
        contract never constructs the other shapes. A coordinator that
        receives one anyway (neither or both) does not reject it with
        `400`: it answers `200` with `result.outcome: "refused"`, exactly
        like any other unresolvable reference - see
        ResolumeActionResult.outcome. `params.layer` disambiguates a clip
        name that occurs more than once; when it does not match any
        candidate the candidate set narrows to zero, never falling back to
        the unfiltered set. A clip reference whose own deck is not
        currently selected is refused with `200` and
        `result.outcome: "refused"` too (never a stale-reference error and
        never a silent deck change).
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: launchClip
        idempotencyKey:
          type: string
        params:
          type: object
          required: [clip]
          additionalProperties: false
          properties:
            clip:
              type: string
              minLength: 1
              description: The clip's own label - its authored name, or its generated form if unnamed.
            deck:
              type: string
              minLength: 1
              description: >-
                The deck this clip lives on. Required unless `persistent`
                is `true`; must be absent when `persistent` is `true`.
            layer:
              type: string
              minLength: 1
              description: Disambiguates a clip name that occurs more than once. Never required.
            persistent:
              type: boolean
              description: >-
                True when `clip` names a persistent clip (no `deck`
                allowed). Absent or false means a deck clip, and `deck`
                is then required.
          oneOf:
            - required: [deck]
              not:
                required: [persistent]
            - required: [persistent]
              not:
                required: [deck]
    ResolumeClearLayerActionRequest:
      type: object
      description: '`action: "clearLayer"`: clears (disconnects) a layer''s active clip, named by `params.layer`.'
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: clearLayer
        idempotencyKey:
          type: string
        params:
          type: object
          required: [layer]
          additionalProperties: false
          properties:
            layer:
              type: string
              minLength: 1
              description: The layer's own label - its authored name, or its generated form if unnamed.
    ResolumeLaunchColumnActionRequest:
      type: object
      description: '`action: "launchColumn"`: launches (connects) a column named by `params.column`, on the deck named by `params.deck`.'
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: launchColumn
        idempotencyKey:
          type: string
        params:
          type: object
          required: [column, deck]
          additionalProperties: false
          properties:
            column:
              type: string
              minLength: 1
              description: The column's own generated label - columns never carry an authored name.
            deck:
              type: string
              minLength: 1
              description: The deck this column lives on. Always required.
    ResolumeSelectDeckActionRequest:
      type: object
      description: '`action: "selectDeck"`: selects the deck named by `params.deck`.'
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: selectDeck
        idempotencyKey:
          type: string
        params:
          type: object
          required: [deck]
          additionalProperties: false
          properties:
            deck:
              type: string
              minLength: 1
              description: The deck's own label - its authored name, or its generated form if unnamed.
    ResolumeBlackoutActionRequest:
      type: object
      description: >-
        `action: "blackout"`: disconnects every tracked layer. Exempt from
        ADR-024 decision 11's fail-closed audit rule.
      required: [action, idempotencyKey]
      properties:
        action:
          type: string
          const: blackout
        idempotencyKey:
          type: string
        params:
          type: object
          description: This action takes no parameters - a non-empty params object is a 400.
          additionalProperties: false
    ResolumeSetLayerBypassActionRequest:
      type: object
      description: '`action: "setLayerBypass"`: sets a layer''s bypass state.'
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: setLayerBypass
        idempotencyKey:
          type: string
        params:
          type: object
          required: [layer, bypassed]
          additionalProperties: false
          properties:
            layer:
              type: string
              minLength: 1
              description: The layer's own label - its authored name, or its generated form if unnamed.
            bypassed:
              type: boolean
    ResolumeSetLayerMasterActionRequest:
      type: object
      description: >-
        `action: "setLayerMaster"`: sets a layer's master to a continuous
        value. Validated server-side against Arena's own declared range for
        THIS layer's master parameter (RangeParameter min/max, read fresh
        off the pre-dispatch baseline) rather than a fixed [0, 1] - an
        out-of-range request is refused with the declared bound stated,
        never silently clamped.
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: setLayerMaster
        idempotencyKey:
          type: string
        params:
          type: object
          required: [layer, master]
          additionalProperties: false
          properties:
            layer:
              type: string
              minLength: 1
              description: The layer's own label - its authored name, or its generated form if unnamed.
            master:
              type: number
              description: >-
                The requested master value. Commonly [0, 1] but validated
                against the layer's own declared range, not assumed.
    ResolumeActionResponse:
      type: object
      description: The body of a successful (200) response from POST /resolume/actions.
      required: [serverTime, result]
      properties:
        serverTime:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/ResolumeActionResult"
    ResolumeActionResult:
      type: object
      description: >-
        What happened to one dispatched (or replayed) action. outcome is
        never inferred from this endpoint's own `200` status - it is
        exactly one of the six values in its enum below, and a `200` is
        sent for every one of them, including "refused" and "failed": this
        endpoint reports honestly what happened rather than using the HTTP
        status to editorialize about the answer.
      required:
        [id, idempotencyKey, action, params, replay, outcome, outcomeReason,
         attributionDegraded, dispatchedAt, resolvedAt, selectedDeckChanged]
      properties:
        id:
          type: string
        idempotencyKey:
          type: string
        action:
          type: string
        params:
          type: object
          additionalProperties: true
          description: This action's own normalized parameters - defaults applied, never omitted or null.
        replay:
          type: boolean
          description: >-
            True when this response answers a REPLAYED idempotency key: the
            action described here was NOT dispatched by this request.
        outcome:
          type: string
          enum: ["confirmed", "unconfirmed", "unconfirmable", "refused", "failed", ""]
          description: >-
            "confirmed": the effect was observed on evidence collected
            strictly after dispatch. "unconfirmed": this action's own
            derived confirmation deadline expired first. "unconfirmable":
            dispatched, but its own effect could not be told apart from
            its pre-dispatch state (e.g. launching an already-playing
            clip) - never treated as success. "refused": refused before
            dispatch (a clip's deck was not selected, the composition
            identity was unknown, or a non-exempt action's audit write
            failed) - no request ever reached Resolume. "failed": dispatch
            was attempted and the attempt itself failed. Empty only for a
            REPLAY response returned before the original request's own
            dispatch/confirmation has finished - a real, honest value
            (ADR-020's absence-is-stated rule), matching
            FPPCommandResult.outcome's identical narrow case exactly. A
            coordinator restart can no longer make this PERMANENT: any
            Resolume command row still unresolved at startup is resolved by
            a startup reconciliation pass (mirroring
            FPPCommandResult.outcomeReason's own note on
            ReconcileStrandedFPPCommands) before it can ever reach a client
            in that state.
        outcomeReason:
          type: string
          description: >-
            A short, human-readable explanation. Non-empty for every
            resolved result, including "confirmed" - the only value for
            which it may be empty is the identical narrow replay race
            `outcome`'s own description names.
        attributionDegraded:
          type: boolean
          description: >-
            True when this action's dispatch or outcome audit entry could
            not be written - the `blackout`/`clearLayer` safety-class
            exemption proceeding anyway with a degraded, stderr-only
            attribution record.
        dispatchedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Null only when this action was refused before dispatch was
            ever attempted, or in the narrow accepted replay race
            `replay`'s own description names.
        resolvedAt:
          type: [string, "null"]
          format: date-time
        resolvedId:
          type: string
          description: >-
            The Resolume object id this action's own name reference
            resolved to, kept visible for debugging (ADR-037 removes the
            id from what an operator types, not from the record). Absent
            for `blackout`, which addresses nothing, and for a refusal
            reached before any name was resolved.
        selectedDeckChanged:
          type: [boolean, "null"]
          description: >-
            Whether the selected deck changed between this action's
            decision and its confirmation. Meaningful only for a confirmed
            `launchClip` (the only action that can race a deck - layers
            are deck-independent). ALWAYS present; null, never false, both
            when the deck could not be read at confirmation time and for
            every action other than a confirmed launchClip. Evidence, never
            a refusal.
    ResolumeRecoveryRecordEntry:
      type: object
      description: >-
        One layer's row in the crash-recovery record (Track D seam D-3a).
        Every object reference is a name (ADR-037), never an id. clip,
        clipNameGenerated, and deck are absent when state is not "clip".
        establishedAt and source are absent only when no record has ever
        been established for this layer at all (state "unknown", reason
        "never observed"). reason is always present when state is
        "unknown".
      required: [layer, layerNameGenerated, state]
      properties:
        layer:
          type: string
        layerNameGenerated:
          type: boolean
        state:
          type: string
          enum: ["clip", "dark", "unknown"]
        clip:
          type: string
        clipNameGenerated:
          type: boolean
        deck:
          type: string
        establishedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: ["action", "survey"]
        reason:
          type: string
    ResolumeRecoveryRestoreLayer:
      type: object
      description: >-
        One layer's own outcome within a restore (Track D seam D-3a).
        reason is always present on "skipped" and "failed", always absent
        on "restored". clip is present only when this layer had a
        clip-state target. actionOutcome is present only when a D-3
        dispatch was actually issued for this layer.
      required: [layer, layerNameGenerated, result]
      properties:
        layer:
          type: string
        layerNameGenerated:
          type: boolean
        result:
          type: string
          enum: ["restored", "skipped", "failed"]
        reason:
          type: string
        clip:
          type: string
        actionOutcome:
          type: string
          enum: ["confirmed", "unconfirmed", "unconfirmable", "failed", "refused"]
    ResolumeRecoveryRestoreReport:
      type: object
      description: One restore's whole outcome (Track D seam D-3a).
      required: [startedAt, finishedAt, trigger, outcome, principal, layers, omittedLayerCount]
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        trigger:
          type: string
          enum: ["automatic", "manual"]
        outcome:
          type: string
          enum: ["restored", "partial", "nothing_to_do", "failed"]
        principal:
          type: string
        layers:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeRecoveryRestoreLayer"
        omittedLayerCount:
          type: integer
          description: >-
            Nonzero when the composition had more layers than one restore
            attempts: the excess layers were never attempted and do not
            appear in layers. Zero means nothing was omitted. Run the
            restore again to continue.
    ResolumeRecoveryResponse:
      type: object
      description: >-
        The body of GET /resolume/recovery (Track D seam D-3a): the
        auto-restore toggle, the recovery record, and the last restore.
        lastRestore is null until a restore has run.
      required:
        [serverTime, resolumeConfigured, autoRestoreEnabled, autoRestoreConfigured,
         settleDelaySeconds, record, lastRestore]
      properties:
        serverTime:
          type: string
          format: date-time
        resolumeConfigured:
          type: boolean
          description: >-
            False when this coordinator has no Resolume instance configured
            at all (SHOWMESH_RESOLUME_URL unset) - distinct from
            autoRestoreConfigured, which is about whether the toggle has a
            stored value. A client renders "not configured" rather than the
            toggle's default-ON value when this is false: an operator who
            believes recovery is armed and is wrong is worse off than one
            who knows it is unavailable.
        autoRestoreEnabled:
          type: boolean
        autoRestoreConfigured:
          type: boolean
          description: False when autoRestoreEnabled is the built-in default rather than a stored choice.
        settleDelaySeconds:
          type: number
        record:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeRecoveryRecordEntry"
        lastRestore:
          oneOf:
            - $ref: "#/components/schemas/ResolumeRecoveryRestoreReport"
            - type: "null"
    ResolumeRecoveryRestoreResponse:
      type: object
      description: The body of a successful POST /resolume/recovery/restore.
      required: [serverTime, restore]
      properties:
        serverTime:
          type: string
          format: date-time
        restore:
          $ref: "#/components/schemas/ResolumeRecoveryRestoreReport"
    ResolumeRecoveryChangedEvent:
      type: object
      description: >-
        The payload of a "resolumeRecovery.changed" SSE event (Track D seam
        D-3a): the resource's own rendered wire representation, minus
        serverTime (stamped separately, alongside seq, at broadcast time).
        No delta event kind exists for this resource, matching
        resolume.changed's own posture.
      required:
        [seq, serverTime, resolumeConfigured, autoRestoreEnabled,
         autoRestoreConfigured, settleDelaySeconds, record, lastRestore]
      properties:
        seq:
          type: integer
          description: Per-connection only; never a durable cursor.
        serverTime:
          type: string
          format: date-time
        resolumeConfigured:
          type: boolean
          description: >-
            False when this coordinator has no Resolume instance configured
            at all (SHOWMESH_RESOLUME_URL unset) - distinct from
            autoRestoreConfigured, which is about whether the toggle has a
            stored value. A client renders "not configured" rather than the
            toggle's default-ON value when this is false: an operator who
            believes recovery is armed and is wrong is worse off than one
            who knows it is unavailable.
        autoRestoreEnabled:
          type: boolean
        autoRestoreConfigured:
          type: boolean
          description: False when autoRestoreEnabled is the built-in default rather than a stored choice.
        settleDelaySeconds:
          type: number
        record:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeRecoveryRecordEntry"
        lastRestore:
          oneOf:
            - $ref: "#/components/schemas/ResolumeRecoveryRestoreReport"
            - type: "null"
    ConfigResolumeRecoveryPayload:
      type: object
      description: >-
        The "resolume.recovery" configuration kind's decoded payload
        (Track D seam D-3a): the body PUT /config/resolume.recovery
        accepts, and the "payload" member of GET /config/resolume.recovery's
        response. One boolean, no other keys.
      required: [autoRestoreEnabled]
      properties:
        autoRestoreEnabled:
          type: boolean
    ResolumeRecoveryConfigResponse:
      type: object
      description: The body of GET and PUT /config/resolume.recovery.
      required:
        [serverTime, kind, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigResolumeRecoveryPayload"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
    ConfigRenderRestartPolicy:
      type: object
      description: >-
        render.settings.restartPolicy (Track B seam B2c): the render
        pipeline supervisor's bounded exponential backoff - must not restart
        a pipeline that fails identically and immediately forever.
      required: [initialDelaySeconds, maxDelaySeconds, maxConsecutiveFastFailures]
      properties:
        initialDelaySeconds:
          type: integer
