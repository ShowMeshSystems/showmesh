      summary: Re-resolve one show.action's stored target (Track E seam E7-2, ADR-029)
      description: >-
        Never gated by any scope (ADR-024: reads stay open by default) and
        never dispatches anything. Re-resolves `id`'s CURRENTLY STORED
        target against whatever the relevant integration reports right
        now, through the same resolver/registry/broker-list write-time
        validation already uses. `binding.state` is three-valued and
        `unknown` is not a soft `ok`: it means the check could not be
        performed at all (no Resolume composition uploaded, or a stored
        payload this coordinator cannot decode), never that the target
        was found broken.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionBindingResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /actions/bindings:
    get:
      operationId: listActionBindings
      summary: Re-resolve every show.action's stored target (Track E seam E7-2)
      description: >-
        The pre-show sweep: every show.action's own binding check, in one
        request. Never gated by any scope. `show`, when given, narrows the
        result to that show; a show id matching nothing returns an empty
        list, never a refusal - see `?show=` on `GET /config/show.action`.
      parameters:
        - name: show
          in: query
          required: false
          schema:
            type: string
