      summary: The installation-wide operating mode (ADR-033)
      description: >-
        The one mode value for this installation: `program` or `show`. Not
        per-node, not per-device, and never a per-subsystem flag.


        Requires `observation:read`, and this is a DELIBERATE DEPARTURE
        from every other configuration singleton, all of which gate even
        their `GET` on `config:write`. ADR-033 decision 3 requires the mode
        to be persistently visible in the Operator UI and reported by
        `showmeshctl`; the operator standing at the console during a show
        holds `observation:read` and `show:macro:run`, not `config:write`,
        and an indicator only an admin can see is not persistent
        visibility. `observation:read` is the narrowest existing scope
        every signed-in role already holds - no new scope is minted for
        this. `GET /config/show.mode/revisions` keeps the ordinary
        `config:write` gate, and the `PUT` is unchanged from every other
        kind.


        Never `404`s: the payload has a well-defined default, reported with
        `revision` `0` and `source` `"default"` when nothing has ever been
        written. That default is `program`, because a fresh install is by
        definition being set up. It is NOT the same thing as ADR-033
        decision 5's `unknown`: `unknown` means a NODE could not read the
        mode at all, behaves as `show`, and never appears in this payload.
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowModeConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
