      description: >-
        The "fppconnect.settings" configuration kind's decoded payload
        (ADR-044 decision 5): the body PUT /config/fppconnect.settings
        accepts (a full replacement - every field required and non-null),
        and the "payload" member of GET /config/fppconnect.settings'
        response. `enabled` gates the node's unauthenticated xLights
        ingestion listener. `maxFileBytes` is the per-file byte cap on one
        ingested upload; `maxAssetDirBytes` is the total byte cap on the
        node's asset directory and must be at least `maxFileBytes` - a
        cap smaller than the per-file cap would refuse every upload
        unconditionally. Defaults: `enabled` true (a builder default, not
        an owner ruling), `maxFileBytes` 2147483648 (2 GiB),
        `maxAssetDirBytes` 21474836480 (20 GiB).
      required: [enabled, maxFileBytes, maxAssetDirBytes]
      properties:
        enabled:
          type: boolean
        maxFileBytes:
          type: integer
          description: Always at least 1.
        maxAssetDirBytes:
          type: integer
          description: Always at least 1, and always at least maxFileBytes.
    FPPConnectSettingsConfigResponse:
      type: object
