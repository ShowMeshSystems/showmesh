                $ref: "#/components/schemas/ShowMacroConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putShowMacro
      summary: Write a new show.macro revision (Step 9)
      description: >-
        Requires `config:write` (admin only). `steps` is required, must
        contain 1-32 entries, each `id` unique, each `action` resolving to
        an existing `show.action` object. Two keys in this payload default
        when absent, and reject a present `null` as invalid: the
        top-level `description` (defaults to empty, i.e. no description)
        and each step's `onFailure` (default `continue`) /
        `onUnconfirmed` (default `continue`). Both default to `continue`
        because a macro run always runs every step (owner decision
        2026-08-14); they remain two independent fields, and `abort` is
        available on either as an explicit per-step choice. `localFallback.class` is required per step
        (`none` | `coordinator-required` | `silence`); `reduced` is
        rejected with its own distinct problem type. The request body is
        therefore ConfigShowMacroWrite, not ConfigShowMacro: the latter is
        the strict, always-resolved shape this endpoint reads back. Stores
        the VALIDATED, NORMALIZED payload — including description and
        onFailure/onUnconfirmed resolved to their defaults — never the raw
        request body.
