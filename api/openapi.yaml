          type: string
        label:
          type: string
        show:
          type: string
        state:
          type: string
          enum: [ok, broken, unknown]
          description: >-
            "ok": the target resolved, unambiguously, against current
            integration state. "broken": the target did not resolve, or
            resolved ambiguously. "unknown": the check could not be
            performed at all - never a soft "ok", and never reported as
            "broken" for a check this coordinator simply could not run.
        reason:
          type: string
    ActionBindingResponse:
      type: object
      description: The body of GET /actions/{id}/binding.
      required: [serverTime, binding]
      properties:
        serverTime:
          type: string
          format: date-time
        binding:
          $ref: "#/components/schemas/ActionBinding"
    ActionBindingsResponse:
      type: object
      description: The body of GET /actions/bindings.
      required: [serverTime, bindings]
      properties:
        serverTime:
          type: string
          format: date-time
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/ActionBinding"
    ActionInvocationRequest:
      type: object
      description: >-
        The body of POST /actions/{id}/invocations. idempotencyKey is
        required. requestedRevision optionally pins the exact show.action
        revision to execute: a durable/queued caller (e.g. a
        Track F cue) should always set it, so activating a newer revision
        after the cue was queued never changes what runs; an interactive
        caller may omit it to mean "whichever revision is active right
        now" - the response's revision field always states which
        revision actually ran.
      required: [idempotencyKey]
      properties:
        idempotencyKey:
          type: string
        requestedRevision:
          type: integer
          format: int64
          minimum: 1
    ActionInvocationResult:
      type: object
      description: >-
        One invoked (or replayed) action's lifecycle and, once resolved,
        its outcome against this API's shared five-word outcome
        vocabulary - the same one ResolumeActionResult.outcome uses.
      required:
        [id, idempotencyKey, actionId, revision, replay, state, outcome,
         outcomeReason, dispatchAttribution, dispatchAttributionReason,
         outcomeAttribution, outcomeAttributionReason,
         attributionDegraded, dispatchedAt, resolvedAt]
      properties:
        id:
          type: string
        idempotencyKey:
          type: string
        actionId:
          type: string
        revision:
          type: integer
          format: int64
          description: The show.action revision that actually executed.
        label:
          type: string
        replay:
          type: boolean
          description: >-
            True when this response answers a REPLAYED idempotency key:
            nothing was dispatched by this request.
        state:
          type: string
          enum: ["pending", "resolved"]
          description: >-
            This invocation's own lifecycle. "pending" means it has not
            yet resolved - either a replay observed mid-flight, or this
            coordinator's own outcome could not be durably recorded yet
            (ADR-003).
        outcome:
          type: [string, "null"]
          enum: ["confirmed", "unconfirmed", "unconfirmable", "refused", "failed", null]
          description: >-
            null while state is "pending" - a pending result never
            carries a blank outcome pretending to be one. One of the five
            terminal words once state is "resolved".
        outcomeReason:
          type: string
          description: >-
            Always non-empty, in both states - while pending, states why
            no outcome exists yet (ADR-020 decision 5).
        dispatchAttribution:
          type: string
          enum: ["complete", "degraded"]
          description: >-
            Whether the pre-dispatch audit entry was written durably.
        dispatchAttributionReason:
          type: string
        outcomeAttribution:
          type: string
          enum: ["pending", "complete", "degraded"]
          description: >-
            Whether the outcome audit entry (and this invocation's own
            durable outcome record) was written durably. "pending" only
            while state is itself "pending".
        outcomeAttributionReason:
          type: string
        attributionDegraded:
          type: boolean
          description: >-
            Derived: true iff dispatchAttribution or outcomeAttribution is
            "degraded". Kept only for a caller that has not moved to the
            two named states above.
        dispatchedAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
    ActionInvocationResponse:
      type: object
      description: The body of a successful (200) response from POST /actions/{id}/invocations.
      required: [serverTime, result]
      properties:
        serverTime:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/ActionInvocationResult"
    MacroRunChangedEvent:
      type: object
      description: >-
        The payload of a "macroRun.changed" SSE event (STEP-9-SPEC.md
        section 6.6): one run's state transition. Step-level detail is
        deliberately NOT carried here - a client wanting step detail
        fetches GET /macro-runs/{runId}.
      required:
        [seq, serverTime, runId, macroObjectId, state, completed, confirmed,
         reason, attributionDegraded]
      properties:
        seq:
          type: integer
          description: Per-connection only; never a durable cursor.
        serverTime:
          type: string
          format: date-time
        runId:
          type: string
        macroObjectId:
          type: string
        state:
          type: string
          enum: [running, finished]
        completed:
          type: [boolean, "null"]
        confirmed:
          type: [boolean, "null"]
        reason:
          type: string
        attributionDegraded:
          type: boolean
    FPPPlaylistEntryObservationRequest:
      type: object
      description: >-
        The body of POST /integrations/fpp/playlist-entry-observations
        (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §1.2), schema
        version 1. instanceUuid, sequence, observedAtMillis, action,
        schemaVersion, and coalescedSincePreviousAcknowledged are present
        on every observation, available or not. playlistName, playlistHash,
        position, and entryKey are required when unavailable is absent;
        playlistHash and entryKey must be absent when unavailable is
        present (they are derived identity nothing computed for an
        unavailable observation), while playlistName, section, and
        position are merely permitted to be absent then. section may be
        the empty string even when unavailable is absent; playlistName
        may not.
      required:
        [schemaVersion, instanceUuid, action, sequence, observedAtMillis,
         coalescedSincePreviousAcknowledged]
      properties:
        schemaVersion:
          type: integer
          description: Currently 1. Any other value is refused.
        instanceUuid:
          type: string
        playlistName:
          type: string
        playlistHash:
          type: string
          description: SHA-256, lowercase hex.
        section:
          type: string
        position:
          type: integer
          description: Zero-based position within the section.
        entryKey:
          type: string
          description: SHA-256, lowercase hex.
        sequenceFilename:
          type: string
        mediaFilename:
          type: string
        action:
          type: string
          enum: [start, playing, stop, query_next, unknown]
        sequence:
          type: integer
          description: Monotonic per-instance event sequence, persistent across plugin and host restarts.
        observedAtMillis:
          type: integer
          description: Plugin observation time, epoch milliseconds.
        coalescedSincePreviousAcknowledged:
          type: integer
          description: Gap evidence, 0 when none.
        unavailable:
          type: string
          enum:
            - missing_instance_uuid
            - missing_playlist_name
            - missing_definition
            - unsupported_definition_shape
            - negative_position
            - truncated_identity_field
    FPPPlaylistEntryObservationResponse:
      type: object
      description: >-
        The 200 response of POST /integrations/fpp/playlist-entry-observations
        (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §1.6 step 10): what was decided, not an echo of the
        request. accepted is true when this observation changed the
        stored state; false only for an idempotent replay, which stores
        nothing and publishes nothing. replay is accepted's inverse.
      required: [schemaVersion, instanceUuid, sequence, entryKey, accepted, replay, serverTime]
      properties:
        schemaVersion:
          type: integer
        instanceUuid:
          type: string
        sequence:
          type: integer
        entryKey:
          type: string
        accepted:
          type: boolean
        replay:
          type: boolean
        serverTime:
          type: string
          format: date-time
    FPPPlaylistEntryObservation:
      type: object
      description: >-
        One FPP instance's latest accepted playlist-entry observation, as
        rendered by GET /integrations/fpp/playlist-entry-observations and
        the fppPlaylistEntry.changed stream event. position is absent
        when unavailable is set - an unavailable observation's identity
        fields carry no meaningful position.
      required:
        [instanceUuid, schemaVersion, sequence, action, observedAt,
         coalescedSincePreviousAcknowledged, receivedAt, endpointId]
      properties:
        instanceUuid:
          type: string
        endpointId:
          type: [string, "null"]
          description: >-
            the configured fpp.endpoints id whose most recently
            observed instance uuid matches instanceUuid, resolved
            best-effort at read time. Null when no currently configured
            endpoint has reported this uuid, or when more than one has (a
            duplicate, see GET /fpp's duplicateInstanceUuidEndpointIds ,
            makes the correlation ambiguous).
        schemaVersion:
          type: integer
        sequence:
          type: integer
        playlistName:
          type: string
        playlistHash:
          type: string
        section:
          type: string
        position:
          type: integer
        entryKey:
          type: string
        sequenceFilename:
          type: string
        mediaFilename:
          type: string
        action:
          type: string
          enum: [start, playing, stop, query_next, unknown]
        unavailable:
          type: string
          enum:
            - missing_instance_uuid
            - missing_playlist_name
            - missing_definition
            - unsupported_definition_shape
            - negative_position
            - truncated_identity_field
        observedAt:
          type: string
          format: date-time
        coalescedSincePreviousAcknowledged:
          type: integer
        receivedAt:
          type: string
          format: date-time
    FPPPlaylistEntryObservationsResponse:
      type: object
      description: >-
        The body of GET /integrations/fpp/playlist-entry-observations:
        the latest accepted observation for every known instance.
      required: [observations, serverTime]
      properties:
        observations:
          type: array
          items:
            $ref: "#/components/schemas/FPPPlaylistEntryObservation"
        serverTime:
          type: string
          format: date-time
    FPPPlaylistEntryChangedEvent:
      type: object
      description: >-
        The payload of an "fppPlaylistEntry.changed" SSE event (FPP-PLUGIN-COORDINATOR-CONTRACTS.md
        §1.6 step 10): one instance's latest observation, full-frame
        only - no ADR-023 delta narrowing exists for this resource.
      required: [seq, serverTime, observation]
      properties:
        seq:
          type: integer
          description: Per-connection only; never a durable cursor.
        serverTime:
          type: string
          format: date-time
        observation:
          $ref: "#/components/schemas/FPPPlaylistEntryObservation"
    FPPPlaylistEntryReconciliationResponse:
      type: object
      description: >-
        The body of GET /integrations/fpp/playlist-entry-observations/{instanceUuid}/reconciliation
        (TRACK-H-H2-SPEC.md §5): what this coordinator currently makes of
        the latest accepted observation for one instance. Only the
        fields relevant to `outcome` are populated; the rest are the JSON
        zero value.
      required: [instanceUuid, outcome, reason, definitionAvailable, serverTime]
      properties:
        instanceUuid:
          type: string
        outcome:
          type: string
          enum:
            - identity-unavailable
            - unbound
            - stale-import
            - unknown-entry
            - evidence-mismatch
            - cross-show
            - resolved
        reason:
          type: string
        observedPlaylistHash:
          type: string
        observedEntryKey:
          type: string
        observedSection:
          type: string
        observedPosition:
          type: integer
        observedSequenceFilename:
          type: string
        observedMediaFilename:
          type: string
        observedAction:
          type: string
        observedUnavailable:
          type: string
        playlistId:
          type: string
        playlistRevision:
          type: integer
        show:
          type: string
        bindingPlaylistHash:
          type: string
        bindingPlaylistName:
          type: string
        entryId:
          type: string
        cueId:
          type: string
        cueRevision:
          type: integer
        definitionAvailable:
          type: boolean
          description: >-
            Whether a definition is stored for the hash this result
            matched against. Populated only for outcomes that reach
            entry-key derivation (`unknown-entry`, `evidence-mismatch`,
            `cross-show`, `resolved`); `false` and not meaningful for
            `identity-unavailable`, `unbound`, and `stale-import`.
        serverTime:
          type: string
          format: date-time
    FPPPlaylistReadinessResponse:
      type: object
      description: >-
        The body of GET /integrations/fpp/playlists/{playlistId}/readiness
        (TRACK-H-H2-SPEC.md §6, whose vocabulary has since been opened --
        see docs/build/TRACK-H-cues-and-playlists.md section H6 for the
        full account of what was added and why): whether one FPP-backed
        Playlist is ready, and which condition fails first when it is not.
        `warning` is set when a condition did not fail readiness outright
        but is still worth surfacing: either the non-fatal form of the
        observation-hash check (no observation received at all yet, "the
        normal afternoon state, not a fault"), or
        `exclusive-claim-conflict`'s own inconclusive form (a stored Cue
        elsewhere could not be decoded, so the check could not be
        verified). `warning` is never set alongside a non-empty
        `failingCondition` equal to `observation-hash-mismatch`. An
        observation that WAS received but could not establish identity is
        the `evidence-unavailable` failing condition, not a warning:
        readiness never returns `ready: true` for a check it could not
        evaluate. `definition-superseded` detects an edited-but-never-
        played FPP playlist directly from the definition store, so it does
        not require FPP to have played anything since the edit.
        `node-render-unassigned`, `node-catalog-stale` and
        `exclusive-claim-conflict` are evaluated against every node
        participating in this Playlist's own Show's resolved Cue catalog,
        reusing the same resolution `GET /nodes/{nodeId}/cue-catalog` and
        the cue-catalog deploy path already use -- never a second one.
      required: [playlistId, ready, serverTime]
      properties:
        playlistId:
          type: string
        ready:
          type: boolean
        failingCondition:
          type: string
          enum:
            - definition-missing
            - definition-superseded
            - entry-not-in-definition
            - entry-filename-mismatch
            - cue-not-ready
            - evidence-unavailable
            - observation-hash-mismatch
            - node-render-unassigned
            - exclusive-claim-conflict
            - node-catalog-stale
        reason:
          type: string
        warning:
          type: string
        serverTime:
          type: string
          format: date-time
    FPPPlaylistDefinitionPublishRequest:
      type: object
      description: >-
        The body of POST /integrations/fpp/playlist-definitions
        (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §3.3), schema version 1.
        definition is the complete playlist definition as a parsed JSON
        value, no member removed; the coordinator canonicalizes what it
        received and refuses the request when the result does not hash
        to the declared playlistHash.
      required: [schemaVersion, instanceUuid, playlistName, playlistHash, definition, capturedAtMillis]
      properties:
        schemaVersion:
          type: integer
          description: Currently 1. Any other value is refused.
        instanceUuid:
          type: string
        playlistName:
          type: string
        playlistHash:
          type: string
          description: SHA-256 over the canonicalization of definition. Lowercase hex.
        definition:
          type: object
          description: The complete playlist definition, as a parsed JSON value.
        capturedAtMillis:
          type: integer
          description: When the plugin read this definition, epoch milliseconds.
    FPPPlaylistDefinitionPublishResponse:
      type: object
      description: >-
        The 200 response of POST /integrations/fpp/playlist-definitions
        (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §3.4 step 8). stored is true
        only when this call actually inserted a new row; idempotent is
        its inverse. playlistHash always echoes the hash the coordinator
        computed, never the caller's bare claim.
      required: [schemaVersion, instanceUuid, playlistHash, stored, idempotent, serverTime]
      properties:
        schemaVersion:
          type: integer
        instanceUuid:
          type: string
        playlistHash:
          type: string
        stored:
          type: boolean
        idempotent:
          type: boolean
        serverTime:
          type: string
          format: date-time
    FPPPlaylistDefinitionMetadata:
      type: object
      description: >-
        One row of GET /integrations/fpp/playlist-definitions
        (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §3.6): metadata only, no
        definition payload. referenced is true when some stored
        show.playlist object's active revision names this
        (instanceUuid, playlistHash).
      required: [instanceUuid, playlistName, playlistHash, capturedAt, receivedAt, entryCount, referenced]
      properties:
        instanceUuid:
          type: string
        playlistName:
          type: string
        playlistHash:
          type: string
        capturedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        entryCount:
          type: integer
        referenced:
          type: boolean
    FPPPlaylistDefinitionsListResponse:
      type: object
      description: >-
        The body of GET /integrations/fpp/playlist-definitions: every
        stored definition's metadata, newest received first.
      required: [definitions, serverTime]
      properties:
        definitions:
          type: array
          items:
            $ref: "#/components/schemas/FPPPlaylistDefinitionMetadata"
        serverTime:
          type: string
          format: date-time
    FPPPlaylistDefinitionResponse:
      type: object
      description: >-
        The body of GET /integrations/fpp/playlist-definitions/{instanceUuid}/{playlistHash}
        (FPP-PLUGIN-COORDINATOR-CONTRACTS.md §3.6): the stored definition
        itself, as the coordinator canonicalized it.
      required: [instanceUuid, playlistName, playlistHash, definition, capturedAt, receivedAt, serverTime]
      properties:
        instanceUuid:
          type: string
        playlistName:
          type: string
        playlistHash:
          type: string
        definition:
          type: object
        capturedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
    FPPPlaylistDefinitionEntry:
      type: object
      description: >-
        One parsed playlist entry (TRACK-H-H2-SPEC.md §4.1). type,
        sequenceName, and mediaName may all be empty — an entry with no
        filenames is still an entry and is listed.
      required: [section, position, type, sequenceName, mediaName]
      properties:
        section:
          type: string
          enum: [leadIn, mainPlaylist, leadOut]
        position:
          type: integer
          description: Zero-based position within the section, positioned independently per section.
        type:
          type: string
        sequenceName:
          type: string
        mediaName:
          type: string
    FPPPlaylistDefinitionEntriesResponse:
      type: object
      description: >-
        The body of GET /integrations/fpp/playlist-definitions/{instanceUuid}/{playlistHash}/entries
        (TRACK-H-H2-SPEC.md §4 step 2): leadIn, then mainPlaylist, then
        leadOut, in that fixed order.
      required: [instanceUuid, playlistHash, entries, serverTime]
      properties:
        instanceUuid:
          type: string
        playlistHash:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FPPPlaylistDefinitionEntry"
        serverTime:
          type: string
          format: date-time
    ConfigShow:
      type: object
      description: >-
        The STORED/READ shape of the "show" configuration kind's decoded
        payload (Track E, ADR-027 decision 2: a Show is a namespace, not a
        container - this payload carries no list of surfaces, actions, or
        macros), returned by GET and by a successful PUT. notes is always
        the resolved value here (empty string if none was ever set), never
        absent - a stored revision states its own content outright. To
        submit a show, use ConfigShowWrite instead, which allows notes to
        be absent.
      required: [name, notes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 4000
    ConfigShowWrite:
      type: object
      description: >-
        The WRITE shape of the "show" configuration kind's payload: the
        body PUT /config/show/{id} accepts. Identical to ConfigShow except
        that notes is not required - an absent key takes its documented
        default of empty (i.e. no notes), and a present `null` is rejected
        as invalid, the same absent-defaults rule ConfigShowActionWrite's
        own description field uses. This is still a FULL REPLACEMENT: a
        `notes` value from a previous revision is never carried forward.
        The response to a successful write stores and returns the
        resolved ConfigShow shape, never this one.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 4000
    ShowConfigResponse:
      type: object
      description: The body of GET and PUT /config/show/{id}.
      required:
        [serverTime, kind, id, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          enum: [show]
        id:
          type: string
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigShow"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api]
    ConfigShowSurfaceChannelRange:
      type: object
      description: >-
        show.surface.channelRange (Track E, ADR-026). Required and must be
        non-empty: an empty range makes xLights render a full, non-sparse
        FSEQ (RES-003), which is the gigabytes-per-song case ADR-028's
        asset store exists to avoid. This schema alone cannot express
        "channelCount must be at least 1" as a REFUSAL DISTINCT FROM
        absent/null (see PUT /config/show.surface/{id}'s own description);
        that three-way distinction is enforced server-side.
      required: [startChannel, channelCount]
      properties:
        startChannel:
          type: integer
          minimum: 1
        channelCount:
          type: integer
          minimum: 0
          description: >-
            The published minimum is 0 so a schema validator does not
            reject the exact "explicitly empty" request body this
            coordinator's own write-time validation exists to name and
            refuse with its own message; the server's real minimum is 1.
    ConfigShowSurfaceGeometry:
      type: object
      description: >-
        show.surface.geometry (Track E, ADR-026). width * height *
        channelsPerPixel(pixelFormat) must equal the sibling
        channelRange.channelCount exactly - enforced server-side, since it
        is a rule across two sibling objects.
      required: [width, height, pixelFormat]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        pixelFormat:
          type: string
          enum: [rgb, rgbw]
    ConfigShowSurfaceNDIOutput:
      type: object
      description: show.surface.output.ndi (ADR-026 - NDI is the reference transport).
      required: [sourceName]
      properties:
        sourceName:
          type: string
          minLength: 1
    ConfigShowSurfaceHDMI:
      type: object
      description: show.surface.output.hdmi (ADR-026 - HDMI is a supported alternate).
      required: [display]
      properties:
        display:
          type: string
          minLength: 1
    ConfigShowSurfaceOutput:
      type: object
      description: >-
        show.surface.output (Track E, ADR-026). Exactly one of ndi/hdmi
        must be present, and it must be the one named by transport -
        support for one transport is never evidence for the other, so
        this never defaults or infers a transport from whichever
        sub-object happens to be present. Only transport is required by
        THIS schema; which of ndi/hdmi accompanies it is enforced
        server-side.
      required: [transport]
      properties:
        transport:
          type: string
          enum: [ndi, hdmi]
        ndi:
          $ref: "#/components/schemas/ConfigShowSurfaceNDIOutput"
        hdmi:
          $ref: "#/components/schemas/ConfigShowSurfaceHDMI"
    ConfigShowSurface:
      type: object
      description: >-
        The "show.surface" configuration kind's decoded payload (Track E,
        ADR-026), returned by GET and accepted by PUT
        /config/show.surface/{id}. Every field is required on write -
        unlike ConfigShow, this payload has no optional/defaulted key, so
        one shape serves both the read and write side. `node` must name a
        declared node; this coordinator deliberately does not check the
        node's advertised NDI/HDMI capability (observed state, absent
        whenever the node is offline). A second surface assigned to the
        same node is a valid payload on its own terms (ADR-026's `N=1` is
        a scope limit on the renderer, not a schema rule).
      required: [show, name, node, channelRange, geometry, frameRate, output]
      properties:
        show:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        node:
          type: string
          minLength: 1
        channelRange:
          $ref: "#/components/schemas/ConfigShowSurfaceChannelRange"
        geometry:
          $ref: "#/components/schemas/ConfigShowSurfaceGeometry"
        frameRate:
          type: integer
          minimum: 1
          maximum: 120
          description: >-
            ADR-026's day-0 profile of 40 fps over NDI on OptiPlex
            7040-class hardware is L0 design intent, a target to validate
            and not a supported profile.
        output:
          $ref: "#/components/schemas/ConfigShowSurfaceOutput"
    ShowSurfaceConfigResponse:
      type: object
      description: The body of GET and PUT /config/show.surface/{id}.
      required:
        [serverTime, kind, id, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          enum: [show.surface]
        id:
          type: string
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigShowSurface"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api]
    ConfigShowCueRenderOutput:
      type: object
      description: >-
        show.cue.outputs.render (Track H seam H1, ADR-043). sequence is the
        LOGICAL sequence name, never an FSEQ filename or an asset id.
      required: [sequence]
      properties:
        sequence:
          type: string
          minLength: 1
    ConfigShowCueAudioOutput:
      type: object
      description: show.cue.outputs.audio (Track H seam H1).
      required: [asset, startOffsetMillis]
      properties:
        asset:
          type: string
          minLength: 1
        startOffsetMillis:
          type: integer
          minimum: 0
    ConfigShowCueLTCOutput:
      type: object
      description: >-
        show.cue.outputs.ltc (Track H seam H1, H0.3). Bounded at 24 hours;
        requires outputs.audio to also be present (ADR-018's one clock
        domain) — enforced server-side.
      required: [startOffsetMillis]
      properties:
        startOffsetMillis:
          type: integer
          minimum: 0
          maximum: 86400000
    ConfigShowCueAnnouncementOutput:
      type: object
      description: >-
        show.cue.outputs.announcement (Track H seam H1, H0.4). Requires
        outputs.audio to also be present. duckGainDb is required when
        policy is "duck" and refused otherwise — enforced server-side.
      required: [policy, fadeMillis]
      properties:
        policy:
          type: string
          enum: [duck, mix, interrupt]
        duckGainDb:
          type: number
          exclusiveMaximum: 0
          minimum: -60
        fadeMillis:
          type: integer
          minimum: 0
          maximum: 60000
    ConfigShowCueOutputs:
      type: object
      description: >-
        show.cue.outputs (Track H seam H1). At least one member is
        required — enforced server-side, since an empty object cannot be
        distinguished from "absent" by a plain JSON schema.
      properties:
        render:
          $ref: "#/components/schemas/ConfigShowCueRenderOutput"
        audio:
          $ref: "#/components/schemas/ConfigShowCueAudioOutput"
        ltc:
          $ref: "#/components/schemas/ConfigShowCueLTCOutput"
        announcement:
          $ref: "#/components/schemas/ConfigShowCueAnnouncementOutput"
    ConfigShowCue:
      type: object
      description: >-
        The "show.cue" configuration kind's decoded payload (Track H seam
        H1, ADR-043), returned by GET and accepted by PUT
        /config/show.cue/{id}. show must name an existing show object.
      required: [show, name, outputs]
      properties:
        show:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        outputs:
          $ref: "#/components/schemas/ConfigShowCueOutputs"
    ShowCueConfigResponse:
      type: object
      description: The body of GET and PUT /config/show.cue/{id}.
      required:
        [serverTime, kind, id, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          enum: [show.cue]
        id:
          type: string
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigShowCue"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api]
    ConfigShowPlaylistFPPBinding:
      type: object
      description: >-
        show.playlist.fpp (Track H seam H1): the imported FPP playlist
        identity this Playlist is bound to. playlistHash is the imported
        canonical hash (FPP-PLUGIN-COORDINATOR-CONTRACTS.md section 1.3),
        64 lowercase hex characters; this seam validates its shape only.
      required: [instanceUuid, playlistName, playlistHash]
      properties:
        instanceUuid:
          type: string
          minLength: 1
        playlistName:
          type: string
          minLength: 1
        playlistHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    ConfigShowPlaylistShowmeshAudio:
      type: object
      description: >-
        show.playlist.showmeshAudio (Track H seam H1). Permitted only when
        runner is "showmesh-audio" — enforced server-side. The handler
        always resolves and emits repeat (default "none"), so it is
        required on the wire even though an authored request may omit it.
      required: [repeat]
      properties:
        repeat:
          type: string
          enum: [none, all]
    ConfigShowPlaylistEntryFPP:
      type: object
      description: >-
        One entry's fpp binding (Track H seam H1, section 3.1). section
        may be empty (an FPP playlist's default, unnamed section).
        expectedSequenceFilename/expectedMediaFilename are optional
        validation evidence, never identity — the entry key is derived,
        never authored.
      required: [section, position]
      properties:
        section:
          type: string
        position:
          type: integer
          minimum: 0
        expectedSequenceFilename:
          type: string
        expectedMediaFilename:
          type: string
    ConfigShowPlaylistEntry:
      type: object
      description: One element of show.playlist.entries (Track H seam H1).
      required: [id, cue]
      properties:
        id:
          type: string
          minLength: 1
        cue:
          type: string
          minLength: 1
        fpp:
          $ref: "#/components/schemas/ConfigShowPlaylistEntryFPP"
    ConfigShowPlaylist:
      type: object
      description: >-
        The "show.playlist" configuration kind's decoded payload (Track H
        seam H1, ADR-043), returned by GET and accepted by PUT
        /config/show.playlist/{id}. show must name an existing show
        object. runner is one of fpp/showmesh-audio; the reserved
        showmesh runner is refused server-side. fpp is required iff
        runner is fpp; showmeshAudio is permitted only when runner is
        showmesh-audio. mismatchPolicy is permitted only when runner is
        fpp; safeCueRef is required iff mismatchPolicy is safeCue.
        entries is required and non-empty.
      required: [show, name, runner, entries]
      properties:
        show:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        runner:
          type: string
          enum: [fpp, showmesh-audio]
        mismatchPolicy:
          type: string
          enum: [hold, blackAndSilence, safeCue]
        safeCueRef:
          type: string
        fpp:
          $ref: "#/components/schemas/ConfigShowPlaylistFPPBinding"
        showmeshAudio:
          $ref: "#/components/schemas/ConfigShowPlaylistShowmeshAudio"
        entries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConfigShowPlaylistEntry"
    ShowPlaylistConfigResponse:
      type: object
      description: The body of GET and PUT /config/show.playlist/{id}.
      required:
        [serverTime, kind, id, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          enum: [show.playlist]
        id:
          type: string
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigShowPlaylist"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api]
    ConfigShowActive:
      type: object
      description: >-
        The "show.active" singleton configuration kind's decoded payload
        (Track E, ADR-027 decision 3): the body PUT /config/show.active
        accepts, and the "payload" member of GET /config/show.active's
        response. show must name an existing show config object
        (server-side; not expressible in this schema alone).
      required: [show]
      properties:
        show:
          type: string
          minLength: 1
    ShowActiveConfigResponse:
      type: object
      description: The body of GET and PUT /config/show.active.
      required:
        [serverTime, kind, id, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          enum: [show.active]
        id:
          type: string
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigShowActive"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api]
    ConfigNightSessionFPPPlaylist:
      type: object
      description: >-
        Names an FPP-owned playlist: referenced, never created (Track F
        seam F1, RESTING-MODE.md §6.1). fppInstanceId must name a
        configured FPP instance (server-side; not expressible here).
      required: [fppInstanceId, playlist]
      properties:
        fppInstanceId:
          type: string
          minLength: 1
        playlist:
          type: string
          minLength: 1
    ConfigNightSessionAssetRef:
      type: object
      description: >-
        ADR-028's asset identity as a night.session needs to name one:
        show, sequence, and target. target names the rendering/playout
        target (a node id); the implied targetKind is always "node". Must
        resolve to a current asset (server-side; not expressible here).
      required: [show, sequence, target]
      properties:
        show:
          type: string
          minLength: 1
        sequence:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
    ConfigNightSessionBackgroundAudioItem:
      type: object
      description: >-
        One entry of resting.backgroundAudio.items. itemId is stable and
        operator-visible (pinned against pkg/audio.PlaylistItem on Track
        C's branch, Track F seam F1): unlike position in the array, it
        survives a reorder. Must be unique within the list.
      required: [itemId, show, sequence, target]
      properties:
        itemId:
          type: string
          minLength: 1
        show:
          type: string
          minLength: 1
        sequence:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
    ConfigNightSessionBackgroundAudio:
      type: object
      description: >-
        night.session.resting.backgroundAudio: a ShowMesh `background`
        playback session (RESTING-MODE.md §8). Present only when the
        deployment configures background audio at all; its absence is
        valid and is not degraded. `resume` and `itemTransition` are
        pinned against pkg/audio's vocabulary on Track C's branch
        (track-c/audio-node). crossfadeMs is required when itemTransition
        is "crossfade" and must be absent otherwise (server-side; not
        expressible here). maxGainDb must be <= 0.
      required: [items, repeat, resume, itemTransition, maxGainDb]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConfigNightSessionBackgroundAudioItem"
        repeat:
          type: string
          enum: [none, item, playlist]
        resume:
          type: string
          enum: [resume, restart]
        itemTransition:
          type: string
          enum: [sequential, gapless, crossfade]
        crossfadeMs:
          type: integer
          minimum: 0
        maxGainDb:
          type: number
          maximum: 0
    ConfigNightSessionResting:
      type: object
      description: >-
        night.session.resting (Track F seam F1, RESTING-MODE.md §6-8).
        endOfNightPlaylist defaults to playlist when absent (server-side).
      required: [fppInstanceId, playlist, endOfNightPlaylist, timelineAsset, endOfNightRepeat]
      properties:
        fppInstanceId:
          type: string
          minLength: 1
        playlist:
          type: string
          minLength: 1
        endOfNightPlaylist:
          type: string
          minLength: 1
        timelineAsset:
          $ref: "#/components/schemas/ConfigNightSessionAssetRef"
        endOfNightRepeat:
          type: boolean
        backgroundAudio:
          $ref: "#/components/schemas/ConfigNightSessionBackgroundAudio"
    ConfigNightSessionCue:
      type: object
      description: >-
        One entry of enterShow.cues or enterResting.cues
        (RESTING-MODE.md §7). offsetMs is SIGNED and relative to the
        anchor - negative means before it. action must name an existing
        show.action object in the same show (server-side; not expressible
        here). onFailure defaults to "continue" (ADR-035) when absent.
      required: [name, role, action, offsetMs, barrier, onFailure]
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [lighting, projection, audio, announcement, other]
        action:
          type: string
          minLength: 1
        offsetMs:
          type: integer
        fadeDurationMs:
          type: integer
          minimum: 0
        barrier:
          type: boolean
        onFailure:
          type: string
          enum: [continue, abort]
        announcementPolicy:
          type: string
          enum: [duck, mix, interrupt]
          description: >-
            Meaningful only when role is "announcement"; rejected on any
            other role. Absent means the night.session's own
            announcementDefaultPolicy applies. interrupt uses
            resting.backgroundAudio's own resume/restart policy on the way
            back.
    ConfigNightSessionEnterShow:
      type: object
      description: night.session.enterShow (RESTING-MODE.md §7.1).
      required: [cues, blackoutHoldMs]
      properties:
        cues:
          type: array
          items:
            $ref: "#/components/schemas/ConfigNightSessionCue"
        blackoutHoldMs:
          type: integer
          minimum: 0
    ConfigNightSessionEnterResting:
      type: object
      description: night.session.enterResting (RESTING-MODE.md §7.2).
      required: [cues, blackoutAfterShowMs]
      properties:
        cues:
          type: array
          items:
            $ref: "#/components/schemas/ConfigNightSessionCue"
        blackoutAfterShowMs:
          type: integer
          minimum: 0
    ConfigNightSessionCueWrite:
      type: object
      description: >-
        The WRITE shape of one entry of enterShow.cues/enterResting.cues:
        the body PUT /config/night.session/{id} accepts inside its cue
        lists. Identical to ConfigNightSessionCue except that barrier and
        onFailure are not required - an absent barrier takes its
        documented default of false, and an absent onFailure takes its
        documented default of "continue" (ADR-035). The response always
        stores and returns the resolved ConfigNightSessionCue shape,
        never this one.
      required: [name, role, action, offsetMs]
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [lighting, projection, audio, announcement, other]
        action:
          type: string
          minLength: 1
        offsetMs:
          type: integer
        fadeDurationMs:
          type: integer
          minimum: 0
        barrier:
          type: boolean
        onFailure:
          type: string
          enum: [continue, abort]
        announcementPolicy:
          type: string
          enum: [duck, mix, interrupt]
    ConfigNightSessionEnterShowWrite:
      type: object
      description: >-
        The WRITE shape of night.session.enterShow: identical to
        ConfigNightSessionEnterShow except that cues carries
        ConfigNightSessionCueWrite entries (barrier/onFailure optional).
      required: [cues, blackoutHoldMs]
      properties:
        cues:
          type: array
          items:
            $ref: "#/components/schemas/ConfigNightSessionCueWrite"
        blackoutHoldMs:
          type: integer
          minimum: 0
    ConfigNightSessionEnterRestingWrite:
      type: object
      description: >-
        The WRITE shape of night.session.enterResting: identical to
        ConfigNightSessionEnterResting except that cues carries
        ConfigNightSessionCueWrite entries.
      required: [cues, blackoutAfterShowMs]
      properties:
        cues:
          type: array
          items:
            $ref: "#/components/schemas/ConfigNightSessionCueWrite"
        blackoutAfterShowMs:
          type: integer
          minimum: 0
    ConfigNightSessionBackgroundAudioWrite:
      type: object
      description: >-
        The WRITE shape of resting.backgroundAudio: identical to
        ConfigNightSessionBackgroundAudio except that repeat is not
        required - an absent repeat takes its documented default of
        "none". crossfadeMs is still required when itemTransition is
        "crossfade" and must be absent otherwise (server-side; not
        expressible here).
      required: [items, resume, itemTransition, maxGainDb]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConfigNightSessionBackgroundAudioItem"
        repeat:
          type: string
          enum: [none, item, playlist]
        resume:
          type: string
          enum: [resume, restart]
        itemTransition:
          type: string
          enum: [sequential, gapless, crossfade]
        crossfadeMs:
          type: integer
          minimum: 0
        maxGainDb:
          type: number
          maximum: 0
    ConfigNightSessionRestingWrite:
      type: object
      description: >-
        The WRITE shape of night.session.resting: identical to
        ConfigNightSessionResting except that endOfNightPlaylist and
        endOfNightRepeat are not required. endOfNightPlaylist, when
        present, must be non-empty (an explicit "" is refused, not
        collapsed into "absent" - RESTING-MODE.md's absent/null/empty
        distinction); when absent it defaults to `playlist`.
        endOfNightRepeat defaults to false when absent. backgroundAudio
        carries the ConfigNightSessionBackgroundAudioWrite shape.
      required: [fppInstanceId, playlist, timelineAsset]
      properties:
        fppInstanceId:
          type: string
          minLength: 1
        playlist:
          type: string
          minLength: 1
        endOfNightPlaylist:
          type: string
          minLength: 1
        timelineAsset:
          $ref: "#/components/schemas/ConfigNightSessionAssetRef"
        endOfNightRepeat:
          type: boolean
        backgroundAudio:
          $ref: "#/components/schemas/ConfigNightSessionBackgroundAudioWrite"
    ConfigNightSessionPowerBinding:
      type: object
      description: >-
        A configured power binding under night.session.siteControl
        (RESTING-MODE.md §10.2, Track F seam F6). action must name an
        existing show.action object in this session's own show
        (server-side; not expressible here). domainProvenance
        "provider" is refused (server-side): no control provider in
        this build can authoritatively identify a power binding's
        physical targets, so every binding this build accepts is
        operator-declared.
      required: [action, powerDomain, domainProvenance]
      properties:
        action:
          type: string
          minLength: 1
        powerDomain:
          type: string
          enum: [presentation, environmental, mixed, unknown]
        domainProvenance:
          type: string
          enum: [provider, operator-declared]
    ConfigNightSessionPrerequisite:
      type: object
      description: >-
        One entry of presentationPowerOff.prerequisites, present only
        when removalPolicy is "after-actions" (RESTING-MODE.md §10.2). A
        "delay" entry carries delayMs and neither action nor
        requireConfirmation; an "action" or "evidence" entry carries
        action and, for "action" only, an optional requireConfirmation.
        action must not name this same presentation power-off binding's
        own action, directly or indirectly (server-side; not expressible
        here).
      required: [kind]
      properties:
        kind:
          type: string
          enum: [action, delay, evidence]
        action:
          type: string
          minLength: 1
        requireConfirmation:
          type: boolean
        delayMs:
          type: integer
          minimum: 0
    ConfigNightSessionPresentationPowerOff:
      type: object
      description: >-
        night.session.siteControl.presentationPowerOff (RESTING-MODE.md
        §10.2). powerDomain must be "presentation" (server-side): this
        binding is what power-down-presentation invokes, and every other
        domain is refused rather than guessed. removalPolicy "immediate"
        requires immediateSafeAttestation: true and forbids
        prerequisites; "after-actions" requires a non-empty prerequisites
        list and forbids immediateSafeAttestation (server-side; that
        either/or is not expressible in this schema alone).
      required: [action, powerDomain, domainProvenance, removalPolicy]
      properties:
        action:
          type: string
          minLength: 1
        powerDomain:
          type: string
          enum: [presentation, environmental, mixed, unknown]
        domainProvenance:
          type: string
          enum: [provider, operator-declared]
        removalPolicy:
          type: string
          enum: [immediate, after-actions]
        immediateSafeAttestation:
          type: boolean
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/ConfigNightSessionPrerequisite"
    ConfigNightSessionSiteControl:
      type: object
      description: >-
        night.session.siteControl (RESTING-MODE.md §10.2/§10.4, ADR-016,
        Track F seam F6): entirely optional, and every field within it is
        independently optional too; an empty object is refused
        (server-side) as configuration nothing enforces.
        requestThermalProfile, when present, names an existing
        show.action object in this session's own show (server-side).
      properties:
        requestThermalProfile:
          type: string
          minLength: 1
        presentationPowerOn:
          $ref: "#/components/schemas/ConfigNightSessionPowerBinding"
        presentationPowerOff:
          $ref: "#/components/schemas/ConfigNightSessionPresentationPowerOff"
    ConfigNightSessionInterlock:
      type: object
      description: >-
        One entry of night.session.interlocks (RESTING-MODE.md §10.1,
        Track F seam F6): a named rule attached to exactly one lifecycle
        phase, unique within a configuration revision. A "disabled" entry
        carries only name, phase, and posture; every other property below
        is refused for it (server-side). An "observe" entry must not set
        onUnavailable or overridePolicy; a "block" entry requires both,
        with no default (server-side; the exact combination rules are
        not expressible in this schema alone). signal names an existing
        show.action object that declares an mqtt target with
        expect.kind other than "none" (server-side): an interlock's
        evidence is that action's own request/response, the only
        mechanism this build has to reach a site sensor.
      required: [name, phase, posture]
      properties:
        name:
          type: string
          minLength: 1
        phase:
          type: string
          enum:
            - prepare-site
            - presentation-power-on
            - projector-strike
            - run-readiness
            - start-preshow
            - start-night
            - enter-resting
            - fade-out-night
            - power-down-presentation
        posture:
          type: string
          enum: [observe, block, disabled]
        signal:
          type: string
          minLength: 1
        freshnessSeconds:
          type: integer
          minimum: 0
          description: >-
            Bounds how old the evidence this rule consults may be before
            it is treated as unavailable (server-side enforced). For a
            phase whose evidence is dispatched live at the instant the
            command runs (prepare-site, run-readiness, fade-out-night,
            power-down-presentation), evidence is always current and this
            has no effect. For a phase gated against a stored readiness
            result instead (start-preshow, start-night), the stricter of
            this value and the coordinator's own configured readiness
            max age is enforced; with no trusted result at all, or one
            older than either bound, this rule is evidence-unavailable
            regardless of what its stored check reports.
        failureText:
          type: string
          minLength: 1
        onUnavailable:
          type: string
          enum: [block, allow]
        overridePolicy:
          type: string
          enum: [none, authorized-operator]
    ConfigNightSessionWrite:
      type: object
      description: >-
        The WRITE shape of the "night.session" configuration kind's
        payload: the body PUT /config/night.session/{id} accepts.
        Identical to ConfigNightSession except that resting, enterShow,
        and enterResting carry their own *Write shapes, whose only
        difference is which of their own fields are optional-with-a-
        documented-default rather than always required. The response to
        a successful write stores and returns the resolved
        ConfigNightSession shape, never this one - matching
        ConfigShowWrite/ConfigShow's existing precedent one kind over.
        Every validation rule ConfigNightSession's own description states
        (the calendar/duration key ban, siteControl/interlocks validation,
        the same-show rule) applies identically here.
      required: [show, label, showPlaylist, resting, enterShow, enterResting]
      properties:
        show:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        showPlaylist:
          $ref: "#/components/schemas/ConfigNightSessionFPPPlaylist"
        resting:
          $ref: "#/components/schemas/ConfigNightSessionRestingWrite"
        enterShow:
          $ref: "#/components/schemas/ConfigNightSessionEnterShowWrite"
        enterResting:
          $ref: "#/components/schemas/ConfigNightSessionEnterRestingWrite"
        announcementDefaultPolicy:
          type: string
          enum: [duck, mix, interrupt]
          description: >-
            Defaults to "duck" when absent. Used by any announcement-role
            cue that does not name its own announcementPolicy.
        siteControl:
          $ref: "#/components/schemas/ConfigNightSessionSiteControl"
        interlocks:
          type: array
          items:
            $ref: "#/components/schemas/ConfigNightSessionInterlock"
    ConfigNightSession:
      type: object
      description: >-
        The READ (fully resolved) shape of the "night.session"
        configuration kind's decoded payload (Track F seams F1 and F6,
        RESTING-MODE.md, ADR-038, ADR-039), returned by GET and by a
        successful PUT /config/night.session/{id} - never the shape PUT
        itself accepts; see ConfigNightSessionWrite for that. Every field
        defaulted on write (repeat, barrier, onFailure, endOfNightPlaylist,
        endOfNightRepeat) is always the RESOLVED value here, never absent
        standing in for "the default applies". A KEY named at, cron,
        schedule, time, date, weekday, or timezone, or a KEY that
        restates the resting FSEQ's own duration (restDuration,
        restSeconds, ...), is rejected anywhere in this object
        (server-side; not expressible in this schema) - this is a rule
        about field NAMES, not values, so an operator-authored label or
        action id that happens to contain a date or a time of day is an
        ordinary string, not a violation. `siteControl` and `interlocks`
        are entirely optional (RESTING-MODE.md §10's own opening line: a
        deployment that omits both runs the whole night loop unchanged).
        Every cross-object reference this object carries (cue actions,
        the resting timeline asset, every backgroundAudio item, every
        siteControl action, every interlock signal) must belong to this
        session's own `show` (ADR-027: a Show is a namespace).
      required:
        [show, label, showPlaylist, resting, enterShow, enterResting,
         announcementDefaultPolicy]
      properties:
        show:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        showPlaylist:
          $ref: "#/components/schemas/ConfigNightSessionFPPPlaylist"
        resting:
          $ref: "#/components/schemas/ConfigNightSessionResting"
        enterShow:
          $ref: "#/components/schemas/ConfigNightSessionEnterShow"
        enterResting:
          $ref: "#/components/schemas/ConfigNightSessionEnterResting"
        announcementDefaultPolicy:
          type: string
          enum: [duck, mix, interrupt]
        siteControl:
          $ref: "#/components/schemas/ConfigNightSessionSiteControl"
        interlocks:
          type: array
          items:
            $ref: "#/components/schemas/ConfigNightSessionInterlock"
    NightSessionConfigResponse:
      type: object
      description: >-
        The body of GET and PUT /config/night.session/{id}, and of GET
        /config/night.session/{id}/revisions/{revision} (one past,
        immutable revision's full payload).
      required:
        [serverTime, kind, id, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          enum: [night.session]
        id:
          type: string
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigNightSession"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api]
    ConfigNightSessionActive:
      type: object
      description: >-
        The "night.session.active" singleton configuration kind's decoded
        payload (Track F seam F1, ADR-039 rule 4): the body PUT
        /config/night.session.active accepts, and the "payload" member of
        GET /config/night.session.active's response. session is REQUIRED
        as a key but may be the empty string, which explicitly clears the
        pointer back to unset (the zero-to-one-and-back-to-zero
        transition) - a non-empty value must name an existing
        night.session object (server-side; not expressible here).
      required: [session]
      properties:
        session:
          type: string
    NightSessionActiveConfigResponse:
      type: object
      description: The body of GET and PUT /config/night.session.active.
      required:
        [serverTime, kind, id, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          enum: [night.session.active]
        id:
          type: string
        revision:
          type: integer
        payload:
          $ref: "#/components/schemas/ConfigNightSessionActive"
        updatedAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        source:
          type: string
          enum: [api]
    NightReadinessCheck:
      type: object
      description: >-
        One named signal run-readiness evaluated. This build checks
        `fpp.reachable` for the session's referenced FPP instances (`name`
        `fpp:<instanceId>:reachable`), the pinned resting FSEQ asset's own
        parseable non-zero duration (`resting:asset-duration`), the
        resting playlist's idle-read shape - exactly one FSEQ-only item,
        no FPP audio item (`resting:playlist-shape:<playlist>`) - the show
        playlist's presence (`show:playlist-present:<playlist>`), and
        whether the exact deployed FSEQ variant on the FPP host can be
        confirmed (`resting:asset-exact-variant:<playlist>`). When
        `resting.endOfNightPlaylist` names a different playlist from
        `resting.playlist`, it gets its own shape and exact-variant checks
        under the `resting-end-of-night:` prefix; when the two are the same
        playlist, which is the default, it is not checked twice. That last
        check's `state` is PERMANENTLY `not_verifiable`: FPP exposes no
        content hash, only a filename, so this coordinator can never
        independently confirm the live host is running the pinned asset's
        exact bytes, and this is stated rather than folded into the
        passing shape check or defaulted to a pass - but a check that can
        never be anything but not_verifiable is excluded from the
        aggregate `outcome` (it is still always listed), so `outcome` can
        still read `"ready"` once every checkable check passes. Each
        check's own `reason` states exactly what it verified and what it
        could not. A healthy result on one check is never evidence any
        other check passed.
      required: [name, state, reason]
      properties:
        name:
          type: string
        state:
          type: string
          description: >-
            pkg/observation's Health vocabulary, plus not_verifiable for a
            check that is structurally incapable of ever reporting
            anything else, and not_configured for a check whose own
            OPTIONAL configuration is simply absent - both excluded from
            the aggregate outcome but always listed. Missing evidence is
            always "unknown".
          enum: [healthy, degraded, failed, unknown, not_verifiable, not_configured]
        reason:
          type: string
    NightReadiness:
      type: object
      description: >-
        The current session's most recent run-readiness result, or its
        explicit absence, stated with a state and a reason rather than
        omitted (ADR-020). No precomputed age field (ADR-020 decision 6):
        compare `completedAt` against the envelope's own `serverTime`.
        `outcome`/`epochId`/`completedAt` are present only when `state` is
        `"recorded"`. `outcome` never withholds `start-night` by itself in
        this build; only the epoch/freshness gate does.
      required: [state, reason, sameEpoch, fresh, checks]
      properties:
        state:
          type: string
          enum: [recorded, unknown, not_configured, not_available]
        reason:
          type: string
          description: >-
            Distinguishes "no result recorded yet" from "the store could
            not be read" from "the result exists but its checks payload
            failed to decode" - never a single collapsed reason for all
            three.
        outcome:
          type: string
          enum: [ready, not_ready, unknown]
        epochId:
          type: string
        completedAt:
          type: string
          format: date-time
        sameEpoch:
          type: boolean
        fresh:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/NightReadinessCheck"
    NightPhaseEvidence:
      type: object
      description: >-
        One optional or not-yet-implemented section, stated with a state
        and a reason rather than omitted.
      required: [state, reason]
      properties:
        state:
          type: string
          enum: [recorded, unknown, not_configured, not_available]
        reason:
          type: string
    NightCue:
      type: object
      description: >-
        One configured cue's outbox detail for the session's current
        cycle. `state` "not_dispatched" means no outbox row exists for
        this cycle. `state` and `outcome` are never collapsed into one
        field: a dispatched-but-unconfirmed cue reports `state`
        "resolved", `outcome` "unconfirmed" - never "failed".
      required: [name, phase, role, action, actionRevision, state,
                 dispatchedAt, resolvedAt]
      properties:
        name:
          type: string
        phase:
          type: string
          description: >-
            `fadeOut` replays the `enterShow` cue definitions while the
            session is fading out, under its own outbox identity. Rows in
            that phase are listed only once they exist.
          enum: [enterShow, enterResting, fadeOut]
        role:
          type: string
        action:
          type: string
        actionRevision:
          type: [integer, "null"]
        state:
          type: string
          enum: [not_dispatched, pending, dispatched, resolved, ambiguous]
        outcome:
          type: string
          enum: [confirmed, unconfirmed, unconfirmable, failed, refused, ambiguous]
        reason:
          type: string
        dispatchedAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
    NightCues:
      type: object
      description: >-
        The current cycle's per-cue detail, or the stated reason it could
        not be read - never a silently empty list for either "no cues
        configured" or "read failed".
      required: [state, reason, cues]
      properties:
        state:
          type: string
          enum: [recorded, unknown, not_configured, not_available]
        reason:
          type: string
        cues:
          type: array
          items:
            $ref: "#/components/schemas/NightCue"
    NightBackgroundAudioStep:
      type: object
      description: >-
        One durable audio step Track F seam F5's own controller has
        recorded, across every cycle the session has lived through:
        either the resting bed's own playback sequence or an
        announcement session's clear and start.
      required: [sequence, phase, cueName, kind, actionRevision, state,
                 dispatchedAt, resolvedAt]
      properties:
        sequence:
          type: string
          enum: [background, announcement]
          description: >-
            Which of the controller's two audio sequences this step
            belongs to, so a failure is attributable without reading the
            internal phase string.
        phase:
          type: string
          description: >-
            The internal outbox phase this step was recorded under - a
            diagnostic identifier, not a value to round-trip back into a
            request.
        cueName:
          type: string
        kind:
          type: string
          enum: [apply, gain, start, pause, resume, stop,
                 announcementClear, announcementStart]
        actionRevision:
          type: integer
        state:
          type: string
          enum: [pending, dispatched, resolved, ambiguous]
        outcome:
          type: string
          enum: [confirmed, unconfirmed, unconfirmable, failed, refused, ambiguous]
        reason:
          type: string
        dispatchedAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
    NightBackgroundAudio:
      type: object
      description: >-
        resting.backgroundAudio's own durable step log for the current
        cycle, or the stated reason it could not be read. Empty `steps`
        with `state` "recorded" means backgroundAudio is not configured
        at all, or has never been started this cycle.
      required: [state, reason, steps]
      properties:
        state:
          type: string
          enum: [recorded, unknown, not_configured, not_available]
        reason:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/NightBackgroundAudioStep"
    NightSessionState:
      type: object
      description: >-
        The night-session lifecycle controller's own persisted state - a
        dedicated closed state machine, never observed evidence. `id` is
        "" and `state` is "inactive" when no session has ever been
        created.
      required:
        [id, configObjectId, configRevision, state, stateEnteredAt, cycle,
         finalShowRequested, finalShowRequestedAt, admissionClosed,
         admissionClosedAt, shutdownIntent, armedShowId, showCommitted,
         readiness, powerPhase, transition, cues, backgroundAudio,
         degraded, attributionDegraded, authorization, updatedAt]
      properties:
        id:
          type: string
        configObjectId:
          type: string
        configRevision:
          type: integer
        state:
          type: string
          description: RESTING-MODE.md §3's ten states, exactly.
          enum:
            - inactive
            - preparing
            - preshow
            - transition-to-show
            - live
            - transition-to-resting
            - resting-intershow
            - end-of-night-resting
            - fading-out
            - stopped
        stateEnteredAt:
          type: string
          format: date-time
        cycle:
          type: integer
        finalShowRequested:
          type: boolean
        finalShowRequestedAt:
          type: [string, "null"]
          format: date-time
        admissionClosed:
          type: boolean
        admissionClosedAt:
          type: [string, "null"]
          format: date-time
        shutdownIntent:
          type: string
          enum: ["", fade-out, power-down]
        armedShowId:
          type: string
        showCommitted:
          type: boolean
        readiness:
          $ref: "#/components/schemas/NightReadiness"
        powerPhase:
          $ref: "#/components/schemas/NightPhaseEvidence"
        transition:
          $ref: "#/components/schemas/NightPhaseEvidence"
        cues:
          $ref: "#/components/schemas/NightCues"
        backgroundAudio:
          $ref: "#/components/schemas/NightBackgroundAudio"
        degraded:
          type: boolean
        degradedReason:
          type: string
        attributionDegraded:
          type: boolean
          description: >-
            True when this session's most recent command applied despite
            its audit entry failing to write (ADR-024 decision 11), or when
            an autonomous dispatch ran with no authorizing principal
            recorded. Never cleared once true.
        authorization:
          $ref: "#/components/schemas/NightAuthorization"
        updatedAt:
          type: string
          format: date-time
    NightAuthorization:
      type: object
      description: >-
        Who authorized this session, recorded for provenance and surviving
        a coordinator restart. The night controller performs autonomous
        actions as its own session-scoped system actor and never as this
        principal, so this is a record of authority rather than a live
        credential. State is "unknown" when nothing has been attributed
        yet; autonomous actions still run in that case, and the session
        carries attributionDegraded.
      required: [state, recordedAt]
      properties:
        state:
          type: string
          enum: [recorded, unknown]
        reason:
          type: string
        principalId:
          type: string
        principalName:
          type: string
        command:
          type: string
          description: The lifecycle command that established this attribution.
        recordedAt:
          type: [string, "null"]
          format: date-time
    NightSessionResponse:
      type: object
      description: The body of GET /night/session and GET /night/sessions/{id}.
      required: [serverTime, session]
      properties:
        serverTime:
          type: string
          format: date-time
        session:
          $ref: "#/components/schemas/NightSessionState"
    NightSessionChangedEvent:
      type: object
      description: >-
        The payload of a "nightSession.changed" SSE event (Track F seam
        F2): one kind, not one per transition — the full NightSessionState
        a GET returns, never a delta. No delta event kind exists for this
        resource, matching resolume.changed's own posture.
      required: [seq, serverTime, session]
      properties:
        seq:
          type: integer
          description: Per-connection only; never a durable cursor.
        serverTime:
          type: string
          format: date-time
        session:
          $ref: "#/components/schemas/NightSessionState"
    NightInterlockOverride:
      type: object
      description: >-
        One entry of NightCommandRequest.interlockOverrides
        (RESTING-MODE.md §10.1, Track F seam F6): a request to override a
        named "block" interlock rule currently withholding the command's
        own phase. Honored only when that rule declares
        `overridePolicy: authorized-operator`, the caller separately
        holds `night:override`, and the rule is actually withholding the
        phase being entered (server-side; not expressible here). Every
        accepted override is audited with the rule, phase, reason, and a
        bounded (this-invocation-only) scope.
      required: [rule, reason]
      properties:
        rule:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
    NightCommandRequest:
      type: object
      description: >-
        The optional body of POST /night/commands/{command}. Decoded
        strictly: an unrecognized key is refused, not silently ignored.
        `idempotencyKey` is honored only by `prepare-site`; every other
        command is already idempotent by lifecycle state and ignores it.
        `interlockOverrides` (Track F seam F6) is consulted by
        `prepare-site`, `run-readiness`, `start-preshow`, `start-night`,
        `fade-out-night`, and `power-down-presentation`, each against
        the "block" interlock rules declared for that command's own
        phase, described in full on `POST /night/commands/{command}`
        itself. `request-final-show` and `end-session` consult no
        interlock at all and REFUSE a non-empty `interlockOverrides`
        rather than silently ignoring it.
      properties:
        idempotencyKey:
          type: string
        interlockOverrides:
          type: array
          items:
            $ref: "#/components/schemas/NightInterlockOverride"
    NightCommandResult:
      type: object
      description: >-
        What POST /night/commands/{command} accepted, and how -
        `idempotent_no_op` is a real, distinct outcome from `applied`.
      required: [command, outcome, attributionDegraded]
      properties:
        command:
          type: string
        outcome:
          type: string
          enum: [applied, idempotent_no_op]
        reason:
          type: string
        attributionDegraded:
          type: boolean
    NightCommandResponse:
      type: object
      description: >-
        The 202 body of POST /night/commands/{command}: acceptance plus
        the resulting session state, never a held connection waiting on a
        downstream outcome.
      required: [serverTime, command, session]
      properties:
        serverTime:
          type: string
          format: date-time
        command:
          $ref: "#/components/schemas/NightCommandResult"
        session:
          $ref: "#/components/schemas/NightSessionState"
    Asset:
      type: object
      description: >-
        One row of the coordinator's asset metadata store (Track E seam
        E3/E4, ADR-028): an artifact's identity, never its bytes.
        `target` mirrors the store's own TargetID - empty when
        `targetKind` is "show". `runtimeFilename` is preserved but carries
        no identity of its own: two different Asset values may share the
        same `runtimeFilename` (ADR-028 decision 1 - a filename is not an
        asset identity).
      additionalProperties: false
      required:
        [id, show, sequence, targetKind, target, mediaType, contentHash,
         runtimeFilename, sizeBytes, createdAt, createdByPrincipalId,
         createdByPrincipalName, supersededAt, current]
      properties:
        id:
          type: string
        show:
          type: string
        sequence:
          type: string
        targetKind:
          type: string
          enum: [node, show]
        target:
          type: string
          description: A declared node id, or empty when targetKind is "show".
        mediaType:
          type: string
          enum: [fseq, audio, media]
        contentHash:
          type: string
          description: "sha256:<hex>"
        runtimeFilename:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdByPrincipalId:
          type: [string, "null"]
        createdByPrincipalName:
          type: [string, "null"]
        supersededAt:
          type: [string, "null"]
          format: date-time
          description: Null for the CURRENT asset serving its (show, sequence, targetKind, target) tuple.
        current:
          type: boolean
          description: True exactly when supersededAt is null.
    AssetResponse:
      type: object
      description: >-
        The body of POST /assets and GET /assets/{id}. `rolledBack` is true
        only when a POST matched a SUPERSEDED identity and performed
        ADR-028 decision 10's rollback (un-superseding `asset` and
        superseding whatever was current); it is always false on GET.
      additionalProperties: false
      required: [serverTime, asset, rolledBack]
      properties:
        serverTime:
          type: string
          format: date-time
        asset:
          $ref: "#/components/schemas/Asset"
        rolledBack:
          type: boolean
    AssetsListResponse:
      type: object
      description: The body of GET /assets.
      additionalProperties: false
      required: [serverTime, assets]
      properties:
        serverTime:
          type: string
          format: date-time
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
    AssetUploadRequest:
      type: object
      description: >-
        POST /assets' multipart/form-data body. show, sequence, mediaType,
        and targetKind are required on every request; target is required
        only when targetKind is "node" (not expressible in this schema
        alone - see the operation's own description). Every field part
        MUST arrive before the file part.
      additionalProperties: false
      required: [file, show, sequence, mediaType, targetKind]
      properties:
        file:
          type: string
          format: binary
        show:
          type: string
          minLength: 1
        sequence:
          type: string
          minLength: 1
        mediaType:
          type: string
          enum: [fseq, audio, media]
        targetKind:
          type: string
          enum: [node, show]
        target:
          type: string
          description: Required, and must name a declared node, when targetKind is "node".
    NodeAssetManifest:
      type: object
      description: >-
        One node's asset readiness verdict (Track E seam E5, ADR-020,
        ADR-028): "what should this node hold" versus "what does it
        actually hold". state is "ready", "not_ready", or "unknown".
        reason is null only when state is "ready"; every other state
        names the specific cause. missing and gaps are populated only
        when state is "not_ready". extra is populated whenever a fresh
        inventory report exists, regardless of state - never an error and
        never a basis for deletion. observedAt is null exactly when state
        is "unknown": there is no evidence an unknown verdict rests on, so
        there is nothing to date it by.
      additionalProperties: false
      required: [node, state, reason, missing, gaps, extra, observedAt]
      properties:
        node:
          type: string
        state:
          type: string
          enum: [ready, not_ready, unknown]
        reason:
          type: [string, "null"]
        missing:
          type: array
          items:
            $ref: "#/components/schemas/MissingAsset"
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/AssetGap"
        extra:
          type: array
          items:
            $ref: "#/components/schemas/ExtraAsset"
        observedAt:
          type: [string, "null"]
          format: date-time
    MissingAsset:
      type: object
      description: One expected asset a manifest found the node does not currently hold.
      additionalProperties: false
      required: [assetId, sequence, filename, contentHash, sizeBytes]
      properties:
        assetId:
          type: string
        sequence:
          type: string
        filename:
          type: string
        contentHash:
          type: string
        sizeBytes:
          type: integer
    AssetGap:
      type: object
      description: >-
        A sequence the active show has some current asset for, that a
        node carrying one or more surfaces in that show has no coverage
        for at all - inferred from the show's own asset rows, not a
        stored surface-to-sequence link.
      additionalProperties: false
      required: [sequence, surfaces]
      properties:
        sequence:
          type: string
        surfaces:
          type: array
          items:
            type: string
    ExtraAsset:
      type: object
      description: >-
        One asset a node holds that this manifest did not expect. Never an
        error and never a basis for deletion.
      additionalProperties: false
      required: [contentHash, filename, sizeBytes]
      properties:
        contentHash:
          type: string
        filename:
          type: string
        sizeBytes:
          type: integer
    NodeAssetManifestResponse:
      type: object
      description: The body of GET /nodes/{nodeId}/assets.
      additionalProperties: false
      required: [serverTime, manifest]
      properties:
        serverTime:
          type: string
          format: date-time
        manifest:
          $ref: "#/components/schemas/NodeAssetManifest"
    AssetManifestResponse:
      type: object
      description: The body of GET /assets/manifest.
      additionalProperties: false
      required: [serverTime, nodes]
      properties:
        serverTime:
          type: string
          format: date-time
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeAssetManifest"
    CueCatalogRenderOutput:
      type: object
      description: >-
        One Cue's resolved render output for a node (Track H seam H3/H4).
        sequence is a logical identity only; filename is the runtime
        filename a node must open (and verify against assetHashes) to
        render it.
      additionalProperties: false
      required: [sequence, filename, assetHashes]
      properties:
        sequence:
          type: string
        filename:
          type: string
        assetHashes:
          type: array
          items:
            type: string
    CueCatalogAudioOutput:
      type: object
      description: >-
        One Cue's resolved audio output for a node (Track H seam H3/H4).
        asset is a logical identity only; filename is the runtime
        filename a node must open (and verify against assetHashes) to
        play it.
      additionalProperties: false
      required: [asset, filename, startOffsetMillis, assetHashes]
      properties:
        asset:
          type: string
        filename:
          type: string
        startOffsetMillis:
          type: integer
        assetHashes:
          type: array
          items:
            type: string
    CueCatalogLTCOutput:
      type: object
      description: One Cue's resolved LTC output (Track H seam H3).
      additionalProperties: false
      required: [startOffsetMillis]
      properties:
        startOffsetMillis:
          type: integer
    CueCatalogAnnouncementOutput:
      type: object
      description: One Cue's resolved announcement policy (Track H seam H3).
      additionalProperties: false
      required: [policy, fadeMillis]
      properties:
        policy:
          type: string
          enum: [duck, mix, interrupt]
        duckGainDb:
          type: number
        fadeMillis:
          type: integer
    CueCatalogOutputs:
      type: object
      description: >-
        One Cue's resolved outputs, restricted to the ones that concern
        the requested node (Track H seam H3). A member is absent when that
        output either was not declared on the Cue, or does not concern
        this node.
      additionalProperties: false
      properties:
        render:
          $ref: "#/components/schemas/CueCatalogRenderOutput"
        audio:
          $ref: "#/components/schemas/CueCatalogAudioOutput"
        ltc:
          $ref: "#/components/schemas/CueCatalogLTCOutput"
        announcement:
          $ref: "#/components/schemas/CueCatalogAnnouncementOutput"
    CueCatalogEntry:
      type: object
      description: One Cue's row in a resolved catalog (Track H seam H3).
      additionalProperties: false
      required: [cueId, cueRevision, outputs]
      properties:
        cueId:
          type: string
        cueRevision:
          type: integer
        outputs:
          $ref: "#/components/schemas/CueCatalogOutputs"
    CueCatalogResponse:
      type: object
      description: >-
        The body of GET /nodes/{nodeId}/cue-catalog (Track H seam H3, plus
        its read-only acknowledgement projection). acknowledgedStatus
        is always present: "catalog-unacknowledged" when this node has
        never acknowledged a cue catalog, "catalog-current" when its last
        acknowledged revision equals `revision` above, and
        "catalog-stale" otherwise (including when no active show is
        configured at all, so there is nothing to be current with).
        acknowledgedRevision and acknowledgedAt are both absent exactly
        when acknowledgedStatus is "catalog-unacknowledged" - a caller
        must read acknowledgedStatus, never infer "never acknowledged"
        from their absence.
      additionalProperties: false
      required: [serverTime, node, configured, entries, acknowledgedStatus]
      properties:
        serverTime:
          type: string
          format: date-time
        node:
          type: string
        configured:
          type: boolean
        show:
          type: string
        generation:
          type: integer
        revision:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CueCatalogEntry"
        acknowledgedStatus:
          type: string
          enum: [catalog-current, catalog-stale, catalog-unacknowledged]
        acknowledgedRevision:
          type: string
        acknowledgedAt:
          type: string
          format: date-time
    CueCatalogAcknowledgeRequest:
      type: object
      description: The body of POST /nodes/{nodeId}/cue-catalog/acknowledge.
      additionalProperties: false
      required: [revision, show, generation]
      properties:
        revision:
          type: string
          minLength: 1
        show:
          type: string
          minLength: 1
        generation:
          type: integer
          minimum: 1
    CueCatalogAcknowledgeResponse:
      type: object
      description: The response body of POST /nodes/{nodeId}/cue-catalog/acknowledge.
      additionalProperties: false
      required: [serverTime, node, configured, status, acknowledgedRevision, acknowledgedAt]
      properties:
        serverTime:
          type: string
          format: date-time
        node:
          type: string
        configured:
          type: boolean
        status:
          type: string
          enum: [catalog-current, catalog-stale]
        acknowledgedRevision:
          type: string
        currentRevision:
          type: string
        acknowledgedAt:
          type: string
          format: date-time
    CueCatalogDeployRequest:
      type: object
      description: >-
        The body of POST /nodes/{nodeId}/cue-catalog/deploy. Carries only
        an idempotency key - the catalog itself is always THIS
        coordinator's own current resolution, never a request field.
      additionalProperties: false
      properties:
        idempotencyKey:
          type: string
          description: >-
            Optional; a fresh key is minted server-side when omitted. A
            replayed key dispatches nothing and returns the original
            command's own result, flagged `replay: true`.
    CueCatalogDeployResponse:
      type: object
      description: The body of a successful (200) response from the deploy endpoint.
      required: [serverTime, command]
      additionalProperties: false
      properties:
        serverTime:
          type: string
          format: date-time
        command:
          $ref: "#/components/schemas/CueCatalogDeployResult"
    CueCatalogDeployResult:
      type: object
      description: >-
        What happened to one dispatched (or replayed) cuecatalog.deploy
        command. outcome is never "successful" merely because the publish
        to the node succeeded (ADR-003): it is decided by the node's own
        result, which independently recomputes the catalog revision before
        reporting it.
      required:
        [commandId, idempotencyKey, node, replay, show, generation,
         revision, outcome, dispatchedAt]
      additionalProperties: false
      properties:
        commandId:
          type: string
        idempotencyKey:
          type: string
        node:
          type: string
        replay:
          type: boolean
          description: >-
            True when this response answers a REPLAYED idempotency key:
            the command described here was NOT dispatched by this
            request - it is the ORIGINAL command's already-recorded
            result.
        show:
          type: string
        generation:
          type: integer
        revision:
          type: string
          description: The catalog revision this coordinator resolved and dispatched.
        outcome:
          type: string
          enum: ["confirmed", "unconfirmed", "refused", "failed", ""]
          description: >-
            Empty only for a REPLAY response returned before the original
            request's own dispatch/confirmation has finished - the same
            accepted-empty case FPPCommandResult.outcome documents, a
            real, honest value (ADR-020's absence-is-stated rule), not an
            omission.
        reason:
          type: string
        acknowledgedRevision:
          type: string
          description: >-
            The revision the node reported holding after this deploy.
            Present only when outcome is "confirmed".
        dispatchedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Null for a command whose publish has not completed, or whose
            publish failed before reaching the wire.
        resolvedAt:
          type: [string, "null"]
          format: date-time
