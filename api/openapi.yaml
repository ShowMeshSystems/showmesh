    ConfigShowActionMQTTPublish:
      type: object
      description: >-
        The STORED/READ shape of show.action.target.publish (STEP-9-SPEC.md
        section 5.3), present only when target.integration is "mqtt".
        retain is always the resolved value here, never absent. To submit
        a publish target, use ConfigShowActionMQTTPublishWrite instead,
        which allows retain to be absent.
      required: [topic, payload, qos, retain]
      properties:
        topic:
          type: string
          minLength: 1
        payload:
          type: string
        qos:
          type: integer
          enum: [0, 1, 2]
        retain:
          type: boolean
    ConfigShowActionMQTTPublishWrite:
      type: object
      description: >-
        The WRITE shape of show.action.target.publish. Identical to
        ConfigShowActionMQTTPublish except that retain is not required: an
        absent key defaults to false, while a present `null` is rejected
        as invalid — the same absent-defaults rule ConfigShowActionWrite's
        own description field and ConfigShowMacroStepWrite's
        onFailure/onUnconfirmed use. The response to a successful write is
        always the resolved ConfigShowActionMQTTPublish shape, never this
        one.
      required: [topic, payload, qos]
      properties:
        topic:
          type: string
          minLength: 1
        payload:
          type: string
        qos:
          type: integer
          enum: [0, 1, 2]
        retain:
          type: boolean
    ConfigShowActionMQTTExpect:
      type: object
      description: >-
        show.action.target.expect (STEP-9-SPEC.md section 7.3), present
        only when target.integration is "mqtt". topic, value, and
        deadlineSeconds are omitted entirely for kind "none", which
        declares no expected response at all. This same schema is used for
        both the GET and the PUT request body: a GET response, PUT back
        unchanged, always validates. Only kind is required by THIS schema;
        topic and deadlineSeconds are required, and value is present or
        absent per kind's own rule (see value's own description), for
        every kind other than "none" — enforced by this coordinator's
        write-time validation rather than by this schema, matching
        ConfigShowActionTarget's identical escape one level up.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [none, boolean, number, text, match]
        topic:
          type: string
          minLength: 1
        value:
          type: string
          description: >-
            Present only for kind "number" (optional — an absent value
            accepts receipt with no equality check) and kind "match"
            (required; an empty string is a valid, distinct match target).
            Never present for "none", "boolean", or "text". Always a JSON
            string on the wire in both directions, including for kind
            "number": the string is the operator's own typed text (e.g.
            "42"), validated as parseable as a number but stored and
            returned verbatim, never reformatted through a float — a JSON
            number that round-trips through a float64 is not guaranteed to
            come back byte-identical. A JSON number literal is rejected
            for kind "number": this field has exactly one wire
            representation per kind, not two.
        deadlineSeconds:
          type: integer
          minimum: 1
          maximum: 120
