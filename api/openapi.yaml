        seam B2c, ADR-039): the body PUT /config/render.settings accepts
        (a full replacement - every field required and non-null), and the
        "payload" member of GET /config/render.settings' response.
        `idleOutput` is what a surface draws while the MultiSync timeline is
        stopped, opened, or unknown (TRACK-B-BUILD-CONTRACT.md ruling 3 -
        sync loss changes the picture, never the sender).
      required: [idleOutput, restartPolicy]
