  /nodes/{nodeId}/audio/sessions/{sessionId}/gain/fade:
    post:
      operationId: dispatchAudioGainFade
      summary: Dispatch audio.gain.fade to a node's playback session
      description: >-
        Behind `audio:command`. Sets the session's CONFIGURED gain to
        `params.targetGainDb` immediately, clamped to the
        session's ceiling, and schedules a fade toward it over
        `params.durationMs` along `params.curve` (only `"linear"`
        ships - that names the fade SHAPE, not the gain unit).
        `params.targetGainDb` is in DECIBELS: `0` is unity, `-6.02` is
        half amplitude, `-60` and below is silence, and `+12` is the most
        this accepts. The coordinator converts it to the engine's linear
        amplitude multiplier once, at its own boundary. The pre-decibel
        `params.targetGain` is refused by name, naming
        `params.targetGainDb` as its replacement.
        While the session is muted or ducked, the ramp actually
        dispatched to the output targets that suppression's own level,
        not `params.targetGainDb`: the configured gain this call records
        is what the node returns to once every such reason releases, but
        the fade itself never bypasses an active mute or duck. This
        response reports the fade as DISPATCHED, never as complete -
        `fade_complete` is an outcome the engine reports only once it
        observes the gain it was actually dispatched toward reached,
        never inferred from the requested duration having elapsed,
        because Track F's transition barrier is built on that
        distinction. A `200` response is never itself
        success: `command.outcome` is the only place that is decided, and
        it is commonly `"unconfirmable"` today because the pipeline
        backend behind this seam's session engine is an open owner
        decision - every dispatch against the shipped agent reports
        `"unconfirmable"` with a reason, which is a real, expected
        outcome and not a transport failure. See AudioSessionCommandResult.outcome.
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioGainFadeRequest"
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioSessionCommandResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: >-
            Two DISTINCT causes, decided in this order: (1) `idempotencyKey`
            was already used for a command whose `action` differs from
            this one - never answered as if it belonged to whichever
            command first claimed the key; (2) the SAME action but
            DIFFERENT `params`/`revision` - also a conflict, never a
            replay. Mint a fresh `idempotencyKey` for a genuinely new
            request.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AudioCommandAuditUnavailable"
  /nodes/{nodeId}/audio/sessions/{sessionId}/output/mute:
    post:
      operationId: dispatchAudioOutputMute
      summary: Dispatch audio.output.mute to a node's playback session
      description: >-
        Behind `audio:command`. Marks the session muted and drives its
        output to silence, without changing its configured gain: mute
        and a duck from a higher-priority announcement are independent
