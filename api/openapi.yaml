  /nodes/{nodeId}/audio/sessions/{sessionId}/gain:
    post:
      operationId: dispatchAudioGainSet
      summary: Dispatch audio.gain.set to a node's playback session
      description: >-
        Behind `audio:command`. Sets the session's CONFIGURED gain,
        clamped to its ceiling. `params.gainDb` is in DECIBELS: `0` is
        unity, `-6.02` is half amplitude, `-60` and below is silence, and
        `+12` is the most this accepts. The coordinator converts it to
        the engine's linear amplitude multiplier once, at its own
        boundary; the node and the engine below it stay linear
        (AUDIO-ENGINE.md). The pre-decibel `params.gain` is refused by
        name, naming `params.gainDb` as its replacement, because the two
        units share a number range and a `0.5` meant for a halving would
        otherwise dispatch as a half-decibel lift. The ceiling is enforced at the point a gain
        takes effect, not only at validation, and a clamp is reported as
        evidence rather than silently applied. While the session is
        muted or ducked by a higher-priority announcement, this
        configured gain is what the node returns to once every such
        reason releases; it does not reach the output immediately in
        that case, because a mute or a duck must never be bypassed by an
        operator's own gain change. A `200` response is never itself
        success: `command.outcome` is the only place that is decided, and
        it is commonly `"unconfirmable"` today because the pipeline
        backend behind this seam's session engine is an open owner
        decision - every dispatch against the shipped agent reports
        `"unconfirmable"` with a reason, which is a real, expected
        outcome and not a transport failure. See AudioSessionCommandResult.outcome.
