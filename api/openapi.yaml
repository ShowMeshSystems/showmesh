        sight of the lifecycle state. Distinct from
        `/config/night.session/{id}` (the AUTHORED definition a session
        pins): this is the RUNNING controller's own persisted state, a
        dedicated closed state machine, never observed evidence and never
        a general workflow.


        If no session has ever been created (the coordinator has never
        seen `prepare-site`), this still answers `200` with
        `session.state` = `"inactive"` and every identity field empty,
        rather than `404` - "no session yet" is itself a real, renderable
        state.
      responses:
