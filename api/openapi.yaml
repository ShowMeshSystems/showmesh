  /fpp/{instanceId}/commands:
    post:
      operationId: dispatchFPPCommand
      summary: Dispatch a primitive FPP lifecycle command (Step 7 seam C, Step 8)
      description: >-
        Behind `fpp:command` (ADR-024 decision 4). Dispatches FPP's own
        native command over POST at its own /api/command endpoint
        (ADR-001: this is ShowMesh invoking FPP's own command, never a
        second scheduler) and confirms by evidence against the collector's
        observations before answering, up to an internal, per-action
        deadline (ADR-003). A `200` from FPP is never reported as this
        endpoint's own success on its own - see FPPCommandResult.outcome. A
        cookie-authenticated request additionally requires
        `Sec-Fetch-Site: same-origin` (ADR-024 decision 6, `403` on
        absence, same Problem schema as a missing-scope `403`); a
        bearer-token-authenticated request is exempt.

        `idempotencyKey` is resolved FIRST, before `startPlaylist`'s own
        `ifBusy` guard (or any other primitive's pre-dispatch guard) ever
        runs - a review finding proved live that the reverse order answers
        a legitimate replay with a fresh `409` the guard invented for what
        it wrongly evaluated as a brand-new request. A replayed
        `idempotencyKey` - reused against the SAME `action`, the SAME
        `instanceId`, and the SAME normalized `params` it was first used
        against - dispatches nothing and returns the original command's
        result, flagged `replay: true`, with no guard evaluated at all. An
        `idempotencyKey` reused against a DIFFERENT `action`, a DIFFERENT
        `instanceId`, or DIFFERENT `params` is a `409` conflict, not a
        replay, also decided before any guard runs: see the
        `idempotencyKey` field on any FPPCommandRequest variant below (the
        text is identical on all eight) and the `409` response below. Only
        a genuinely NEW `idempotencyKey` - one this coordinator has never
        recorded - reaches a primitive's own guard at all.

        `startPlaylist`'s own `ifBusy` default (`"refuse"`) additionally
        produces a `409` BEFORE anything is dispatched to FPP when a
        DIFFERENT playlist is currently confirmed playing (`type`
        `fpp-start-playlist-busy`, `detail` names what is playing), or when
        the evidence needed to decide that is not current (`type`
        `fpp-start-playlist-evidence-not-current` - this coordinator never
        proceeds on the grounds that it could not tell) - two DIFFERENT
        `type` values on the same `409` status, neither of them the plain
        `conflict` the idempotency-key case above uses, so a client can
        tell all three apart without parsing `detail` prose; see
        StartPlaylistCommandRequest.params's own description. This is a
        guard against an accidental interruption, not a lock: it is
        evaluated against evidence that can be stale, and cannot prevent a
        race against FPP's own scheduler.
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
          description: Same ID syntax as a node ID (contract section 7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FPPCommandRequest"
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FPPCommandResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: >-
            Three DISTINCT causes, three DISTINCT `type` values, decided in
            this order (see this operation's own description): (1)
            `idempotencyKey` was already used for a command whose `action`,
            `instanceId`, or normalized `params` differs from this
            request's own - a conflict, not a replay, `type` `conflict`,
            remedy "mint a fresh key"; decided BEFORE either guard below
            ever runs. Only once the key is confirmed genuinely new does
            `startPlaylist`'s own `ifBusy` guard get to refuse: (2) a
            DIFFERENT playlist is confirmed playing, `type`
            `fpp-start-playlist-busy`, remedy "resend with
            ifBusy: replace"; or (3) the evidence needed to decide that is
            not current, `type` `fpp-start-playlist-evidence-not-current`,
            remedy "retry once evidence is current, or resend with
            ifBusy: replace if interrupting is intended". No two of these
            three share a `type`, specifically so a client branches on
            `type`, never on `detail` prose, since (1)'s remedy is the
            OPPOSITE of (2)'s and (3)'s.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            ADR-024 decision 11's fail-closed default: this action is not
            a member of decision 11's blackout/stop/power-off safety
            class, and the pre-dispatch write that must durably record a
            command before it is dispatched could not be appended to this
            coordinator's audit store. `type`
            `fpp-command-refused-audit-unavailable`. Nothing was recorded
            and nothing was dispatched to FPP; retry once the audit store
            is writable again.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /observations:
    get:
      operationId: listObservations
      summary: Flat observation list
      description: >-
        Every observation this coordinator currently holds, across every
        resource, optionally filtered. A filter that matches nothing
        returns `200` with an empty `observations` array - "no observations
        match this filter" is not "this endpoint does not exist", so this
        is never a `404`.
      parameters:
