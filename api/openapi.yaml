    RenderSettingsConfigResponse:
      type: object
      description: >-
        The body of GET and PUT /config/render.settings. Never `404`s: the
        payload has a well-defined default, reported with `revision` `0` and
        `source` `"default"` when nothing has ever been written, mirroring
        ResolumeRecoveryConfigResponse's identical posture.
      required:
        [serverTime, kind, revision, payload, updatedAt,
         createdByPrincipalId, createdByPrincipalName, source,
