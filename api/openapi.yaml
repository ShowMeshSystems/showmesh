    FPPObservationsChangedEvent:
      type: object
      description: >-
        The payload of an `fpp.observations.changed` event (ADR-023),
        delivered only to a connection that opted into delta frames via
        `GET /stream?deltas=1`. `changed` is never null and carries the
        full `Evidence` envelope - exactly the shape an element of
        `FPPInstance.observations` would have - for every signal on this
        instance whose resolved evidence differs from what this connection
        has already been told; it never repeats a signal whose resolved
        evidence is unchanged from last time. `removed` is never null and
        carries the signal IDs (bare strings, not `Evidence` envelopes) of
        every observation this connection has previously been told about
        for this instance that no longer exists at all - a cape swapped
        for a smaller one, a renamed port, a sensor that stopped being
        reported. A client applying `removed` MUST delete those signals
        from its own merged baseline; without that, the baseline
        accumulates observations the coordinator no longer has. At least
        one of `changed`/`removed` is always non-empty: an instance with
        nothing to report this render pass produces no
        `fpp.observations.changed` event at all. This event is always
        paired with `instanceId`, unlike `FPPChangedEvent`, which nests
        its instance identity inside `instance` - an observations-only
        delta has no full instance object to carry it in otherwise.
        Structural, non-observation changes to an instance (health,
        endpoint, lastPollAt, lastPollError) continue to arrive as
        `fpp.changed` for a delta-subscribed connection too - this event
        exists only for a change confined to `observations`.
      required: [seq, serverTime, instanceId, changed, removed]
      properties:
        seq:
          type: integer
          description: Per-connection only; never a durable cursor.
        serverTime:
          type: string
          format: date-time
        instanceId:
          type: string
        changed:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        removed:
          type: array
          items:
            type: string
    ConfigObjectSummary:
      type: object
      description: >-
        Step 9 (STEP-9-SPEC.md section 5.5): one element of
        ConfigObjectsListResponse.objects - enough to enumerate and label
        every show.action or show.macro object without fetching each one's
        full payload.
      required: [id, label, show, currentRevision, updatedAt]
      properties:
        id:
          type: string
        label:
          type: string
        show:
          type: string
        currentRevision:
          type: integer
        updatedAt:
          type: string
          format: date-time
    ConfigObjectsListResponse:
      type: object
      description: >-
        The body of GET /config/show.action, GET /config/show.macro, GET
        /config/show, GET /config/show.surface, GET /config/show.cue, GET
        /config/show.playlist, GET /config/night.session, and GET
        /config/audio.node (audio.node's own list summary reports its
        configured programRoute as label and leaves show empty, since
        audio.node carries no show reference).
      required: [serverTime, kind, objects]
      properties:
        serverTime:
          type: string
          format: date-time
        kind:
          type: string
          enum: [show.action, show.macro, show, show.surface, show.cue, show.playlist, night.session, audio.node]
        objects:
          type: array
          items:
            $ref: "#/components/schemas/ConfigObjectSummary"
    ConfigShowActionMQTTPublish:
      type: object
      description: >-
        The STORED/READ shape of show.action.target.publish (STEP-9-SPEC.md
        section 5.3), present only when target.integration is "mqtt".
        retain is always the resolved value here, never absent. To submit
        a publish target, use ConfigShowActionMQTTPublishWrite instead,
        which allows retain to be absent.
      required: [topic, payload, qos, retain]
      properties:
        topic:
          type: string
          minLength: 1
        payload:
          type: string
        qos:
          type: integer
          enum: [0, 1, 2]
        retain:
          type: boolean
    ConfigShowActionMQTTPublishWrite:
      type: object
      description: >-
        The WRITE shape of show.action.target.publish. Identical to
        ConfigShowActionMQTTPublish except that retain is not required: an
        absent key defaults to false, while a present `null` is rejected
        as invalid - the same absent-defaults rule ConfigShowActionWrite's
        own description field and ConfigShowMacroStepWrite's
        onFailure/onUnconfirmed use. The response to a successful write is
        always the resolved ConfigShowActionMQTTPublish shape, never this
        one.
      required: [topic, payload, qos]
      properties:
        topic:
          type: string
          minLength: 1
        payload:
          type: string
        qos:
          type: integer
          enum: [0, 1, 2]
        retain:
          type: boolean
    ConfigShowActionMQTTExpect:
      type: object
      description: >-
        show.action.target.expect (STEP-9-SPEC.md section 7.3), present
        only when target.integration is "mqtt". topic, value, and
        deadlineSeconds are omitted entirely for kind "none", which
        declares no expected response at all. This same schema is used for
        both the GET and the PUT request body: a GET response, PUT back
        unchanged, always validates. Only kind is required by THIS schema;
        topic and deadlineSeconds are required, and value is present or
        absent per kind's own rule (see value's own description), for
        every kind other than "none" - enforced by this coordinator's
        write-time validation rather than by this schema, matching
        ConfigShowActionTarget's identical escape one level up.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [none, boolean, number, text, match]
        topic:
          type: string
          minLength: 1
        value:
          type: string
          description: >-
            Present only for kind "number" (optional - an absent value
            accepts receipt with no equality check) and kind "match"
            (required; an empty string is a valid, distinct match target).
            Never present for "none", "boolean", or "text". Always a JSON
            string on the wire in both directions, including for kind
            "number": the string is the operator's own typed text (e.g.
            "42"), validated as parseable as a number but stored and
            returned verbatim, never reformatted through a float - a JSON
            number that round-trips through a float64 is not guaranteed to
            come back byte-identical. A JSON number literal is rejected
            for kind "number": this field has exactly one wire
            representation per kind, not two.
        deadlineSeconds:
          type: integer
          minimum: 1
          maximum: 120
    ConfigShowActionTarget:
      type: object
      description: >-
        The STORED/READ shape of show.action.target (STEP-9-SPEC.md
        section 5.3): integration plus either the fpp, mqtt, or resolume
        fields directly, never nested a second level under an
        "fpp"/"mqtt"/"resolume" key. Only integration is required here;
        which of the remaining fields is present depends on integration's
        own value, enforced by this coordinator's write-time validation
        rather than by this schema. publish, when present, is always the
        resolved ConfigShowActionMQTTPublish shape. ref carries ADR-037's
        named-reference vocabulary (clip, deck, layer, column, persistent,
        bypassed, master) - never a Resolume object id. To submit a
        target, use ConfigShowActionTargetWrite instead.
      required: [integration]
      properties:
        integration:
          type: string
          enum: [fpp, mqtt, resolume, audio]
        instanceId:
          type: string
          minLength: 1
        primitive:
          type: string
          minLength: 1
        params:
          type: object
          description: >-
            An fpp primitive's own decoded params, or (audio-only) that
            audio operation's own command params, passed through
            undecoded to the node exactly as a direct audio.session.*/
            audio.gain.*/audio.output.* API call's own params would be.
          additionalProperties: true
        broker:
          type: string
          minLength: 1
        publish:
          $ref: "#/components/schemas/ConfigShowActionMQTTPublish"
        expect:
          $ref: "#/components/schemas/ConfigShowActionMQTTExpect"
        action:
          type: string
          description: >-
            resolume-only: one of the seven Track D D-3 action names
            (launchClip, clearLayer, blackout, launchColumn, selectDeck,
            setLayerBypass, setLayerMaster).
          minLength: 1
        ref:
          type: object
          description: >-
            resolume-only: ADR-037's named-reference vocabulary for this
            action. Every key is a reference or a value from a closed,
            per-action list, enforced by this coordinator's write-time
            validation rather than by this schema.
          additionalProperties: true
        audioNodeId:
          type: string
          description: "audio-only: the target audio node id."
          minLength: 1
        audioSessionId:
          type: string
          description: "audio-only: the target pkg/audio session id."
          minLength: 1
        audioAction:
          type: string
          description: >-
            audio-only: one of the reserved audio.session.*/audio.gain.*/
            audio.output.* operation names (docs/build/IDENTIFIER-REGISTER.md's
            "Agent operation names" table) - never a new operation name.
            `params` is otherwise opaque here and validated by the node,
            with one exception: `audio.gain.set` requires `params.gainDb`
            and `audio.gain.fade` requires `params.targetGainDb`, both in
            DECIBELS on the same scale as the gain endpoints (0 dB unity,
            -60 dB silence, +12 dB the most accepted). The pre-decibel
            `params.gain`/`params.targetGain` are refused here at
            authoring time, naming the replacement, rather than
            discovered when the Cue fires mid-show.
          minLength: 1
    ConfigShowActionTargetWrite:
      type: object
      description: >-
        The WRITE shape of show.action.target. Identical to
        ConfigShowActionTarget except that publish, when present, is
        ConfigShowActionMQTTPublishWrite, which allows retain to be
        absent. The response to a successful write is always the resolved
