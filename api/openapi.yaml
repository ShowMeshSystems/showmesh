      summary: One specific night session by its own id (Track F seam F2)
      description: >-
        Same open-read posture as `/night/session`. Every session that has
        ever been created remains reachable by id (a new `prepare-site`
        after `stopped` creates a NEW session/epoch; this is how a prior
        night's own record stays inspectable).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
