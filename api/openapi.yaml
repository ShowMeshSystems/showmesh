    Problem:
      type: object
      description: >-
        RFC 9457 application/problem+json. serverTime is an extension
        member present on every problem this API produces, with no
        exception (section 6.2 and 6.6). supportedVersions is present only
        on an "unsupported-api-version" problem. type is a stable,
        documented identifier a client dispatches on - the values in its
        enum below are every class this coordinator currently produces,
        and this list is the single source of truth for that set. It is
        deliberately not a fetchable URI: nothing in this API or its tests
        dereferences it over the network.


        Step 9 (STEP-9-SPEC.md) adds fifteen more, in two groups. Twelve
        are internal/coordinator/config's ValidationError.Code values,
        mapped mechanically onto their own "show-config-*" type by
        internal/coordinator/api's mapValidationError (showconfig.go) - a
        client that must tell two refusals on a show.action/show.macro
        write apart branches on type, never on detail's prose. Three are
        the macro run surface's own conflicts (ADR-031 decisions 2 and 6,
        STEP-9-SPEC.md section 6.2): "macro-run-already-in-flight" (a
        second run of a macro already running, 409, naming the in-flight
        run in detail), "macro-run-idempotency-macro-conflict" (the same
        idempotency key reused for a different macro, 409), and
        "macro-run-idempotency-revision-conflict" (the same key reused for
        the same macro at a different pinned revision - the macro was
        edited between two submissions under one key, 409) - minted by
        internal/coordinator/macro (which imports this package; see
        macro_seam.go), never by this package itself.


        Four of the fifteen are ADR-024: "forbidden" (401 means no valid
        credential, this means authenticated but missing a scope - the
        detail text names the missing scope), "csrf-rejected" (a
        cookie-authenticated write with no `Sec-Fetch-Site: same-origin`
        header, decision 6), "too-many-requests" (decision 8's login
        concurrency bound, paired with a `Retry-After` response header),
        and "credential-in-url" (decision 1: a request whose query string
        carried a credential). One is "conflict": the request is valid but
        this coordinator's current state makes it unsafe or meaningless to
        act on right now - shared by `PUT /config/fpp.endpoints` (Step 7
        seam A, refused because `SHOWMESH_FPP_ENDPOINTS` is still set in
        the coordinator's own environment, RES-008 D1),
        `POST /discovery/runs` (Step 7 seam B, refused while a run is
        already in progress), and a `commands` idempotency key reused
        against a different action, target, or (as of Step 8) normalized
        params (Step 7 seam C, extended by Step 8) - `detail` names which.
        Three are Step 8's own additions, all scoped to
        `POST /fpp/{instanceId}/commands`: "fpp-command-refused-audit-unavailable"
        (ADR-024 decision 11's fail-closed default for a non-safety-class
        primitive, `503`, when the pre-dispatch audit write could not be
        made), "fpp-start-playlist-evidence-not-current"
        (`startPlaylist`'s own `ifBusy=refuse` guard refusing because the
        evidence it would need to decide whether a different playlist is
        running is not itself current, `409`), and "fpp-start-playlist-busy"
        (that same guard refusing because a DIFFERENT playlist IS
        confirmed currently playing, `409`) - kept as three DISTINCT
        `409`/`503` types (not sharing "conflict", and not sharing each
        other) specifically so a client branches on `type` rather than
        parsing `detail` prose: "mint a fresh key" (idempotency conflict),
        "resend with ifBusy: replace" (busy), and "retry once evidence is
        current, or resend with ifBusy: replace if interrupting is
        intended" (evidence not current) are three different remedies, and
        a review finding caught that the busy/evidence-not-current split
        had left "busy" still sharing a type with the idempotency case even
        after the evidence-not-current case was split out.
        One is Track D seam D-2a's own addition: "payload-too-large" (413,
        POST /config/resolume/composition refusing an uploaded file larger
        than this coordinator's own upload bound, before buffering it
        whole; reused verbatim, not duplicated, by POST /resolume/actions
        for a request body over its own much smaller limit - Review fix 5,
        2026-08-15 - because both refusals share the identical remedy,
        "shrink the request", unlike the busy/evidence-not-current split
        above where the type had to fork because the remedies differ). One
        is Track D seam D-3/B's own addition:
        "resolume-action-refused-audit-unavailable" (POST /resolume/actions'
        own ADR-024 decision 11 fail-closed default for a non-exempt
        action - every action except `blackout` and `clearLayer` - `503`,
        mirroring "fpp-command-refused-audit-unavailable" exactly, for a
        second vendor's command surface). One is Track E seam E7-1's own
        addition: "action-invoke-refused-audit-unavailable"
        (POST /actions/{id}/invocations' own ADR-024 decision 11
        fail-closed default for an action whose stored safetyClass is
        "none"). Three are Track C's own additions, all scoped to
        PUT /config/audio.node/{id}: "audio-node-channel-duplicate" (a
        channel index reused within programChannels, or repeated within
        ltcChannel), "audio-node-channel-overlap" (ltcChannel naming a
        channel already claimed by programChannels), and
        "audio-node-route-mismatch" (programRoute and ltcRoute naming the
        same device route). Two are this contract's own additions, both scoped to
        `POST /integrations/fpp/playlist-entry-observations`:
        "unsupported-observation-schema-version" (`schemaVersion` is not
        `1`, `400`) and "observation-entry-key-mismatch" (the coordinator
        re-derived `entryKey` from the submitted identity fields and it
        disagreed with what was sent, `400`) - kept distinct from
        "invalid-parameter" because both name a specific, differently
        remediable disagreement rather than an ordinary malformed field.
      required: [type, title, status, detail, serverTime]
      properties:
        type:
          type: string
          format: uri
          enum:
