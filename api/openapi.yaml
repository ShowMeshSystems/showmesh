        conflictingRunId:
          type: string
          description: >-
            The macro run this problem is about. Present on the three
            macro-run conflicts and on nothing else: the in-flight run that
            refused an overlapping submission, or the existing run an
            idempotency key already belongs to. It is a field rather than
            something a client digs out of detail, because a 409 whose
            whole purpose is to point at a run is useless to a client that
            cannot link to it, and matching a substring of this server's
            English is how the Operator UI once told two different 409s
            apart. Additive and omitted when empty.
