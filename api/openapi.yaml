          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionBindingsResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /actions/{id}/invocations:
    post:
      operationId: invokeAction
      summary: Invoke one stored show.action by id (Track E seam E7-1, ADR-037 decision 8)
      description: >-
        Behind `show:action:invoke`. The request carries only an
        idempotency key: the stored action's own target supplies every
        parameter, so a caller cannot pass a protocol address, topic, or
        path here (that raw hatch is ADR-029 decision 3's own, separately
        queued, deliberately inconvenient escape valve, not this
        endpoint) - a body naming any key other than `idempotencyKey` is
        refused (`400`), never silently ignored. Dispatches through the
        exact same in-process seams
        `internal/coordinator/macro`'s own step dispatch uses. A cookie-
        authenticated request additionally requires
        `Sec-Fetch-Site: same-origin` (ADR-024 decision 6); a bearer-
        token-authenticated request is exempt.

        `idempotencyKey` is resolved first: a replayed key against the
        SAME action id dispatches nothing and returns the original
        result, flagged `replay: true`. A key reused against a DIFFERENT
        action id is a `409` conflict. `blackout`/`stop`/`powerOff`-classed
        actions (read from the stored action's own `safetyClass`) are
        exempt from ADR-024 decision 11's fail-closed audit rule; every
        other action fails closed (`503`, nothing dispatched) under the
        identical condition.

        `requestedRevision` optionally pins the exact show.action revision
        to execute: a durable/queued caller names the revision it queued
        against, so activating a
        newer revision after the cue was queued never changes what runs.
        An interactive caller may omit it to mean "whichever revision is
        active right now". Either way, the response's `result.revision`
        states which revision actually executed.
      parameters:
        - name: id
          in: path
          required: true
          description: The show.action object id to invoke.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionInvocationRequest"
      responses:
        "200":
          description: OK
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionInvocationResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: >-
            `idempotencyKey` was already used for a different action id -
            `type` `conflict`, remedy "mint a fresh key".
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            ADR-024 decision 11's fail-closed default: this action's own
            safetyClass is "none", and the pre-dispatch write that must
            durably record it before dispatch could not be appended to
            this coordinator's audit store. `type`
            `action-invoke-refused-audit-unavailable`. Nothing was
            recorded and nothing was dispatched; retry once the audit
            store is writable again.
          headers:
            ShowMesh-API-Version:
              $ref: "#/components/headers/ShowMesh-API-Version"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /macros/{id}/runs:
    post:
      operationId: submitMacroRun
      summary: Submit a macro run (Step 9, STEP-9-SPEC.md section 6.6, ADR-031)
      description: >-
        Requires `show:macro:run` specifically (never satisfied by
        `config:write` alone - an admin who has never been granted
        `show:macro:run` may not fire a show through a different scope).
        `202`, never `200` or `201`: the run is accepted and not complete
        (ADR-031 decision 1). The body is the run's initial state, so a
        client that never watches still holds the run id and the pinned
        macro/action revisions; the outcome is learned by GET
        /macro-runs/{runId} or the `macroRun.changed` change-stream event,
        never by waiting on this response. `idempotencyKey` governs a
        three-way replay rule (STEP-9-SPEC.md section 6.2): the same key
        with the same macro at the same pinned revision replays (returns
        the existing run, `replay: true`, not a new one); the same key
        against a different macro, or the same macro at a different
        pinned revision, is each its own distinct `409`. A second run of
        the same macro already in flight is refused `409` naming the
        in-flight run (ADR-031 decision 6).
      parameters:
        - name: id
          in: path
          required: true
