    MacroRunStepCommand:
      type: object
      description: >-
        States the FPP command a step dispatched, or explicitly why no
        command detail is available — never omitted (STEP-9-SPEC.md
        section 6.1's "not retained" rendering rule). state is "none" (no
        command at all — an mqtt step, or an fpp step not yet dispatched),
        "retained" (detail carries the command), or "not_retained"
        (retention has pruned the command row; id is still named).
      required: [state]
      properties:
        state:
          type: string
          enum: [none, retained, not_retained]
        id:
          type: string
        reason:
          type: string
        detail:
          $ref: "#/components/schemas/FPPCommandResult"
    MacroRunStep:
      type: object
      description: >-
        One element of MacroRun.steps. state is the step's own dispatch
        lifecycle: "pending" (not yet touched), "resolved" (an outcome was
        recorded), or "skipped" (an abort left this step never attempted)
        — a closed, three-member vocabulary. There is no "dispatched"
        intermediate: this package's own executor always resolves a step
        to a terminal outcome before it is ever written, so a value this
        producer cannot emit is not published here (a prior "dispatched"
        enum member was removed by review for exactly that reason).
        outcome is null while state is "pending" — most visibly, every
        202 response from POST /macros/{id}/runs carries the full,
        just-created step list with outcome null on every step, since
        none has executed yet — and otherwise one of "confirmed",
        "unconfirmed", "unconfirmable", "failed", "skipped": section
        6.4's exact five-member vocabulary, also closed. A blank string
        was considered and rejected: MacroRunSummary's own
        completed/confirmed are null rather than defaulted to false for an
        unresolved run specifically so a "not decided yet" state never
        reads as a definite, premature verdict, and an empty outcome
        string here would be that same premature verdict spelled as
        whitespace.
        outcomeState is a free-form, opaque status code and is
        intentionally NOT enumerated or otherwise typed: in practice it is
        drawn from at least four different, independently-evolving
        vocabularies depending on integration and on how resolution ended
        (the FPP dispatch seam's own evidence-state codes; a distinct set
        of MQTT response-contract codes; a handful of ad hoc codes this
        package emits itself for conditions neither of those cover; and
        reuse of this same struct's own "skipped"), so a mapping from
        producer to vocabulary would already be wrong the next time any
        one of them changes and is not published. Two of its values
        already collide by spelling with values in DIFFERENT fields on
        this same struct ("confirmed" also appears as an outcome value,
        "skipped" also appears as a state value) without meaning the same
        thing, so treat outcomeState as opaque, never compare it across
        fields, and render outcomeReason for a human — per the rule that a
        client ignores what it does not recognise.
      required:
        [stepIndex, stepId, actionObjectId, actionRevision, integration,
         safetyClass, localFallbackClass, state, dispatchedAt, resolvedAt,
         outcome, outcomeState, outcomeReason, attributionDegraded, command]
      properties:
        stepIndex:
          type: integer
        stepId:
          type: string
        actionObjectId:
          type: string
        actionRevision:
          type: integer
        integration:
          type: string
          enum: [fpp, mqtt]
        safetyClass:
          type: string
          enum: [none, blackout, stop, powerOff]
        localFallbackClass:
          type: string
          enum: [none, coordinator-required, silence]
        state:
          type: string
          enum: [pending, resolved, skipped]
        dispatchedAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
        outcome:
          type: [string, "null"]
          enum:
            [null, confirmed, unconfirmed, unconfirmable, failed, skipped]
        outcomeState:
          type: string
        outcomeReason:
          type: string
        attributionDegraded:
          type: boolean
        command:
          $ref: "#/components/schemas/MacroRunStepCommand"
    MacroRun:
