        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /events:
    get:
      operationId: listEvents
      summary: Event history
      description: >-
        Event history in ascending `seq` order. See this document's
        top-level description for what `gap: true` means; it is a
        successful response describing an incomplete answer, never an
        error.
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: >-
