      required: [id, name, nameGenerated, closed, clipCount]
      properties:
        id:
          type: string
        name:
          type: string
        nameGenerated:
          type: boolean
        closed:
          type: boolean
        clipCount:
          type: integer
    ResolumeCompositionSummary:
      type: object
      description: >-
        What the coordinator parsed from an uploaded composition file, in
        terms an operator recognizes — never a bare success flag (ADR-032
        decisions 7 and 8). Shared verbatim between
        POST /config/resolume/composition's own response and the
        "composition" member of GET /config/resolume/composition.
      required:
        [name, sourceFilename, contentHash, sizeBytes, writtenBy, canvas,
         decks, layerCount, layerGroupCount, columnCount, clipCount,
         persistentClipCount]
      properties:
        name:
          type: string
        sourceFilename:
          type: string
        contentHash:
          type: string
        sizeBytes:
          type: integer
        writtenBy:
          $ref: "#/components/schemas/ResolumeCompositionWrittenBy"
        canvas:
          $ref: "#/components/schemas/ResolumeCompositionCanvas"
        decks:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionDeckSummary"
        layerCount:
          type: integer
        layerGroupCount:
          type: integer
        columnCount:
          type: integer
        clipCount:
          type: integer
        persistentClipCount:
          type: integer
    ResolumeCompositionUploadResponse:
      type: object
      description: The body of a successful POST /config/resolume/composition.
      required: [serverTime, revision, activatedAt, composition]
      properties:
        serverTime:
          type: string
          format: date-time
        revision:
          type: integer
        activatedAt:
          type: string
          format: date-time
        composition:
          $ref: "#/components/schemas/ResolumeCompositionSummary"
    ResolumeCompositionLayerGroup:
      type: object
      description: >-
        One element of ResolumeCompositionResponse.layerGroups. index is
        the group's position among the file's own <Group> elements in
        document order, which is what
        ResolumeCompositionLayer.layerGroupIndex refers to.
      required: [id, index]
      properties:
        id:
          type: string
        index:
          type: integer
    ResolumeCompositionLayer:
      type: object
      description: >-
        One element of ResolumeCompositionResponse.layers, deck-independent
        (ADR-032 decision 6 — only a clip's resolution depends on its deck
        being selected). layerGroupIndex is absent from the wire entirely,
        never sent as null, when the composition has no layer groups at
        all. When present, it is the layer's own layerGroup value taken
        as-is from the uploaded composition file — NOT validated to be
        within [0, layerGroups.length). A client that wants an actual
        layerGroups element must bounds-check this value itself before
        indexing with it. name is never blank (ADR-037 decisions 4 and 7):
        it is the operator's own value from the composition file when one
        exists, or a generated positional label ("Layer <n>") when it does
        not, and nameGenerated says which — a blank cell is never sent in
        its place.
      required: [id, index, name, nameGenerated]
      properties:
        id:
          type: string
        index:
          type: integer
        layerGroupIndex:
          type: integer
        name:
          type: string
        nameGenerated:
          type: boolean
    ResolumeCompositionColumn:
      type: object
      description: >-
        One column position within one deck. name/nameGenerated are
        ADR-037 decision 4: columns never carry an authored name at all
        (the .avc format gives them none), so nameGenerated is always
        true and name is always the generated "Column <n>" form from
        index — carried anyway so every kind's response shares the
        identical (name, nameGenerated) shape.
      required: [id, deckId, index, name, nameGenerated]
      properties:
        id:
          type: string
        deckId:
          type: string
        index:
          type: integer
        name:
          type: string
        nameGenerated:
          type: boolean
    ResolumeCompositionClip:
      type: object
      description: >-
        One clip in the stored id map. Every element of "clips" carries
        deckId: a Resolume clip id resolves over Resolume's own API only
        while its own deck is selected (ADR-032 decision 6), so a clip
        reference without its deck cannot tell a stale id from an
        unselected deck. Elements of "persistentClips" carry no deckId at
        all (absent from the wire, never sent as an empty string) — they
        live outside any deck and resolve regardless of selection.
        transportTypeIndex is a raw index with no label to resolve it
        against — absent when the clip carries no TransportType param, and
        never translated to a name. name/nameGenerated are ADR-037
        decision 4: name is the clip's own authored name when non-empty,
        otherwise a generated form — "Clip L<layerIndex+1>C<columnIndex+1>"
        for a deck clip, "Persistent clip <n>" (1-based position among
        "persistentClips") for a persistent one. ambiguous (amendment,
        2026-08-16) is true when this clip's own (deck-or-persistent,
        layer, label) triple is shared by another clip in this
        composition, meaning no reference — including one naming this
        clip's own layer — can ever resolve it; the remedy is renaming one
        of the colliding clips in Resolume and re-uploading.
      required: [id, layerIndex, columnIndex, name, nameGenerated, ambiguous]
      properties:
        id:
          type: string
        deckId:
          type: string
        layerIndex:
          type: integer
        columnIndex:
          type: integer
        name:
          type: string
        nameGenerated:
          type: boolean
        ambiguous:
          type: boolean
        transportTypeIndex:
          type: integer
        sourcePath:
          type: string
        width:
          type: integer
        height:
          type: integer
    ResolumeCompositionResponse:
      type: object
      description: >-
        The body of GET /config/resolume/composition: the stored
        composition's own summary plus the full id map every ShowMesh
        reference to a Resolume object resolves through (ADR-032 decision
        1).
      required:
        [serverTime, revision, activatedAt, composition, decks,
         layerGroups, layers, columns, clips, persistentClips]
      properties:
        serverTime:
          type: string
          format: date-time
        revision:
          type: integer
        activatedAt:
          type: string
          format: date-time
        composition:
          $ref: "#/components/schemas/ResolumeCompositionSummary"
        decks:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionDeckSummary"
        layerGroups:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionLayerGroup"
        layers:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionLayer"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionColumn"
        clips:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionClip"
        persistentClips:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeCompositionClip"
    ResolumeActionParam:
      type: object
      description: >-
        One named parameter one Resolume action's "params" object accepts.
        ADR-037 gave this vocabulary its first optional parameters
        (launchClip's "layer" and "persistent", and its conditionally
        required "deck") — required: false means the parameter may be
        absent, never that an absent value is silently defaulted; there is
        still no `default` member here the way FPPCommandRequest's variant
        schemas have for some of their own parameters, because what an
        absence means is a resolution rule the caller applies, not a
        decode-time default.
      required: [name, kind, required]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [string, bool, number]
        required:
          type: boolean
    ResolumeAction:
      type: object
      description: >-
        One entry of the fixed seven-action vocabulary GET /resolume/actions
        returns. auditExempt mirrors ADR-024 decision 11's safety class:
        true only for `blackout` and `clearLayer`. coordinatorRequired is
        `true` for every entry today — the Resolume adapter is coordinator-
        hosted and Resolume holds no local fallback — carried on the wire
        so a macro author never has to know that out of band.
      required: [name, params, auditExempt, coordinatorRequired]
      properties:
        name:
          type: string
          enum:
            [launchClip, clearLayer, blackout, launchColumn, selectDeck,
             setLayerBypass, setLayerMaster]
        params:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeActionParam"
        auditExempt:
          type: boolean
        coordinatorRequired:
          type: boolean
    ResolumeActionsResponse:
      type: object
      description: The body of GET /resolume/actions.
      required: [serverTime, actions]
      properties:
        serverTime:
          type: string
          format: date-time
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ResolumeAction"
    ResolumeActionRequest:
      description: >-
        The body of POST /resolume/actions — a discriminated union on
        `action`, matching FPPCommandRequest's own shape (Step 7/8) for the
        identical reason: a bare, propertyless `params` object would let a
        generated client build a request this coordinator always rejects.
        Every variant's `idempotencyKey` is required (ARCHITECTURE section
        8.1) and scoped to the exact (action, normalized params) pair it
        is first used against — reusing it against the SAME action and the
        SAME normalized params is a replay; reusing it against a DIFFERENT
        action or DIFFERENT params is a `409` conflict, refused outright.
        There is no `instanceId` the way FPPCommandRequest has one: this
        coordinator dispatches against exactly one configured Resolume
        adapter. ADR-037: every reference below is a NAME, resolved
        against the stored composition — a raw Resolume object id is never
        accepted anywhere in this union, and a request that still sends
        one is refused as an unrecognized parameter.
      discriminator:
        propertyName: action
        mapping:
          launchClip: "#/components/schemas/ResolumeLaunchClipActionRequest"
          clearLayer: "#/components/schemas/ResolumeClearLayerActionRequest"
          launchColumn: "#/components/schemas/ResolumeLaunchColumnActionRequest"
          selectDeck: "#/components/schemas/ResolumeSelectDeckActionRequest"
          blackout: "#/components/schemas/ResolumeBlackoutActionRequest"
          setLayerBypass: "#/components/schemas/ResolumeSetLayerBypassActionRequest"
          setLayerMaster: "#/components/schemas/ResolumeSetLayerMasterActionRequest"
      oneOf:
        - $ref: "#/components/schemas/ResolumeLaunchClipActionRequest"
        - $ref: "#/components/schemas/ResolumeClearLayerActionRequest"
        - $ref: "#/components/schemas/ResolumeLaunchColumnActionRequest"
        - $ref: "#/components/schemas/ResolumeSelectDeckActionRequest"
        - $ref: "#/components/schemas/ResolumeBlackoutActionRequest"
        - $ref: "#/components/schemas/ResolumeSetLayerBypassActionRequest"
        - $ref: "#/components/schemas/ResolumeSetLayerMasterActionRequest"
    ResolumeLaunchClipActionRequest:
      type: object
      description: >-
        `action: "launchClip"`: launches (connects) a clip named by
        `params.clip`, scoped to exactly one of `params.deck` (a deck
        clip) or `params.persistent: true` (a persistent clip, which lives
        outside any deck and carries no `deck`) — neither or both is
        refused as `400`. `params.layer` disambiguates a clip name that
        occurs more than once; when it does not match any candidate the
        candidate set narrows to zero, never falling back to the
        unfiltered set. A clip reference whose own deck is not currently
        selected is refused with `200` and `result.outcome: "refused"`
        (never a stale-reference error and never a silent deck change) —
        see ResolumeActionResult.outcome.
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: launchClip
        idempotencyKey:
          type: string
        params:
          type: object
          required: [clip]
          additionalProperties: false
          properties:
            clip:
              type: string
              minLength: 1
              description: The clip's own label — its authored name, or its generated form if unnamed.
            deck:
              type: string
              minLength: 1
              description: >-
                The deck this clip lives on. Required unless `persistent`
                is `true`; must be absent when `persistent` is `true`.
            layer:
              type: string
              minLength: 1
              description: Disambiguates a clip name that occurs more than once. Never required.
            persistent:
              type: boolean
              description: >-
                True when `clip` names a persistent clip (no `deck`
                allowed). Absent or false means a deck clip, and `deck`
                is then required.
    ResolumeClearLayerActionRequest:
      type: object
      description: '`action: "clearLayer"`: clears (disconnects) a layer''s active clip, named by `params.layer`.'
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: clearLayer
        idempotencyKey:
          type: string
        params:
          type: object
          required: [layer]
          additionalProperties: false
          properties:
            layer:
              type: string
              minLength: 1
              description: The layer's own label — its authored name, or its generated form if unnamed.
    ResolumeLaunchColumnActionRequest:
      type: object
      description: '`action: "launchColumn"`: launches (connects) a column named by `params.column`, on the deck named by `params.deck`.'
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: launchColumn
        idempotencyKey:
          type: string
        params:
          type: object
          required: [column, deck]
          additionalProperties: false
          properties:
            column:
              type: string
              minLength: 1
              description: The column's own generated label — columns never carry an authored name.
            deck:
              type: string
              minLength: 1
              description: The deck this column lives on. Always required.
    ResolumeSelectDeckActionRequest:
      type: object
      description: '`action: "selectDeck"`: selects the deck named by `params.deck`.'
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: selectDeck
        idempotencyKey:
          type: string
        params:
          type: object
          required: [deck]
          additionalProperties: false
          properties:
            deck:
              type: string
              minLength: 1
              description: The deck's own label — its authored name, or its generated form if unnamed.
    ResolumeBlackoutActionRequest:
      type: object
      description: >-
        `action: "blackout"`: disconnects every tracked layer. Exempt from
        ADR-024 decision 11's fail-closed audit rule.
      required: [action, idempotencyKey]
      properties:
        action:
          type: string
          const: blackout
        idempotencyKey:
          type: string
        params:
          type: object
          description: This action takes no parameters — a non-empty params object is a 400.
          additionalProperties: false
    ResolumeSetLayerBypassActionRequest:
      type: object
      description: '`action: "setLayerBypass"`: sets a layer''s bypass state.'
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: setLayerBypass
        idempotencyKey:
          type: string
        params:
          type: object
          required: [layer, bypassed]
          additionalProperties: false
          properties:
            layer:
              type: string
              minLength: 1
              description: The layer's own label — its authored name, or its generated form if unnamed.
            bypassed:
              type: boolean
    ResolumeSetLayerMasterActionRequest:
      type: object
      description: >-
        `action: "setLayerMaster"`: sets a layer's master to a continuous
        value. Validated server-side against Arena's own declared range for
        THIS layer's master parameter (RangeParameter min/max, read fresh
        off the pre-dispatch baseline) rather than a fixed [0, 1] — an
        out-of-range request is refused with the declared bound stated,
        never silently clamped.
      required: [action, idempotencyKey, params]
      properties:
        action:
          type: string
          const: setLayerMaster
        idempotencyKey:
          type: string
        params:
          type: object
          required: [layer, master]
          additionalProperties: false
          properties:
            layer:
              type: string
              minLength: 1
              description: The layer's own label — its authored name, or its generated form if unnamed.
            master:
              type: number
              description: >-
                The requested master value. Commonly [0, 1] but validated
                against the layer's own declared range, not assumed.
    ResolumeActionResponse:
      type: object
      description: The body of a successful (200) response from POST /resolume/actions.
      required: [serverTime, result]
      properties:
        serverTime:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/ResolumeActionResult"
    ResolumeActionResult:
      type: object
      description: >-
        What happened to one dispatched (or replayed) action. outcome is
        never inferred from this endpoint's own `200` status — it is
        exactly one of the six values in its enum below, and a `200` is
        sent for every one of them, including "refused" and "failed": this
        endpoint reports honestly what happened rather than using the HTTP
        status to editorialize about the answer.
      required:
        [id, idempotencyKey, action, params, replay, outcome, outcomeReason,
         attributionDegraded, dispatchedAt, resolvedAt]
      properties:
        id:
          type: string
        idempotencyKey:
          type: string
        action:
          type: string
        params:
          type: object
          additionalProperties: true
          description: This action's own normalized parameters — defaults applied, never omitted or null.
        replay:
          type: boolean
          description: >-
            True when this response answers a REPLAYED idempotency key: the
            action described here was NOT dispatched by this request.
        outcome:
          type: string
          enum: ["confirmed", "unconfirmed", "unconfirmable", "refused", "failed", ""]
          description: >-
            "confirmed": the effect was observed on evidence collected
            strictly after dispatch. "unconfirmed": this action's own
            derived confirmation deadline expired first. "unconfirmable":
            dispatched, but its own effect could not be told apart from
            its pre-dispatch state (e.g. launching an already-playing
            clip) — never treated as success. "refused": refused before
            dispatch (a clip's deck was not selected, the composition
            identity was unknown, or a non-exempt action's audit write
            failed) — no request ever reached Resolume. "failed": dispatch
            was attempted and the attempt itself failed. Empty only for a
            REPLAY response returned before the original request's own
            dispatch/confirmation has finished — a real, honest value
            (ADR-020's absence-is-stated rule), matching
            FPPCommandResult.outcome's identical narrow case exactly. A
            coordinator restart can no longer make this PERMANENT: any
            Resolume command row still unresolved at startup is resolved by
            a startup reconciliation pass (mirroring
            FPPCommandResult.outcomeReason's own note on
            ReconcileStrandedFPPCommands) before it can ever reach a client
            in that state.
        outcomeReason:
          type: string
          description: >-
            A short, human-readable explanation. Non-empty for every
            resolved result, including "confirmed" — the only value for
            which it may be empty is the identical narrow replay race
            `outcome`'s own description names.
        attributionDegraded:
          type: boolean
          description: >-
            True when this action's dispatch or outcome audit entry could
            not be written — the `blackout`/`clearLayer` safety-class
            exemption proceeding anyway with a degraded, stderr-only
            attribution record.
        dispatchedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Null only when this action was refused before dispatch was
            ever attempted, or in the narrow accepted replay race
            `replay`'s own description names.
        resolvedAt:
          type: [string, "null"]
          format: date-time
    Problem:
      type: object
      description: >-
        RFC 9457 application/problem+json. serverTime is an extension
        member present on every problem this API produces, with no
        exception (section 6.2 and 6.6). supportedVersions is present only
        on an "unsupported-api-version" problem. type is a stable,
        documented identifier a client dispatches on — the values in its
        enum below are every class this coordinator currently produces,
        and this list is the single source of truth for that set. It is
        deliberately not a fetchable URI: nothing in this API or its tests
        dereferences it over the network.


        Step 9 (STEP-9-SPEC.md) adds fifteen more, in two groups. Twelve
        are internal/coordinator/config's ValidationError.Code values,
        mapped mechanically onto their own "show-config-*" type by
        internal/coordinator/api's mapValidationError (showconfig.go) — a
        client that must tell two refusals on a show.action/show.macro
        write apart branches on type, never on detail's prose. Three are
        the macro run surface's own conflicts (ADR-031 decisions 2 and 6,
        STEP-9-SPEC.md section 6.2): "macro-run-already-in-flight" (a
        second run of a macro already running, 409, naming the in-flight
        run in detail), "macro-run-idempotency-macro-conflict" (the same
        idempotency key reused for a different macro, 409), and
        "macro-run-idempotency-revision-conflict" (the same key reused for
        the same macro at a different pinned revision — the macro was
        edited between two submissions under one key, 409) — minted by
        internal/coordinator/macro (which imports this package; see
        macro_seam.go), never by this package itself.


        Four of the fifteen are ADR-024: "forbidden" (401 means no valid
        credential, this means authenticated but missing a scope — the
        detail text names the missing scope), "csrf-rejected" (a
        cookie-authenticated write with no `Sec-Fetch-Site: same-origin`
        header, decision 6), "too-many-requests" (decision 8's login
        concurrency bound, paired with a `Retry-After` response header),
        and "credential-in-url" (decision 1: a request whose query string
        carried a credential). One is "conflict": the request is valid but
        this coordinator's current state makes it unsafe or meaningless to
        act on right now — shared by `PUT /config/fpp.endpoints` (Step 7
        seam A, refused because `SHOWMESH_FPP_ENDPOINTS` is still set in
        the coordinator's own environment, RES-008 D1),
        `POST /discovery/runs` (Step 7 seam B, refused while a run is
        already in progress), and a `commands` idempotency key reused
        against a different action, target, or (as of Step 8) normalized
        params (Step 7 seam C, extended by Step 8) — `detail` names which.
        Three are Step 8's own additions, all scoped to
        `POST /fpp/{instanceId}/commands`: "fpp-command-refused-audit-unavailable"
        (ADR-024 decision 11's fail-closed default for a non-safety-class
        primitive, `503`, when the pre-dispatch audit write could not be
        made), "fpp-start-playlist-evidence-not-current"
        (`startPlaylist`'s own `ifBusy=refuse` guard refusing because the
        evidence it would need to decide whether a different playlist is
        running is not itself current, `409`), and "fpp-start-playlist-busy"
        (that same guard refusing because a DIFFERENT playlist IS
        confirmed currently playing, `409`) — kept as three DISTINCT
        `409`/`503` types (not sharing "conflict", and not sharing each
        other) specifically so a client branches on `type` rather than
        parsing `detail` prose: "mint a fresh key" (idempotency conflict),
        "resend with ifBusy: replace" (busy), and "retry once evidence is
        current, or resend with ifBusy: replace if interrupting is
        intended" (evidence not current) are three different remedies, and
        a review finding caught that the busy/evidence-not-current split
        had left "busy" still sharing a type with the idempotency case even
        after the evidence-not-current case was split out.
        One is Track D seam D-2a's own addition: "payload-too-large" (413,
        POST /config/resolume/composition refusing an uploaded file larger
        than this coordinator's own upload bound, before buffering it
        whole; reused verbatim, not duplicated, by POST /resolume/actions
        for a request body over its own much smaller limit — Review fix 5,
        2026-08-15 — because both refusals share the identical remedy,
        "shrink the request", unlike the busy/evidence-not-current split
        above where the type had to fork because the remedies differ). One
        is Track D seam D-3/B's own addition:
        "resolume-action-refused-audit-unavailable" (POST /resolume/actions'
        own ADR-024 decision 11 fail-closed default for a non-exempt
        action — every action except `blackout` and `clearLayer` — `503`,
        mirroring "fpp-command-refused-audit-unavailable" exactly, for a
        second vendor's command surface).
      required: [type, title, status, detail, serverTime]
      properties:
        type:
          type: string
          format: uri
          enum:
            - https://showmesh.dev/problems/unsupported-api-version
            - https://showmesh.dev/problems/resource-not-found
            - https://showmesh.dev/problems/invalid-parameter
            - https://showmesh.dev/problems/unauthorized
            - https://showmesh.dev/problems/method-not-allowed
            - https://showmesh.dev/problems/internal-error
            - https://showmesh.dev/problems/forbidden
            - https://showmesh.dev/problems/csrf-rejected
            - https://showmesh.dev/problems/too-many-requests
            - https://showmesh.dev/problems/credential-in-url
            - https://showmesh.dev/problems/conflict
            - https://showmesh.dev/problems/fpp-command-refused-audit-unavailable
            - https://showmesh.dev/problems/fpp-start-playlist-evidence-not-current
            - https://showmesh.dev/problems/fpp-start-playlist-busy
            - https://showmesh.dev/problems/show-config-body-invalid
            - https://showmesh.dev/problems/show-config-field-required
            - https://showmesh.dev/problems/show-config-field-null
            - https://showmesh.dev/problems/show-config-field-empty
            - https://showmesh.dev/problems/show-config-field-invalid
            - https://showmesh.dev/problems/show-config-field-unknown-reference
            - https://showmesh.dev/problems/show-config-safety-class-mismatch
            - https://showmesh.dev/problems/show-config-local-fallback-reduced
            - https://showmesh.dev/problems/show-config-steps-empty
            - https://showmesh.dev/problems/show-config-steps-too-many
            - https://showmesh.dev/problems/show-config-step-id-duplicate
            - https://showmesh.dev/problems/show-config-field-unknown-key
            - https://showmesh.dev/problems/macro-run-already-in-flight
            - https://showmesh.dev/problems/macro-run-idempotency-macro-conflict
            - https://showmesh.dev/problems/macro-run-idempotency-revision-conflict
            - https://showmesh.dev/problems/payload-too-large
            - https://showmesh.dev/problems/resolume-action-refused-audit-unavailable
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        serverTime:
          type: string
          format: date-time
        supportedVersions:
          type: array
          items:
            type: integer
        conflictingRunId:
          type: string
          description: >-
            The macro run this problem is about. Present on the three
            macro-run conflicts and on nothing else: the in-flight run that
            refused an overlapping submission, or the existing run an
            idempotency key already belongs to. It is a field rather than
            something a client digs out of detail, because a 409 whose
            whole purpose is to point at a run is useless to a client that
            cannot link to it, and matching a substring of this server's
            English is how the Operator UI once told two different 409s
            apart. Additive and omitted when empty.
    StreamStart:
      type: object
      description: The payload of the first event on every SSE connection.
      required: [streamId, apiVersion, serverTime, snapshotRequired]
      properties:
        streamId:
          type: string
        apiVersion:
          type: integer
        serverTime:
          type: string
          format: date-time
        snapshotRequired:
          type: boolean
          const: true
    StreamReset:
      type: object
      description: >-
        The payload of a stream.reset event: either an overflowed
        subscriber buffer (reason "subscriber_too_slow", after which the
        connection is closed) or any other condition making the client's
        local model unsafe to keep applying deltas to.
      required: [seq, serverTime, reason, snapshotRequired]
      properties:
        seq:
          type: integer
          description: Per-connection only; never a durable cursor.
        serverTime:
          type: string
          format: date-time
        reason:
          type: string
        snapshotRequired:
          type: boolean
          const: true
    NodeChangedEvent:
      type: object
      required: [seq, serverTime, node]
      properties:
        seq:
          type: integer
        serverTime:
          type: string
          format: date-time
        node:
          $ref: "#/components/schemas/Node"
    FPPChangedEvent:
      type: object
      required: [seq, serverTime, instance]
      properties:
        seq:
          type: integer
        serverTime:
          type: string
          format: date-time
        instance:
          $ref: "#/components/schemas/FPPInstance"
    EventRecordedEvent:
      type: object
      required: [seq, serverTime, event]
      properties:
        seq:
          type: integer
        serverTime:
          type: string
          format: date-time
        event:
          $ref: "#/components/schemas/Event"
    FPPObservationsChangedEvent:
      type: object
      description: >-
        The payload of an `fpp.observations.changed` event (ADR-023),
        delivered only to a connection that opted into delta frames via
        `GET /stream?deltas=1`. `changed` is never null and carries the
        full `Evidence` envelope — exactly the shape an element of
        `FPPInstance.observations` would have — for every signal on this
        instance whose resolved evidence differs from what this connection
        has already been told; it never repeats a signal whose resolved
        evidence is unchanged from last time. `removed` is never null and
        carries the signal IDs (bare strings, not `Evidence` envelopes) of
        every observation this connection has previously been told about
        for this instance that no longer exists at all — a cape swapped
        for a smaller one, a renamed port, a sensor that stopped being
        reported. A client applying `removed` MUST delete those signals
        from its own merged baseline; without that, the baseline
        accumulates observations the coordinator no longer has. At least
        one of `changed`/`removed` is always non-empty: an instance with
        nothing to report this render pass produces no
        `fpp.observations.changed` event at all. This event is always
        paired with `instanceId`, unlike `FPPChangedEvent`, which nests
        its instance identity inside `instance` — an observations-only
        delta has no full instance object to carry it in otherwise.
        Structural, non-observation changes to an instance (health,
        endpoint, lastPollAt, lastPollError) continue to arrive as
        `fpp.changed` for a delta-subscribed connection too — this event
        exists only for a change confined to `observations`.
      required: [seq, serverTime, instanceId, changed, removed]
      properties:
        seq:
          type: integer
          description: Per-connection only; never a durable cursor.
        serverTime:
          type: string
          format: date-time
        instanceId:
          type: string
        changed:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        removed:
          type: array
          items:
            type: string
    ConfigObjectSummary:
      type: object
      description: >-
        Step 9 (STEP-9-SPEC.md section 5.5): one element of
        ConfigObjectsListResponse.objects — enough to enumerate and label
        every show.action or show.macro object without fetching each one's
        full payload.
      required: [id, label, show, currentRevision, updatedAt]
      properties:
