        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        state:
          type: string
          enum: [running, finished]
        completed:
          type: [boolean, "null"]
        confirmed:
          type: [boolean, "null"]
        reason:
          type: string
        attributionDegraded:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/MacroRunStep"
    MacroRunResponse:
