name: FPP Integration (bench fppd)

# Deliberately its own workflow, not a job in ci.yml (BUILD-PLAN Step 7,
# decided 2026-08-12): bench/fpp-multisync's fpp-master is a full FPP
# source build (see that directory's own docker-compose.yml comment), so
# running it on every push would either slow the fast path or teach
# people to skip it. This is the first work in this project that
# genuinely depends on `make test-integration-fpp`, which is why the
# decision is made here rather than deferred again — see
# docs/build/BUILD-PLAN.md's Step 7 "Decisions settled before the step
# starts".
#
# Triggered on changes to the two packages this proves (the FPP REST
# collector, and Step 7 seam C's FPP command client) plus a nightly run,
# so a regression in either is caught within a day even on a quiet
# branch, without paying the full source build on every unrelated push.

on:
  push:
    branches: [main]
    paths:
      - "internal/coordinator/collector/fpp/**"
      - "internal/coordinator/fppcommand/**"
      - "internal/coordinator/api/fppcommand_handler.go"
      - "pkg/command/**"
      - "bench/fpp-multisync/**"
      - "scripts/test-integration-fpp.sh"
      - "test/integration/fpp_e2e_test.go"
      - "test/integration/fpp_command_primitives_test.go"
      - "test/integration/fpp_command_test.go"
      - "test/integration/macro_run_submit_timeout_test.go"
      - ".github/workflows/test-integration-fpp.yml"
  pull_request:
    paths:
      - "internal/coordinator/collector/fpp/**"
      - "internal/coordinator/fppcommand/**"
      - "internal/coordinator/api/fppcommand_handler.go"
      - "pkg/command/**"
      - "bench/fpp-multisync/**"
      - "scripts/test-integration-fpp.sh"
      - "test/integration/fpp_e2e_test.go"
      - "test/integration/fpp_command_primitives_test.go"
      - "test/integration/fpp_command_test.go"
      - "test/integration/macro_run_submit_timeout_test.go"
      - ".github/workflows/test-integration-fpp.yml"
  schedule:
    # 05:00 UTC nightly, offset from no other scheduled job in this repo
    # (there are none today) — an arbitrary off-peak hour, not a measured
    # choice.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-integration-fpp:
    runs-on: ubuntu-latest
    # A full FPP source build (bench/fpp-multisync/docker-compose.yml's own
    # comment: "a first build is a full FPP source build and can take
    # several minutes") plus the test run itself; generous headroom over
    # the other integration jobs' 10 minutes for exactly that reason.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest ships Docker (with Compose v2) already, usable
      # without sudo. `make test-integration-fpp` (scripts/test-integration-fpp.sh)
      # builds and starts bench/fpp-multisync's fpp-master itself — a real
      # fppd, never a fake — plus its own throwaway Mosquitto for
      # TestFPPSuccessPathThroughRealCoordinator, exactly as a developer
      # running it locally does; this job supplies no bespoke CI-only
      # config.
      - name: Integration tests (real fppd, bench container)
        # This suite compiles the whole test/integration package, which
        # reaches the agent's cgo audio engine, and it runs go test -race,
        # which requires cgo. The engine needs GStreamer 1.26 and
        # ubuntu-latest ships 1.24, so the suite runs inside Debian 13.
        # Not a `container:` job: the script builds and starts the bench
        # fppd through docker compose and reaches it on localhost, which
        # needs the host socket and host networking, and GitHub's
        # container: field cannot express --network. Workspace mounted at
        # its own absolute path with TMPDIR inside it, so any bind mount
        # the script hands the host daemon resolves the same on both sides.
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/.ci-tmp"
          docker run --rm \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e TMPDIR="$GITHUB_WORKSPACE/.ci-tmp" \
            -e HOME=/tmp \
            golang:1.25.0-trixie \
            bash -euxo pipefail -c '
              apt-get update -o Acquire::Retries=2
              apt-get install -y --no-install-recommends \
                pkg-config gstreamer1.0-tools gstreamer1.0-plugins-base \
                gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
                gstreamer1.0-plugins-base-apps gstreamer1.0-alsa \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
                libltc-dev docker-cli docker-compose curl jq
              # Debian's docker-compose is Compose v2 and installs the CLI
              # plugin, so the script's `docker compose` subcommand works.
              docker compose version
              gst="$(pkg-config --modversion gstreamer-1.0)"
              echo "gstreamer-1.0: $gst, libltc: $(pkg-config --modversion ltc)"
              pkg-config --atleast-version=1.26.0 gstreamer-1.0 \
                || { echo "gstreamer $gst is below the 1.26 floor go-gst needs" >&2; exit 1; }
              git config --global --add safe.directory "*"
              make test-integration-fpp
            '
