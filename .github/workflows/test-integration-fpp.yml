name: FPP Integration (bench fppd)

# Deliberately its own workflow, not a job in ci.yml: it depends on a real
# fppd, which the other integration jobs don't need. fpp-master comes from
# a prebuilt, digest-pinned GHCR fixture (bench/fpp-multisync/docker-
# compose.prebuilt.yml) rather than a source build, published separately by
# build-fpp-test-image.yml -- see bench/fpp-multisync/README.md.
#
# Triggered on changes to the two packages this proves (the FPP REST
# collector, and the FPP command client) plus a nightly run, so a
# regression in either is caught within a day even on a quiet branch.

on:
  push:
    branches: [main]
    paths:
      - "internal/coordinator/collector/fpp/**"
      - "internal/coordinator/fppcommand/**"
      - "internal/coordinator/api/fppcommand_handler.go"
      - "pkg/command/**"
      - "bench/fpp-multisync/**"
      - "scripts/test-integration-fpp.sh"
      - "test/integration/fpp_e2e_test.go"
      - "test/integration/fpp_command_primitives_test.go"
      - "test/integration/fpp_command_test.go"
      - "test/integration/macro_run_submit_timeout_test.go"
      - ".github/workflows/test-integration-fpp.yml"
      - ".github/workflows/build-fpp-test-image.yml"
  pull_request:
    paths:
      - "internal/coordinator/collector/fpp/**"
      - "internal/coordinator/fppcommand/**"
      - "internal/coordinator/api/fppcommand_handler.go"
      - "pkg/command/**"
      - "bench/fpp-multisync/**"
      - "scripts/test-integration-fpp.sh"
      - "test/integration/fpp_e2e_test.go"
      - "test/integration/fpp_command_primitives_test.go"
      - "test/integration/fpp_command_test.go"
      - "test/integration/macro_run_submit_timeout_test.go"
      - ".github/workflows/test-integration-fpp.yml"
      - ".github/workflows/build-fpp-test-image.yml"
  schedule:
    # 05:00 UTC nightly, offset from no other scheduled job in this repo
    # (there are none today) — an arbitrary off-peak hour, not a measured
    # choice.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-integration-fpp:
    runs-on: ubuntu-latest
    # The fixture pull plus the test run; the source build this used to pay
    # for is gone, but headroom stays generous over the other integration
    # jobs' 10 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the pinned FPP test fixture
        run: |
          docker compose -f bench/fpp-multisync/docker-compose.yml -f bench/fpp-multisync/docker-compose.prebuilt.yml pull fpp-master
          resolved="$(docker compose -f bench/fpp-multisync/docker-compose.yml -f bench/fpp-multisync/docker-compose.prebuilt.yml config --images fpp-master)"
          echo "pulled fpp-master image: $resolved"

      # ubuntu-latest ships Docker (with Compose v2) already, usable
      # without sudo. `make test-integration-fpp` (scripts/test-integration-fpp.sh)
      # starts bench/fpp-multisync's fpp-master itself -- a real fppd,
      # never a fake -- plus its own throwaway Mosquitto for
      # TestFPPSuccessPathThroughRealCoordinator. SHOWMESH_FPP_TEST_PREBUILT
      # makes it recreate fpp-master from the fixture just pulled above
      # instead of source-building it.
      - name: Integration tests (real fppd, bench container)
        env:
          SHOWMESH_FPP_TEST_PREBUILT: "1"
        run: make test-integration-fpp
