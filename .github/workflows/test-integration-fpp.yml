name: FPP Integration (bench fppd)

# Deliberately its own workflow, not a job in ci.yml: it depends on a real
# fppd, which the other integration jobs don't need. fpp-master comes from
# a prebuilt, digest-pinned GHCR fixture (bench/fpp-multisync/docker-
# compose.prebuilt.yml) rather than a source build, published separately by
# build-fpp-test-image.yml -- see bench/fpp-multisync/README.md.
#
# Triggered on changes to the two packages this proves (the FPP REST
# collector, and the FPP command client) plus a nightly run, so a
# regression in either is caught within a day even on a quiet branch.

on:
  push:
    branches: [main]
    paths:
      - "internal/coordinator/collector/fpp/**"
      - "internal/coordinator/fppcommand/**"
      - "internal/coordinator/api/fppcommand_handler.go"
      - "pkg/command/**"
      - "bench/fpp-multisync/**"
      - "scripts/test-integration-fpp.sh"
      - "test/integration/fpp_e2e_test.go"
      - "test/integration/fpp_command_primitives_test.go"
      - "test/integration/fpp_command_test.go"
      - "test/integration/macro_run_submit_timeout_test.go"
      - ".github/workflows/test-integration-fpp.yml"
      - ".github/workflows/build-fpp-test-image.yml"
  pull_request:
    paths:
      - "internal/coordinator/collector/fpp/**"
      - "internal/coordinator/fppcommand/**"
      - "internal/coordinator/api/fppcommand_handler.go"
      - "pkg/command/**"
      - "bench/fpp-multisync/**"
      - "scripts/test-integration-fpp.sh"
      - "test/integration/fpp_e2e_test.go"
      - "test/integration/fpp_command_primitives_test.go"
      - "test/integration/fpp_command_test.go"
      - "test/integration/macro_run_submit_timeout_test.go"
      - ".github/workflows/test-integration-fpp.yml"
      - ".github/workflows/build-fpp-test-image.yml"
  schedule:
    # 05:00 UTC nightly, offset from no other scheduled job in this repo
    # (there are none today) — an arbitrary off-peak hour, not a measured
    # choice.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-integration-fpp:
    runs-on: ubuntu-latest
    env:
      COMPOSE_BASE: bench/fpp-multisync/docker-compose.yml
      COMPOSE_PREBUILT: bench/fpp-multisync/docker-compose.prebuilt.yml
    # The fixture pull, the apt install of the cgo build dependencies, and
    # both suites.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No fallback: docker-compose.prebuilt.yml removes fpp-master's build
      # config outright, so a failure here is the end of the job rather than
      # a silent return to the source build this replaced.
      - name: Pull the pinned FPP test fixture
        run: |
          resolved="$(docker compose -f "$COMPOSE_BASE" -f "$COMPOSE_PREBUILT" config --images fpp-master)"
          echo "pinned fpp-master image: $resolved"
          if ! docker compose -f "$COMPOSE_BASE" -f "$COMPOSE_PREBUILT" pull fpp-master; then
            echo "::error::could not pull $resolved. A pull request from a fork gets a GITHUB_TOKEN scoped to the fork, which cannot read this private package; a fork PR cannot run this job." >&2
            exit 1
          fi

      # `make test-integration-fpp` (scripts/test-integration-fpp.sh) starts
      # bench/fpp-multisync's fpp-master itself -- a real fppd, never a fake
      # -- plus its own throwaway Mosquitto for
      # TestFPPSuccessPathThroughRealCoordinator. SHOWMESH_FPP_TEST_PREBUILT
      # makes it recreate fpp-master from the fixture just pulled above
      # instead of source-building it. Compose comes from the container's
      # own docker-compose package, which must support `!reset` (>= 2.24.4),
      # not from the runner.
      - name: Integration tests (real fppd, bench container)
        env:
          SHOWMESH_FPP_TEST_PREBUILT: "1"
        # This suite compiles the whole test/integration package, which
        # reaches the agent's cgo audio engine, and it runs go test -race,
        # which requires cgo. The engine needs GStreamer 1.26 and
        # ubuntu-latest ships 1.24, so the suite runs inside Debian 13.
        # Not a `container:` job: the script starts the bench fppd
        # through docker compose and reaches it on localhost, which
        # needs the host socket and host networking, and GitHub's
        # container: field cannot express --network. Workspace mounted at
        # its own absolute path with TMPDIR inside it, so any bind mount
        # the script hands the host daemon resolves the same on both sides.
        # The runner's docker config is mounted so a compose pull inside the
        # container authenticates to GHCR instead of failing anonymously.
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/.ci-tmp"
          docker run --rm \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e TMPDIR="$GITHUB_WORKSPACE/.ci-tmp" \
            -e HOME=/tmp \
            -e SHOWMESH_FPP_TEST_PREBUILT \
            -v "$HOME/.docker":/tmp/.docker:ro \
            golang:1.25.0-trixie \
            bash -euxo pipefail -c '
              apt-get update -o Acquire::Retries=2
              # The cgo build dependencies go in their own apt call and are
              # verified afterwards. A single large install has been seen to
              # exit 0 having silently not installed libgstreamer1.0-dev,
              # which then fails much later as an unresolved pkg-config.
              apt-get install -y --no-install-recommends \
                pkg-config libgstreamer1.0-dev \
                libgstreamer-plugins-base1.0-dev libltc-dev
              pkg-config --modversion gstreamer-1.0
              pkg-config --modversion ltc
              pkg-config --atleast-version=1.26.0 gstreamer-1.0
              apt-get install -y --no-install-recommends \
                gstreamer1.0-tools gstreamer1.0-plugins-base \
                gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
                gstreamer1.0-plugins-base-apps gstreamer1.0-alsa \
                docker-cli docker-compose curl jq
              docker compose version
              git config --global --add safe.directory "*"
              make test-integration-fpp
            '

      # Independent of SHOWMESH_FPP_TEST_PREBUILT, so dropping or
      # misspelling that variable fails here instead of quietly restoring
      # the source build and reporting green.
      - name: Verify the bench container ran the pinned fixture
        # docker-compose.yml no longer pins a fixed container_name for
        # fpp-master (it collided across the side-by-side 9.5.3/10.0
        # projects bench/fpp-multisync/README.md describes), so the
        # container is resolved by service name through `docker compose ps
        # -q`, the same way scripts/test-integration-fpp.sh resolves it.
        run: |
          pinned="$(docker image inspect -f '{{.Id}}' "$(docker compose -f "$COMPOSE_BASE" -f "$COMPOSE_PREBUILT" config --images fpp-master)")"
          container_id="$(docker compose -f "$COMPOSE_BASE" -f "$COMPOSE_PREBUILT" ps -q fpp-master)"
          running="$(docker inspect -f '{{.Image}}' "$container_id")"
          if [ "$running" != "$pinned" ]; then
            echo "::error::bench fpp-master ran $running, not the pinned fixture $pinned" >&2
            exit 1
          fi
          echo "confirmed: bench fpp-master ran the pinned fixture $pinned"
