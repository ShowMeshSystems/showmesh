name: Build

# Builds and packages ShowMesh Core for one version: the coordinator and UI
# images (pushed under every tag in image_tags), both node agent tarballs and
# the installer, each uploaded as an artifact for the caller to publish.
# Called by release.yml for a release tag and by edge.yml for every merge to main.
on:
  workflow_call:
    inputs:
      version:
        description: Version every binary reports, without a leading v.
        type: string
        required: true
      release_tag:
        description: GitHub release the installer downloads from.
        type: string
        required: true
      image_tags:
        description: Space-separated tags for both images.
        type: string
        required: true
      commit:
        type: string
        required: true
      build_date:
        type: string
        required: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.9"
  COORDINATOR_IMAGE: ghcr.io/showmeshsystems/showmesh-coordinator
  UI_IMAGE: ghcr.io/showmeshsystems/showmesh-ui

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Both Dockerfiles keep their build stage on --platform=$BUILDPLATFORM
      # (see their own comments), so linux/amd64 and linux/arm64 build with
      # no QEMU step here: the coordinator cross-compiles with CGO disabled
      # and the UI's npm build emits static assets that carry no machine code.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          coord=""
          ui=""
          for t in ${{ inputs.image_tags }}; do
            coord="${coord}${{ env.COORDINATOR_IMAGE }}:$t"$'\n'
            ui="${ui}${{ env.UI_IMAGE }}:$t"$'\n'
          done
          {
            echo "coordinator<<EOF"
            printf '%s' "$coord"
            echo "EOF"
            echo "ui<<EOF"
            printf '%s' "$ui"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the coordinator image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.coordinator }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ inputs.commit }}
            BUILD_DATE=${{ inputs.build_date }}

      # Same two platforms as the coordinator image above: an arm64
      # coordinator host pulls both, and an amd64-only UI image failed its
      # install at the pull.
      - name: Build and push the operator UI image
        uses: docker/build-push-action@v7
        with:
          context: ./ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.ui }}

  # ndi-plugin-amd64 and ndi-plugin-arm64 build the NDI GStreamer plugin in
  # their own jobs rather than inside the node-agent jobs: the arm64
  # node-agent job has already run over its time budget once under QEMU
  # (see its own comment), and a Rust build added inline there risks the
  # same failure again. Each leg uploads libgstndi.so as a job artifact;
  # the matching node-agent job downloads it and packages it in.
  ndi-plugin-amd64:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Keyed on the build script's own contents, which is where the
      # pinned gst-plugins-rs revision and Rust toolchain version live: a
      # revision or toolchain bump changes the key and starts a fresh
      # cache, exactly the cases where a stale cache would be wrong.
      - name: Cache the gst-plugins-rs cargo registry and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ndi-plugin-work/gst-plugins-rs/target
          key: ndi-plugin-amd64-${{ hashFiles('deploy/node/ndi-plugin/build-ndi-plugin.sh') }}

      - name: Build the NDI GStreamer plugin (amd64)
        run: deploy/node/ndi-plugin/build-ndi-plugin.sh dist/ndi-plugin/amd64 /tmp/ndi-plugin-work

      - uses: actions/upload-artifact@v7
        with:
          name: ndi-plugin-amd64
          path: dist/ndi-plugin/amd64/libgstndi.so
          retention-days: 7

  ndi-plugin-arm64:
    # A native arm64 runner, not an emulated one, for the same reason
    # node-agent-arm64 uses one: a Rust build under QEMU is exactly the
    # kind of cost that job's own comment records going over budget.
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Cache the gst-plugins-rs cargo registry and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ndi-plugin-work/gst-plugins-rs/target
          key: ndi-plugin-arm64-${{ hashFiles('deploy/node/ndi-plugin/build-ndi-plugin.sh') }}

      - name: Build the NDI GStreamer plugin (arm64)
        run: deploy/node/ndi-plugin/build-ndi-plugin.sh dist/ndi-plugin/arm64 /tmp/ndi-plugin-work

      - uses: actions/upload-artifact@v7
        with:
          name: ndi-plugin-arm64
          path: dist/ndi-plugin/arm64/libgstndi.so
          retention-days: 7

  node-agent-amd64:
    needs: [ndi-plugin-amd64]
    runs-on: ubuntu-latest
    # Debian 13 for the same reason CI's `test`/`lint`/`vuln` jobs use it:
    # ubuntu-latest ships GStreamer 1.24 and the agent's cgo backend needs
    # 1.26+. This container runs as the runner's own amd64, no emulation.
    container:
      image: debian:trixie
    timeout-minutes: 15
    steps:
      - name: Install the C toolchain and the agent's C dependencies
        run: |
          set -eux
          apt-get update -o Acquire::Retries=2
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config file \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-base-apps gstreamer1.0-alsa \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libltc-dev
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: ndi-plugin-amd64
          path: ndi-plugin-amd64

      - name: Build and package the node agent (amd64)
        run: make package-node-agent NODE_AGENT_VERSION=${{ inputs.version }} NDI_PLUGIN_SO=ndi-plugin-amd64/libgstndi.so

      # Same discipline as node-agent-arm64's own check below: read the
      # architecture off the packaged file, never off the job name.
      - name: The packaged NDI plugin exists and really is amd64
        run: |
          set -euxo pipefail
          version="${{ inputs.version }}"
          tarball="dist/node-agent/showmesh-node-agent_${version}_linux_amd64.tar.gz"
          tar -xzf "$tarball" -C "$RUNNER_TEMP" showmesh-node-agent/gstreamer/libgstndi.so
          described="$(file -b "$RUNNER_TEMP/showmesh-node-agent/gstreamer/libgstndi.so")"
          echo "$described"
          case "$described" in
            *"ELF 64-bit LSB"*"x86-64"*) ;;
            *) echo "::error::packaged NDI plugin is not amd64: $described" >&2; exit 1 ;;
          esac

      # Only the tarball: package-node-agent also writes a
      # showmesh-node-agent_<VERSION>_SHA256SUMS in this same directory,
      # but that filename carries no platform label and each of the two
      # legs would produce one covering only its own tarball. Uploading it
      # here would collide across legs when the release job merges both
      # artifacts into one directory. The release job recomputes one
      # SHA256SUMS once both tarballs are staged together.
      - uses: actions/upload-artifact@v7
        with:
          name: node-agent-amd64
          path: dist/node-agent/*.tar.gz
          retention-days: 7

  node-agent-arm64:
    needs: [ndi-plugin-arm64]
    # A native arm64 runner, not an emulated one. Under QEMU this job took
    # 24.3 minutes on 2026-09-03 and exceeded 25 minutes on 2026-09-08, so a
    # tag would have pushed both images and then lost the release to a
    # timeout twenty five minutes later. Native runners are available to this
    # repository because it is public.
    runs-on: ubuntu-24.04-arm
    # Secondary guard only. This number is chosen against two emulated
    # samples, not measured on a native runner; the point of the runner
    # change is that it should never be approached.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # No QEMU setup here, deliberately: the runner is already arm64, so
      # emulating the target would reintroduce the cost this job exists to
      # avoid. The amd64 leg has never needed it either.

      # The native agent links go-gst and libltc (CGO_ENABLED=1), which
      # cannot cross-compile the way the CGo-free FPP plugin does: it has
      # to be built by a compiler and linker that target arm64 for real.
      # Run a real debian:trixie userspace on the arm64 runner and build
      # there with `make package-node-agent` so the packaging step (naming,
      # SHA256SUMS, self-verify) stays the exact same code path as the FPP
      # plugin's and the amd64 leg's.
      - uses: actions/download-artifact@v8
        with:
          name: ndi-plugin-arm64
          path: ndi-plugin-arm64

      - name: Build and package the node agent (arm64)
        run: |
          set -eux
          mkdir -p dist/node-agent
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src -w /src \
            -e NODE_AGENT_VERSION="${{ inputs.version }}" \
            -e GO_VERSION="${{ env.GO_VERSION }}" \
            debian:trixie bash -euxo pipefail -c '
              apt-get update -o Acquire::Retries=2
              apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config \
                gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
                gstreamer1.0-plugins-bad gstreamer1.0-plugins-base-apps gstreamer1.0-alsa \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libltc-dev
              git config --global --add safe.directory "*"
              # Trixies own golang-go package trails the go.mod floor
              # (deploy/node/README.md), so install the pinned toolchain
              # from upstream instead of the distro package.
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-arm64.tar.gz" -o /tmp/go.tgz
              tar -C /usr/local -xzf /tmp/go.tgz
              export PATH="/usr/local/go/bin:$PATH"
              go version
              make package-node-agent NODE_AGENT_VERSION="$NODE_AGENT_VERSION" NDI_PLUGIN_SO=ndi-plugin-arm64/libgstndi.so
            '

      # Read the architecture off the artifact itself, never off the runner
      # label. A runner label is a request; this is what was produced. The
      # same discipline caught a mislabelled base image on a developer
      # machine, and a wrong-architecture agent would install and then fail
      # on the node rather than here.
      - name: The packaged binary really is arm64
        run: |
          set -euxo pipefail
          version="${{ inputs.version }}"
          tarball="dist/node-agent/showmesh-node-agent_${version}_linux_arm64.tar.gz"
          tar -xzf "$tarball" -C "$RUNNER_TEMP" showmesh-node-agent/showmesh-agent-native
          described="$(file -b "$RUNNER_TEMP/showmesh-node-agent/showmesh-agent-native")"
          echo "$described"
          case "$described" in
            *"ELF 64-bit LSB"*"ARM aarch64"*) ;;
            *) echo "::error::packaged agent is not arm64: $described" >&2; exit 1 ;;
          esac

      - name: The packaged NDI plugin exists and really is arm64
        run: |
          set -euxo pipefail
          version="${{ inputs.version }}"
          tarball="dist/node-agent/showmesh-node-agent_${version}_linux_arm64.tar.gz"
          tar -xzf "$tarball" -C "$RUNNER_TEMP" showmesh-node-agent/gstreamer/libgstndi.so
          described="$(file -b "$RUNNER_TEMP/showmesh-node-agent/gstreamer/libgstndi.so")"
          echo "$described"
          case "$described" in
            *"ELF 64-bit LSB"*"ARM aarch64"*) ;;
            *) echo "::error::packaged NDI plugin is not arm64: $described" >&2; exit 1 ;;
          esac

      # See node-agent-amd64's own comment: only the tarball, the release
      # job computes one combined SHA256SUMS once both are staged.
      - uses: actions/upload-artifact@v7
        with:
          name: node-agent-arm64
          path: dist/node-agent/*.tar.gz
          retention-days: 7

  # installer builds the one-command installer bundle and its bootstrap. Only
  # those two files are uploaded; the release job lists them in SHA256SUMS.
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build and self-verify the installer bundle
        run: make package-installer INSTALLER_VERSION=${{ inputs.version }} INSTALLER_RELEASE_TAG=${{ inputs.release_tag }}

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            dist/installer/showmesh-installer_${{ inputs.version }}.tar.gz
            dist/installer/get-showmesh.sh
          retention-days: 7

  # There is still no node-agent-armv7 job, but no longer because the build
  # cannot succeed. The 32-bit size_t constant that blocked it is fixed, and
  # the agent now builds and links under a real linux/arm/v7 debian:trixie
  # container. What remains is packaging: `go env GOOS GOARCH` names that
  # tarball linux_arm, not linux_armv7, so it does not follow the pattern the
  # release job's explicit amd64/arm64 filenames and combined SHA256SUMS
  # assume. Adding the leg means changing those names, which cannot be
  # verified without a full release run. Ship amd64 and arm64 until that is
  # done; falling back to a CGo-free build here would ship a silent agent with
  # no audio engine, which is worse than shipping fewer platforms.
