name: Release

# Publishes ShowMesh Core (coordinator, operator UI, node agent) from a
# pushed release tag. The build itself is build.yml, which edge.yml also runs
# on every merge to main. The FPP plugin releases from its own repository, so
# every tag here is a Core release.
on:
  push:
    tags:
      - 'v*'

# Default to read-only; only the jobs that publish escalate.
permissions:
  contents: read

# A publish in progress must not be cancelled by a later push; each tag
# already gets its own group via github.ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    # Determines the version, commit and build date once, so every other job
    # reads the same values. This is also where the tag/VERSION/CHANGELOG
    # agreement is enforced, before anything is built or published.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.derive.outputs.version }}
      commit: ${{ steps.derive.outputs.commit }}
      build_date: ${{ steps.derive.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version, commit and build date
        id: derive
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          if [ "$version" != "$file_version" ]; then
            echo "::error::tag '$tag' does not agree with VERSION ('$file_version'); refusing to publish a release from a mismatched cut." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "commit=${{ github.sha }}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Extract the CHANGELOG.md section for this version
        # Its output is the release body. The heading shape is `## <VERSION> - <YYYY-MM-DD>` per
        # docs/RELEASING.md; matched as a whole heading, not a substring,
        # so "0.1.0" cannot accidentally match a "0.1.10" section.
        run: |
          set -euo pipefail
          version="${{ steps.derive.outputs.version }}"
          awk -v ver="$version" '
            /^## / {
              if (found) exit
              if ($0 ~ ("^## " ver "( |$)")) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::error::CHANGELOG.md has no '## $version - <date>' section; a release tag requires one." >&2
            exit 1
          fi
          echo "--- CHANGELOG.md section for $version ---"
          cat changelog-section.md

      - uses: actions/upload-artifact@v7
        with:
          name: changelog-section
          path: changelog-section.md
          retention-days: 7


  build:
    needs: [resolve]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      release_tag: v${{ needs.resolve.outputs.version }}
      image_tags: ${{ needs.resolve.outputs.version }} ${{ needs.resolve.outputs.commit }}
      commit: ${{ needs.resolve.outputs.commit }}
      build_date: ${{ needs.resolve.outputs.build_date }}

  release:
    # An explicit `if:` replaces the implicit `if: success()` a plain
    # `needs:` would carry (see ci.yml's own `test-gate`/`ui` comments for
    # this exact trap), so success() is spelled out here too: without it,
    # this job would still run and publish a release from an incomplete
    # set of images or packages after any build job failed.
    if: success()
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          pattern: node-agent-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: changelog-section
          path: .

      - name: Write and verify one SHA256SUMS covering every downloadable file
        # Each leg already self-verified its own single-platform tarball;
        # this is the point both are staged together (per the release
        # contract the amd64 and arm64 legs otherwise share), so this is
        # where the real, all-platform manifest is written, using the same
        # sha256sum invocation package-node-agent itself uses. There is no
        # armv7 tarball to stage: see the note at the end of build.yml. The file is
        # named SHA256SUMS because get-showmesh.sh and showmesh-install fetch
        # it by that name to check the installer bundle and the node tarball.
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          cd dist-artifacts
          files=(
            "showmesh-node-agent_${version}_linux_amd64.tar.gz"
            "showmesh-node-agent_${version}_linux_arm64.tar.gz"
            "showmesh-installer_${version}.tar.gz"
            get-showmesh.sh
          )
          ls "${files[@]}"
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create the GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.resolve.outputs.version }}
          name: v${{ needs.resolve.outputs.version }}
          body_path: changelog-section.md
          prerelease: true
          files: dist-artifacts/*
