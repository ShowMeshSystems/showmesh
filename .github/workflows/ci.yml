name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to read-only; no job needs to write to the repo or packages.
permissions:
  contents: read

# Cancel superseded runs from repeated pushes to the same PR/branch instead
# of letting them pile up and burn runner minutes in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 15
    strategy:
      # Both matrix legs run to completion. With the default fail-fast, a
      # failure on one Go version cancels the other, so a run reports one
      # failure when it could have reported two, and each hidden one costs
      # a full round trip to discover.
      fail-fast: false
      # Test both the minimum Go version this project claims to support
      # (go.mod) and the compiler the Dockerfile actually ships the
      # coordinator binary on, so the two never silently diverge. These are
      # literal versions, not go-version-file, precisely so this matrix
      # doesn't collapse back into one entry; update both by hand when
      # either go.mod's `go` directive or the Dockerfile's golang: tag
      # changes.
      matrix:
        go-version: ["1.25.0", "1.26.6"]
    steps:
      # ubuntu-latest ships GStreamer 1.24 and go-gst needs 1.26 or newer,
      # so every job that compiles the agent's cgo backend runs on Debian 13
      # instead. Debian 13 is also the platform the audio engine was measured
      # green on; Debian 12's GLib 2.74 does not build it at all.
      - name: Install the toolchain and the agent's C dependencies
        run: |
          set -eux
          apt-get update -o Acquire::Retries=2
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base-apps gstreamer1.0-alsa \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libltc-dev
          # go-gst calls GStreamer symbols added in 1.26 (GstIdStr and the
          # static-string caps API), and go-glib calls GLib symbols added
          # through 2.80. Assert both floors here rather than discovering
          # them as a wall of undefined C symbols.
          pkg-config --atleast-version=1.26.0 gstreamer-1.0
          pkg-config --atleast-version=2.80 glib-2.0
          pkg-config --modversion ltc
          # The workspace is checked out by the host runner and read inside
          # the job container, so git refuses it as dubiously owned and any
          # -buildvcs stamp fails as a typecheck error.
          git config --global --add safe.directory '*'
          # Assert the elements the suites actually instantiate, because a
          # missing decoder reports as a MediaFault rather than a skip.
          # rawvideoparse and videotestsrc are the renderer's; wavparse and
          # flacdec decode Track C's real audio fixtures; audiomixer carries
          # the program bus; alsasink is the production output. ndisink is
          # deliberately absent: ADR-010 forbids shipping the NDI runtime,
          # so only the fakesink fallback runs here.
          for element in rawvideoparse videotestsrc wavparse flacdec \
                         audiomixer interleave alsasink; do
            gst-inspect-1.0 "$element" > /dev/null
          done

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build with cgo (ADR-042 real agent backend)
        # The agent's real GStreamer/libltc engine is a cgo build; without
        # this step, nothing in CI proves `./...` links with cgo enabled,
        # only that `go test -race` (which forces it on) happens not to
        # fail. Explicit here rather than assumed from -race's own
        # requirement, because -race enabling cgo as a side effect is not
        # the same claim as this build gate.
        run: CGO_ENABLED=1 go build ./...

      - name: Build CGo-free (ADR-012)
        # ADR-012 requires the coordinator build CGo-free so the image can
        # be a static binary on a distroless base and cross-compile cleanly
        # for arm64; `go test -race` above requires cgo and would not catch
        # a dependency that silently needs it, so build it out explicitly.
        run: CGO_ENABLED=0 go build ./...

      - name: Check formatting
        # gofmt -l lists files that are not formatted; fail the job if it
        # prints anything, since a clean `-l` output is empty. Scoped to
        # the directories that actually hold this project's Go source
        # (matches the Makefile's GOFMT_DIRS) rather than ".": gofmt is a
        # plain filesystem walk with no notion of Go module boundaries, so
        # "." would also walk into ui/node_modules once that exists and
        # can flag (or, via `gofmt -w`, silently reformat) a vendored
        # third-party .go file some npm package happens to ship.
        run: |
          unformatted="$(gofmt -l cmd internal pkg test)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    # SIGKILL-based liveness checks poll with generous, worst-case bounds
    # (see test/integration/kill_test.go), so this job legitimately needs
    # more headroom than the unit-test job; kept as its own job (rather than
    # a step in `test` above) specifically so a broker problem here is
    # distinguishable from a unit test failure at a glance, per the Step 2
    # round 2 Task E spec.
    #
    # Raised from 10 when Track B landed: this job runs render tests that
    # drive real gst-launch-1.0 pipelines, where before they failed fast on
    # the missing binary. The Debian image below adds its own apt and module
    # download on top of that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Integration tests (real Mosquitto broker + real agent subprocess)
        # ubuntu-latest ships GStreamer 1.24 and go-gst needs 1.26, so the
        # suite runs inside Debian 13 rather than on the runner. It cannot
        # be a `container:` job: scripts/test-integration.sh starts the real
        # pinned Mosquitto container itself (deliberately, so this job tests
        # the shipped deploy/mosquitto config rather than a services:
        # stand-in), which needs the host Docker socket and host networking,
        # and GitHub's container: field cannot express --network.
        #
        # Two details make the nested Docker work. The workspace is mounted
        # at the same absolute path inside and out, and TMPDIR points into
        # it, so the seed-file bind mounts the script hands to the host
        # daemon resolve to the same files on both sides. Host networking is
        # what keeps the broker reachable on localhost, exactly as it is on
        # a developer machine.
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/.ci-tmp"
          docker run --rm \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e TMPDIR="$GITHUB_WORKSPACE/.ci-tmp" \
            -e HOME=/tmp \
            golang:1.25.0-trixie \
            bash -euxo pipefail -c '
              apt-get update -o Acquire::Retries=2
              apt-get install -y --no-install-recommends \
                pkg-config gstreamer1.0-tools gstreamer1.0-plugins-base \
                gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
                gstreamer1.0-plugins-base-apps gstreamer1.0-alsa \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
                libltc-dev docker-cli
              pkg-config --atleast-version=1.26.0 gstreamer-1.0
              pkg-config --atleast-version=2.80 glib-2.0
              # The workspace belongs to the runner user, not root, so git
              # refuses it as dubiously owned and every -buildvcs stamp
              # fails. Double quotes because this whole script is already
              # inside a single-quoted argument.
              git config --global --add safe.directory "*"
              make test-integration
            '

  integration-fppmqtt:
    runs-on: ubuntu-latest
    # This is the only place the retained-versus-live observation-time rule
    # (contract section 4.2) is exercised against a real broker connection
    # rather than a directly-injected publish handler call, and that rule
    # has been the source of three separate defects in this project's
    # history — see scripts/test-integration-fppmqtt.sh's own comments. A
    # separate job from `integration` above for the same reason that job is
    # split from `test`: a broker or wiring problem here should be
    # distinguishable from the ADR-008 control-plane suite at a glance.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ubuntu-latest ships Docker already, usable without sudo.
      # `make test-integration-fppmqtt` starts its own pinned eclipse-mosquitto
      # broker (scripts/test-integration-fppmqtt.sh), from the exact shipped
      # deploy/mosquitto/mosquitto.conf, rather than a GitHub Actions
      # `services:` container, for the same reason `test-integration` above
      # does: a bespoke services-container broker would need its own
      # bind-address/anonymous-access config to avoid the image's own
      # deny-by-default behavior, duplicating what the script already does
      # against the real shipped config — and testing that config, not a
      # stand-in for it, is the point of this job. It runs on its own
      # container name and port so it never collides with the `integration`
      # job's broker if GitHub Actions were ever to run them on the same
      # runner.
      - name: Integration tests (FPP MQTT collector against a real broker)
        run: make test-integration-fppmqtt

  integration-broker:
    runs-on: ubuntu-latest
    # internal/coordinator/broker's own retained-message trap and its
    # reconnect-resubscribe behavior (see
    # internal/coordinator/broker/response_integration_test.go) are proved
    # only against a real broker. Review finding 5 on commit 9dcab74 found
    # this suite existed and ran nowhere: not in `make check`, not in any
    # script, not in CI — a separate job from `integration`/
    # `integration-fppmqtt` for the same reason those are split from `test`:
    # a broker or wiring problem here should be distinguishable from either
    # at a glance. One of this suite's own tests kills and restarts a real
    # broker container mid-test, so this job's timeout is wider than the
    # other two integration jobs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ubuntu-latest ships Docker already, usable without sudo. Unlike
      # `integration`/`integration-fppmqtt`, this suite manages its own
      # throwaway Mosquitto container(s) per test rather than the script
      # starting one up front — see scripts/test-integration-broker.sh.
      - name: Integration tests (broker package against real Mosquitto, including a mid-wait restart)
        run: make test-integration-broker

  lint:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    # Debian 13 for the same reason the test job uses it: golangci-lint type
    # checks every package, and the agent's engine packages are cgo, so
    # linting them at all needs GStreamer 1.26 and libltc present.
    timeout-minutes: 15
    steps:
      - name: Install the toolchain and the agent's C dependencies
        run: |
          set -eux
          apt-get update -o Acquire::Retries=2
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libltc-dev
          pkg-config --atleast-version=1.26.0 gstreamer-1.0
          pkg-config --atleast-version=2.80 glib-2.0
          # The workspace is checked out by the host runner and read inside
          # the job container, so git refuses it as dubiously owned and any
          # -buildvcs stamp fails as a typecheck error.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          # Version pinned so lint results don't drift with an unrelated
          # golangci-lint release; bump deliberately alongside .golangci.yml.
          # Matches GOLANGCI_LINT_VERSION in the Makefile's lint fallback.
          version: v2.6.2

  ui:
    # A separate job, not a step folded into `test` above, specifically so
    # a Node/UI failure is legible as a Node failure at a glance rather
    # than buried inside the Go job's log — same reasoning the `integration`
    # job's own comment gives for its separation. This job needs no Go
    # toolchain and the Go jobs above need no Node, which is the ADR-006
    # boundary CLAUDE.md draws around the Operator UI being the one
    # TypeScript exception (ADR-015): the two toolchains stay independent
    # in CI the same way they stay independent in the repository layout.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Version read from .nvmrc rather than pinned here, so the Node major
      # CI runs and the one `make check` enforces locally cannot drift.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci`, not `npm install`: fails on a package.json/lockfile
      # mismatch instead of silently rewriting the committed lockfile,
      # and installs exactly what's locked rather than whatever satisfies
      # the version ranges today.
      - name: Install
        run: cd ui && npm ci

      - name: Lint
        run: cd ui && npm run lint

      - name: Typecheck
        run: cd ui && npm run typecheck

      - name: Unit tests
        run: cd ui && npm test

      - name: Build
        run: cd ui && npm run build

      # Regenerates src/api/generated/schema.d.ts from api/openapi.yaml and
      # fails the job on any diff against what's committed — see the
      # Makefile's ui-gen-check target, which this step also uses locally.
      # This is what keeps ADR-015's "generated from or verified against
      # the Go types" true on every push rather than only at the moment
      # someone remembered to regenerate by hand.
      - name: Generated API types are up to date
        run: make ui-gen-check

  vuln:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    # Debian 13 for the same reason the test job uses it: govulncheck loads
    # every package, and the agent's engine packages are cgo, so scanning
    # them at all needs GStreamer 1.26 and libltc present.
    timeout-minutes: 15
    steps:
      - name: Install the toolchain and the agent's C dependencies
        run: |
          set -eux
          apt-get update -o Acquire::Retries=2
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libltc-dev
          pkg-config --atleast-version=1.26.0 gstreamer-1.0
          pkg-config --atleast-version=2.80 glib-2.0
          # The workspace is checked out by the host runner and read inside
          # the job container, so git refuses it as dubiously owned and any
          # -buildvcs stamp fails as a typecheck error.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7

      # Pinned to the Dockerfile's golang tag, deliberately NOT
      # go-version-file: go.mod. govulncheck reports standard-library
      # vulnerabilities against whichever toolchain runs it, and the stdlib
      # is linked into the shipped binary, so the only version whose stdlib
      # findings describe the released artifact is the one the Dockerfile
      # builds with. Scanning under go.mod's 1.25.0 minimum-support floor
      # would report a different set that nothing this project publishes
      # actually contains. Keep this in step with the Dockerfile.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      # govulncheck, not Dependabot, is the tool that answers whether a
      # vulnerability affects this build, and on 2026-08-14 the two
      # disagreed completely in both directions.
      #
      # Dependabot alerts Go at *module* granularity: a flaw in any package
      # of a module flags the whole module regardless of what is imported.
      # That produced 16 open alerts, 7 critical, of which zero were
      # reachable -- 15 in golang.org/x/crypto/ssh and one in the x/net HTML
      # parser, neither of which this module imports.
      #
      # Meanwhile govulncheck found 17 genuinely reachable vulnerabilities
      # that Dependabot never showed at all, every one of them in the Go
      # standard library, reached from httpapi's server, fppcommand's client
      # and the fppmqtt collector. Dependabot does not watch the toolchain,
      # and the stdlib ships inside the binary. The loud alerts were the
      # harmless ones and the real ones were invisible.
      #
      # So this job is the signal and the Dependabot tab is hygiene. It
      # fails the build only on a vulnerability actually reachable from this
      # code, which is what makes a failure here worth reading. That value
      # is destroyed if it starts failing on unreachable findings, so do not
      # "fix" a red run here by relaxing it to reporting-only; fix the
      # finding or move the pin above.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan for reachable vulnerabilities
        run: govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No QEMU here: the builder stage uses --platform=$BUILDPLATFORM and
      # cross-compiles with CGO_ENABLED=0, and the runtime stage has no RUN
      # instructions, so the arm64 leg is proven by cross compilation from
      # the build platform, not emulation. This stays true only while the
      # runtime stage has no RUN instructions; if one is ever added, QEMU
      # would need to come back to actually exercise it.
      - uses: docker/setup-buildx-action@v4

      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

  fpp-plugin-release:
    # Step 9's FPP plugin (cmd/showmesh-fpp-plugin) is fetched onto an FPP
    # host by scripts/fpp_install.sh as a prebuilt, sha256-verified static
    # binary — FPP hosts carry no Go toolchain, so there is no
    # build-on-device path the way there is for the 55 other listed FPP
    # plugins. This job is that pipeline: it cross-compiles the three
    # platforms the deployed fleet actually needs (a Raspberry Pi 3 B+ —
    # amd64/arm64 already cover neither of the fleet's real ARM targets —
    # a BeagleBone Black needing GOARCH=arm GOARM=7, and a PocketBeagle2),
    # writes the pinned SHA256SUMS manifest, and verifies it — on every
    # run, not as a one-time trusted claim.
    #
    # This job deliberately does NOT create a GitHub Release, upload a
    # release-visible artifact, or push anything anywhere. The owner's
    # decision (2026-08-14): publication is enabled later, when an
    # installer actually needs to fetch these from a real FPP host, and
    # is a separate decision from proving the pipeline works. Enabling it
    # then is meant to be a small, obvious addition here — e.g. a
    # tag-triggered step calling `gh release create` (or
    # softprops/action-gh-release) with `dist/fpp-plugin/*` as its
    # assets — not a rewrite of this job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A synthetic, clearly-non-release version for a CI run — the
      # pinned tag format is fpp-plugin-v<VERSION>, and this is not that;
      # it exists only so this job's own artifact filenames and manifest
      # are exercised end to end, matching what `make release-fpp-plugin`
      # (no VERSION override, defaulting to the top-level VERSION var)
      # does for a bench-local build.
      - name: Build and self-verify the FPP plugin release artifacts
        run: make release-fpp-plugin FPP_PLUGIN_VERSION=0.0.0-ci.${{ github.sha }}

      # A second, independent build of the same commit, compared
      # byte-for-byte against the first — the stronger reproducibility
      # claim release-fpp-plugin's own sha256sum -c cannot make on its
      # own (that only proves the manifest matches what THIS run
      # produced, not that a second run would produce the same thing).
      - name: Verify the release build is reproducible
        run: make verify-fpp-plugin-reproducible FPP_PLUGIN_VERSION=0.0.0-ci.${{ github.sha }}

      # No actions/upload-artifact step here on purpose: this repository
      # is public, and a workflow artifact on a public repository is
      # downloadable the same way a Release asset is — uploading one here
      # would be publication in substance even though it is not the
      # GitHub Releases feature. dist/fpp-plugin/ is left in the runner's
      # own workspace and discarded when the job ends.
