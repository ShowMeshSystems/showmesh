# Override for CI: replaces fpp-master's source build with the prebuilt,
# digest-pinned GHCR fixture published by .github/workflows/build-fpp-test-image.yml.
# `build: !reset null` structurally removes the build config so Compose
# cannot fall back to a source build even if the image is missing.
#
# Local development is unaffected: docker-compose.yml alone still
# source-builds by default. See ../README.md for how to publish a new
# fixture and how to point CI at it (two separate, deliberate steps).

services:
  fpp-master:
    build: !reset null
    image: ${SHOWMESH_FPP_TEST_IMAGE:?SHOWMESH_FPP_TEST_IMAGE is unset and no fixture digest has been pinned here yet -- publish an image with .github/workflows/build-fpp-test-image.yml and set the default in this file, or export SHOWMESH_FPP_TEST_IMAGE yourself}
