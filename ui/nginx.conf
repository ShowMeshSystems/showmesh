# nginx config for the ShowMesh Operator UI container (ADR-022).
#
# This file is a *template*: SHOWMESH_COORDINATOR_HOST and
# SHOWMESH_COORDINATOR_PORT below are substituted by `envsubst` at
# container start (see Dockerfile CMD), not baked in at image-build time.
# Everything else in this file is literal nginx config and must survive
# that substitution step unchanged.
#
# The requirements enforced here come from ADR-022 decisions 2 and 3 and
# from OPERATOR-UI section 3's isolation contract; each is a correctness
# requirement, not a tuning choice, and is called out inline below.

# Resolves the coordinator hostname at *request* time rather than once at
# nginx startup. 127.0.0.11 is Docker's embedded DNS server, reachable from
# any container on a user-defined bridge network (which Compose creates by
# default). This — combined with using a variable in proxy_pass below,
# rather than a literal `proxy_pass http://coordinator:8080` — is what lets
# this container start and serve (and correctly 502) when the coordinator
# service does not exist or is not running: a literal proxy_pass target is
# resolved once at nginx startup, and nginx refuses to start at all if that
# name doesn't resolve then, which would turn "coordinator absent" into "UI
# container never boots" rather than into the 502 an absent coordinator
# should produce.
resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name _;

    # Container-local healthcheck (Dockerfile HEALTHCHECK, Compose
    # healthcheck): must return 200 without contacting the coordinator.
    # OPERATOR-UI section 3's isolation contract requires the UI's own
    # health not to depend on the coordinator being reachable — a
    # coordinator outage must show up as the *application* reporting
    # disconnected, never as this container's healthcheck failing, which
    # would make an unrelated coordinator problem look like a UI crash to
    # whatever is watching container health.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Proxy to the coordinator, byte-identical path (ADR-022 decision 3:
    # "no path rewriting beyond stripping nothing and adding nothing").
    # proxy_pass here has no URI component after the variable, which is
    # what makes nginx forward the original request URI unmodified,
    # including the /api/ prefix, rather than stripping the location match
    # the way `proxy_pass http://upstream/;` (trailing slash) would.
    location /api/ {
        set $coordinator_upstream ${SHOWMESH_COORDINATOR_HOST}:${SHOWMESH_COORDINATOR_PORT};
        proxy_pass http://$coordinator_upstream;

        # No body-size limit of nginx's own: the coordinator's configured
        # assets.settings maxUploadBytes is the only upload bound. A limit
        # here would silently pre-empt that setting with nginx's own
        # (1 MB by default), rejecting uploads before the coordinator ever
        # sees them. proxy_request_buffering off streams the request body
        # straight upstream instead of spooling it in nginx first.
        client_max_body_size 0;
        proxy_request_buffering off;

        # ADR-022 decision 2: the proxy forwards whatever Authorization
        # header the browser sent and never sets, adds, or defaults one of
        # its own. There is deliberately no proxy_set_header Authorization
        # line here — omitting it is what makes nginx pass the client's
        # own header through unmodified rather than overriding it; adding
        # one (even to re-send the same value) is the mistake this
        # comment exists to prevent a future edit from making.
        # These three are the only headers this proxy alters, and they are
        # currently inert: nothing under internal/coordinator/api/ reads
        # X-Forwarded-* or the client address, verified by grep at the time
        # this was written. They are set so a deployment that terminates
        # TLS in front of this container (ADR-022 decision 5) does not have
        # to re-derive the original scheme and client address.
        #
        # ADR-022 decision 3's test is that removing this proxy and pointing
        # a client straight at the coordinator changes nothing except the
        # origin. That test still passes only while the coordinator ignores
        # these headers. The moment coordinator code trusts X-Forwarded-For
        # for a rate limit, an audit record, or an authorization decision,
        # this proxy becomes load-bearing and a security boundary, which
        # decision 2 forbids. Do not make the coordinator trust them.
        # $http_host, not $host, and the difference is load-bearing.
        # nginx's $host strips the port, so a browser on
        # http://192.168.1.50:8080 reached the coordinator claiming a Host
        # of "192.168.1.50". That was invisible until the CSRF predicate
        # began comparing the Origin header's host against this one
        # (auth.go, 2026-08-14), at which point every LAN sign-in was
        # refused over a port mismatch no operator could have seen.
        # $http_host forwards the browser's own Host verbatim, port
        # included, which is what ADR-022 decision 3 asks for anyway:
        # removing this proxy must change nothing except the origin, and a
        # rewritten Host is a change.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requires HTTP/1.1 (chunked transfer, no HTTP/1.0 keep-alive
        # framing) and an empty Connection header so nginx does not close
        # the upstream connection between requests on its own initiative.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Correctness requirements, not performance tuning (ADR-022
        # decision 3, ADR-020): buffering or caching a `text/event-stream`
        # response converts the coordinator's real-time change stream into
        # one that arrives all at once when the connection eventually
        # closes. That presents as a UI that reports itself connected
        # while actually showing stale state — the exact failure
        # OPERATOR-UI section 2.4 ("unknown is not healthy", "never
        # present stale state as current") exists to prevent. This applies
        # to every /api/ response, not only /api/v1/stream, since nginx
        # cannot distinguish the streaming route from any other by config
        # alone and ADR-022 forbids caching any /api/* response regardless.
        proxy_buffering off;
        proxy_cache off;

        # How long an idle upstream connection is allowed to sit with no
        # bytes before nginx gives up on it. This has to comfortably
        # exceed the coordinator's SSE keepalive comment cadence
        # (`: keepalive`, api/openapi.yaml's /stream description) or an
        # idle-but-healthy change-stream connection gets killed out from
        # under the client. That cadence is documented as a ShowMesh
        # hypothesis, not a contract value — internal/coordinator/api sets
        # it to 15s by default as of this writing, but a client (this
        # proxy included) must not rely on that exact number, so this
        # timeout is set generously above it rather than tuned to it.
        proxy_read_timeout 300s;
    }

    # Hashed asset filenames (Vite's default build output under
    # /assets/*) are immutable: a changed file gets a new name, so a long
    # max-age is safe and is what makes a UI update actually take effect
    # in a returning browser rather than serving a stale cached bundle
    # under a URL that never changes.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must never be cached: it is the one file whose staleness
    # would leave an operator who just updated this container loading the
    # previous build with no signal that anything is wrong — the opposite
    # problem from the /assets/ rule above.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback for client-side (browser-history-mode) routing only.
    # This location is a separate, less specific match than /api/ above,
    # so nginx's longest-prefix-match selection means an /api/ request can
    # never reach this block and fall through to index.html — a proxy
    # failure on /api/ therefore surfaces as the coordinator's own error
    # response (or a 502 if the coordinator is unreachable), never as an
    # HTTP 200 HTML body where the client expects JSON or an SSE stream.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
